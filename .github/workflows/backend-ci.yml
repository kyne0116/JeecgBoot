name: JeecgBoot CI/CD

on:
  push:
    branches: [ master, develop, my-custom ]
  pull_request:
    branches: [ master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jeecg-boot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      working-directory: ./jeecg-boot
      run: mvn clean package -DskipTests -B -P test
    
    - name: Run unit tests (pure JUnit)
      working-directory: ./jeecg-boot
      run: mvn test -pl jeecg-module-system/jeecg-system-start -Dtest=PureJunitTest -B -P test
