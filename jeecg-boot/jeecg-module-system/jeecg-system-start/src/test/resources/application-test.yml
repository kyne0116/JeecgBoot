# BDD测试专用配置 - 最小化配置，专注测试逻辑
spring:
  main:
    web-application-type: none  # 禁用Web环境，专注于BDD逻辑测试
  datasource:
    url: jdbc:h2:mem:bdd_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

# JeecgBoot必要配置
jeecg:
  xxljob:
    enabled: false
  redisson:
    enabled: false
  file-view-domain: http://localhost:8012
  ai-chat:
    enabled: false
  ai-rag:
    enabled: false
  firewall:
    dataSourceSafe: false
    lowCodeMode: dev
  uploadType: local
  path:
    upload: /tmp/jeecg-boot/upload  # 测试环境上传路径

cas:
  prefixUrl: http://localhost:8443/cas

# BDD测试专用日志配置
logging:
  level:
    root: WARN
    org.jeecg: INFO
    org.springframework: WARN
    org.hibernate: WARN
    io.cucumber: INFO