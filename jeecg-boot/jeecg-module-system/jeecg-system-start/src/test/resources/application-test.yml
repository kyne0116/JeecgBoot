# GitHub Actions CI测试配置
spring:
  datasource:
    dynamic:
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/jeecg-boot?useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          username: root
          password: root
          driver-class-name: com.mysql.cj.jdbc.Driver

# JeecgBoot必要配置
jeecg:
  xxljob:
    enabled: false
  redisson:
    enabled: false
  file-view-domain: http://localhost:8012
  ai-chat:
    enabled: false
  ai-rag:
    enabled: false
  firewall:
    dataSourceSafe: false
    lowCodeMode: dev
  uploadType: local

cas:
  prefixUrl: http://localhost:8443/cas

# 最小化日志配置
logging:
  level:
    root: WARN
    org.jeecg: INFO
    org.springframework: ERROR
    org.hibernate: ERROR
    com.baomidou.mybatisplus: ERROR
    org.apache.ibatis: ERROR