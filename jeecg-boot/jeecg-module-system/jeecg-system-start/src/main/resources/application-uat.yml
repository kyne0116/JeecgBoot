server:
  port: 8080

spring:
  datasource:
    dynamic:
      druid:
        initial-size: 5
        min-idle: 5
        maxActive: 50
        maxWait: 60000
        timeBetweenEvictionRunsMillis: 60000
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1 FROM DUAL
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        filters: stat,wall,slf4j
        wall:
          selectWhereAlwayTrueCheck: false
        stat:
          merge-sql: false
          slow-sql-millis: 5000
      datasource:
        master:
          url: jdbc:mysql://10.92.82.149:30004/jeecg-boot?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          username: root
          password: Best@2008
          driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    database: 0
    host: 10.92.82.149
    port: 6379
    password: ''

mybatis-plus:
  mapper-locations: classpath*:org/jeecg/**/xml/*Mapper.xml
  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      table-underline: true
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    call-setters-on-nulls: true

jeecg:
  xxljob:
    enabled: true
  redisson:
    enabled: true
    address: 10.92.82.149:6379
  file-view-domain: http://10.92.82.149:8012

cas:
  prefixUrl: http://10.92.82.149:8443/cas

logging:
  level:
    org.jeecg: INFO
    org.springframework: WARN