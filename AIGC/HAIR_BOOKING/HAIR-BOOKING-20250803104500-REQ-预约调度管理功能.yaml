          validation_method: "修改日志验证"
      stakeholders: ["客户", "前台接待", "美发师"]
      
    - requirement_id: "REQ-U-015"
      ears_statement: "系统应当能够取消预约记录"
      business_context: "客户临时有事或店铺需要调整安排时取消预约"
      business_value: "释放预约资源，提高资源利用率"
      priority: "high"
      complexity: "medium"
      codegen_suitable: false
      acceptance_criteria:
        - criterion: "取消操作需要选择取消原因"
          validation_method: "取消流程测试"
        - criterion: "取消后释放对应的时间段资源"
          validation_method: "资源释放验证"
      stakeholders: ["客户", "前台接待", "店长"]
      
    - requirement_id: "REQ-U-016"
