      exception_handling_strategy:
        immediate_response: "立即处理受影响的预约"
        user_notification: "通知客户预约变更信息"
        error_logging: "记录请假情况和处理过程"
        recovery_mechanism: "提供改约或退款选项"
        escalation_procedure: "复杂情况需要管理员介入"
      
