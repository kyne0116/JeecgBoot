        protocol: "RESTful API"
        authentication: "JWT token"
        timeout_requirement: "5秒"
        retry_strategy: "失败后最多重试3次"
        
      integration_exception_handling:
        connection_failure: "提示客户信息获取失败，允许手动输入"
        timeout_handling: "显示超时错误，提供重新获取选项"
        data_format_error: "显示数据格式错误，检查客户信息完整性"
        authentication_failure: "重新认证或报告认证问题"
        
      priority: "high"

