      priority: "high"
  
  # 类型3：边界场景 (Boundary Scenarios) - 临界值和边界条件
  boundary_scenarios:
    - scenario_id: "BDD-B-005"
      scenario_title: "预约时间间隔边界测试"
      source_requirement_id: "REQ-U-016"
      boundary_type: "time_limit"
      boundary_value: "30分钟最小间隔"
      boundary_description: "连续预约之间的最小时间间隔"
      
      given: "美发师已有一个预约安排"
      when: "尝试创建紧邻的新预约"
      then: "系统根据最小间隔要求验证时间有效性"
      and_conditions:
        - "间隔时间包括服务时间和准备时间"
        - "不同服务类型可能有不同的间隔要求"
      
      boundary_test_cases:
        - test_case: "最小间隔测试"
          test_value: "间隔30分钟的预约"
          expected_result: "预约创建成功"
        - test_case: "不足间隔测试"
          test_value: "间隔29分钟的预约"
          expected_result: "创建失败并提示间隔不足"
      
      priority: "high"
      
    - scenario_id: "BDD-B-006"
      scenario_title: "预约提前期边界测试"
      source_requirement_id: "REQ-U-012"
      boundary_type: "time_limit"
      boundary_value: "30天最大提前期"
      boundary_description: "客户可以提前预约的最大时间范围"
      
      given: "客户尝试预约未来的服务时间"
      when: "选择距离当前时间30天的预约时间"
      then: "系统接受该预约时间"
      and_conditions:
        - "超过30天的预约被拒绝"
        - "至少提前1小时的预约才被接受"
      
      boundary_test_cases:
        - test_case: "最大提前期测试"
          test_value: "30天后的预约时间"
          expected_result: "预约创建成功"
        - test_case: "超过提前期测试"
          test_value: "31天后的预约时间"
          expected_result: "创建失败并提示超过提前期限制"
      
      priority: "medium"
  
