      source_requirement_id: "REQ-UB-008"
      exception_type: "business_rule_violation"
      error_category: "user_error"
      
      given: "检测到用户在短时间内频繁创建和取消预约"
      when: "用户行为触发恶意操作检测规则"
      then: "系统临时限制该用户的预约操作权限"
      and_conditions:
        - "限制措施包括冷却时间和人工验证要求"
        - "恶意行为记录到安全日志中"
      
      exception_handling_strategy:
        immediate_response: "暂停用户预约操作权限"
        user_notification: "提示'操作过于频繁，请稍后再试'"
        error_logging: "记录用户行为模式和限制措施"
        recovery_mechanism: "冷却期后自动恢复或人工审核"
        escalation_procedure: "严重恶意行为报告给管理员"
      
      severity: "medium"
      priority: "medium"
      
    - scenario_id: "BDD-E-009"
