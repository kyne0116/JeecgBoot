      given: "用户尝试创建与现有预约时间冲突的新预约"
      when: "提交包含冲突时间的预约请求"
      then: "系统检测到冲突并拒绝创建，提供可用时间建议"
      and_conditions:
        - "系统明确指出冲突的具体时间和美发师"
        - "提供最近的可用时间段供选择"
      
      exception_handling_strategy:
        immediate_response: "立即拒绝预约请求，显示冲突信息"
        user_notification: "提示'所选时间与现有预约冲突'"
        error_logging: "记录冲突检测详情和用户操作"
        recovery_mechanism: "提供可用时间段建议"
        escalation_procedure: "持续冲突可能需要人工协调"
      
      severity: "high"
      priority: "critical"
      
    - scenario_id: "BDD-E-007"
      scenario_title: "系统高峰期性能保护"
      source_requirement_id: "REQ-E-009"
      exception_type: "system_error"
      error_category: "system_error"
      
      given: "系统同时处理大量预约请求导致性能下降"
      when: "冲突检测算法响应时间超过设定阈值"
      then: "系统启动性能保护机制，限制并发请求"
      and_conditions:
        - "优先处理已开始的预约请求"
        - "对新请求进行队列管理"
      
      exception_handling_strategy:
        immediate_response: "启动请求限流机制"
        user_notification: "提示'系统繁忙，请稍后重试'"
        error_logging: "记录性能瓶颈和处理情况"
        recovery_mechanism: "自动恢复或扩展系统资源"
        escalation_procedure: "严重情况下通知系统管理员"
      
      severity: "medium"
      priority: "high"
      
    - scenario_id: "BDD-E-008"
