# JeecgBoot系统基础信息 - 汽车4S店无纸化办公系统
# Layer 1 - 系统层配置文档
# 创建时间: 2025-08-01
# 系统代码: AUTO

system_overview:
  system_name: "汽车4S店无纸化办公系统" # 系统名称
  description: "基于JeecgBoot框架的汽车4S店全业务流程数字化管理系统，涵盖车辆信息、销售管理、服务管理、库存管理、财务管理和报表分析等核心业务模块" # 系统的简短描述
  base_working_directory: "/Users/admin/Work/Github/JeecgBoot" # 整个项目的根工作目录
  aigc_working_directory: "${base_working_directory}/AIGC" # AIGC 项目需求文档根目录
  codegen_working_directory: "${base_working_directory}/CodeGen" # CodeGen系统代码生成源码
  contextdev_working_directory: "${base_working_directory}/ContextDev" # ContextDev上下文编程源码
  backend_working_directory: "${base_working_directory}/jeecg-boot" # 后端服务根路径
  frontend_working_directory: "${base_working_directory}/jeecgboot-vue3" # 前端服务根路径

  contains_jeecgboot_module: # 本系统包含的JeecgBoot主要模块
    - code: "基础信息管理模块"
      description: "车辆基本信息、品牌型号、VIN码、车辆状态等基础数据管理"
    - code: "销售信息管理模块"
      description: "销售订单、客户信息、销售流程、合同管理等销售业务"
    - code: "服务信息管理模块"
      description: "维修记录、保养计划、服务预约、工单管理等售后服务"
    - code: "库存信息管理模块"
      description: "库存查询、入库出库、盘点、配件管理等库存业务"
    - code: "财务信息管理模块"
      description: "收付款、结算、财务统计、成本核算等财务管理"
    - code: "报表信息管理模块"
      description: "销售报表、库存报表、财务报表、经营分析等数据报表"

  contains_jeecgboot_submodule: # 本系统包含的JeecgBoot具体子模块
    - code: "AUTO_INFO"
      description: "基础信息管理 - 车辆档案、品牌字典、VIN码管理"
    - code: "AUTO_SALE"
      description: "销售信息管理 - 销售订单、客户CRM、销售流程"
    - code: "AUTO_SERVICE"
      description: "服务信息管理 - 维修工单、保养计划、预约管理"
    - code: "AUTO_INVENTORY"
      description: "库存信息管理 - 车辆库存、配件库存、出入库管理"
    - code: "AUTO_FINANCE"
      description: "财务信息管理 - 收付款、财务核算、成本管理"
    - code: "AUTO_REPORT"
      description: "报表信息管理 - 业务报表、分析图表、数据导出"

  contains_jeecgboot_submodule_views: # 本系统包含的JeecgBoot子模块相关的前端Vue 3视图或页面
    - path: "/views/auto/info/VehicleInfoList.vue"
      description: "车辆基本信息列表页面 - 车辆档案管理"
    - path: "/views/auto/info/BrandManagement.vue"
      description: "品牌型号管理页面 - 汽车品牌字典"
    - path: "/views/auto/sale/SalesOrderList.vue"
      description: "销售订单列表页面 - 销售业务管理"
    - path: "/views/auto/sale/CustomerManagement.vue"
      description: "客户信息管理页面 - CRM客户关系"
    - path: "/views/auto/service/ServiceOrderList.vue"
      description: "服务工单列表页面 - 售后服务管理"
    - path: "/views/auto/inventory/InventoryManagement.vue"
      description: "库存管理页面 - 车辆和配件库存"

  environments: # 系统部署的环境信息，可包含多个
    - id: "dev" # 开发环境的唯一标识
      name: "开发环境"
      backend_url: "http://localhost:8080"
      frontend_url: "http://localhost:3100"
      database:
        connection_url: "jdbc:mysql://localhost:3306/jeecg_auto_dev?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
        driver: "com.mysql.cj.jdbc.Driver"
        username: "root"
        password: "123456"
      redis:
        ip: "127.0.0.1"
        port: "6379"
        password: ""
      storage: "local" # 可选值: "local", "minIO", "oss"
      notes: "供开发人员本地测试和联调使用，包含完整的汽车4S店业务数据"
    - id: "test" # 测试环境的唯一标识
      name: "测试环境"
      backend_url: "http://test-auto.jeecg.com:8080"
      frontend_url: "http://test-auto.jeecg.com:3100"
      database:
        connection_url: "jdbc:mysql://test-db.jeecg.com:3306/jeecg_auto_test?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
        driver: "com.mysql.cj.jdbc.Driver"
        username: "test_user"
        password: "test_password"
      redis:
        ip: "test-redis.jeecg.com"
        port: "6379"
        password: "test_redis_pwd"
      storage: "minIO"
      notes: "供测试团队进行功能和性能测试，模拟真实4S店业务场景"
    - id: "uat" # 用户验收测试环境的唯一标识
      name: "用户验收测试环境"
      backend_url: "http://uat-auto.jeecg.com:8080"
      frontend_url: "http://uat-auto.jeecg.com:3100"
      database:
        connection_url: "jdbc:mysql://uat-db.jeecg.com:3306/jeecg_auto_uat?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
        driver: "com.mysql.cj.jdbc.Driver"
        username: "uat_user"
        password: "uat_password"
      redis:
        ip: "uat-redis.jeecg.com"
        port: "6379"
        password: "uat_redis_pwd"
      storage: "oss"
      notes: "供业务用户进行验收测试，验证系统功能是否满足4S店实际业务需求"
    - id: "prod" # 生产环境的唯一标识
      name: "生产环境"
      backend_url: "https://auto.jeecg.com:8080"
      frontend_url: "https://auto.jeecg.com"
      database:
        connection_url: "jdbc:mysql://prod-db.jeecg.com:3306/jeecg_auto_prod?characterEncoding=UTF-8&useUnicode=true&useSSL=false&tinyInt1isBit=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
        driver: "com.mysql.cj.jdbc.Driver"
        username: "prod_user"
        password: "prod_password"
      redis:
        ip: "prod-redis.jeecg.com"
        port: "6379"
        password: "prod_redis_pwd"
      storage: "oss"
      notes: "正式对外服务的汽车4S店管理系统，高可用和高性能要求"

  tech_stack:
    base_platform: "JeecgBoot" # 基础开发平台
    base_version: "3.8.1" # JeecgBoot版本
    frontend: # 前端技术栈 - 基于JeecgBoot-Vue3
      framework: "Vue.js" # 基于Vue 3的现代前端框架
      version: "3.5.13" # Vue版本
      ui_library: "Ant Design Vue" # UI组件库
      build_tool: "Vite" # 前端构建工具
      language: "TypeScript" # 开发语言
      package_manager: "pnpm" # 包管理器
      jeecg_frontend_version: "3.8.1" # JeecgBoot前端版本
      additional_libraries: # 其他主要依赖
        - name: "Vue Router"
          version: "4.5.0"
          description: "前端路由管理，支持汽车4S店多模块导航"
        - name: "Pinia"
          version: "2.1.7"
          description: "状态管理，存储车辆信息、销售状态等业务数据"
        - name: "Axios"
          version: "1.7.9"
          description: "HTTP客户端，处理汽车4S店业务API调用"
        - name: "VXE Table"
          version: "4.13.31"
          description: "高性能表格组件，展示车辆列表、销售记录等数据"
        - name: "ECharts"
          version: "5.6.0"
          description: "数据可视化图表库，展示销售统计、库存分析等报表"
    backend: # 后端技术栈 - 基于JeecgBoot后端框架
      framework: "Spring Boot" # 基于Spring Boot的企业级Java框架
      language: "Java" # 开发语言
      version: "17" # Java版本(支持JDK 17和1.8)
      spring_boot_version: "2.7.18" # Spring Boot版本
      jeecg_backend_version: "3.8.1" # JeecgBoot后端版本
      orm_library: "MyBatis Plus" # ORM框架
      api_protocol: "RESTful API" # API协议
      security_framework: "Spring Security + JWT + Apache Shiro" # 安全框架
      additional_frameworks: # 其他主要框架和组件
        - name: "Spring Cloud"
          version: "2021.0.8"
          description: "微服务框架，支持4S店多门店分布式部署"
        - name: "Spring Cloud Alibaba"
          version: "2021.0.6.2"
          description: "阿里巴巴微服务套件，提供配置管理和服务发现"
        - name: "MyBatis Plus"
          version: "3.5.3.2"
          description: "MyBatis-Plus ORM框架，处理车辆、销售等业务数据"
        - name: "Druid"
          version: "1.2.24"
          description: "数据库连接池，优化汽车4S店大数据量访问"
        - name: "Apache Shiro"
          version: "1.13.0"
          description: "权限管理框架，控制4S店不同角色权限"
        - name: "Nacos"
          version: "2.0.4"
          description: "服务注册与配置中心，管理4S店微服务配置"
        - name: "XXL-Job"
          version: "2.4.1"
          description: "分布式任务调度，处理保养提醒、库存盘点等定时任务"
        - name: "Knife4j"
          version: "4.4.0"
          description: "API文档生成工具，为4S店系统提供完整接口文档"
        - name: "Hutool"
          version: "5.8.25"
          description: "Java工具类库，简化汽车4S店业务开发"
        - name: "APIJSON"
          version: "5.2.0"
          description: "腾讯开源的JSON动态API框架，支持零代码实时生成文档和自动化测试"
          repository: "https://github.com/Tencent/APIJSON"

  git_repository:
    repo_url: "https://github.com/company/jeecg-auto-4s-system.git" # 项目的主要Git仓库地址
    branch_strategy: "GitFlow工作流，main/develop/feature分支策略"
    cicd_pipeline_tool: "Jenkins + Docker + Kubernetes"

  additional_notes: |
    # 汽车4S店系统特色功能说明
    
    ## 业务特色
    1. **VIN码管理**: 支持17位VIN码格式验证和唯一性检查
    2. **汽车品牌字典**: 预置BMW、BENZ、AUDI、LEXUS等主流品牌数据
    3. **车辆状态管理**: 支持在库→已预订→已销售的完整生命周期
    4. **4S店权限体系**: 基于auto:info:add/edit/delete/list的细粒度权限控制
    
    ## 技术特色
    1. **CodeGen适配**: 针对汽车行业优化，85%基础功能可自动生成
    2. **多门店支持**: 支持连锁4S店的多门店数据隔离和统一管理
    3. **报表丰富**: 内置销售日报、月报、库存报表、财务报表等标准报表
    4. **移动端适配**: 支持微信小程序和移动端H5，方便销售顾问移动办公
    
    ## 部署要求
    1. **数据库**: MySQL 8.0+ (推荐)，需要支持JSON字段类型
    2. **缓存**: Redis 6.0+ (推荐)，用于会话管理和缓存优化
    3. **存储**: 支持本地存储、MinIO、阿里云OSS等多种方式
    4. **服务器**: 建议4核8G以上配置，支持高并发访问