      measurement_criteria: "数据库加密和传输加密检查"
      target_value: "100%敏感数据加密"
      acceptance_threshold: "安全审计验证"
      
    - nfr_id: "NFR-SECU-002"
      requirement_type: "security"
      requirement_statement: "短信发送操作需要审计日志记录"
      measurement_criteria: "操作日志完整性和准确性"
      target_value: "100%操作记录"
      acceptance_threshold: "日志审查验证"

