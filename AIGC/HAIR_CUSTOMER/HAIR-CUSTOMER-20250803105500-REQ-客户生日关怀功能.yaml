    - business_requirement: "自动化客户关怀流程"
      system_requirements: ["EARS-EVT-001", "EARS-UBI-005", "EARS-STA-001"]
      rationale: "定时任务和功能开关实现自动化流程管理"
      
    - business_requirement: "遵守个人信息保护法规"
      system_requirements: ["EARS-UBI-002", "EARS-UNW-001", "EARS-EVT-006"]
