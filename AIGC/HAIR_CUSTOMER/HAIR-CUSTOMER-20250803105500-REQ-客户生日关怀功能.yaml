  integration_constraints:
    - constraint_id: "INTG-CONS-001"
      constraint_type: "integration"
      constraint_description: "短信服务必须支持主流服务商API"
      constraint_rationale: "确保服务可用性和成本控制"
      impact_assessment: "需要抽象短信服务接口，支持多服务商切换"
      
