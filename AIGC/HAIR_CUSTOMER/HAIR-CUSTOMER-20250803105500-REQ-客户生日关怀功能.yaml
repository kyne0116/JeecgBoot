    - business_requirement: "确保服务质量和可靠性"
      system_requirements: ["EARS-UBI-004", "EARS-EVT-003", "EARS-UNW-002", "EARS-UNW-004"]
      rationale: "发送记录、重试机制和质量控制保证服务质量"
      
  # 系统需求到测试场景的映射
  system_to_test_mapping:
