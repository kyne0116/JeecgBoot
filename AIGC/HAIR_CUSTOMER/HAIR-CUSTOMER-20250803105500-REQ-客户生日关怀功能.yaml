      test_scenarios: ["BDD-FUNC-001", "BDD-EXC-003"]
      coverage_level: "complete"
      
    - system_requirement: "EARS-UBI-002"
      test_scenarios: ["BDD-FUNC-001", "BDD-FUNC-006"]
      coverage_level: "complete"
      
    - system_requirement: "EARS-EVT-001"
      test_scenarios: ["BDD-FUNC-002", "BDD-BND-001"]
      coverage_level: "complete"
      
    - system_requirement: "EARS-UBI-003"
      test_scenarios: ["BDD-FUNC-003", "BDD-FUNC-008"]
      coverage_level: "complete"
      
    - system_requirement: "EARS-EVT-003"
      test_scenarios: ["BDD-EXC-001", "BDD-EXC-002"]
      coverage_level: "complete"
      
  # 测试覆盖率分析
  test_coverage_analysis:
