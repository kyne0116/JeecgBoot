      target_value: "≥95%成功率"
      acceptance_threshold: "月度统计验证"
      
    - nfr_id: "NFR-RELI-002"
      requirement_type: "reliability"
      requirement_statement: "定时任务执行可靠性达到99%"
      measurement_criteria: "定时任务成功执行次数与计划执行次数比率"
      target_value: "≥99%执行成功率"
      acceptance_threshold: "系统监控验证"
      
  # 安全性需求
  security_requirements:
