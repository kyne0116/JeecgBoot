    - nfr_id: "NFR-PERF-002"
      requirement_type: "performance"
      requirement_statement: "定时任务执行不影响系统响应性能"
      measurement_criteria: "定时任务执行期间系统响应时间"
      target_value: "响应时间增幅≤20%"
      acceptance_threshold: "性能监控验证"
      
  # 可靠性需求
  reliability_requirements:
