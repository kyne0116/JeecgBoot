# 支持三层架构的Layer 3 - 需求层 (Requirement Level)

# ============================================================================
# 📁 v4.0 三层架构存储规范 (重要更新)
# ============================================================================
# 本模板属于: Layer 3 - 需求层 (Requirement Level)
# 命名格式: [SYSTEM]-[MODULE]-[TIMESTAMP]-REQ-[TITLE].yaml
# 存储位置: ${base_working_directory}/AIGC/[SYSTEM]_[MODULE]/[SYSTEM]-[MODULE]-[TIMESTAMP]-REQ-[TITLE].yaml
# 
# 当前文档:
# - 美发管理系统-客户管理: /Users/admin/Work/Github/JeecgBoot/AIGC/HAIR_CUSTOMER/HAIR-CUSTOMER-20250803103001-REQ-客户服务历史管理功能.yaml
#
# 4-Agent协作文档链:
# - REQ: HAIR-CUSTOMER-20250803103001-REQ-客户服务历史管理功能.yaml (需求分析 - Agent-A)
# - ARCH: HAIR-CUSTOMER-20250803103001-ARCH-客户服务历史管理功能.yaml (架构设计 - Agent-B)
# - DEV: HAIR-CUSTOMER-20250803103001-DEV-客户服务历史管理功能.yaml (开发任务 - Agent-C)
# - TEST: HAIR-CUSTOMER-20250803103001-TEST-客户服务历史管理功能.yaml (测试设计 - Agent-D)
# ============================================================================

# ============================================================================
# Agent协作协议声明
# ============================================================================
agent_collaboration_protocol:
  source_agent: "Agent-A (需求分析师)"
  target_agent: "Agent-B (架构设计师)"
  communication_standard: "BDD/EARS结构化协议"
  quality_target: "格式一致性>95%, 追溯完整性100%"
  processing_time_target: "<30秒/需求项"

