      baseline_version: "v1.0"
      requirement_suite_id: "HAIR-CUSTOMER-20250803103000"
      baseline_doc_path: "/Users/admin/Work/Github/JeecgBoot/AIGC/requirement_baseline_HAIR_CUSTOMER.yaml"
      
    # 系统基础信息引用  
