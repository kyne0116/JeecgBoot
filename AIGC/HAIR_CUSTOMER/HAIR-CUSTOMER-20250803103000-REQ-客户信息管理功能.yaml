# 
# 当前文档:
# - 美发管理系统-客户管理: /Users/admin/Work/Github/JeecgBoot/AIGC/HAIR_CUSTOMER/HAIR-CUSTOMER-20250803103000-REQ-客户信息管理功能.yaml
#
# 4-Agent协作文档链:
# - REQ: HAIR-CUSTOMER-20250803103000-REQ-客户信息管理功能.yaml (需求分析 - Agent-A)
# - ARCH: HAIR-CUSTOMER-20250803103000-ARCH-客户信息管理功能.yaml (架构设计 - Agent-B)
# - DEV: HAIR-CUSTOMER-20250803103000-DEV-客户信息管理功能.yaml (开发任务 - Agent-C)
