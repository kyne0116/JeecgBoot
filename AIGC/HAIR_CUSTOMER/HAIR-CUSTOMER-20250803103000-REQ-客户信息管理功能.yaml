# ============================================================================
additional_information:
  # 重要假设条件
  key_assumptions: |
    1. 美发店客户信息相对简单，不涉及复杂的企业客户管理
    2. 客户愿意提供个人信息用于服务优化
    3. 工作人员具备基本的计算机操作能力
    4. 客户隐私保护符合相关法律法规要求
    
  # 范围外事项
  out_of_scope_items: |
    1. 客户积分和会员等级管理（未来版本考虑）
