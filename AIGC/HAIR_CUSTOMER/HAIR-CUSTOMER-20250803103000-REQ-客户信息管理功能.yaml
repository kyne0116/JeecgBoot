# ============================================================================
# EARS需求分析结果 (五种类型完整覆盖)
# ============================================================================
ears_requirement_analysis:
  # 分析统计摘要
  analysis_summary:
    total_requirements_identified: 18
    ubiquitous_requirements_count: 6
    event_driven_requirements_count: 4
    unwanted_behavior_requirements_count: 3
    state_driven_requirements_count: 3
    optional_requirements_count: 2
    
  # 类型1：通用需求 (Ubiquitous Requirements)
  ubiquitous_requirements:
    - requirement_id: "REQ-U-001"
      ears_statement: "系统应当能够新增客户基本信息记录"
      business_context: "前台接待需要为新客户建立档案"
      business_value: "建立客户数据库，为后续服务提供基础"
      priority: "high"
      complexity: "simple"
      codegen_suitable: true
      acceptance_criteria:
        - criterion: "能够录入客户姓名、电话、性别等基本信息"
          validation_method: "功能测试验证"
        - criterion: "新增客户后系统自动分配唯一客户编号"
          validation_method: "数据库记录检查"
      stakeholders: ["前台接待", "店长"]
      
    - requirement_id: "REQ-U-002"
      ears_statement: "系统应当能够查询和检索客户信息"
      business_context: "工作人员需要快速找到客户历史信息"
      business_value: "提高服务效率，了解客户需求"
      priority: "high"
      complexity: "simple"
      codegen_suitable: true
      acceptance_criteria:
        - criterion: "支持按姓名、电话、客户编号等条件查询"
          validation_method: "查询功能测试"
        - criterion: "查询结果响应时间小于3秒"
          validation_method: "性能测试"
      stakeholders: ["前台接待", "美发师"]
      
    - requirement_id: "REQ-U-003"
      ears_statement: "系统应当能够修改客户基本信息"
      business_context: "客户信息发生变更时需要及时更新"
      business_value: "保持客户信息准确性和时效性"
      priority: "medium"
      complexity: "simple"
      codegen_suitable: true
      acceptance_criteria:
        - criterion: "能够修改除客户编号外的所有基本信息"
          validation_method: "功能测试验证"
        - criterion: "修改操作需要记录操作人和操作时间"
          validation_method: "审计日志检查"
      stakeholders: ["前台接待", "店长"]
      
    - requirement_id: "REQ-U-004"
      ears_statement: "系统应当能够删除客户信息记录"
      business_context: "处理重复记录或客户要求删除个人信息"
      business_value: "维护数据质量，保护客户隐私权"
      priority: "low"
      complexity: "medium"
      codegen_suitable: false
      acceptance_criteria:
        - criterion: "删除操作需要店长级别权限确认"
          validation_method: "权限控制测试"
        - criterion: "逻辑删除，保留历史记录用于审计"
          validation_method: "数据完整性检查"
      stakeholders: ["店长", "客户"]
      
    - requirement_id: "REQ-U-005"
      ears_statement: "系统应当能够导出客户信息列表"
      business_context: "管理层需要分析客户数据，制定营销策略"
      business_value: "支持商业分析和决策制定"
      priority: "medium"
      complexity: "simple"
      codegen_suitable: true
      acceptance_criteria:
        - criterion: "支持导出Excel格式的客户信息表"
          validation_method: "导出功能测试"
        - criterion: "导出数据应脱敏处理敏感信息"
          validation_method: "数据安全审查"
      stakeholders: ["店长", "管理层"]
      
    - requirement_id: "REQ-U-006"
      ears_statement: "系统应当能够管理客户美发偏好信息"
      business_context: "记录客户的发型偏好、颜色喜好等个性化信息"
      business_value: "提供个性化服务，提升客户满意度"
      priority: "medium"
      complexity: "medium"
      codegen_suitable: false
      acceptance_criteria:
        - criterion: "能够记录客户的发型类型、颜色偏好、护理需求"
          validation_method: "功能测试验证"
        - criterion: "偏好信息支持多选和备注说明"
          validation_method: "界面交互测试"
      stakeholders: ["美发师", "客户"]
  
  # 类型2：事件驱动需求 (Event-driven Requirements)
  event_driven_requirements:
    - requirement_id: "REQ-E-001"
      ears_statement: "当客户首次到店时，系统应当引导工作人员创建客户档案"
      event_source: "user_action"
      event_frequency: "occasional"
      response_timing: "immediate"
      business_context: "新客户接待流程优化"
      priority: "high"
      complexity: "medium"
      acceptance_criteria:
        - criterion: "检测到新客户时显示创建档案提示"
          validation_method: "界面流程测试"
      error_handling_requirement: "如果客户拒绝提供信息，允许创建匿名档案"
      
    - requirement_id: "REQ-E-002"
      ears_statement: "当客户信息发生修改时，系统应当自动记录变更日志"
      event_source: "user_action"
      event_frequency: "realtime"
      response_timing: "immediate"
      business_context: "数据变更审计和追溯"
      priority: "medium"
      complexity: "simple"
      acceptance_criteria:
        - criterion: "变更日志包含修改前后值、操作人、操作时间"
          validation_method: "审计日志验证"
      error_handling_requirement: "日志记录失败时不影响业务操作，但需要告警"
      
    - requirement_id: "REQ-E-003"
      ears_statement: "当客户长期未到店时，系统应当标记为潜在流失客户"
      event_source: "system_timer"
      event_frequency: "periodic"
      response_timing: "scheduled"
      business_context: "客户关系维护和流失预警"
      priority: "low"
      complexity: "medium"
      acceptance_criteria:
        - criterion: "超过6个月未到店的客户自动标记为潜在流失"
          validation_method: "定时任务测试"
      error_handling_requirement: "标记失败时记录错误日志，不影响其他功能"
      
    - requirement_id: "REQ-E-004"
      ears_statement: "当系统检测到重复客户信息时，系统应当提示可能的重复记录"
      event_source: "user_action"
      event_frequency: "occasional"
      response_timing: "immediate"
      business_context: "防止重复建档，维护数据质量"
      priority: "medium"
      complexity: "complex"
      acceptance_criteria:
        - criterion: "基于姓名+电话组合检测重复记录"
          validation_method: "重复检测算法测试"
      error_handling_requirement: "检测失败时允许继续创建，但记录告警日志"
  
  # 类型3：不希望行为需求 (Unwanted Behavior Requirements)
  unwanted_behavior_requirements:
    - requirement_id: "REQ-UB-001"
      ears_statement: "如果未经授权人员试图访问客户隐私信息，系统应当拒绝访问并记录安全日志"
      unwanted_scenario: "非授权人员查看客户敏感信息"
      risk_level: "high"
      prevention_mechanism: "基于角色的权限控制"
      detection_method: "访问权限验证"
      recovery_action: "拒绝访问，记录安全日志，必要时锁定账户"
      business_impact: "保护客户隐私，避免信息泄露风险"
      priority: "high"
      acceptance_criteria:
        - criterion: "非授权访问被成功拒绝，无敏感信息泄露"
          validation_method: "权限测试和安全测试"
      
    - requirement_id: "REQ-UB-002"
      ears_statement: "如果客户信息录入包含恶意代码或非法字符，系统应当拒绝录入并提示错误"
      unwanted_scenario: "恶意代码注入或数据污染"
      risk_level: "medium"
      prevention_mechanism: "输入验证和数据清洗"
      detection_method: "输入内容格式校验"
      recovery_action: "拒绝录入，提示具体错误信息"
      business_impact: "保护系统安全，维护数据质量"
      priority: "medium"
      acceptance_criteria:
        - criterion: "恶意输入被成功拦截，系统保持稳定"
          validation_method: "安全测试和输入验证测试"
      
    - requirement_id: "REQ-UB-003"
      ears_statement: "如果批量操作可能导致客户数据丢失，系统应当要求二次确认并提供数据备份"
      unwanted_scenario: "批量删除或修改导致数据意外丢失"
      risk_level: "high"
      prevention_mechanism: "二次确认机制和操作前备份"
      detection_method: "批量操作风险评估"
      recovery_action: "要求确认，提供撤销功能"
      business_impact: "防止数据丢失，确保业务连续性"
      priority: "high"
      acceptance_criteria:
        - criterion: "批量操作有明确的确认流程和撤销机制"
          validation_method: "批量操作安全测试"
  
  # 类型4：状态驱动需求 (State-driven Requirements)
  state_driven_requirements:
    - requirement_id: "REQ-S-001"
      ears_statement: "当客户信息处于新建状态时，系统应当要求填写必填字段"
      state_definition: "客户记录刚创建，信息不完整"
      state_entry_condition: "点击新增客户按钮"
      state_exit_condition: "必填信息录入完成并保存"
      state_behavior_description: "强制校验必填字段，阻止不完整信息保存"
      state_transitions:
        - from_state: "新建状态"
          to_state: "完整状态"
          transition_trigger: "保存操作"
          transition_condition: "所有必填字段已填写"
        - from_state: "新建状态"
          to_state: "取消状态"
          transition_trigger: "取消操作"
          transition_condition: "用户确认放弃录入"
      business_context: "确保客户信息完整性"
      priority: "high"
      complexity: "simple"
      
    - requirement_id: "REQ-S-002"
      ears_statement: "当客户信息处于编辑状态时，系统应当锁定记录防止并发修改"
      state_definition: "客户记录正在被修改中"
      state_entry_condition: "点击编辑客户信息"
      state_exit_condition: "保存修改或取消编辑"
      state_behavior_description: "对记录加锁，其他用户只能查看不能编辑"
      state_transitions:
        - from_state: "编辑状态"
          to_state: "完整状态"
          transition_trigger: "保存操作"
          transition_condition: "修改内容验证通过"
        - from_state: "编辑状态"
          to_state: "完整状态"
          transition_trigger: "取消操作"
          transition_condition: "确认放弃修改"
      business_context: "防止数据并发修改冲突"
      priority: "medium"
      complexity: "medium"
      
    - requirement_id: "REQ-S-003"
      ears_statement: "当客户信息处于删除状态时，系统应当隐藏记录但保留历史数据"
      state_definition: "客户记录已被逻辑删除"
      state_entry_condition: "执行删除操作并确认"
      state_exit_condition: "记录恢复或物理删除"
      state_behavior_description: "记录在正常查询中不可见，但在审计查询中可见"
      state_transitions:
        - from_state: "删除状态"
          to_state: "完整状态"
          transition_trigger: "恢复操作"
          transition_condition: "管理员权限确认"
      business_context: "数据删除安全性和可恢复性"
      priority: "low"
      complexity: "medium"
  
  # 类型5：可选需求 (Optional Requirements)
  optional_requirements:
    - requirement_id: "REQ-O-001"
      ears_statement: "在客户同意的情况下，系统可以记录客户照片用于识别"
      optional_condition: "客户主动同意照片采集"
      optional_feature_description: "拍摄并存储客户照片，辅助身份识别"
      business_benefit: "提高客户识别准确性，提升服务个性化水平"
      implementation_priority: "phase_2"
      effort_estimation: "medium"
      dependency_requirements: ["REQ-U-001", "文件存储服务"]
      business_value_score: 7
      technical_complexity_score: 6
      
    - requirement_id: "REQ-O-002"
      ears_statement: "在有充足资源的情况下，系统可以提供客户信息智能推荐功能"
      optional_condition: "AI推荐引擎开发完成"
      optional_feature_description: "基于客户历史偏好推荐合适的服务项目"
      business_benefit: "提高服务推荐准确性，增加客户满意度"
      implementation_priority: "future"
      effort_estimation: "large"
      dependency_requirements: ["REQ-U-006", "AI推荐算法"]
      business_value_score: 8
      technical_complexity_score: 9

# ============================================================================
# BDD场景分解 (四种场景类型完整覆盖)
# ============================================================================
bdd_scenario_analysis:
  # 场景分析摘要
  scenario_summary:
    total_scenarios_identified: 12
    functional_scenarios_count: 6
    exception_scenarios_count: 3
    boundary_scenarios_count: 2
    integration_scenarios_count: 1
    
  # 类型1：功能场景 (Functional Scenarios) - 正向业务流程
  functional_scenarios:
    - scenario_id: "BDD-F-001"
      scenario_title: "新客户信息录入"
      source_requirement_id: "REQ-U-001"
      business_goal: "为新客户建立完整的信息档案"
      user_role: "前台接待"
      
      given: "前台接待已登录系统且有客户信息录入权限"
      when: "点击新增客户按钮并填写客户基本信息"
      then: "系统成功保存客户信息并分配唯一客户编号"
      and_conditions:
        - "客户姓名、电话号码、性别为必填项"
        - "系统自动记录创建时间和创建人"
      but_exceptions:
        - condition: "如果必填字段未填写完整"
          expected_behavior: "系统提示具体缺失字段，阻止保存"
          error_code: "CUST_001"
          recovery_strategy: "补充必填信息后重新保存"
          user_guidance: "请填写所有必填字段后再保存"
          
      acceptance_criteria:
        - criterion: "能够成功保存包含姓名、电话、性别的客户记录"
          validation_approach: "输入有效数据并验证保存结果"
          success_indicator: "数据库中存在对应记录且字段值正确"
      
      test_data_requirements:
        - data_type: "客户基本信息"
          data_description: "姓名、电话、性别、地址等信息"
          data_source: "测试数据生成器"
          
      priority: "high"
      complexity: "simple"
      
    - scenario_id: "BDD-F-002"
      scenario_title: "客户信息查询检索"
      source_requirement_id: "REQ-U-002"
      business_goal: "快速找到指定客户的详细信息"
      user_role: "前台接待"
      
      given: "系统中已存在客户信息记录"
      when: "在查询界面输入客户姓名或电话号码进行搜索"
      then: "系统显示匹配的客户信息列表"
      and_conditions:
        - "查询结果包含客户编号、姓名、电话等关键信息"
        - "支持模糊查询和精确查询"
      but_exceptions:
        - condition: "如果查询条件未匹配到任何记录"
          expected_behavior: "显示'未找到匹配客户'提示信息"
          error_code: "CUST_002"
          recovery_strategy: "调整查询条件重新搜索"
          user_guidance: "请检查客户姓名或电话号码是否正确"
          
      acceptance_criteria:
        - criterion: "能够通过姓名或电话准确查询到客户信息"
          validation_approach: "使用已知客户信息进行查询测试"
          success_indicator: "查询结果与预期客户信息一致"
      
      test_data_requirements:
        - data_type: "查询关键词"
          data_description: "客户姓名、电话号码等查询条件"
          data_source: "已存在的客户记录"
          
      priority: "high"
      complexity: "simple"
      
    - scenario_id: "BDD-F-003"
      scenario_title: "客户信息修改更新"
      source_requirement_id: "REQ-U-003"
      business_goal: "及时更新客户变更信息"
      user_role: "前台接待"
      
      given: "已找到需要修改的客户记录"
      when: "进入编辑模式修改客户信息并保存"
      then: "系统成功更新客户信息并记录变更日志"
      and_conditions:
        - "修改操作自动记录操作人和操作时间"
        - "客户编号不允许修改"
      but_exceptions:
        - condition: "如果其他用户正在编辑同一客户记录"
          expected_behavior: "系统提示记录被锁定，无法编辑"
          error_code: "CUST_003"
          recovery_strategy: "等待其他用户完成编辑后再次尝试"
          user_guidance: "该客户信息正在被其他用户编辑中"
          
      acceptance_criteria:
        - criterion: "能够成功修改客户信息并保存"
          validation_approach: "修改客户信息并验证数据库更新"
          success_indicator: "数据库中客户信息已更新为新值"
      
      test_data_requirements:
        - data_type: "修改后的客户信息"
          data_description: "更新的电话、地址等信息"
          data_source: "测试数据集"
          
      priority: "medium"
      complexity: "simple"
      
    - scenario_id: "BDD-F-004"
      scenario_title: "客户偏好信息管理"
      source_requirement_id: "REQ-U-006"
      business_goal: "记录客户个性化偏好提升服务质量"
      user_role: "美发师"
      
      given: "美发师已登录系统且正在查看客户详情"
      when: "在偏好设置页面录入客户发型和颜色偏好"
      then: "系统保存客户偏好信息并在后续服务中显示"
      and_conditions:
        - "偏好信息支持多选（如发型类型、颜色系列）"
        - "可以添加备注说明特殊要求"
      but_exceptions:
        - condition: "如果偏好信息格式不正确"
          expected_behavior: "系统提示正确的格式要求"
          error_code: "CUST_004"
          recovery_strategy: "按照提示格式重新录入"
          user_guidance: "请按照指定格式录入偏好信息"
          
      acceptance_criteria:
        - criterion: "能够成功保存客户发型和颜色偏好"
          validation_approach: "录入偏好信息并验证存储和显示"
          success_indicator: "偏好信息正确保存并在客户资料中显示"
      
      test_data_requirements:
        - data_type: "客户偏好信息"
          data_description: "发型类型、颜色偏好、特殊要求等"
          data_source: "美发业务知识库"
          
      priority: "medium"
      complexity: "medium"
      
    - scenario_id: "BDD-F-005"
      scenario_title: "客户信息导出"
      source_requirement_id: "REQ-U-005"
      business_goal: "支持客户数据分析和营销策略制定"
      user_role: "店长"
      
      given: "店长已登录系统且有数据导出权限"
      when: "选择导出条件并执行客户信息导出操作"
      then: "系统生成Excel文件并提供下载链接"
      and_conditions:
        - "导出数据已进行敏感信息脱敏处理"
        - "导出操作记录在系统日志中"
      but_exceptions:
        - condition: "如果导出数据量过大"
          expected_behavior: "系统提示分批导出或联系管理员"
          error_code: "CUST_005"
          recovery_strategy: "缩小导出范围或选择分批导出"
          user_guidance: "数据量过大，请缩小查询范围"
          
      acceptance_criteria:
        - criterion: "能够成功导出客户信息Excel文件"
          validation_approach: "执行导出操作并验证文件内容"
          success_indicator: "生成的Excel文件包含正确的客户数据"
      
      test_data_requirements:
        - data_type: "客户数据集"
          data_description: "包含多种客户类型的测试数据"
          data_source: "测试数据库"
          
      priority: "medium"
      complexity: "simple"
      
    - scenario_id: "BDD-F-006"
      scenario_title: "重复客户检测"
      source_requirement_id: "REQ-E-004"
      business_goal: "防止创建重复的客户记录"
      user_role: "前台接待"
      
      given: "系统中已存在客户记录"
      when: "录入新客户信息时姓名和电话号码与现有记录相似"
      then: "系统提示可能存在重复记录并显示相似客户信息"
      and_conditions:
        - "提供选择现有客户或继续创建新客户的选项"
        - "重复检测基于姓名+电话的组合匹配"
      but_exceptions:
        - condition: "如果用户确认继续创建新客户"
          expected_behavior: "系统允许创建但记录重复提醒日志"
          error_code: "CUST_006"
          recovery_strategy: "继续创建新记录"
          user_guidance: "已记录重复提醒，继续创建新客户"
          
      acceptance_criteria:
        - criterion: "能够准确检测到潜在的重复客户记录"
          validation_approach: "使用相似信息测试重复检测功能"
          success_indicator: "系统正确识别并提示重复风险"
      
      test_data_requirements:
        - data_type: "相似客户信息"
          data_description: "姓名或电话相近的客户数据"
          data_source: "专门设计的重复测试数据"
          
      priority: "medium"
      complexity: "complex"
  
  # 类型2：异常场景 (Exception Scenarios) - 错误处理和异常情况
  exception_scenarios:
    - scenario_id: "BDD-E-001"
      scenario_title: "非授权访问客户信息"
      source_requirement_id: "REQ-UB-001"
      exception_type: "business_rule_violation"
      error_category: "user_error"
      
      given: "普通员工已登录系统但没有客户信息查看权限"
      when: "尝试访问客户详细信息页面"
      then: "系统拒绝访问并显示权限不足提示"
      and_conditions:
        - "访问尝试被记录在安全日志中"
        - "用户界面隐藏无权限访问的功能按钮"
      
      exception_handling_strategy:
        immediate_response: "立即拒绝访问，显示权限错误页面"
        user_notification: "提示'您没有权限访问此功能，请联系管理员'"
        error_logging: "记录访问者信息、尝试时间、访问资源"
        recovery_mechanism: "引导用户返回授权功能页面"
        escalation_procedure: "连续违规访问将触发账户锁定"
      
      severity: "high"
      priority: "high"
      
    - scenario_id: "BDD-E-002"
      scenario_title: "恶意输入攻击防护"
      source_requirement_id: "REQ-UB-002"
      exception_type: "system_error"
      error_category: "integration_error"
      
      given: "用户在客户信息录入页面输入包含SQL注入代码的内容"
      when: "提交包含恶意代码的客户信息"
      then: "系统检测到恶意输入并拒绝保存，显示安全错误提示"
      and_conditions:
        - "恶意输入尝试被记录在安全日志中"
        - "系统对所有输入进行安全过滤"
      
      exception_handling_strategy:
        immediate_response: "拒绝处理请求，清空可疑输入字段"
        user_notification: "提示'输入内容包含非法字符，请重新输入'"
        error_logging: "记录恶意输入内容、来源IP、用户账户"
        recovery_mechanism: "提供输入格式指导，重置表单"
        escalation_procedure: "多次恶意输入将暂时锁定账户"
      
      severity: "critical"
      priority: "high"
      
    - scenario_id: "BDD-E-003"
      scenario_title: "网络连接中断处理"
      source_requirement_id: "REQ-E-002"
      exception_type: "external_failure"
      error_category: "system_error"
      
      given: "用户正在编辑客户信息时网络连接突然中断"
      when: "提交保存操作但无法连接到服务器"
      then: "系统提示网络错误并保存本地草稿"
      and_conditions:
        - "本地保存的草稿在网络恢复后可以继续编辑"
        - "系统自动检测网络恢复状态"
      
      exception_handling_strategy:
        immediate_response: "显示网络连接错误提示"
        user_notification: "网络连接中断，数据已暂存本地"
        error_logging: "记录网络错误时间和用户操作"
        recovery_mechanism: "网络恢复后自动重新连接"
        escalation_procedure: "长时间网络中断时引导用户重新登录"
      
      severity: "medium"
      priority: "medium"
  
  # 类型3：边界场景 (Boundary Scenarios) - 临界值和边界条件
  boundary_scenarios:
    - scenario_id: "BDD-B-001"
      scenario_title: "客户姓名长度边界测试"
      source_requirement_id: "REQ-U-001"
      boundary_type: "data_limit"
      boundary_value: "50个字符"
      boundary_description: "客户姓名字段的最大长度限制"
      
      given: "用户在客户信息录入页面"
      when: "输入长度恰好为50个字符的客户姓名"
      then: "系统成功接受并保存该姓名"
      and_conditions:
        - "输入长度为51个字符时系统拒绝并提示超长"
        - "输入长度为1个字符时系统接受"
      
      boundary_test_cases:
        - test_case: "最大长度测试"
          test_value: "50个字符的姓名"
          expected_result: "成功保存"
        - test_case: "超长测试"
          test_value: "51个字符的姓名"
          expected_result: "拒绝保存并提示错误"
      
      priority: "medium"
      
    - scenario_id: "BDD-B-002"
      scenario_title: "电话号码格式边界测试"
      source_requirement_id: "REQ-U-001"
      boundary_type: "data_limit"
      boundary_value: "11位数字"
      boundary_description: "中国大陆手机号码标准格式"
      
      given: "用户在客户信息录入页面填写电话号码"
      when: "输入标准的11位手机号码"
      then: "系统验证通过并成功保存"
      and_conditions:
        - "10位或12位号码系统拒绝"
        - "包含非数字字符的号码系统拒绝"
      
      boundary_test_cases:
        - test_case: "标准格式测试"
          test_value: "13812345678"
          expected_result: "验证通过"
        - test_case: "非标准格式测试"
          test_value: "138-1234-5678"
          expected_result: "验证失败"
      
      priority: "high"
  
  # 类型4：集成场景 (Integration Scenarios) - 外部系统交互
  integration_scenarios:
    - scenario_id: "BDD-I-001"
      scenario_title: "客户数据导出到外部系统"
      source_requirement_id: "REQ-U-005"
      integration_type: "file_system"
      external_system: "Excel文件生成器"
      integration_direction: "outbound"
      
      given: "客户数据库中存在多条客户记录"
      when: "执行客户信息导出操作"
      then: "系统生成包含所有客户信息的Excel文件"
      and_conditions:
        - "Excel文件格式符合标准"
        - "敏感信息已进行脱敏处理"
      
      integration_constraints:
        data_format: "Excel (.xlsx)"
        protocol: "http"
        authentication: "none"
        timeout_requirement: "30秒"
        retry_strategy: "失败后最多重试3次"
        
      integration_exception_handling:
        connection_failure: "提示文件生成失败，建议稍后重试"
        timeout_handling: "显示生成超时错误，提供重新生成选项"
        data_format_error: "显示数据格式错误，检查数据完整性"
        authentication_failure: "不适用"
        
      priority: "medium"

