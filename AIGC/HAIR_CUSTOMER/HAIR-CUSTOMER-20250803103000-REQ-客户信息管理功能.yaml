      system_level_traceability_id: "HAIR-SYSTEM-TRACE"
      baseline_level_traceability_id: "TRACE-REQ-BASELINE-20250803-001-HAIR-CUSTOMER-20250803103000"
      
  # 源输入信息
  source_input_info:
