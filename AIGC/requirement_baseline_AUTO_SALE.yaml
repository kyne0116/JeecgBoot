  # 与库存模块的依赖
  dependencies_with_inventory_module:
    - dependency_id: "CROSS-DEP-SALE-INV-001"
      dependency_type: "functional_dependency"
      dependency_description: "销售订单需要检查库存可用性"
      dependency_strength: "mandatory"
      interface_specification: "实时库存查询和预占接口"
      
  # 与财务模块的依赖
  dependencies_with_finance_module:
    - dependency_id: "CROSS-DEP-SALE-FIN-001"
      dependency_type: "workflow_dependency"
      dependency_description: "销售订单完成后需要触发财务收款流程"
      dependency_strength: "mandatory"
      interface_specification: "销售订单状态变更事件通知"

# ============================================================================
# 附加信息
# ============================================================================
additional_information:
  # 重要假设条件
  key_assumptions: |
    1. 销售流程遵循4S店标准业务流程
    2. 客户数据符合GDPR和个人信息保护法规
    3. 销售人员具备基本的CRM系统使用能力
    4. 与现有财务系统能够实现数据集成
    
  # 基线范围外事项  
  out_of_baseline_scope: |
    1. 金融贷款和保险业务处理(专业金融模块)
    2. 复杂的佣金计算和提成管理(HR模块)
    3. 高级数据分析和BI报表(REPORT模块专责)
    4. 移动端原生APP开发(后续版本考虑)
    
  # 风险提示
  risk_alerts: |
    1. 销售流程的个性化需求可能导致开发复杂度增加
    2. 客户数据隐私合规要求严格，需要额外的安全设计
    3. 与外部CRM或ERP系统的集成可能存在技术难点
    4. 销售业务规则变化频繁，需要考虑系统的可配置性