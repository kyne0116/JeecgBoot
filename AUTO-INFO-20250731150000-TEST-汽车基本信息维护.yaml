# ============================================================================
# JeecgBoot特性集成测试 (CodeGen和框架特性)
# ============================================================================
jeecg_integration_testing:
  # CodeGen生成代码测试
  codegen_generated_code_testing:
    # 标准CRUD测试模板
    standard_crud_test_templates:
      - template_id: "CRUD-TEMPLATE-001"
        business_entity: "CarInfo"
        
        # CRUD操作测试覆盖
        crud_operations_coverage:
          create_operation_tests:
            - test_name: "testCreateCarInfo_ValidInput_ReturnsSuccess"
              test_type: "positive_test"
              validation_points: ["数据保存成功", "返回正确ID", "状态设置正确"]
              
          read_operation_tests:
            - test_name: "testGetCarInfo_ValidId_ReturnsEntity"
              test_type: "positive_test"
              validation_points: ["数据查询成功", "字段值正确", "关联数据加载"]
              
          update_operation_tests:
            - test_name: "testUpdateCarInfo_ValidInput_ReturnsSuccess"
              test_type: "positive_test"
              validation_points: ["数据更新成功", "VIN码保持不变", "修改时间更新"]
              
          delete_operation_tests:
            - test_name: "testDeleteCarInfo_ValidId_ReturnsSuccess"
              test_type: "positive_test"
              validation_points: ["数据删除成功", "关联清理正确", "日志记录完整"]
              
          query_operation_tests:
            - test_name: "testQueryCarInfo_ValidCriteria_ReturnsResults"
              test_type: "positive_test"
              validation_points: ["查询条件生效", "分页功能正常", "排序功能正常"]
              
        # 数据字典验证测试
        dictionary_validation_tests:
          used_dictionaries: ["car_brand", "car_status"]
          dictionary_tests:
            - dictionary_name: "car_brand"
              dictionary_values: ["BMW", "BENZ", "AUDI", "TOYOTA", "HONDA"]
              validation_test_cases:
                - test_case: "testCarInfo_ValidBrandCode_AcceptsValue"
                  test_input: "BMW"
                  expected_result: "success"
                - test_case: "testCarInfo_InvalidBrandCode_RejectsValue"
                  test_input: "INVALID_BRAND"
                  expected_result: "validation_error"
                  
            - dictionary_name: "car_status"
              dictionary_values: ["1", "2", "3"]
              validation_test_cases:
                - test_case: "testCarInfo_ValidStatusCode_AcceptsValue"
                  test_input: "1"
                  expected_result: "success"
                - test_case: "testCarInfo_InvalidStatusCode_RejectsValue"
                  test_input: "9"
                  expected_result: "validation_error"
                  
    # 自定义业务逻辑测试
    custom_business_logic_testing:
      - custom_logic_id: "CUSTOM-LOGIC-001"
        logic_description: "VIN码格式验证和唯一性检查"
        complexity_level: "complex"
        
        # 自定义测试策略
        custom_test_strategy:
          test_approach: "white_box"
          test_techniques: ["equivalence_partitioning", "boundary_value_analysis", "decision_table"]
          test_coverage_requirements: ["所有验证规则", "所有异常情况", "边界条件"]
          
        # 自定义测试用例
        custom_test_cases:
          - custom_test_case_id: "CUSTOM-TC-001"
            test_case_description: "VIN码17位长度验证"
            test_complexity: "medium"
            test_data_requirements: "不同长度的VIN码字符串"
            expected_challenges: ["边界值测试", "特殊字符处理"]
            
          - custom_test_case_id: "CUSTOM-TC-002"
            test_case_description: "VIN码唯一性数据库检查"
            test_complexity: "high"
            test_data_requirements: "已存在和不存在的VIN码"
            expected_challenges: ["数据库并发访问", "性能测试"]
            
      - custom_logic_id: "CUSTOM-LOGIC-002"
        logic_description: "车辆状态变更工作流"
        complexity_level: "medium"
        custom_test_strategy:
          test_approach: "grey_box"
          test_techniques: ["state_transition_testing", "workflow_testing"]
          test_coverage_requirements: ["所有状态转换", "状态约束检查"]
        custom_test_cases:
          - custom_test_case_id: "CUSTOM-TC-003"
            test_case_description: "车辆状态从在库到已销售的转换"
            test_complexity: "medium"
            test_data_requirements: "不同状态的车辆数据"
            expected_challenges: ["状态转换规则验证", "业务权限检查"]
            
  # JeecgBoot框架特性测试
  jeecg_framework_features_testing:
    # 权限控制测试
    permission_control_testing:
      - permission_test_suite_id: "PERM-TS-001"
        tested_permissions: ["auto:info:add", "auto:info:edit", "auto:info:delete", "auto:info:list"]
        
        permission_test_cases:
          - permission_test_case_id: "PERM-TC-001"
            test_scenario: "有权限用户访问车辆信息新增功能"
            user_role: "car_manager"
            required_permission: "auto:info:add"
            test_action: "POST /auto/carInfo/add"
            expected_result: "access_granted"
            
          - permission_test_case_id: "PERM-TC-002"
            test_scenario: "无权限用户访问车辆信息删除功能"
            user_role: "car_viewer"
            required_permission: "auto:info:delete"
            test_action: "DELETE /auto/carInfo/delete"
            expected_result: "access_denied"
            
          - permission_test_case_id: "PERM-TC-003"
            test_scenario: "管理员用户访问所有车辆信息功能"
            user_role: "admin"
            required_permission: "auto:info:*"
            test_action: "ALL /auto/carInfo/*"
            expected_result: "access_granted"
            
    # 系统集成测试
    system_integration_testing:
      - integration_test_suite_id: "INTEG-TS-001"
        integration_type: "database"
        
        integration_test_cases:
          - integration_test_case_id: "INTEG-TC-001"
            test_scenario: "数据库连接池管理和事务处理"
            integration_setup: "配置Druid连接池和事务管理"
            test_execution: "执行CRUD操作并验证事务一致性"
            expected_integration_result: "数据操作成功且事务正确提交或回滚"
            error_handling_validation: "连接池耗尽时的降级处理"
            
      - integration_test_suite_id: "INTEG-TS-002"
        integration_type: "external_service"
        integration_test_cases:
          - integration_test_case_id: "INTEG-TC-002"
            test_scenario: "第三方汽车数据API集成"
            integration_setup: "配置外部API Mock服务"
            test_execution: "调用API获取车型信息并处理响应"
            expected_integration_result: "成功获取车型数据或优雅降级"
            error_handling_validation: "API超时和错误响应的处理"
            
      - integration_test_suite_id: "INTEG-TS-003"
        integration_type: "message_queue"
        integration_test_cases:
          - integration_test_case_id: "INTEG-TC-003"
            test_scenario: "车辆状态变更消息发布"
            integration_setup: "配置Redis消息队列"
            test_execution: "更新车辆状态并发布变更消息"
            expected_integration_result: "消息成功发布并被订阅者接收"
            error_handling_validation: "消息队列不可用时的处理"

# ============================================================================
# 测试数据设计与管理
# ============================================================================
test_data_design_and_management:
  # 测试数据设计摘要
  test_data_summary:
    total_test_data_sets: 12
    synthetic_data_sets: 8
    production_subset_data_sets: 2
    mock_data_sets: 2
    test_data_volume_estimation: "medium"
    
  # 测试数据分类设计
  test_data_category_design:
    # 正向测试数据 (Happy Path)
    positive_test_data:
      - data_set_id: "POS-DATA-001"
        data_set_name: "ValidCarInfoData"
        data_purpose: "支持正向业务流程测试，验证标准CRUD功能"
        
        # 数据结构设计
        data_structure:
          business_entity: "CarInfo"
          required_fields: ["vinCode", "brandCode", "modelName", "engineNumber", "carStatus"]
          optional_fields: ["color", "purchaseDate", "remarks"]
          data_relationships: ["CarBrand(字典关联)", "CarStatus(字典关联)"]
          
        # 数据生成策略
        data_generation_strategy:
          generation_method: "faker_library"
          data_volume: 50
          data_variation: "多品牌多车型组合"
          
        # 数据样本
        data_samples:
          - sample_id: "POS-SAMPLE-001"
            sample_data: |
              {
                "vinCode": "WBAKG1C59DD123456",
                "brandCode": "BMW",
                "modelName": "X5 xDrive35i",
                "engineNumber": "BMW12345678",
                "carStatus": "1",
                "color": "黑色",
                "purchaseDate": "2024-01-15",
                "remarks": "测试车辆数据"
              }
            usage_scenarios: ["创建测试", "查询测试", "更新测试"]
            
      - data_set_id: "POS-DATA-002"
        data_set_name: "CarBrandDictionaryData"
        data_purpose: "提供汽车品牌字典测试数据"
        data_structure:
          business_entity: "CarBrand"
          required_fields: ["dictCode", "dictName", "dictValue"]
          optional_fields: ["sortOrder", "isActive"]
          data_relationships: ["CarInfo(外键关联)"]
        data_generation_strategy:
          generation_method: "template_based"
          data_volume: 20
          data_variation: "主流汽车品牌覆盖"
        data_samples:
          - sample_id: "POS-SAMPLE-002"
            sample_data: |
              [
                {"dictCode": "BMW", "dictName": "宝马", "dictValue": "BMW"},
                {"dictCode": "BENZ", "dictName": "奔驰", "dictValue": "BENZ"},
                {"dictCode": "AUDI", "dictName": "奥迪", "dictValue": "AUDI"},
                {"dictCode": "TOYOTA", "dictName": "丰田", "dictValue": "TOYOTA"}
              ]
            usage_scenarios: ["品牌选择测试", "数据字典验证"]
            
    # 负向测试数据 (Negative Path)
    negative_test_data:
      - data_set_id: "NEG-DATA-001"
        data_set_name: "InvalidCarInfoData"
        data_purpose: "验证数据验证规则和异常处理机制"
        
        # 异常数据类型
        negative_data_types:
          invalid_format_data: 
            - "VIN码长度不足: 'SHORT123'"
            - "VIN码长度超长: 'TOOLONGVIN1234567890123456'"
            - "VIN码包含非法字符: 'INVALID@#$%^&*()123'"
            - "发动机号为空字符串"
          boundary_violation_data:
            - "车型名称超过50字符限制"
            - "VIN码正好17位但包含禁用字符"
          business_rule_violation_data:
            - "重复的VIN码数据"
            - "已销售车辆尝试删除"
            - "无效的品牌代码"
          security_attack_data:
            - "SQL注入测试数据: '; DROP TABLE car_info; --"
            - "XSS攻击数据: '<script>alert(1)</script>'"
            - "过长字符串攻击"
            
        # 预期异常结果
        expected_error_responses:
          - error_type: "validation_error"
            error_message_pattern: "VIN码格式不正确"
            error_code: "INVALID_VIN_FORMAT"
            
          - error_type: "business_error"
            error_message_pattern: "VIN码已存在"
            error_code: "DUPLICATE_VIN"
            
          - error_type: "security_error"
            error_message_pattern: "非法字符"
            error_code: "INVALID_INPUT"
            
    # 边界测试数据 (Boundary Data)
    boundary_test_data:
      - data_set_id: "BOUND-DATA-001"
        data_set_name: "CarInfoBoundaryData"
        data_purpose: "验证字段长度和数值范围的边界条件处理"
        
        # 边界值定义
        boundary_definitions:
          - field_name: "vinCode"
            data_type: "string"
            min_boundary_value: "17位字符"
            max_boundary_value: "17位字符"
            boundary_test_values: ["16位字符", "17位字符", "18位字符"]
            
          - field_name: "modelName"
            data_type: "string"
            min_boundary_value: "1字符"
            max_boundary_value: "50字符"
            boundary_test_values: ["空字符串", "1字符", "49字符", "50字符", "51字符"]
            
          - field_name: "engineNumber"
            data_type: "string"
            min_boundary_value: "1字符"
            max_boundary_value: "30字符"
            boundary_test_values: ["空字符串", "1字符", "29字符", "30字符", "31字符"]
            
    # 集成测试数据 (Integration Data)
    integration_test_data:
      - data_set_id: "INTEG-DATA-001"
        data_set_name: "CarInfoSystemIntegrationData"
        data_purpose: "支持系统间集成测试，验证数据流转和状态同步"
        
        # 集成数据关系
        integration_relationships:
          - relationship_type: "one_to_many"
            source_entity: "CarInfo"
            target_entity: "CarStatusLog"
            relationship_data: "车辆信息变更历史记录"
            
          - relationship_type: "many_to_one"
            source_entity: "CarInfo"
            target_entity: "CarBrand"
            relationship_data: "品牌字典关联关系"
            
        # 外部系统模拟数据
        external_system_mock_data:
          - external_system: "CarBrandAPI"
            mock_response_data: |
              {
                "success": true,
                "data": {
                  "brandCode": "BMW",
                  "brandName": "宝马",
                  "country": "德国",
                  "established": "1916"
                }
              }
            mock_scenarios: ["success", "timeout", "error"]
            
          - external_system: "VinValidationService"
            mock_response_data: |
              {
                "valid": true,
                "details": {
                  "manufacturer": "BMW",
                  "year": "2024",
                  "model": "X5"
                }
              }
            mock_scenarios: ["valid_vin", "invalid_vin", "service_error"]
            
  # 测试数据管理策略
  test_data_management_strategy:
    # 数据生命周期管理
    data_lifecycle_management:
      data_creation_strategy: "hybrid"
      data_refresh_strategy: "per_suite"
      data_cleanup_strategy: "immediate"
      data_isolation_strategy: "separate_schema"
      
    # 数据隐私和安全
    data_privacy_and_security:
      sensitive_data_handling: "synthetic_replacement"
      data_access_control: ["测试团队读写权限", "开发团队只读权限"]
      data_retention_policy: "测试完成后7天内清理"
      
    # 数据同步和版本控制
    data_sync_and_versioning:
      data_version_control: "git_based"
      data_environment_sync: "自动同步至测试环境"
      data_backup_strategy: "每日备份重要基础数据"

# ============================================================================
# 测试执行策略与调度
# ============================================================================
test_execution_strategy_and_scheduling:
  # 测试执行摘要
  execution_summary:
    total_execution_time_estimate: 40
    parallel_execution_opportunities: 15
    sequential_execution_requirements: 8
    resource_requirements: ["测试环境服务器", "数据库", "浏览器", "API测试工具"]
    
  # 测试执行层次设计
  test_execution_hierarchy:
    # L1: 单元测试执行
    unit_test_execution:
      execution_priority: "highest"
      execution_trigger: "code_commit"
      execution_frequency: "every_commit"
      execution_environment: "developer_machine"
      execution_timeout: 15
      failure_handling: "fail_fast"
      
      # 并行执行策略
      parallel_execution_config:
        parallel_test_classes: true
        parallel_test_methods: true
        thread_pool_size: 4
        
    # L2: 集成测试执行
    integration_test_execution:
      execution_priority: "high"
      execution_trigger: "unit_tests_passed"
      execution_frequency: "daily"
      execution_environment: "integration_test_server"
      execution_timeout: 60
      failure_handling: "continue_on_failure"
      
      # 依赖管理
      dependency_management:
        database_setup: "h2_memory"
        external_service_setup: ["wiremock", "embedded_redis"]
        test_data_preparation: "automatic"
        
    # L3: 系统测试执行
    system_test_execution:
      execution_priority: "medium"
      execution_trigger: "integration_tests_passed"
      execution_frequency: "weekly"
      execution_environment: "system_test_environment"
      execution_timeout: 4
      failure_handling: "stop_on_critical_failure"
      
      # 环境准备
      environment_preparation:
        environment_provisioning: "automatic"
        application_deployment: "automatic"
        test_data_loading: "automatic"
        
    # L4: 验收测试执行
    acceptance_test_execution:
      execution_priority: "medium"
      execution_trigger: "system_tests_passed"
      execution_frequency: "release_candidate"
      execution_environment: "staging_environment"
      execution_timeout: 8
      failure_handling: "manual_review_required"
      
      # 利益相关者参与
      stakeholder_involvement:
        business_analyst_review: true
        product_owner_signoff: true
        user_acceptance_testing: true
        
  # 测试执行依赖图
  test_execution_dependency_graph:
    # 测试执行节点
    execution_nodes:
      - node_id: "EXEC-NODE-001"
        node_name: "CarInfoServiceUnitTest"
        node_type: "unit"
        execution_criteria: "代码提交触发"
        success_criteria: "所有单元测试通过且覆盖率>85%"
        failure_criteria: "任何测试失败或覆盖率不足"
        
      - node_id: "EXEC-NODE-002"
        node_name: "CarInfoAPIIntegrationTest"
        node_type: "integration"
        execution_criteria: "单元测试通过后执行"
        success_criteria: "API功能正常且响应时间<2秒"
        failure_criteria: "API错误或性能不达标"
        
      - node_id: "EXEC-NODE-003"
        node_name: "CarInfoUISystemTest"
        node_type: "system"
        execution_criteria: "集成测试通过后执行"
        success_criteria: "UI功能完整且用户体验良好"
        failure_criteria: "UI功能异常或用户体验差"
        
      - node_id: "EXEC-NODE-004"
        node_name: "CarInfoBusinessAcceptanceTest"
        node_type: "acceptance"
        execution_criteria: "系统测试通过后执行"
        success_criteria: "业务流程完整且用户验收通过"
        failure_criteria: "业务流程不完整或用户不满意"
        
    # 依赖关系
    execution_dependencies:
      - dependency_id: "EXEC-DEP-001"
        source_node_id: "EXEC-NODE-001"
        target_node_id: "EXEC-NODE-002"
        dependency_type: "prerequisite"
        dependency_condition: "单元测试全部通过"
        
      - dependency_id: "EXEC-DEP-002"
        source_node_id: "EXEC-NODE-002"
        target_node_id: "EXEC-NODE-003"
        dependency_type: "prerequisite"
        dependency_condition: "集成测试全部通过"
        
      - dependency_id: "EXEC-DEP-003"
        source_node_id: "EXEC-NODE-003"
        target_node_id: "EXEC-NODE-004"
        dependency_type: "prerequisite"
        dependency_condition: "系统测试关键场景通过"
        
  # 测试结果处理策略
  test_result_processing_strategy:
    # 结果收集
    result_collection:
      result_format: ["junit_xml", "cucumber_json", "allure_json"]
      result_storage: "file_system"
      result_retention: "30天"
      
    # 结果分析
    result_analysis:
      trend_analysis: true
      failure_pattern_analysis: true
      coverage_analysis: true
      performance_analysis: true
      
    # 结果通知
    result_notification:
      notification_channels: ["email", "slack"]
      notification_recipients: ["开发团队", "测试团队", "项目经理"]
      notification_triggers: ["failure", "success"]
      
  # 测试环境管理
  test_environment_management:
    # 环境配置
    environment_configurations:
      - environment_id: "TEST-ENV-001"
        environment_name: "unit_test_env"
        environment_type: "local"
        environment_resources: ["H2内存数据库", "Mock服务", "本地Redis"]
        environment_setup_time: 2
        environment_teardown_time: 1
        
      - environment_id: "TEST-ENV-002"
        environment_name: "integration_test_env"
        environment_type: "ci"
        environment_resources: ["MySQL测试库", "WireMock服务", "Redis缓存"]
        environment_setup_time: 5
        environment_teardown_time: 3
        
      - environment_id: "TEST-ENV-003"
        environment_name: "system_test_env"
        environment_type: "staging"
        environment_resources: ["完整应用栈", "外部服务模拟", "浏览器环境"]
        environment_setup_time: 15
        environment_teardown_time: 10
        
    # 环境调度
    environment_scheduling:
      environment_availability: "24x7"
      environment_booking_system: false
      environment_conflict_resolution: "queue"
      
    # 环境监控
    environment_monitoring:
      resource_monitoring: ["cpu", "memory", "disk"]
      application_health_monitoring: ["服务状态", "数据库连接", "缓存状态"]
      test_execution_monitoring: ["执行进度", "失败率", "性能指标"]

# ============================================================================
# 质量保证检查点 (Agent-D自检要求)
# ============================================================================
quality_assurance_checkpoints:
  # 测试设计完整性检查
  test_design_completeness_check:
    traceability_validation:
      - check_item: "所有测试用例都有完整的追溯链"
        validation_result: "pass"
        missing_traceability: []
        traceability_coverage_percentage: 100
        
    test_coverage_validation:
      - check_item: "需求覆盖完整性检查"
        validation_result: "pass"
        uncovered_requirements: []
        requirement_coverage_percentage: 100
        
    scenario_coverage_validation:
      - check_item: "BDD场景覆盖完整性检查"
        validation_result: "pass"
        uncovered_scenarios: []
        scenario_coverage_percentage: 100
        
    test_type_coverage_validation:
      - check_item: "测试类型覆盖完整性检查"
        validation_result: "pass"
        missing_test_types: []
        functional_test_coverage: 95
        non_functional_test_coverage: 75
        
  # 测试可执行性检查
  test_executability_validation:
    automation_feasibility_check:
      total_test_cases: 85
      automatable_test_cases: 70
      automation_feasibility_percentage: 82
      manual_test_cases: 15
      automation_challenges: ["第三方API集成测试", "复杂UI交互验证"]
      
    test_environment_dependency_check:
      environment_requirements_defined: true
      environment_availability_confirmed: true
      environment_setup_documented: true
      environment_conflicts_identified: []
      
    test_data_dependency_check:
      test_data_requirements_defined: true
      test_data_generation_strategy_defined: true
      test_data_privacy_compliance: "compliant"
      test_data_volume_feasibility: "feasible"
      
  # 测试逻辑一致性检查
  test_logic_consistency_validation:
    test_case_logic_validation:
      logical_errors_detected: []
      contradictory_test_cases: []
      incomplete_test_scenarios: []
      
    test_data_consistency_validation:
      data_inconsistencies_detected: []
      invalid_test_data_samples: []
      missing_test_data_relationships: []
      
    expected_result_validation:
      unrealistic_expected_results: []
      undefined_expected_results: []
      ambiguous_validation_criteria: []
      
  # 测试策略合理性检查
  test_strategy_rationality_validation:
    test_approach_appropriateness:
      over_engineered_test_approaches: []
      under_engineered_test_approaches: []
      inappropriate_test_techniques: []
      
    resource_requirement_realism:
      unrealistic_resource_requirements: []
      resource_conflicts_identified: []
      budget_constraint_violations: []
      
    timeline_feasibility:
      unrealistic_execution_timelines: []
      timeline_conflicts_identified: []
      critical_path_bottlenecks: ["第三方API依赖可能影响集成测试进度"]

