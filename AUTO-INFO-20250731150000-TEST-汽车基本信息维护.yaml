# JeecgBoot AI Agent协作测试设计模板
# 基于BTDTP (BDD-Traceability-Driven Test Planning)协议
# 汽车4S店无纸化办公系统 - 汽车基本信息维护功能测试设计

# ============================================================================
# Agent协作协议声明
# ============================================================================
agent_collaboration_protocol:
  source_agent: "Agent-D (测试工程师)"
  input_agents: ["Agent-A (需求分析师)", "Agent-B (架构设计师)", "Agent-C (开发工程师)"]
  output_target: "QA团队执行 | 自动化测试平台 | 质量报告系统"
  communication_standard: "BTDTP结构化测试设计协议"
  quality_target: "测试覆盖率100%, 追溯完整性100%, 自动化率>80%"
  processing_time_target: "<90秒/测试群组"

# ============================================================================
# 输出元数据规范 (Agent-D必须填写)
# ============================================================================
test_design_metadata:
  # 文档标识
  document_identity:
    test_doc_id: "TEST-DOC-20250731-001"
    created_timestamp: "2025-07-31 16:00:00"
    agent_version: "Agent-D v1.0"
    processing_duration: "85s"
    
  # 基线和系统关联信息
  baseline_and_system_reference:
    # 需求基线引用
    baseline_reference:
      baseline_id: "REQ-BASELINE-20250731-001"
      baseline_version: "v1.0"
      requirement_suite_id: "AUTO-INFO-20250731150000"
      baseline_doc_path: "/Users/admin/Work/Github/JeecgBoot/AUTO-INFO-20250731150000-requirement_baseline.yaml"
      
    # 系统基础信息引用  
    system_reference:
      system_id: "AUTO-4S-SYSTEM"
      system_name: "汽车4S店无纸化办公系统"
      system_base_doc_path: "/Users/admin/Work/Github/JeecgBoot/AUTO-INFO-20250731150000-system_base_info.yaml"
      jeecg_version: "3.8.1"
      test_environments: ["dev", "test", "uat", "prod"]
      
  # 多源输入信息
  multi_source_input_info:
    requirement_doc_id: "AUTO-INFO-20250731150000-REQ"
    requirement_doc_path: "/Users/admin/Work/Github/JeecgBoot/AUTO-INFO-20250731150000-REQ-汽车基本信息维护.yaml"
    design_doc_id: "AUTO-INFO-20250731150000-ARCH"
    design_doc_path: "/Users/admin/Work/Github/JeecgBoot/AUTO-INFO-20250731150000-ARCH-汽车基本信息维护.yaml"
    wbs_doc_id: "AUTO-INFO-20250731150000-DEV"
    wbs_doc_path: "/Users/admin/Work/Github/JeecgBoot/AUTO-INFO-20250731150000-DEV-汽车基本信息维护.yaml"
    
    # 输入统计
    input_requirements_count: 12
    input_scenarios_count: 16
    input_design_decisions_count: 8
    input_tasks_count: 7
    
    # 完整追溯链
    complete_traceability_chain:
      baseline_traceability_id: "TRACE-REQ-BASELINE-20250731-001-AUTO-INFO-20250731150000"
      system_traceability_id: "TRACE-AUTO-4S-SYSTEM"
      requirement_traceability_id: "TRACE-REQ-AUTO-INFO-20250731150000"
      design_traceability_id: "TRACE-ARCH-AUTO-INFO-20250731150000"
      development_traceability_id: "TRACE-DEV-AUTO-INFO-20250731150000"
    
  # JeecgBoot测试环境上下文
  testing_context:
    framework_version: "3.8.1"
    test_framework_stack: ["junit5", "testng", "cucumber", "selenium", "postman"]
    test_environment: "test"
    test_data_strategy: "synthetic"
    test_automation_platform: "jenkins"

# ============================================================================
# 多源输入解析与融合 (Agent-A/B/C输出理解)
# ============================================================================
multi_source_input_parsing:
  # Agent-A需求文档解析
  requirements_parsing:
    ears_requirements_analysis:
      # EARS五种类型解析
      ubiquitous_requirements:
        - requirement_id: "REQ-U-001"
          ears_statement: "系统应当能够录入汽车基本信息"
          acceptance_criteria: ["支持VIN码输入", "支持品牌选择", "支持车型输入", "支持发动机号输入"]
          test_implications: "需要验证各字段的输入功能和数据保存"
          testability_score: 9
          
        - requirement_id: "REQ-U-002"
          ears_statement: "系统应当能够查询汽车基本信息"
          acceptance_criteria: ["支持VIN码查询", "支持品牌筛选", "支持组合查询", "支持分页显示"]
          test_implications: "需要验证各种查询条件和结果展示"
          testability_score: 8
          
        - requirement_id: "REQ-U-003"
          ears_statement: "系统应当能够修改汽车基本信息"
          acceptance_criteria: ["支持字段编辑", "保持VIN码不变", "记录修改历史", "验证权限"]
          test_implications: "需要验证编辑功能和权限控制"
          testability_score: 8
          
        - requirement_id: "REQ-U-004"
          ears_statement: "系统应当能够删除汽车基本信息"
          acceptance_criteria: ["支持单条删除", "支持批量删除", "验证删除权限", "确认删除操作"]
          test_implications: "需要验证删除功能和权限控制"
          testability_score: 7
          
        - requirement_id: "REQ-U-005"
          ears_statement: "系统应当能够导出汽车基本信息"
          acceptance_criteria: ["支持Excel导出", "支持条件筛选导出", "包含完整信息", "格式正确"]
          test_implications: "需要验证导出功能和文件格式"
          testability_score: 8
          
      event_driven_requirements:
        - requirement_id: "REQ-E-001"
          ears_statement: "当录入重复VIN码时，系统应当提示错误并阻止保存"
          event_trigger: "录入重复VIN码"
          expected_response: "显示错误提示并阻止保存"
          test_implications: "需要验证VIN码唯一性检查机制"
          testability_score: 9
          
        - requirement_id: "REQ-E-002"
          ears_statement: "当车辆状态发生变化时，系统应当记录状态变更日志"
          event_trigger: "车辆状态变化"
          expected_response: "自动记录状态变更日志"
          test_implications: "需要验证状态变更跟踪功能"
          testability_score: 8
          
        - requirement_id: "REQ-E-003"
          ears_statement: "当VIN码格式不正确时，系统应当进行格式验证并提示错误"
          event_trigger: "输入无效VIN码格式"
          expected_response: "显示格式错误提示"
          test_implications: "需要验证VIN码格式验证规则"
          testability_score: 9
          
      unwanted_behavior_requirements:
        - requirement_id: "REQ-UB-001"
          ears_statement: "系统不应当允许未授权用户访问汽车信息管理功能"
          unwanted_scenario: "未授权用户尝试访问管理功能"
          prevention_mechanism: "权限验证和访问控制"
          test_implications: "需要验证安全访问控制机制"
          testability_score: 8
          
        - requirement_id: "REQ-UB-002"
          ears_statement: "系统不应当允许删除已销售车辆的基本信息"
          unwanted_scenario: "尝试删除已销售车辆信息"
          prevention_mechanism: "状态检查和业务规则验证"
          test_implications: "需要验证业务规则约束"
          testability_score: 7
          
      state_driven_requirements:
        - requirement_id: "REQ-S-001"
          ears_statement: "当车辆处于在库状态时，系统应当允许修改车辆基本信息"
          state_transitions: ["在库状态→允许修改", "已销售状态→限制修改"]
          test_implications: "需要验证基于状态的权限控制"
          testability_score: 8
          
      optional_requirements:
        - requirement_id: "REQ-O-001"
          ears_statement: "系统可以选择性地集成第三方汽车数据API获取车型信息"
          optional_conditions: ["API可用时启用", "API不可用时手工录入"]
          test_implications: "需要验证API集成和降级处理"
          testability_score: 6
          
    bdd_scenarios_analysis:
      # BDD四种场景解析
      functional_scenarios:
        - scenario_id: "BDD-F-001"
          scenario_title: "新车基本信息录入"
          given: "用户已登录且有录入权限"
          when: "录入车辆基本信息"
          then: "成功保存并生成档案"
          and_conditions: ["状态设置为在库", "记录操作日志"]
          but_exceptions: ["VIN码重复检查", "格式验证失败"]
          test_case_generation_potential: "high"
          automation_feasibility: "high"
          
        - scenario_id: "BDD-F-002"
          scenario_title: "汽车信息查询"
          given: "系统中存在汽车信息数据"
          when: "使用查询条件搜索"
          then: "返回匹配的车辆列表"
          and_conditions: ["支持分页显示", "支持排序"]
          but_exceptions: ["查询条件为空", "无匹配结果"]
          test_case_generation_potential: "high"
          automation_feasibility: "high"
          
        - scenario_id: "BDD-F-003"
          scenario_title: "汽车信息修改"
          given: "选择要修改的车辆信息"
          when: "更新车辆属性信息"
          then: "成功保存修改"
          and_conditions: ["VIN码保持不变", "记录修改历史"]
          but_exceptions: ["权限不足", "状态不允许修改"]
          test_case_generation_potential: "high"
          automation_feasibility: "high"
          
        - scenario_id: "BDD-F-004"
          scenario_title: "汽车信息删除"
          given: "选择要删除的车辆信息"
          when: "执行删除操作"
          then: "成功删除车辆信息"
          and_conditions: ["需要确认操作", "记录删除日志"]
          but_exceptions: ["车辆已销售", "权限不足"]
          test_case_generation_potential: "high"
          automation_feasibility: "medium"
          
      exception_scenarios:
        - scenario_id: "BDD-E-001"
          scenario_title: "VIN码重复录入异常"
          exception_type: "business_rule_violation"
          given: "系统中已存在相同VIN码的车辆"
          when: "尝试录入重复VIN码"
          then: "显示错误提示并阻止保存"
          test_case_generation_potential: "high"
          automation_feasibility: "high"
          
        - scenario_id: "BDD-E-002"
          scenario_title: "VIN码格式错误异常"
          exception_type: "validation_error"
          given: "用户输入VIN码"
          when: "VIN码格式不符合规范"
          then: "显示格式错误提示"
          test_case_generation_potential: "high"
          automation_feasibility: "high"
          
        - scenario_id: "BDD-E-003"
          scenario_title: "权限不足异常"
          exception_type: "security_violation"
          given: "用户登录但权限不足"
          when: "尝试执行需要权限的操作"
          then: "显示权限不足提示"
          test_case_generation_potential: "high"
          automation_feasibility: "high"
          
        - scenario_id: "BDD-E-004"
          scenario_title: "系统异常处理"
          exception_type: "system_error"
          given: "系统运行正常"
          when: "发生数据库连接异常"
          then: "显示友好错误信息"
          test_case_generation_potential: "medium"
          automation_feasibility: "medium"
          
      boundary_scenarios:
        - scenario_id: "BDD-B-001"
          scenario_title: "VIN码长度边界测试"
          boundary_type: "string_length"
          boundary_value: "17位字符"
          given: "用户在VIN码字段输入"
          when: "输入不同长度的字符串"
          then: "验证17位长度要求"
          test_case_generation_potential: "high"
          automation_feasibility: "high"
          
        - scenario_id: "BDD-B-002"
          scenario_title: "查询结果数量边界测试"
          boundary_type: "result_set_size"
          boundary_value: "分页大小限制"
          given: "执行汽车信息查询"
          when: "查询结果超过分页限制"
          then: "正确处理分页显示"
          test_case_generation_potential: "medium"
          automation_feasibility: "high"
          
        - scenario_id: "BDD-B-003"
          scenario_title: "车型名称长度边界测试"
          boundary_type: "string_length"
          boundary_value: "50字符限制"
          given: "用户输入车型名称"
          when: "输入接近或超过50字符"
          then: "验证长度限制处理"
          test_case_generation_potential: "high"
          automation_feasibility: "high"
          
        - scenario_id: "BDD-B-004"
          scenario_title: "批量操作数量边界测试"
          boundary_type: "batch_size"
          boundary_value: "批处理上限"
          given: "选择多条车辆信息"
          when: "执行批量删除操作"
          then: "验证批处理数量限制"
          test_case_generation_potential: "medium"
          automation_feasibility: "high"
          
      integration_scenarios:
        - scenario_id: "BDD-I-001"
          scenario_title: "汽车品牌数据集成"
          integration_type: "data_integration"
          external_system: "汽车品牌字典服务"
          given: "汽车品牌字典服务可用"
          when: "录入车辆品牌信息"
          then: "正确获取并显示品牌选项"
          test_case_generation_potential: "high"
          automation_feasibility: "medium"
          
        - scenario_id: "BDD-I-002"
          scenario_title: "库存管理系统集成"
          integration_type: "system_integration"
          external_system: "库存管理系统"
          given: "库存管理系统正常运行"
          when: "更新车辆状态信息"
          then: "同步更新库存系统状态"
          test_case_generation_potential: "medium"
          automation_feasibility: "medium"
          
        - scenario_id: "BDD-I-003"
          scenario_title: "用户权限系统集成"
          integration_type: "security_integration"
          external_system: "JeecgBoot权限管理"
          given: "用户权限配置正确"
          when: "访问汽车信息管理功能"
          then: "正确验证用户权限"
          test_case_generation_potential: "high"
          automation_feasibility: "high"
          
        - scenario_id: "BDD-I-004"
          scenario_title: "第三方汽车数据API集成"
          integration_type: "api_integration"
          external_system: "汽车数据API"
          given: "第三方API服务可用"
          when: "根据VIN码获取车辆详细信息"
          then: "成功获取并填充车辆信息"
          test_case_generation_potential: "medium"
          automation_feasibility: "low"
          
  # Agent-B设计文档解析
  design_parsing:
    architectural_decisions_analysis:
      - design_decision_id: "DES-U-001"
        source_requirement_ids: ["REQ-U-001"]
        design_pattern: "enhanced_crud"
        implementation_approach: "hybrid"
        test_strategy_suggestion: "结合CodeGen标准测试和自定义业务逻辑测试"
        testing_challenges: ["VIN码验证逻辑复杂性", "多种数据源集成测试"]
        test_design_implications: "需要分层测试策略，覆盖标准CRUD和自定义验证"
        
      - design_decision_id: "DES-U-002"
        source_requirement_ids: ["REQ-U-002"]
        design_pattern: "multi_condition_query"
        implementation_approach: "codegen_with_extensions"
        test_strategy_suggestion: "查询性能测试和边界条件验证"
        testing_challenges: ["复杂查询条件组合", "大数据量查询性能"]
        test_design_implications: "需要查询性能测试和边界条件覆盖"
        
    codegen_configuration_analysis:
      - codegen_config_id: "CODEGEN-001"
        module_name: "auto"
        business_entity: "CarInfo"
        generated_components: ["Entity", "Controller", "Service", "Mapper", "Vue页面"]
        test_generation_opportunity: "standard_tests"
        standard_test_applicability: 85
        
  # Agent-C任务分解解析
  task_breakdown_parsing:
    task_groups_analysis:
      - task_group_id: "TG-001"
        gwt_task_mapping:
          given_tasks: ["TASK-GIVEN-001", "TASK-GIVEN-002"]
          when_tasks: ["TASK-WHEN-001", "TASK-WHEN-002", "TASK-WHEN-003"]
          then_tasks: ["TASK-THEN-001", "TASK-THEN-002"]
          but_tasks: []
        test_task_identification:
          identified_test_tasks: ["TASK-THEN-001", "TASK-THEN-002"]
          missing_test_coverage: ["API性能测试", "并发访问测试"]
          test_task_dependencies: ["开发任务完成后执行"]
          
    codegen_vs_manual_analysis:
      codegen_tasks:
        - task_id: "TASK-WHEN-001"
          codegen_coverage: 90
          standard_test_applicability: "high"
          test_template_usage: "JeecgBoot标准CRUD测试模板"
          
      manual_tasks:
        - task_id: "TASK-WHEN-002"
          complexity_reason: "complex_algorithm"
          custom_test_requirements: ["VIN码格式验证", "唯一性检查", "性能测试"]
          test_design_complexity: "complex"

# ============================================================================
# BTDTP测试规划 (四维测试空间映射)
# ============================================================================
btdtp_test_planning:
  # 测试规划摘要
  test_planning_summary:
    total_test_scenarios_planned: 28
    total_test_cases_planned: 85
    automation_coverage_target: 82
    manual_testing_percentage: 18
    estimated_test_execution_time: 40
    test_environment_requirements: ["MySQL测试数据库", "Redis缓存", "Mock外部API"]
    
  # 四维测试映射矩阵
  four_dimensional_test_mapping:
    # 维度映射说明
    mapping_dimensions:
      dimension_1: "EARS需求类型"
      dimension_2: "BDD场景类型"
      dimension_3: "开发任务类型"
      dimension_4: "测试层次"
      
    # 核心测试类型映射
    core_test_type_mappings:
      - mapping_id: "BTM-001"
        ears_type: "ubiquitous"
        bdd_scenario_type: "functional"
        task_type: "when_task"
        test_level: "unit"
        test_type_description: "汽车信息CRUD单元测试"
        test_approach: "JeecgBoot标准CRUD测试模板"
        automation_priority: "high"
        codegen_applicable: true
        
      - mapping_id: "BTM-002"
        ears_type: "event_driven"
        bdd_scenario_type: "exception"
        task_type: "when_task"
        test_level: "integration"
        test_type_description: "VIN码验证集成测试"
        test_approach: "自定义业务规则验证测试"
        automation_priority: "high"
        codegen_applicable: false
        
      - mapping_id: "BTM-003"
        ears_type: "unwanted_behavior"
        bdd_scenario_type: "exception"
        task_type: "but_task"
        test_level: "system"
        test_type_description: "安全权限系统测试"
        test_approach: "权限控制和安全测试"
        automation_priority: "high"
        codegen_applicable: false
        
      - mapping_id: "BTM-004"
        ears_type: "state_driven"
        bdd_scenario_type: "functional"
        task_type: "given_task"
        test_level: "integration"
        test_type_description: "状态驱动业务规则测试"
        test_approach: "状态机转换测试"
        automation_priority: "medium"
        codegen_applicable: false
        
      - mapping_id: "BTM-005"
        ears_type: "optional"
        bdd_scenario_type: "integration"
        task_type: "then_task"
        test_level: "system"
        test_type_description: "第三方API集成测试"
        test_approach: "API集成和降级测试"
        automation_priority: "low"
        codegen_applicable: false
        
  # 测试策略定义
  test_strategy_definitions:
    # 单元测试策略
    unit_test_strategy:
      applicable_scenarios: ["BDD-F-001", "BDD-F-002", "BDD-F-003", "BDD-F-004"]
      test_framework: "junit5"
      mock_strategy: "mockito"
      coverage_target: 85
      execution_approach: "automated"
      
    # 集成测试策略
    integration_test_strategy:
      applicable_scenarios: ["BDD-I-001", "BDD-I-002", "BDD-I-003", "BDD-E-001", "BDD-E-002"]
      integration_levels: ["service", "database", "external_api"]
      test_framework: "spring_boot_test"
      database_strategy: "h2_memory"
      external_service_strategy: "wiremock"
      execution_approach: "automated"
      
    # 系统测试策略
    system_test_strategy:
      applicable_scenarios: ["BDD-F-001", "BDD-F-002", "BDD-F-003", "BDD-F-004", "BDD-I-004"]
      test_types: ["functional", "performance", "security", "usability"]
      test_environment: "dedicated_test_env"
      data_strategy: "synthetic"
      execution_approach: "automated_with_manual_validation"
      
    # 验收测试策略
    acceptance_test_strategy:
      applicable_scenarios: ["BDD-F-001", "BDD-F-002", "BDD-F-003", "BDD-F-004"]
      test_approach: "bdd_cucumber"
      stakeholder_involvement: ["business_analyst", "product_owner", "end_user"]
      test_environment: "staging"
      execution_approach: "mixed_automated_manual"

# ============================================================================
# 测试用例生成 (可执行测试用例规范)
# ============================================================================
test_case_generation:
  # 测试用例生成摘要
  generation_summary:
    total_generated_test_cases: 85
    automated_test_cases: 70
    manual_test_cases: 15
    generated_test_data_sets: 12
    
  # BDD Gherkin格式测试用例
  bdd_gherkin_test_cases:
    - test_case_id: "BDD-TC-001"
      test_case_name: "新车基本信息录入成功测试"
      
      # 完整追溯链
      traceability_chain:
        source_requirement_id: "REQ-U-001"
        source_scenario_id: "BDD-F-001"
        source_design_id: "DES-U-001"
        source_task_id: "TASK-WHEN-001"
        
      # Gherkin结构
      gherkin_structure:
        feature: "汽车基本信息维护"
        background: "用户已登录并具有汽车信息录入权限"
        scenario: "新车基本信息录入成功"
        given: "用户在汽车信息录入页面"
        when: "用户输入有效的车辆基本信息并提交"
        then: "系统成功保存车辆信息并显示成功提示"
        and_steps: ["车辆状态自动设置为在库", "系统记录操作日志"]
        but_steps: ["如果VIN码已存在则显示重复错误"]
        
      # 执行规范
      execution_specification:
        test_level: "system"
        automation_type: "fully_automated"
        test_framework: "cucumber_java"
        execution_priority: "high"
        execution_environment: "test"
        
      # 测试数据要求
      test_data_requirements:
        input_data: "有效的车辆信息数据集（VIN码、品牌、车型、发动机号等）"
        expected_output: "保存成功响应和车辆ID"
        test_data_setup: "准备品牌字典数据和用户权限"
        test_data_cleanup: "清理测试创建的车辆信息"
        
      # 验证点
      validation_points:
        functional_validations: ["数据保存成功", "返回车辆ID", "状态设置正确"]
        data_validations: ["数据库记录创建", "字段值正确保存"]
        ui_validations: ["成功提示显示", "页面正确跳转"]
        api_validations: ["API返回正确状态码", "响应数据结构正确"]
        
    - test_case_id: "BDD-TC-002"
      test_case_name: "VIN码重复录入异常测试"
      traceability_chain:
        source_requirement_id: "REQ-E-001"
        source_scenario_id: "BDD-E-001"
        source_design_id: "DES-U-002"
        source_task_id: "TASK-WHEN-002"
      gherkin_structure:
        feature: "汽车基本信息维护"
        background: "系统中已存在VIN码为TESTVIN12345678901的车辆"
        scenario: "录入重复VIN码时系统提示错误"
        given: "用户在汽车信息录入页面"
        when: "用户输入已存在的VIN码TESTVIN12345678901并提交"
        then: "系统显示VIN码重复错误提示并阻止保存"
        and_steps: ["错误提示明确指示VIN码重复", "表单数据保持不变"]
        but_steps: []
      execution_specification:
        test_level: "integration"
        automation_type: "fully_automated"
        test_framework: "cucumber_java"
        execution_priority: "high"
        execution_environment: "test"
      test_data_requirements:
        input_data: "重复的VIN码数据"
        expected_output: "VIN码重复错误信息"
        test_data_setup: "预先创建一条车辆信息记录"
        test_data_cleanup: "清理测试数据"
      validation_points:
        functional_validations: ["错误提示正确显示", "数据未保存"]
        data_validations: ["数据库无新增记录", "原有数据不变"]
        ui_validations: ["错误信息显示", "表单状态保持"]
        api_validations: ["API返回错误状态码", "错误信息格式正确"]
        
    - test_case_id: "BDD-TC-003"
      test_case_name: "汽车信息查询功能测试"
      traceability_chain:
        source_requirement_id: "REQ-U-002"
        source_scenario_id: "BDD-F-002"
        source_design_id: "DES-U-003"
        source_task_id: "TASK-WHEN-001"
      gherkin_structure:
        feature: "汽车基本信息维护"
        background: "系统中存在多条车辆信息记录"
        scenario: "根据查询条件搜索车辆信息"
        given: "用户在汽车信息查询页面"
        when: "用户输入查询条件并点击搜索"
        then: "系统返回匹配的车辆列表"
        and_steps: ["支持分页显示", "支持按字段排序"]
        but_steps: ["当无匹配结果时显示空列表提示"]
      execution_specification:
        test_level: "system"
        automation_type: "fully_automated"
        test_framework: "cucumber_java"
        execution_priority: "high"
        execution_environment: "test"
      test_data_requirements:
        input_data: "多种查询条件组合（VIN码、品牌、车型等）"
        expected_output: "匹配的车辆信息列表"
        test_data_setup: "准备多条不同属性的车辆信息记录"
        test_data_cleanup: "清理测试数据"
      validation_points:
        functional_validations: ["查询结果正确", "分页功能正常", "排序功能正常"]
        data_validations: ["查询结果数据准确", "分页数据正确"]
        ui_validations: ["列表正确显示", "分页控件正常"]
        api_validations: ["查询API响应正确", "分页参数处理正确"]
        
  # JUnit/TestNG单元测试规范
  unit_test_specifications:
    - test_class_id: "UNIT-TC-001"
      test_class_name: "CarInfoServiceTest"
      
      # 追溯信息
      traceability_info:
        tested_component: "CarInfoService"
        source_requirement_ids: ["REQ-U-001", "REQ-U-002", "REQ-U-003", "REQ-U-004"]
        source_task_ids: ["TASK-WHEN-001", "TASK-WHEN-002"]
        
      # 测试类结构
      test_class_structure:
        test_framework: "junit5"
        mock_framework: "mockito"
        test_annotations: ["@ExtendWith(MockitoExtension.class)", "@MockBean"]
        setup_methods: ["setUp() - 初始化Mock对象和测试数据"]
        teardown_methods: ["tearDown() - 清理测试数据"]
        
      # 测试方法规范
      test_methods:
        - test_method_id: "UNIT-TM-001"
          test_method_name: "testCreateCarInfo_ValidInput_ReturnsSuccess"
          test_description: "测试创建车辆信息功能 - 有效输入返回成功"
          
          # Given-When-Then映射到测试代码
          test_structure:
            given_setup: "准备有效的CarInfoVO对象和Mock依赖行为"
            when_execution: "调用carInfoService.createCarInfo(carInfoVO)"
            then_verification: "验证返回结果成功且包含正确的车辆ID"
            
          # 测试覆盖点
          coverage_points:
            method_coverage: ["createCarInfo", "validateVinCode", "saveCarInfo"]
            branch_coverage: ["正常保存分支", "数据验证分支"]
            exception_coverage: ["无异常抛出验证"]
            
          # 依赖和Mock
          dependencies_and_mocks:
            mocked_dependencies: ["CarInfoMapper", "VinValidationUtil", "DictService"]
            mock_behaviors: ["保存操作返回成功", "VIN码验证通过", "字典数据正常"]
            
        - test_method_id: "UNIT-TM-002"
          test_method_name: "testCreateCarInfo_DuplicateVin_ThrowsException"
          test_description: "测试创建车辆信息功能 - 重复VIN码抛出异常"
          test_structure:
            given_setup: "准备重复VIN码的CarInfoVO和Mock重复检查行为"
            when_execution: "调用carInfoService.createCarInfo(carInfoVO)"
            then_verification: "验证抛出VinDuplicateException异常"
          coverage_points:
            method_coverage: ["createCarInfo", "checkVinDuplicate"]
            branch_coverage: ["VIN码重复检查分支"]
            exception_coverage: ["VinDuplicateException异常处理"]
          dependencies_and_mocks:
            mocked_dependencies: ["CarInfoMapper"]
            mock_behaviors: ["VIN码重复检查返回true"]
            
        - test_method_id: "UNIT-TM-003"
          test_method_name: "testQueryCarInfo_ValidCriteria_ReturnsResults"
          test_description: "测试查询车辆信息功能 - 有效条件返回结果"
          test_structure:
            given_setup: "准备查询条件和Mock查询结果"
            when_execution: "调用carInfoService.queryCarInfo(criteria)"
            then_verification: "验证返回正确的查询结果列表"
          coverage_points:
            method_coverage: ["queryCarInfo", "buildQueryCondition"]
            branch_coverage: ["不同查询条件分支"]
            exception_coverage: ["查询异常处理"]
          dependencies_and_mocks:
            mocked_dependencies: ["CarInfoMapper"]
            mock_behaviors: ["查询操作返回结果列表"]
            
        - test_method_id: "UNIT-TM-004"
          test_method_name: "testUpdateCarInfo_ValidInput_ReturnsSuccess"
          test_description: "测试更新车辆信息功能 - 有效输入返回成功"
          test_structure:
            given_setup: "准备更新的CarInfoVO和Mock更新行为"
            when_execution: "调用carInfoService.updateCarInfo(carInfoVO)"
            then_verification: "验证更新成功且VIN码不变"
          coverage_points:
            method_coverage: ["updateCarInfo", "validateUpdate"]
            branch_coverage: ["更新验证分支", "状态检查分支"]
            exception_coverage: ["更新异常处理"]
          dependencies_and_mocks:
            mocked_dependencies: ["CarInfoMapper", "StatusValidator"]
            mock_behaviors: ["更新操作成功", "状态验证通过"]
            
        - test_method_id: "UNIT-TM-005"
          test_method_name: "testDeleteCarInfo_ValidId_ReturnsSuccess"
          test_description: "测试删除车辆信息功能 - 有效ID返回成功"
          test_structure:
            given_setup: "准备有效的车辆ID和Mock删除行为"
            when_execution: "调用carInfoService.deleteCarInfo(carId)"
            then_verification: "验证删除成功"
          coverage_points:
            method_coverage: ["deleteCarInfo", "validateDelete"]
            branch_coverage: ["删除权限检查分支", "状态验证分支"]
            exception_coverage: ["删除异常处理"]
          dependencies_and_mocks:
            mocked_dependencies: ["CarInfoMapper", "StatusValidator"]
            mock_behaviors: ["删除操作成功", "状态允许删除"]
            
    - test_class_id: "UNIT-TC-002"  
      test_class_name: "VinValidationUtilTest"
      traceability_info:
        tested_component: "VinValidationUtil"
        source_requirement_ids: ["REQ-E-003"]
        source_task_ids: ["TASK-WHEN-002"]
      test_class_structure:
        test_framework: "junit5"
        mock_framework: "mockito"
        test_annotations: ["@TestInstance(Lifecycle.PER_CLASS)"]
        setup_methods: ["initTestData() - 初始化VIN码测试数据"]
        teardown_methods: []
      test_methods:
        - test_method_id: "UNIT-TM-006"
          test_method_name: "testValidateVinFormat_ValidVin_ReturnsTrue"
          test_description: "测试VIN码格式验证 - 有效VIN码返回true"
          test_structure:
            given_setup: "准备有效的17位VIN码字符串"
            when_execution: "调用VinValidationUtil.validateVinFormat(vin)"
            then_verification: "验证返回true"
          coverage_points:
            method_coverage: ["validateVinFormat", "checkVinLength", "checkVinCharacters"]
            branch_coverage: ["有效VIN码分支"]
            exception_coverage: ["无异常验证"]
          dependencies_and_mocks:
            mocked_dependencies: []
            mock_behaviors: []
            
        - test_method_id: "UNIT-TM-007"
          test_method_name: "testValidateVinFormat_InvalidLength_ReturnsFalse"
          test_description: "测试VIN码格式验证 - 无效长度返回false"
          test_structure:
            given_setup: "准备长度不为17位的VIN码字符串"
            when_execution: "调用VinValidationUtil.validateVinFormat(vin)"
            then_verification: "验证返回false"
          coverage_points:
            method_coverage: ["validateVinFormat", "checkVinLength"]
            branch_coverage: ["无效长度分支"]
            exception_coverage: ["无异常验证"]
          dependencies_and_mocks:
            mocked_dependencies: []
            mock_behaviors: []
            
  # API接口测试规范
  api_test_specifications:
    - api_test_suite_id: "API-TS-001"
      api_test_suite_name: "CarInfoControllerAPITest"
      
      # 追溯信息
      traceability_info:
        tested_api_controller: "CarInfoController"
        source_requirement_ids: ["REQ-U-001", "REQ-U-002", "REQ-U-003", "REQ-U-004", "REQ-U-005"]
        source_design_ids: ["DES-U-001", "DES-U-002"]
        
      # API测试配置
      api_test_configuration:
        test_framework: "restassured"
        base_url: "http://localhost:8080"
        authentication_method: "jwt"
        test_environment: "test"
        
      # API测试用例
      api_test_cases:
        - api_test_case_id: "API-TC-001"
          api_test_case_name: "testCreateCarInfo_ValidPayload_Returns201"
          
          # HTTP请求规范
          http_request_specification:
            http_method: "POST"
            endpoint_path: "/auto/carInfo/add"
            request_headers: ["Content-Type: application/json", "Authorization: Bearer {jwt_token}"]
            request_body: |
              {
                "vinCode": "TEST1234567890123",
                "brandCode": "BMW", 
                "modelName": "X5",
                "engineNumber": "ENG123456789",
                "carStatus": "1"
              }
            query_parameters: []
            path_parameters: []
            
          # HTTP响应验证
          http_response_validation:
            expected_status_code: 200
            expected_headers: ["Content-Type: application/json"]
            expected_response_body: |
              {
                "success": true,
                "message": "添加成功",
                "code": 200,
                "result": {
                  "id": "{generated_id}"
                }
              }
            response_time_threshold: 2000
            
          # 数据验证
          data_validation:
            database_validations: ["验证数据库中存在新增记录", "验证字段值正确保存"]
            business_rule_validations: ["验证VIN码唯一性", "验证状态设置正确"]
            
        - api_test_case_id: "API-TC-002"
          api_test_case_name: "testCreateCarInfo_DuplicateVin_Returns400"
          http_request_specification:
            http_method: "POST"
            endpoint_path: "/auto/carInfo/add"
            request_headers: ["Content-Type: application/json", "Authorization: Bearer {jwt_token}"]
            request_body: |
              {
                "vinCode": "EXISTING123456789",
                "brandCode": "BENZ",
                "modelName": "C200",
                "engineNumber": "ENG987654321", 
                "carStatus": "1"
              }
            query_parameters: []
            path_parameters: []
          http_response_validation:
            expected_status_code: 500
            expected_headers: ["Content-Type: application/json"]
            expected_response_body: |
              {
                "success": false,
                "message": "VIN码已存在",
                "code": 500
              }
            response_time_threshold: 2000
          data_validation:
            database_validations: ["验证数据库中无新增记录"]
            business_rule_validations: ["验证VIN码重复检查生效"]
            
        - api_test_case_id: "API-TC-003"
          api_test_case_name: "testQueryCarInfo_ValidCriteria_Returns200"
          http_request_specification:
            http_method: "GET"
            endpoint_path: "/auto/carInfo/list"
            request_headers: ["Authorization: Bearer {jwt_token}"]
            request_body: ""
            query_parameters: ["pageNo=1", "pageSize=10", "brandCode=BMW"]
            path_parameters: []
          http_response_validation:
            expected_status_code: 200
            expected_headers: ["Content-Type: application/json"]
            expected_response_body: |
              {
                "success": true,
                "result": {
                  "records": [
                    {
                      "id": "{car_id}",
                      "vinCode": "{vin_code}",
                      "brandCode": "BMW",
                      "modelName": "{model_name}",
                      "carStatus": "{status}"
                    }
                  ],
                  "total": "{total_count}",
                  "size": 10,
                  "current": 1
                }
              }
            response_time_threshold: 3000
          data_validation:
            database_validations: ["验证查询结果与数据库一致"]
            business_rule_validations: ["验证分页逻辑正确", "验证筛选条件生效"]
            
        - api_test_case_id: "API-TC-004"
          api_test_case_name: "testUpdateCarInfo_ValidPayload_Returns200"
          http_request_specification:
            http_method: "PUT"
            endpoint_path: "/auto/carInfo/edit"
            request_headers: ["Content-Type: application/json", "Authorization: Bearer {jwt_token}"]
            request_body: |
              {
                "id": "{existing_car_id}",
                "vinCode": "EXISTING123456789",
                "brandCode": "BMW",
                "modelName": "X7",
                "engineNumber": "ENG123456789",
                "carStatus": "2"
              }
            query_parameters: []
            path_parameters: []
          http_response_validation:
            expected_status_code: 200
            expected_headers: ["Content-Type: application/json"]
            expected_response_body: |
              {
                "success": true,
                "message": "编辑成功",
                "code": 200
              }
            response_time_threshold: 2000
          data_validation:
            database_validations: ["验证数据库记录已更新", "验证VIN码未改变"]
            business_rule_validations: ["验证状态变更日志记录"]
            
        - api_test_case_id: "API-TC-005"
          api_test_case_name: "testDeleteCarInfo_ValidId_Returns200"
          http_request_specification:
            http_method: "DELETE"
            endpoint_path: "/auto/carInfo/delete"
            request_headers: ["Authorization: Bearer {jwt_token}"]
            request_body: ""
            query_parameters: ["id={deletable_car_id}"]
            path_parameters: []
          http_response_validation:
            expected_status_code: 200
            expected_headers: ["Content-Type: application/json"]
            expected_response_body: |
              {
                "success": true,
                "message": "删除成功",
                "code": 200
              }
            response_time_threshold: 2000
          data_validation:
            database_validations: ["验证数据库记录已删除"]
            business_rule_validations: ["验证删除日志记录"]
            
  # UI自动化测试规范
  ui_automation_specifications:
    - ui_test_suite_id: "UI-TS-001"
      ui_test_suite_name: "CarInfoManagementUITest"
      
      # 追溯信息
      traceability_info:
        tested_ui_component: "CarInfoList.vue + CarInfoForm.vue"
        source_requirement_ids: ["REQ-U-001", "REQ-U-002", "REQ-U-003", "REQ-U-004"]
        source_scenario_ids: ["BDD-F-001", "BDD-F-002", "BDD-F-003", "BDD-F-004"]
        
      # UI测试配置
      ui_test_configuration:
        automation_framework: "selenium"
        browser_support: ["chrome", "firefox"]
        resolution_support: ["1920x1080", "1366x768"]
        test_environment_url: "http://localhost:3000"
        
      # UI测试用例
      ui_test_cases:
        - ui_test_case_id: "UI-TC-001"
          ui_test_case_name: "testCreateCarInfo_ValidForm_DisplaysSuccessMessage"
          
          # UI测试步骤
          ui_test_steps:
            - step_id: "UI-STEP-001"
              step_description: "导航到汽车信息管理页面"
              step_action: "navigate"
              target_element: "/auto/info/carInfoList"
              input_data: ""
              expected_result: "页面正确加载，显示车辆信息列表"
              
            - step_id: "UI-STEP-002"
              step_description: "点击新增按钮"
              step_action: "click"
              target_element: "button[data-testid=add-car-btn]"
              input_data: ""
              expected_result: "打开车辆信息表单对话框"
              
            - step_id: "UI-STEP-003"
              step_description: "填写VIN码字段"
              step_action: "input"
              target_element: "input[data-testid=vin-code-input]"
              input_data: "UITEST1234567890123"
              expected_result: "VIN码字段正确显示输入值"
              
            - step_id: "UI-STEP-004"
              step_description: "选择汽车品牌"
              step_action: "select"
              target_element: "select[data-testid=brand-select]"
              input_data: "BMW"
              expected_result: "品牌下拉框正确选择BMW"
              
            - step_id: "UI-STEP-005"
              step_description: "填写车型名称"
              step_action: "input"
              target_element: "input[data-testid=model-name-input]"
              input_data: "X5"
              expected_result: "车型名称字段正确显示输入值"
              
            - step_id: "UI-STEP-006"
              step_description: "填写发动机号"
              step_action: "input"
              target_element: "input[data-testid=engine-number-input]"
              input_data: "ENG123456789"
              expected_result: "发动机号字段正确显示输入值"
              
            - step_id: "UI-STEP-007" 
              step_description: "点击保存按钮"
              step_action: "click"
              target_element: "button[data-testid=save-btn]"
              input_data: ""
              expected_result: "提交表单数据"
              
            - step_id: "UI-STEP-008"
              step_description: "验证成功提示"
              step_action: "wait"
              target_element: ".ant-message-success"
              input_data: ""
              expected_result: "显示保存成功提示信息"
              
          # UI验证点
          ui_validations:
            element_visibility: ["新增按钮可见", "表单对话框正确打开", "成功提示显示"]
            text_validations: ["页面标题正确", "表单标签正确", "成功提示文案正确"]
            form_validations: ["必填字段验证", "数据格式验证", "提交成功验证"]
            navigation_validations: ["页面路由正确", "对话框状态正确"]
            
        - ui_test_case_id: "UI-TC-002"
          ui_test_case_name: "testQueryCarInfo_ValidCriteria_DisplaysResults"
          ui_test_steps:
            - step_id: "UI-STEP-009"
              step_description: "在搜索框输入VIN码"
              step_action: "input"
