# ===============================================================================
# JeecgBoot CodeGen 系统配置文件
# 版本: v3.0
# 说明: 整合 CodeGen 系统环境变量和 JeecgBoot 框架集成配置
# 格式: INI 配置文件格式 (支持 Python configparser)
# 编码: UTF-8
# ===============================================================================


[database_execution]
# 数据库连接配置
# 说明: 用于 SQL 脚本自动执行的数据库连接信息
# 注意: 数据库连接信息从环境变量读取 (JEECG_DATABASE_TYPE, JEECG_DATABASE_URL, JEECG_DATABASE_USERNAME, JEECG_DATABASE_PASSWORD)
# 是否启用数据库 SQL 自动执行
enabled = true
# SQL 执行方法: mysql_client=MySQL客户端, jdbc=JDBC连接
method = mysql_client
# SQL 执行超时时间 (单位: 秒)
timeout = 30
# 是否自动提交事务
auto_commit = true

[timeouts]
# API 调用超时配置 (单位: 秒)
# 说明: 各个 API 调用的超时时间设置，防止长时间等待
# 登录 API 超时时间
login = 10
# 表单创建 API 超时时间
create = 30
# 表单列表查询 API 超时时间
list = 15
# 数据库同步 API 超时时间
sync = 30
# 代码生成 API 超时时间
codegen = 60

[form]
# 表单配置
# 说明: 在线表单创建和管理相关配置
# 表单数据模板文件名
data_file = Code_Gen_Template.json
# 表单创建后等待时间 (单位: 秒)
wait_after_create = 3

[codegen]
# 代码生成核心配置
# 说明: JeecgBoot 代码生成 API 的核心参数
# 项目路径模板变量 (运行时替换)
project_path = {{PROJECT_PATH}}
# 实体名称模板变量 (运行时替换)
entity_name = {{BUSINESS_ENTITY}}
# JSP 模式: one=单表, jvxe=主子表
jsp_mode = one
# 表单类型: 1=普通表单, 2=主子表表单
jform_type = 1
# 包结构风格: service=标准服务层结构
package_style = service
# Vue 版本: vue3=Vue3 框架
vue_style = vue3
# 生成代码类型 (逗号分隔)
code_types = controller,service,dao,mapper,entity,vue

[table_types_single]
# 表类型配置 - 独立表/单表
# 说明: 独立业务表的配置参数
tableType = 1
relationType = null
tabOrderNum = null
jsp_mode = one
jform_type = 1
description = 独立表配置

[table_types_main]
# 表类型配置 - 主表
# 说明: 主子表关系中主表的配置参数
tableType = 2
relationType = null
tabOrderNum = null
jsp_mode = jvxe
jform_type = 2
enable_sub_list = true
description = 主表配置

[table_types_sub]
# 表类型配置 - 子表
# 说明: 主子表关系中子表的配置参数
tableType = 3
relationType = 0
tabOrderNum = {{AUTO_INCREMENT}}
jsp_mode = one
jform_type = 1
description = 子表配置

[master_sub_table]
# 主子表关联配置
# 说明: 主子表关联功能的详细参数
# 主表 JSP 模式
jsp_mode = jvxe
# 主表表单类型
jform_type = 2
# 启用子表列表
enable_sub_list = true
# 子表 ID 起始值
sub_id_start = 1020
# 子表 ID 前缀
sub_id_prefix = row_
# 外键字段后缀
foreign_key_suffix = _id
# 子表顺序起始值
tab_order_start = 1

[compilation]
# Maven 编译配置
# 说明: 代码生成后的 Maven 编译验证功能
# 是否启用编译验证 (true/false)
enabled = false
# 编译策略: skip=跳过编译, quick=快速编译, full=完整编译
strategy = skip
# 跳过编译的原因说明
reason = 编译不影响代码生成核心功能，跳过以提高效率
# Maven 命令名称
maven_command = mvn
# 编译参数 (逗号分隔)
compile_args = compile,-DskipTests
# 编译超时时间 (单位: 秒)
timeout = 120
# 是否验证 target/classes 目录
verify_target_classes = false
# 是否自动创建 pom.xml 文件
auto_create_pom = true
# 是否优先使用模块级编译
prefer_module_compilation = true

[compilation_fallback_quick]
# Maven 编译回退选项 - 快速编译
# 说明: 当标准编译失败时的快速编译选项
# 是否启用快速编译回退
enabled = false
# 快速编译命令 (逗号分隔)
command = mvn,compile,-DskipTests
# 快速编译超时时间
timeout = 120

[compilation_fallback_full]
# Maven 编译回退选项 - 完整安装
# 说明: 当快速编译也失败时的完整安装选项
# 是否启用完整安装回退
enabled = false
# 完整安装命令 (逗号分隔)
command = mvn,clean,install,-DskipTests
# 完整安装超时时间
timeout = 300

[frontend_migration]
# 前端代码迁移配置
# 说明: 自动将生成的 Vue3 前端代码迁移到正确位置
# 是否启用前端代码迁移
enabled = true
# 前端项目目标基础路径
target_base_path = jeecgboot-vue3/src/views
# 是否清理源文件 (迁移后删除原文件)
cleanup_source = false
# 是否自动创建目标目录
create_target_dirs = true



[permission_authorization]
# 权限授权配置
# 说明: 自动为管理员角色授权新生成模块的权限
# 是否启用权限自动授权
enabled = true
# 管理员角色 ID (JeecgBoot 系统中的管理员角色标识)
admin_role_id = f6817f48af4fb3af11b9e8bf182f618b
# 权限授权 API 超时时间 (单位: 秒)
timeout = 30
# 权限授权重试次数
retry_attempts = 3
# 是否自动为管理员授权
auto_grant_to_admin = true
# 权限授权功能描述
description = 自动为管理员角色授权新生成模块的权限

[query]
# 查询配置
# 说明: 数据查询相关的默认参数
# 默认分页大小
page_size = 50
# 默认页码
page_no = 1

[display]
# 显示配置
# 说明: 界面显示相关的参数
# Token 显示长度
token_length = 50
# 最大记录显示数量
max_records = 5

[paths]
# 项目结构路径配置
# 说明: JeecgBoot 项目内部的标准目录结构
# 后端模块基础路径 (相对于项目根目录)
backend_module_base = jeecg-boot/jeecg-boot-module
# 前端项目基础路径 (相对于项目根目录)
frontend_project_base = jeecgboot-vue3
# 前端视图目录路径 (相对于前端项目根目录)
frontend_views_dir = src/views
# 系统启动模块路径 (相对于项目根目录)
system_start_module = jeecg-boot/jeecg-module-system/jeecg-system-start

[config_files]
# 配置文件路径
# 说明: 系统运行过程中需要读取或修改的配置文件路径
# JeecgBoot 主配置文件路径 (相对于系统启动模块)
jeecg_main_config = src/main/resources/jeecg_config.properties
# 数据库配置文件路径 (相对于系统启动模块)
database_config = src/main/resources/application-dev.yml
# Maven 主 POM 文件路径 (相对于项目根目录)
main_pom = pom.xml
# 模块 POM 文件路径 (相对于项目根目录)
module_pom = jeecg-boot/jeecg-boot-module/pom.xml

[temp_files]
# 临时文件配置
# 说明: 系统运行过程中生成的临时文件配置
# 临时配置文件前缀
config_prefix = temp_
# 临时配置文件后缀
config_suffix = _config.json
# 临时文件保留时间 (单位: 小时)
retention_hours = 24
# 是否自动清理临时文件
auto_cleanup = true

[validation_table_name]
# 表名格式验证
# 说明: JeecgBoot 表名必须遵循的格式规范
# 表名前缀 (固定值)
prefix = us_
# 表名段数 (固定为4段: us_模块_子模块_实体)
segments = 4
# 表名分隔符
separator = _
# 表名正则表达式
pattern = ^us_[a-z]+_[a-z]+_[a-z]+$

[validation_fields]
# 字段验证规则
# 说明: 配置文件中字段必须遵循的验证规则
# orderNum 必须从 0 开始连续递增 (致命约束)
order_num_start_value = 0
order_num_must_be_continuous = true
# 系统字段数量 (前7个字段为系统字段)
system_fields_count = 7
# 最小业务字段数量
min_business_fields = 1

[validation_field_lengths]
# 字段长度限制 (基于 JeecgBoot 数据库表结构)
# 说明: 防止字段值超过数据库字段长度限制
# queryMode 字段最大长度
query_mode_max_length = 10
# fieldShowType 字段最大长度
field_show_type_max_length = 20
# queryShowType 字段最大长度
query_show_type_max_length = 50
# fieldValidType 字段最大长度
field_valid_type_max_length = 300

[validation_recommended_values]
# 推荐的字段值
# 说明: 推荐使用的标准字段值，确保兼容性
# 推荐的 queryMode 值 (逗号分隔)
query_mode = single,range,like,in,between
# 推荐的 fieldShowType 值 (逗号分隔)
field_show_type = text,textarea,number,date,select,radio,checkbox
# 推荐的 dbType 值 (逗号分隔)
db_type = string,int,BigDecimal,Date,Datetime,text

[api]
# JeecgBoot API 接口地址 - 基于Git历史版本修复
login_url = http://localhost:8080/jeecg-boot/sys/mLogin
form_addall_url = http://localhost:8080/jeecg-boot/online/cgform/api/addAll
form_list_url = http://localhost:8080/jeecg-boot/online/cgform/head/list
form_delete_batch_url = http://localhost:8080/jeecg-boot/online/cgform/head/deleteBatch
# 数据库同步API使用动态URL格式: {base_url}/online/cgform/api/doDbSynch/{form_id}/normal
database_sync_base_path = /online/cgform/api/doDbSynch
codegen_generate_url = http://localhost:8080/jeecg-boot/online/cgform/api/codeGenerate

[api_strategy_independent_table]
# API 调用策略配置 - 独立表
steps = login,addall,list,sync,generate

[api_strategy_main_table]
# API 调用策略配置 - 主表
steps = login,addall,list,sync,generate
enable_sub_list = true

[api_strategy_sub_table]
# API 调用策略配置 - 子表
steps = login,addall,list,sync

[api_error_handling]
# 错误处理配置
retry_max_attempts = 3
retry_delay_seconds = 2
timeout_default_action = abort

# ===============================================================================
# 配置文件结束
# 说明: INI 格式配置文件，支持 Python configparser 解析
# JeecgBoot API 接口地址:
#   - 登录认证: http://localhost:8080/jeecg-boot/sys/mLogin
#   - 表单创建: http://localhost:8080/jeecg-boot/online/cgform/api/addAll
#   - 表单查询: http://localhost:8080/jeecg-boot/online/cgform/head/list
#   - 数据库同步: http://localhost:8080/jeecg-boot/online/cgform/head/doDbSynch
#   - 代码生成: http://localhost:8080/jeecg-boot/online/cgform/api/codeGenerate
# 默认服务地址: http://localhost:8080/jeecg-boot
# ===============================================================================
