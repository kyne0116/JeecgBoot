# ===============================================================================
# JeecgBoot CodeGen 系统配置文件
# 版本: v3.0
# 说明: 整合 CodeGen 系统环境变量和 JeecgBoot 框架集成配置
# 格式: 标准 Java Properties 文件格式 (key=value)
# 编码: UTF-8
# ===============================================================================

# ===============================================================================
# 第一部分：CodeGen 系统环境变量
# 说明: 系统运行所需的基础环境配置，支持环境变量引用
# ===============================================================================

# 项目根路径配置
# 说明: JeecgBoot 项目的根目录路径，所有相对路径的基准
# 默认值: /Users/admin/Work/Github/JeecgBoot (macOS 环境)
# 注意: 使用正斜杠 / 保持跨平台兼容性
project.path_prefix=${JEECG_PROJECT_ROOT:/Users/admin/Work/Github/JeecgBoot}

# JeecgBoot 服务器连接配置
# 说明: JeecgBoot 后端服务的基础 URL
# 默认值: http://localhost:8080/jeecg-boot
server.base_url=${JEECG_BASE_URL:http://localhost:8080/jeecg-boot}

# JeecgBoot 系统登录凭据
# 说明: 用于 CodeGen 系统登录 JeecgBoot 的管理员账号
# 默认用户名: admin
server.username=${JEECG_USERNAME:admin}
# 默认密码: 123456
server.password=${JEECG_PASSWORD:123456}

# 数据库连接配置
# 说明: 用于 SQL 脚本自动执行的数据库连接信息
# 数据库类型: mysql, postgresql, oracle
database_execution.type=${JEECG_DATABASE_TYPE:mysql}
# 数据库连接 URL
database_execution.url=${JEECG_DATABASE_URL:jdbc:mysql://localhost:30004/jeecg-boot}
# 数据库用户名
database_execution.username=${JEECG_DATABASE_USERNAME:root}
# 数据库密码
database_execution.password=${JEECG_DATABASE_PASSWORD:Best@2008}

# ===============================================================================
# 第二部分：JeecgBoot 集成变量
# 说明: 与 JeecgBoot 框架集成相关的配置参数
# ===============================================================================

# API 调用超时配置 (单位: 秒)
# 说明: 各个 API 调用的超时时间设置，防止长时间等待
# 登录 API 超时时间
timeouts.login=10
# 表单创建 API 超时时间
timeouts.create=30
# 表单列表查询 API 超时时间
timeouts.list=15
# 数据库同步 API 超时时间
timeouts.sync=30
# 代码生成 API 超时时间
timeouts.codegen=60

# 表单配置
# 说明: 在线表单创建和管理相关配置
# 表单数据模板文件名
form.data_file=Code_Gen_Template.json
# 表单创建后等待时间 (单位: 秒)
form.wait_after_create=3

# 代码生成核心配置
# 说明: JeecgBoot 代码生成 API 的核心参数
# 项目路径模板变量 (运行时替换)
codegen.project_path={{PROJECT_PATH}}
# 实体名称模板变量 (运行时替换)
codegen.entity_name={{BUSINESS_ENTITY}}
# JSP 模式: one=单表, jvxe=主子表
codegen.jsp_mode=one
# 表单类型: 1=普通表单, 2=主子表表单
codegen.jform_type=1
# 包结构风格: service=标准服务层结构
codegen.package_style=service
# Vue 版本: vue3=Vue3 框架
codegen.vue_style=vue3
# 生成代码类型 (逗号分隔)
codegen.code_types=controller,service,dao,mapper,entity,vue

# 表类型配置 - 独立表/单表
# 说明: 独立业务表的配置参数
codegen.table_types.single.tableType=1
codegen.table_types.single.relationType=null
codegen.table_types.single.tabOrderNum=null
codegen.table_types.single.jsp_mode=one
codegen.table_types.single.jform_type=1
codegen.table_types.single.description=独立表配置

# 表类型配置 - 主表
# 说明: 主子表关系中主表的配置参数
codegen.table_types.main.tableType=2
codegen.table_types.main.relationType=null
codegen.table_types.main.tabOrderNum=null
codegen.table_types.main.jsp_mode=jvxe
codegen.table_types.main.jform_type=2
codegen.table_types.main.enable_sub_list=true
codegen.table_types.main.description=主表配置

# 表类型配置 - 子表
# 说明: 主子表关系中子表的配置参数
codegen.table_types.sub.tableType=3
codegen.table_types.sub.relationType=0
codegen.table_types.sub.tabOrderNum={{AUTO_INCREMENT}}
codegen.table_types.sub.jsp_mode=one
codegen.table_types.sub.jform_type=1
codegen.table_types.sub.description=子表配置

# 主子表关联配置
# 说明: 主子表关联功能的详细参数
# 主表 JSP 模式
codegen.master_sub_table.jsp_mode=jvxe
# 主表表单类型
codegen.master_sub_table.jform_type=2
# 启用子表列表
codegen.master_sub_table.enable_sub_list=true
# 子表 ID 起始值
codegen.master_sub_table.sub_id_start=1020
# 子表 ID 前缀
codegen.master_sub_table.sub_id_prefix=row_
# 外键字段后缀
codegen.master_sub_table.foreign_key_suffix=_id
# 子表顺序起始值
codegen.master_sub_table.tab_order_start=1

# ===============================================================================
# 第三部分：系统功能模块配置
# 说明: 各个功能模块的启用状态和详细参数配置
# ===============================================================================

# Maven 编译配置
# 说明: 代码生成后的 Maven 编译验证功能
# 是否启用编译验证 (true/false)
compilation.enabled=false
# 编译策略: skip=跳过编译, quick=快速编译, full=完整编译
compilation.strategy=skip
# 跳过编译的原因说明
compilation.reason=编译不影响代码生成核心功能，跳过以提高效率
# Maven 命令名称
compilation.maven_command=mvn
# 编译参数 (逗号分隔)
compilation.compile_args=compile,-DskipTests
# 编译超时时间 (单位: 秒)
compilation.timeout=120
# 是否验证 target/classes 目录
compilation.verify_target_classes=false
# 是否自动创建 pom.xml 文件
compilation.auto_create_pom=true
# 是否优先使用模块级编译
compilation.prefer_module_compilation=true

# Maven 编译回退选项 - 快速编译
# 说明: 当标准编译失败时的快速编译选项
# 是否启用快速编译回退
compilation.fallback_options.quick_compile.enabled=false
# 快速编译命令 (逗号分隔)
compilation.fallback_options.quick_compile.command=mvn,compile,-DskipTests
# 快速编译超时时间
compilation.fallback_options.quick_compile.timeout=120

# Maven 编译回退选项 - 完整安装
# 说明: 当快速编译也失败时的完整安装选项
# 是否启用完整安装回退
compilation.fallback_options.full_install.enabled=false
# 完整安装命令 (逗号分隔)
compilation.fallback_options.full_install.command=mvn,clean,install,-DskipTests
# 完整安装超时时间
compilation.fallback_options.full_install.timeout=300

# 前端代码迁移配置
# 说明: 自动将生成的 Vue3 前端代码迁移到正确位置
# 是否启用前端代码迁移
frontend_migration.enabled=true
# 前端项目目标基础路径
frontend_migration.target_base_path=jeecgboot-vue3/src/views
# 是否清理源文件 (迁移后删除原文件)
frontend_migration.cleanup_source=false
# 是否自动创建目标目录
frontend_migration.create_target_dirs=true

# 数据库 SQL 执行配置
# 说明: 自动执行生成的 SQL 脚本创建数据库表结构
# 是否启用数据库 SQL 自动执行
database_execution.enabled=true
# SQL 执行方法: mysql_client=MySQL客户端, jdbc=JDBC连接
database_execution.method=mysql_client
# SQL 执行超时时间 (单位: 秒)
database_execution.timeout=30
# 是否自动提交事务
database_execution.auto_commit=true

# 权限授权配置
# 说明: 自动为管理员角色授权新生成模块的权限
# 是否启用权限自动授权
permission_authorization.enabled=true
# 管理员角色 ID (JeecgBoot 系统中的管理员角色标识)
permission_authorization.admin_role_id=f6817f48af4fb3af11b9e8bf182f618b
# 权限授权 API 超时时间 (单位: 秒)
permission_authorization.timeout=30
# 权限授权重试次数
permission_authorization.retry_attempts=3
# 是否自动为管理员授权
permission_authorization.auto_grant_to_admin=true
# 权限授权功能描述
permission_authorization.description=自动为管理员角色授权新生成模块的权限

# 查询配置
# 说明: 数据查询相关的默认参数
# 默认分页大小
query.page_size=50
# 默认页码
query.page_no=1

# 显示配置
# 说明: 界面显示相关的参数
# Token 显示长度
display.token_length=50
# 最大记录显示数量
display.max_records=5

# ===============================================================================
# 第四部分：路径和文件配置
# 说明: 系统运行过程中涉及的各种路径和文件配置
# ===============================================================================

# 项目结构路径配置
# 说明: JeecgBoot 项目内部的标准目录结构
# 后端模块基础路径 (相对于项目根目录)
paths.backend_module_base=jeecg-boot/jeecg-boot-module
# 前端项目基础路径 (相对于项目根目录)
paths.frontend_project_base=jeecgboot-vue3
# 前端视图目录路径 (相对于前端项目根目录)
paths.frontend_views_dir=src/views
# 系统启动模块路径 (相对于项目根目录)
paths.system_start_module=jeecg-boot/jeecg-module-system/jeecg-system-start

# 配置文件路径
# 说明: 系统运行过程中需要读取或修改的配置文件路径
# JeecgBoot 主配置文件路径 (相对于系统启动模块)
config_files.jeecg_main_config=src/main/resources/jeecg_config.properties
# 数据库配置文件路径 (相对于系统启动模块)
config_files.database_config=src/main/resources/application-dev.yml
# Maven 主 POM 文件路径 (相对于项目根目录)
config_files.main_pom=pom.xml
# 模块 POM 文件路径 (相对于项目根目录)
config_files.module_pom=jeecg-boot/jeecg-boot-module/pom.xml

# 临时文件配置
# 说明: 系统运行过程中生成的临时文件配置
# 临时配置文件前缀
temp_files.config_prefix=temp_
# 临时配置文件后缀
temp_files.config_suffix=_config.json
# 临时文件保留时间 (单位: 小时)
temp_files.retention_hours=24
# 是否自动清理临时文件
temp_files.auto_cleanup=true

# ===============================================================================
# 第五部分：系统约束和验证规则
# 说明: 确保代码生成质量的各种约束条件和验证规则
# ===============================================================================

# 表名格式验证
# 说明: JeecgBoot 表名必须遵循的格式规范
# 表名前缀 (固定值)
validation.table_name.prefix=us_
# 表名段数 (固定为4段: us_模块_子模块_实体)
validation.table_name.segments=4
# 表名分隔符
validation.table_name.separator=_
# 表名正则表达式
validation.table_name.pattern=^us_[a-z]+_[a-z]+_[a-z]+$

# 字段验证规则
# 说明: 配置文件中字段必须遵循的验证规则
# orderNum 必须从 0 开始连续递增 (致命约束)
validation.fields.order_num.start_value=0
validation.fields.order_num.must_be_continuous=true
# 系统字段数量 (前7个字段为系统字段)
validation.fields.system_fields_count=7
# 最小业务字段数量
validation.fields.min_business_fields=1

# 字段长度限制 (基于 JeecgBoot 数据库表结构)
# 说明: 防止字段值超过数据库字段长度限制
# queryMode 字段最大长度
validation.field_lengths.query_mode.max_length=10
# fieldShowType 字段最大长度
validation.field_lengths.field_show_type.max_length=20
# queryShowType 字段最大长度
validation.field_lengths.query_show_type.max_length=50
# fieldValidType 字段最大长度
validation.field_lengths.field_valid_type.max_length=300

# 推荐的字段值
# 说明: 推荐使用的标准字段值，确保兼容性
# 推荐的 queryMode 值 (逗号分隔)
validation.recommended_values.query_mode=single,range,like,in,between
# 推荐的 fieldShowType 值 (逗号分隔)
validation.recommended_values.field_show_type=text,textarea,number,date,select,radio,checkbox
# 推荐的 dbType 值 (逗号分隔)
validation.recommended_values.db_type=string,int,BigDecimal,Date,Datetime,text

# ===============================================================================
# 第六部分：JeecgBoot API 接口配置
# 说明: 代码生成系统调用的所有 JeecgBoot API 接口定义
# ===============================================================================

# JeecgBoot API 接口地址
api.login.url=${server.base_url}/sys/mLogin
api.form.addall.url=${server.base_url}/online/cgform/api/addAll
api.form.list.url=${server.base_url}/online/cgform/head/list
api.database.sync.url=${server.base_url}/online/cgform/head/doDbSynch
api.codegen.generate.url=${server.base_url}/online/cgform/api/codeGenerate

# API 调用策略配置
api.strategy.independent_table.steps=login,addall,list,sync,generate
api.strategy.main_table.steps=login,addall,list,sync,generate
api.strategy.main_table.enable_sub_list=true
api.strategy.sub_table.steps=login,addall,list,sync

# 错误处理配置
api.retry.max_attempts=3
api.retry.delay_seconds=2
api.timeout.default_action=abort



# ===============================================================================
# 配置文件结束
# 说明: 所有配置项均支持环境变量覆盖，格式为 ${ENV_VAR:default_value}
# JeecgBoot API 接口地址:
#   - 登录认证: ${server.base_url}/sys/mLogin
#   - 表单创建: ${server.base_url}/online/cgform/api/addAll
#   - 表单查询: ${server.base_url}/online/cgform/head/list
#   - 数据库同步: ${server.base_url}/online/cgform/head/doDbSynch
#   - 代码生成: ${server.base_url}/online/cgform/api/codeGenerate
# 默认服务地址: http://localhost:8080/jeecg-boot
# ===============================================================================
