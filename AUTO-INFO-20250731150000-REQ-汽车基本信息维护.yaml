# JeecgBoot AI Agent协作需求分析模板
# 基于BDD/EARS技术的结构化需求收集，专为Agent-A（需求分析师）设计
# 汽车4S店无纸化办公系统 - 汽车基本信息维护功能需求分析

# ============================================================================
# Agent协作协议声明
# ============================================================================
agent_collaboration_protocol:
  source_agent: "Agent-A (需求分析师)"
  target_agent: "Agent-B (架构设计师)"
  communication_standard: "BDD/EARS结构化协议"
  quality_target: "格式一致性>95%, 追溯完整性100%"
  processing_time_target: "<30秒/需求项"

# ============================================================================
# 输出元数据规范 (Agent-A必须填写)
# ============================================================================
requirement_metadata:
  # 文档标识
  document_identity:
    requirement_doc_id: "AUTO-INFO-20250731150000-REQ" # 汽车基本信息维护需求分析
    created_timestamp: "2025-07-31 15:00:00"
    agent_version: "Agent-A v1.0"
    processing_duration: "25s"
    
  # 基线和系统关联信息
  baseline_and_system_reference:
    # 需求基线引用
    baseline_reference:
      baseline_id: "REQ-BASELINE-20250731-001" # 来自需求基线模板
      baseline_version: "v1.0" # 基线版本
      requirement_suite_id: "AUTO-INFO-20250731150000" # 本需求在基线中的套件ID
      baseline_doc_path: "/Users/admin/Work/Github/JeecgBoot/AUTO-INFO-20250731150000-requirement_baseline.yaml" # 基线文档路径
      
    # 系统基础信息引用  
    system_reference:
      system_id: "AUTO-4S-SYSTEM" # 来自系统基础模板
      system_name: "汽车4S店无纸化办公系统" # 系统名称
      system_base_doc_path: "/Users/admin/Work/Github/JeecgBoot/AUTO-INFO-20250731150000-system_base_info.yaml" # 系统基础文档路径
      jeecg_version: "3.8.1" # 继承的JeecgBoot版本
      
    # 追溯链起点
    traceability_chain_origin:
      business_requirement_source: "4S店业务数字化转型需求" # 原始业务需求来源
      system_level_traceability_id: "TRACE-AUTO-4S-SYSTEM" # 系统级追溯ID
      baseline_level_traceability_id: "TRACE-REQ-BASELINE-20250731-001-AUTO-INFO-20250731150000" # 基线级追溯ID
      
  # 源输入信息
  source_input_info:
    original_business_input: |
      汽车4S店需要一个无纸化办公系统来管理汽车基本信息，包括：
      1. 新车入库时的基本信息录入
      2. 车型管理和品牌分类
      3. 库存更新和状态跟踪
      4. 车辆从入库到销售的全生命周期管理
      5. 支持VIN码、发动机号、车架号等关键标识的管理
      6. 车辆配置信息的详细记录
      7. 支持多品牌汽车的统一管理
    input_complexity: "medium" # simple | medium | complex
    input_language: "zh-CN" # zh-CN | en-US
    business_domain: "汽车信息管理" # 继承自基线的业务领域
    requirement_priority: "high" # 继承自基线的需求优先级
    
  # JeecgBoot环境上下文
  jeecg_context:
    framework_version: "3.8.1" # 默认3.8.1
    target_module_type: "custom" # system | custom | demo
    codegen_applicability: "85%" # 预估CodeGen适用比例

# ============================================================================
# EARS需求分析结果 (五种类型完整覆盖)
# ============================================================================
ears_requirement_analysis:
  # 分析统计摘要
  analysis_summary:
    total_requirements_identified: 12
    ubiquitous_requirements_count: 5
    event_driven_requirements_count: 3
    unwanted_behavior_requirements_count: 2
    state_driven_requirements_count: 1
    optional_requirements_count: 1
    
  # 类型1：通用需求 (Ubiquitous Requirements)
  ubiquitous_requirements:
    - requirement_id: "REQ-U-001"
      ears_statement: "系统应当能够录入汽车基本信息"
      business_context: "4S店工作人员需要在新车入库时录入车辆的基础信息"
      business_value: "确保每辆车都有完整的基础数据记录，为后续业务提供数据支撑"
      priority: "high" # high | medium | low
      complexity: "medium" # simple | medium | complex
      codegen_suitable: true # true | false
      acceptance_criteria:
        - criterion: "能够录入车辆品牌、车系、车型等基础信息"
          validation_method: "功能测试验证录入功能"
        - criterion: "能够录入VIN码、发动机号、车架号等唯一标识"
          validation_method: "数据唯一性验证"
      stakeholders: ["销售人员", "库管人员"]
      
    - requirement_id: "REQ-U-002"
      ears_statement: "系统应当能够查询汽车基本信息"
      business_context: "业务人员需要快速查找和检索车辆信息"
      business_value: "提高业务效率，快速响应客户询问"
      priority: "high"
      complexity: "simple"
      codegen_suitable: true
      acceptance_criteria:
        - criterion: "支持按VIN码、品牌、车型等条件查询"
          validation_method: "查询功能测试"
        - criterion: "查询结果准确且响应时间<2秒"
          validation_method: "性能测试"
      stakeholders: ["销售人员", "客服人员"]
      
    - requirement_id: "REQ-U-003"
      ears_statement: "系统应当能够修改汽车基本信息"
      business_context: "当车辆信息有更新或错误时，需要修改记录"
      business_value: "保证数据的准确性和时效性"
      priority: "high"
      complexity: "medium"
      codegen_suitable: true
      acceptance_criteria:
        - criterion: "能够修改除VIN码外的其他车辆信息"
          validation_method: "修改功能测试"
        - criterion: "修改操作记录操作日志"
          validation_method: "日志审计验证"
      stakeholders: ["库管人员", "业务经理"]
      
    - requirement_id: "REQ-U-004"
      ears_statement: "系统应当能够删除汽车基本信息"
      business_context: "错误录入或取消入库的车辆需要删除记录"
      business_value: "维护数据库的数据质量和准确性"
      priority: "medium"
      complexity: "simple"
      codegen_suitable: true
      acceptance_criteria:
        - criterion: "只有特定权限用户可以删除车辆信息"
          validation_method: "权限控制测试"
        - criterion: "删除操作需要确认并记录日志"
          validation_method: "操作确认和日志验证"
      stakeholders: ["系统管理员", "业务经理"]
      
    - requirement_id: "REQ-U-005"
      ears_statement: "系统应当能够导出汽车基本信息"
      business_context: "需要将车辆信息导出为Excel等格式供业务使用"
      business_value: "支持线下业务处理和数据分析"
      priority: "medium"
      complexity: "simple"
      codegen_suitable: true
      acceptance_criteria:
        - criterion: "支持Excel格式导出"
          validation_method: "导出功能测试"
        - criterion: "导出数据完整准确"
          validation_method: "数据完整性验证"
      stakeholders: ["业务经理", "财务人员"]
  
  # 类型2：事件驱动需求 (Event-driven Requirements)
  event_driven_requirements:
    - requirement_id: "REQ-E-001"
      ears_statement: "当新车入库时，系统应当自动生成车辆入库记录"
      event_source: "user_action" # user_action | system_timer | external_trigger
      event_frequency: "occasional" # realtime | periodic | occasional
      response_timing: "immediate" # immediate | delayed | scheduled
      business_context: "新车到店入库时需要自动记录入库信息"
      priority: "high"
      complexity: "medium"
      acceptance_criteria:
        - criterion: "入库操作触发后自动创建入库记录"
          validation_method: "事件触发测试"
      error_handling_requirement: "入库失败时回滚操作并提示错误信息"
      
    - requirement_id: "REQ-E-002"
      ears_statement: "当车辆状态改变时，系统应当更新车辆状态并记录变更日志"
      event_source: "user_action"
      event_frequency: "occasional"
      response_timing: "immediate"
      business_context: "车辆从入库到销售过程中状态会发生变化"
      priority: "high"
      complexity: "medium"
      acceptance_criteria:
        - criterion: "状态变更后立即更新并记录日志"
          validation_method: "状态变更测试"
      error_handling_requirement: "状态更新失败时保持原状态不变"
      
    - requirement_id: "REQ-E-003"
      ears_statement: "当检测到VIN码重复时，系统应当阻止录入并提示错误"
      event_source: "system_validation"
      event_frequency: "realtime"
      response_timing: "immediate"
      business_context: "VIN码是车辆唯一标识，不能重复"
      priority: "high"
      complexity: "simple"
      acceptance_criteria:
        - criterion: "重复VIN码录入时立即阻止并提示"
          validation_method: "唯一性验证测试"
      error_handling_requirement: "清晰提示VIN码重复错误信息"
  
  # 类型3：不希望行为需求 (Unwanted Behavior Requirements)
  unwanted_behavior_requirements:
    - requirement_id: "REQ-UB-001"
      ears_statement: "如果用户输入无效的VIN码格式，系统应当拒绝录入并提示格式错误"
      unwanted_scenario: "用户输入不符合VIN码标准格式的字符串"
      risk_level: "high" # high | medium | low
      prevention_mechanism: "VIN码格式验证规则"
      detection_method: "实时输入验证"
      recovery_action: "清除无效输入，提示正确格式"
      business_impact: "防止无效数据录入，确保数据质量"
      priority: "high"
      acceptance_criteria:
        - criterion: "无效VIN码格式无法录入系统"
          validation_method: "格式验证测试"
      
    - requirement_id: "REQ-UB-002"
      ears_statement: "如果用户尝试删除已销售车辆信息，系统应当阻止删除并提示错误"
      unwanted_scenario: "用户误操作删除已销售车辆的基本信息"
      risk_level: "high"
      prevention_mechanism: "车辆状态检查机制"
      detection_method: "删除前状态验证"
      recovery_action: "阻止删除操作，显示错误提示"
      business_impact: "保护重要业务数据不被误删"
      priority: "high"
      acceptance_criteria:
        - criterion: "已销售车辆信息无法被删除"
          validation_method: "状态保护测试"
  
  # 类型4：状态驱动需求 (State-driven Requirements)
  state_driven_requirements:
    - requirement_id: "REQ-S-001"
      ears_statement: "当系统处于车辆信息录入状态时，系统应当验证必填字段完整性"
      state_definition: "车辆信息录入状态"
      state_entry_condition: "用户点击新增车辆信息按钮"
      state_exit_condition: "用户保存或取消录入操作"
      state_behavior_description: "在录入状态下进行必填字段验证"
      state_transitions:
        - from_state: "初始状态"
          to_state: "录入状态"
          transition_trigger: "点击新增按钮"
          transition_condition: "用户有录入权限"
        - from_state: "录入状态"
          to_state: "保存状态"
          transition_trigger: "点击保存按钮"
          transition_condition: "必填字段验证通过"
      business_context: "确保录入的车辆信息完整有效"
      priority: "high"
      complexity: "medium"
  
  # 类型5：可选需求 (Optional Requirements)
  optional_requirements:
    - requirement_id: "REQ-O-001"
      ears_statement: "在网络连接正常情况下，系统可以自动获取车型配置信息"
      optional_condition: "网络连接正常且第三方API可用"
      optional_feature_description: "集成汽车配置信息API，自动获取详细配置"
      business_benefit: "减少手工录入工作量，提高数据准确性"
      implementation_priority: "phase_2" # phase_1 | phase_2 | phase_3 | future
      effort_estimation: "medium" # small | medium | large
      dependency_requirements: ["第三方API集成", "网络环境稳定"]
      business_value_score: 7 # 1-10
      technical_complexity_score: 6 # 1-10

# ============================================================================
# BDD场景分解 (四种场景类型完整覆盖)
# ============================================================================
bdd_scenario_analysis:
  # 场景分析摘要
  scenario_summary:
    total_scenarios_identified: 16
    functional_scenarios_count: 8
    exception_scenarios_count: 4
    boundary_scenarios_count: 2
    integration_scenarios_count: 2
    
  # 类型1：功能场景 (Functional Scenarios) - 正向业务流程
  functional_scenarios:
    - scenario_id: "BDD-F-001"
      scenario_title: "新车基本信息录入"
      source_requirement_id: "REQ-U-001" # 必须追溯到EARS需求
      business_goal: "完成新车入库时的基本信息录入"
      user_role: "库管人员"
      
      # Given-When-Then核心结构
      given: "库管人员已登录系统且具有车辆录入权限" # 前置条件
      when: "库管人员录入新车的VIN码、品牌、车型等基本信息" # 触发动作
      then: "系统成功保存车辆信息并生成车辆档案" # 预期结果
      and_conditions: # 附加条件
        - "车辆状态自动设置为'在库'"
        - "系统记录录入时间和操作人员"
      but_exceptions: # 异常情况
        - condition: "但是如果VIN码已存在"
          expected_behavior: "系统提示VIN码重复错误"
          error_code: "VIN_DUPLICATE"
          recovery_strategy: "清除VIN码输入，要求重新输入"
          user_guidance: "请检查VIN码是否正确或该车辆是否已录入"
          
      # 验收标准
      acceptance_criteria:
        - criterion: "车辆信息完整保存到数据库"
          validation_approach: "数据库查询验证"
          success_indicator: "可以通过VIN码查询到完整信息"
      
      # 测试数据需求
      test_data_requirements:
        - data_type: "有效VIN码"
          data_description: "17位标准VIN码格式"
          data_source: "汽车行业标准VIN码生成器"
          
      priority: "high"
      complexity: "medium"
      
    - scenario_id: "BDD-F-002"
      scenario_title: "车辆信息查询"
      source_requirement_id: "REQ-U-002"
      business_goal: "快速查找车辆信息"
      user_role: "销售人员"
      given: "系统中已存在车辆信息数据"
      when: "销售人员通过VIN码或车型进行查询"
      then: "系统显示匹配的车辆信息列表"
      and_conditions:
        - "查询结果按相关度排序"
        - "显示车辆状态和基本配置"
      but_exceptions:
        - condition: "但是如果查询条件不匹配任何车辆"
          expected_behavior: "系统显示'未找到匹配车辆'"
          error_code: "NO_MATCH_FOUND"
          recovery_strategy: "建议调整查询条件"
          user_guidance: "请检查输入信息或使用其他查询条件"
      acceptance_criteria:
        - criterion: "查询结果准确且完整"
          validation_approach: "结果对比验证"
          success_indicator: "查询结果与数据库记录一致"
      test_data_requirements:
        - data_type: "测试车辆数据"
          data_description: "包含多种品牌和车型的测试数据"
          data_source: "测试数据生成工具"
      priority: "high"
      complexity: "simple"
      
    - scenario_id: "BDD-F-003"
      scenario_title: "车辆信息修改"
      source_requirement_id: "REQ-U-003"
      business_goal: "更新车辆信息保持数据准确性"
      user_role: "业务经理"
      given: "车辆信息已存在且用户有修改权限"
      when: "用户修改车辆的配置或其他非关键信息"
      then: "系统更新车辆信息并记录修改日志"
      and_conditions:
        - "保留修改前的历史记录"
        - "更新最后修改时间"
      but_exceptions:
        - condition: "但是如果尝试修改VIN码"
          expected_behavior: "系统阻止修改并提示错误"
          error_code: "VIN_IMMUTABLE"
          recovery_strategy: "VIN码字段置为只读"
          user_guidance: "VIN码为车辆唯一标识，不允许修改"
      acceptance_criteria:
        - criterion: "修改信息正确保存"
          validation_approach: "修改前后数据对比"
          success_indicator: "修改内容已生效且日志完整"
      test_data_requirements:
        - data_type: "可修改字段数据"
          data_description: "除VIN码外的其他车辆属性"
          data_source: "测试用例设计"
      priority: "high"
      complexity: "medium"
      
    - scenario_id: "BDD-F-004"
      scenario_title: "车辆状态更新"
      source_requirement_id: "REQ-E-002"
      business_goal: "跟踪车辆从入库到销售的状态变化"
      user_role: "销售人员"
      given: "车辆处于可变更状态"
      when: "销售人员将车辆状态从'在库'更改为'已预订'"
      then: "系统更新车辆状态并记录状态变更日志"
      and_conditions:
        - "状态变更时间自动记录"
        - "发送状态变更通知"
      but_exceptions:
        - condition: "但是如果车辆已经销售"
          expected_behavior: "系统阻止状态回退"
          error_code: "INVALID_STATUS_CHANGE"
          recovery_strategy: "保持当前状态不变"
          user_guidance: "已销售车辆状态不能回退"
      acceptance_criteria:
        - criterion: "状态变更正确执行"
          validation_approach: "状态历史查询验证"
          success_indicator: "状态变更记录完整准确"
      test_data_requirements:
        - data_type: "状态变更场景数据"
          data_description: "各种状态转换的测试用例"
          data_source: "业务流程分析"
      priority: "high"
      complexity: "medium"
      
    - scenario_id: "BDD-F-005"
      scenario_title: "车辆信息导出"
      source_requirement_id: "REQ-U-005"
      business_goal: "导出车辆数据供线下使用"
      user_role: "业务经理"
      given: "用户已选择需要导出的车辆信息"
      when: "用户点击导出按钮选择Excel格式"
      then: "系统生成Excel文件并提供下载链接"
      and_conditions:
        - "导出文件包含完整的车辆信息"
        - "文件命名包含导出时间"
      but_exceptions:
        - condition: "但是如果选择的数据量过大"
          expected_behavior: "系统分批导出或限制导出数量"
          error_code: "EXPORT_SIZE_LIMIT"
          recovery_strategy: "分批次导出数据"
          user_guidance: "请分批导出或联系管理员"
      acceptance_criteria:
        - criterion: "导出文件内容准确完整"
          validation_approach: "文件内容与查询结果对比"
          success_indicator: "Excel文件可正常打开且数据准确"
      test_data_requirements:
        - data_type: "大量车辆数据"
          data_description: "用于测试导出功能的批量数据"
          data_source: "数据生成脚本"
      priority: "medium"
      complexity: "simple"
      
    # 继续添加其他功能场景...
    - scenario_id: "BDD-F-006"
      scenario_title: "车辆信息删除"
      source_requirement_id: "REQ-U-004"
      business_goal: "删除错误或无效的车辆记录"
      user_role: "系统管理员"
      given: "存在需要删除的车辆记录且用户有删除权限"
      when: "管理员选择车辆记录并确认删除操作"
      then: "系统删除车辆记录并记录删除日志"
      and_conditions:
        - "删除前进行二次确认"
        - "记录删除原因和操作人"
      but_exceptions:
        - condition: "但是如果车辆已销售或已预订"
          expected_behavior: "系统阻止删除并提示原因"
          error_code: "DELETE_FORBIDDEN"
          recovery_strategy: "保持记录不变"
          user_guidance: "已销售或预订车辆不能删除，请先更改状态"
      acceptance_criteria:
        - criterion: "符合条件的记录能正确删除"
          validation_approach: "删除后查询验证"
          success_indicator: "记录已从数据库移除且有日志记录"
      test_data_requirements:
        - data_type: "各种状态的车辆数据"
          data_description: "包含可删除和不可删除状态的车辆"
          data_source: "状态测试数据集"
      priority: "medium"
      complexity: "simple"
  
  # 类型2：异常场景 (Exception Scenarios) - 错误处理和异常情况
  exception_scenarios:
    - scenario_id: "BDD-E-001"
      scenario_title: "VIN码格式错误处理"
      source_requirement_id: "REQ-UB-001"
      exception_type: "data_validation_error" # business_rule_violation | system_error | external_failure | data_validation_error
      error_category: "user_error" # user_error | system_error | integration_error
      
      given: "用户正在录入新车信息"
      when: "用户输入格式不正确的VIN码" # 异常触发条件
      then: "系统立即显示VIN码格式错误提示" # 预期的异常处理结果
      and_conditions:
        - "阻止表单提交"
        - "高亮显示错误字段"
      
      # 异常处理策略
      exception_handling_strategy:
        immediate_response: "实时验证并显示错误提示"
        user_notification: "VIN码必须为17位字符，包含数字和字母"
        error_logging: "记录输入验证错误日志"
        recovery_mechanism: "清除错误输入，显示正确格式示例"
        escalation_procedure: "多次输入错误后提供帮助链接"
      
      severity: "medium" # critical | high | medium | low
      priority: "high"
      
    - scenario_id: "BDD-E-002"
      scenario_title: "系统数据库连接异常"
      source_requirement_id: "REQ-U-001"
      exception_type: "system_error"
      error_category: "system_error"
      given: "用户正在录入车辆信息"
      when: "系统数据库连接中断或超时"
      then: "系统显示友好错误提示并保存临时数据"
      and_conditions:
        - "避免用户输入数据丢失"
        - "提供重试机制"
      exception_handling_strategy:
        immediate_response: "显示系统繁忙提示"
        user_notification: "系统暂时无法保存，请稍后重试"
        error_logging: "记录数据库连接错误详情"
        recovery_mechanism: "自动重试连接，保存表单数据到本地"
        escalation_procedure: "持续失败时通知系统管理员"
      severity: "high"
      priority: "high"
      
    # 继续添加其他异常场景...
  
  # 类型3：边界场景 (Boundary Scenarios) - 临界值和边界条件
  boundary_scenarios:
    - scenario_id: "BDD-B-001"
      scenario_title: "车辆信息字段长度边界测试"
      source_requirement_id: "REQ-U-001"
      boundary_type: "data_limit" # data_limit | time_limit | capacity_limit | permission_boundary
      boundary_value: "车辆型号名称最大50字符"
      boundary_description: "测试车辆型号字段的最大长度限制"
      
      given: "用户正在录入车辆型号信息"
      when: "用户输入50字符的车辆型号名称" # 边界条件触发
      then: "系统正常接受并保存车辆型号" # 边界条件下的预期行为
      and_conditions:
        - "超过50字符时阻止输入"
        - "提示剩余可输入字符数"
      
      # 边界测试要求
      boundary_test_cases:
        - test_case: "边界值测试"
          test_value: "50字符车型名称"
          expected_result: "正常保存"
        - test_case: "超界值测试"
          test_value: "51字符车型名称"
          expected_result: "阻止输入或截断"
      
      priority: "medium"
      
    - scenario_id: "BDD-B-002"
      scenario_title: "批量操作数量边界测试"
      source_requirement_id: "REQ-U-005"
      boundary_type: "capacity_limit"
      boundary_value: "单次导出最大1000条记录"
      boundary_description: "测试批量导出功能的数量限制"
      given: "用户选择了大量车辆信息准备导出"
      when: "用户选择1000条车辆记录进行导出"
      then: "系统正常生成导出文件"
      and_conditions:
        - "超过1000条时提示分批导出"
        - "提供导出进度显示"
      boundary_test_cases:
        - test_case: "边界值导出"
          test_value: "1000条记录"
          expected_result: "正常导出"
        - test_case: "超界值导出"
          test_value: "1001条记录"
          expected_result: "提示分批导出"
      priority: "low"
  
  # 类型4：集成场景 (Integration Scenarios) - 外部系统交互
  integration_scenarios:
    - scenario_id: "BDD-I-001"
      scenario_title: "汽车品牌数据API集成"
      source_requirement_id: "REQ-O-001"
      integration_type: "rest_api" # rest_api | database | file_system | message_queue | third_party_service
      external_system: "汽车品牌数据服务"
      integration_direction: "outbound" # inbound | outbound | bidirectional
      
      given: "系统配置了汽车品牌数据API"
      when: "用户录入车辆品牌信息时" # 集成触发条件
      then: "系统自动调用API获取品牌车型列表" # 集成预期结果
      and_conditions:
        - "API响应时间在3秒内"
        - "失败时使用本地缓存数据"
      
      # 集成约束条件
      integration_constraints:
        data_format: "json" # json | xml | csv | binary
        protocol: "https" # http | https | ftp | tcp
        authentication: "token" # none | basic | oauth | token
        timeout_requirement: "3秒"
        retry_strategy: "3次重试，间隔1秒"
        
      # 集成异常处理
      integration_exception_handling:
        connection_failure: "使用本地品牌数据，记录失败日志"
        timeout_handling: "显示加载中状态，3秒后超时提示"
        data_format_error: "忽略格式错误数据，使用默认值"
        authentication_failure: "重新获取认证令牌"
        
      priority: "low"
      
    - scenario_id: "BDD-I-002"
      scenario_title: "VIN码验证服务集成"
      source_requirement_id: "REQ-E-003"
      integration_type: "rest_api"
      external_system: "VIN码验证服务"
      integration_direction: "outbound"
      given: "系统集成了VIN码验证API"
      when: "用户输入VIN码时"
      then: "系统调用验证服务确认VIN码有效性"
      and_conditions:
        - "验证结果实时反馈"
        - "验证失败时清晰提示错误原因"
      integration_constraints:
        data_format: "json"
        protocol: "https"
        authentication: "oauth"
        timeout_requirement: "2秒"
        retry_strategy: "2次重试"
      integration_exception_handling:
        connection_failure: "使用本地基础格式验证"
        timeout_handling: "2秒超时后提示网络问题"
        data_format_error: "返回验证失败结果"
        authentication_failure: "使用备用验证服务"
      priority: "medium"

