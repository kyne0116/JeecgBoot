baseline_management_configuration:
  baseline_settings:
    auto_sync_enabled: true
    baseline_lock_timeout: 30_minutes
    quality_gate_threshold: 90
    requirement_id_format: '{SYSTEM}_{MODULE}_{FUNCTION}_{VERSION}'
    sync_frequency: real_time
  collaboration_settings:
    escalation_enabled: true
    handoff_timeout: 2_hours
    max_parallel_experts: 3
    notification_channels:
    - email
    - system_message
  deployment_date: '2025-07-27 01:08:26'
  integration_settings:
    ci_cd_integration: false
    codegen_integration: true
    git_integration: true
    quality_tools_integration: true
  version: v1.0.0
