  tech_stack:
    base_platform: "JeecgBoot" # 基础开发平台
    base_version: "3.8.1" # JeecgBoot版本
    frontend: # 前端技术栈 - 基于JeecgBoot-Vue3
      framework: "Vue.js" # 基于Vue 3的现代前端框架
      version: "3.5.13" # Vue版本
      ui_library: "Ant Design Vue" # UI组件库
      build_tool: "Vite" # 前端构建工具
      language: "TypeScript" # 开发语言
      package_manager: "pnpm" # 包管理器
      jeecg_frontend_version: "3.8.1" # JeecgBoot前端版本
      additional_libraries: # 其他主要依赖
        - name: "Vue Router"
          version: "4.5.0"
          description: "前端路由管理"
        - name: "Pinia"
          version: "2.1.7"
          description: "状态管理"
        - name: "Axios"
          version: "1.7.9"
          description: "HTTP客户端"
        - name: "VXE Table"
          version: "4.13.31"
          description: "高性能表格组件"
        - name: "ECharts"
          version: "5.6.0"
          description: "数据可视化图表库"
    backend: # 后端技术栈 - 基于JeecgBoot后端框架
      framework: "Spring Boot" # 基于Spring Boot的企业级Java框架
      language: "Java" # 开发语言
      version: "17" # Java版本(支持JDK 17和1.8)
      spring_boot_version: "2.7.18" # Spring Boot版本
      jeecg_backend_version: "3.8.1" # JeecgBoot后端版本
      orm_library: "MyBatis Plus" # ORM框架
      api_protocol: "RESTful API" # API协议
      security_framework: "Spring Security + JWT + Apache Shiro" # 安全框架
      additional_frameworks: # 其他主要框架和组件
        - name: "Spring Cloud"
          version: "2021.0.8"
          description: "微服务框架(可选)"
        - name: "Spring Cloud Alibaba"
          version: "2021.0.6.2"
          description: "阿里巴巴微服务套件"
        - name: "MyBatis Plus"
          version: "3.5.3.2"
          description: "MyBatis-Plus ORM框架"
        - name: "Druid"
          version: "1.2.24"
          description: "数据库连接池"
        - name: "Apache Shiro"
          version: "1.13.0"
          description: "权限管理框架"
        - name: "Nacos"
          version: "2.0.4"
          description: "服务注册与配置中心"
        - name: "XXL-Job"
          version: "2.4.1"
          description: "分布式任务调度"
        - name: "Knife4j"
          version: "4.4.0"
          description: "API文档生成工具"
        - name: "Hutool"
          version: "5.8.25"
          description: "Java工具类库"
        - name: "APIJSON"
          version: "5.2.0"
          description: "腾讯开源的JSON动态API框架，支持零代码实时生成文档和自动化测试"
          repository: "https://github.com/Tencent/APIJSON"

  git_repository:
    repo_url: "https://github.com/company/auto4s-system.git" # 项目的主要Git仓库地址
    branch_strategy: "Git Flow"
    cicd_pipeline_tool: "Jenkins"

  additional_notes: |
    # 汽车4S店系统特殊说明
    本系统专为汽车4S店业务设计，包含以下特殊业务特性：
    1. 车辆管理：支持新车入库、车辆信息维护、库存管理等核心功能
    2. 销售管理：涵盖客户接待、试驾安排、销售合同、交车流程等
    3. 售后服务：包括维修预约、配件管理、保养提醒、质保管理等
    4. 客户管理：客户档案、购车历史、服务记录、满意度调查等
    5. 财务管理：销售收款、成本核算、佣金计算、财务报表等
    
    系统集成要求：
    - 与汽车厂商DMS系统对接，实现车辆信息同步
    - 与银行金融系统集成，支持分期付款业务
    - 与保险公司系统对接，实现保险业务自动化
    - 支持与第三方物流系统集成
    
    合规要求：
    - 符合汽车销售行业相关法规要求
    - 支持国家汽车召回制度相关功能
    - 满足消费者权益保护相关要求