# JeecgBoot汽车4S店无纸化办公系统基础信息
# 基于system_base_info_template.yaml创建
# 版本: 1.0
# 创建时间: 2025-07-31
# 系统代码: AUTO4S

system_overview:
  system_name: "汽车4S店无纸化办公系统" # 系统名称
  description: "基于JeecgBoot框架的现代化汽车4S店管理系统，提供销售、服务、配件、信息反馈四位一体的综合管理功能，实现4S店业务全流程数字化管理" # 系统的简短描述
  base_working_directory: "/Users/admin/Work/Github/JeecgBoot" # 整个项目的根工作目录
  aigc_working_directory: "/Users/admin/Work/Github/JeecgBoot/AIGC" # AIGC 项目需求文档根目录
  codegen_working_directory: "/Users/admin/Work/Github/JeecgBoot/CodeGen" # CodeGen系统代码生成源码
  contextdev_working_directory: "/Users/admin/Work/Github/JeecgBoot/ContextDev" # ContextDev上下文编程源码
  backend_working_directory: "/Users/admin/Work/Github/JeecgBoot/jeecg-boot" # 后端服务根路径
  frontend_working_directory: "/Users/admin/Work/Github/JeecgBoot/jeecgboot-vue3" # 前端服务根路径

  contains_jeecgboot_module: # 本系统包含的JeecgBoot主要模块
    - code: "VEHICLE"
      description: "车辆信息管理模块"
    - code: "SALES"
      description: "销售管理模块"
    - code: "SERVICE"
      description: "售后服务管理模块"
    - code: "PARTS"
      description: "配件管理模块"
    - code: "CUSTOMER"
      description: "客户关系管理模块"
    - code: "FINANCE"
      description: "财务管理模块"

  contains_jeecgboot_submodule: # 本系统包含的JeecgBoot具体子模块
    - code: "VEHICLE_INFO"
      description: "汽车基本信息维护子模块"
    - code: "VEHICLE_INVENTORY"
      description: "车辆库存管理子模块"
    - code: "SALES_ORDER"
      description: "销售订单管理子模块"
    - code: "MAINTENANCE"
      description: "维修保养管理子模块"
    - code: "PARTS_STOCK"
      description: "配件库存管理子模块"
    - code: "CUSTOMER_SERVICE"
      description: "客户服务管理子模块"

  contains_jeecgboot_submodule_views: # 本系统包含的JeecgBoot子模块相关的前端Vue 3视图或页面
    - path: "/views/vehicle/VehicleInfoList.vue"
      description: "汽车信息列表页面"
    - path: "/views/vehicle/VehicleInfoForm.vue"
      description: "汽车信息编辑表单页面"
    - path: "/views/vehicle/VehicleInventory.vue"
      description: "车辆库存管理页面"
    - path: "/views/sales/SalesOrderList.vue"
      description: "销售订单列表页面"
    - path: "/views/service/MaintenanceList.vue"
      description: "维修保养记录页面"
    - path: "/views/parts/PartsStockList.vue"
      description: "配件库存列表页面"

