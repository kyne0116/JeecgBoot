# L0-系统基础信息
# E-commerce System Base Information
# 版本: 1.0
# 创建时间: 2025-07-31
# 文件组织结构: L0(系统基础) -> L1(需求基线) -> REQ-SUITE(需求套件)

# =============================================================================
# 系统基本信息 (System Basic Information)
# =============================================================================
system_info:
  system_name: "电商管理系统"
  system_code: "EMS"
  system_version: "1.0.0"
  system_type: "Web应用系统"
  development_framework: "JeecgBoot"
  
  # 系统描述
  description: |
    基于JeecgBoot框架的现代化电商管理系统，提供完整的商品管理、订单处理、
    用户管理、支付结算等核心电商功能，支持B2C和B2B业务模式。

  # 业务领域
  business_domain:
    - 电子商务
    - 零售管理
    - 供应链管理
    - 客户关系管理

# =============================================================================
# 技术架构信息 (Technical Architecture)
# =============================================================================
technical_architecture:
  # 架构模式
  architecture_pattern: "分层架构 + 微服务"
  
  # 技术栈
  technology_stack:
    backend:
      framework: "Spring Boot"
      version: "2.7.x"
      java_version: "JDK 8+"
      orm: "MyBatis-Plus"
      security: "Spring Security + JWT"
      
    frontend:
      framework: "Vue.js"
      version: "3.x"
      ui_library: "Ant Design Vue"
      build_tool: "Vite"
      
    database:
      primary: "MySQL 8.0+"
      cache: "Redis 6.x"
      search: "Elasticsearch 7.x"
      
    infrastructure:
      application_server: "Tomcat 9.x"
      reverse_proxy: "Nginx"
      message_queue: "RocketMQ"
      file_storage: "MinIO/OSS"

  # 部署架构
  deployment_architecture:
    environment_types:
      - "开发环境(DEV)"
      - "测试环境(TEST)"
      - "预生产环境(UAT)"
      - "生产环境(PROD)"
    
    deployment_mode: "Docker容器化部署"
    orchestration: "Kubernetes"
    monitoring: "Prometheus + Grafana"

# =============================================================================
# 核心业务模块 (Core Business Modules)
# =============================================================================
core_business_modules:
  # 用户管理模块
  user_management:
    module_code: "USER"
    description: "用户注册、登录、权限管理、个人信息维护"
    priority: "高"
    complexity: "中"
    
  # 商品管理模块
  product_management:
    module_code: "PRODUCT"
    description: "商品信息管理、分类管理、库存管理、价格管理"
    priority: "高"
    complexity: "高"
    
  # 购物车模块
  shopping_cart:
    module_code: "CART"
    description: "购物车商品添加、删除、修改、结算"
    priority: "高"
    complexity: "中"
    
  # 订单管理模块
  order_management:
    module_code: "ORDER"
    description: "订单创建、状态跟踪、订单查询、订单处理"
    priority: "高"
    complexity: "高"
    
  # 支付管理模块
  payment_management:
    module_code: "PAYMENT"
    description: "支付方式管理、支付流程处理、退款管理"
    priority: "高"
    complexity: "高"
    
  # 物流配送模块
  logistics_management:
    module_code: "LOGISTICS"
    description: "配送地址管理、物流跟踪、配送状态更新"
    priority: "中"
    complexity: "中"

# =============================================================================
# 系统角色定义 (System Roles)
# =============================================================================
system_roles:
  # 前台用户角色
  frontend_roles:
    customer:
      role_name: "普通客户"
      role_code: "CUSTOMER"
      description: "注册用户，可以浏览商品、下单购买"
      permissions:
        - "商品浏览"
        - "购物车管理"
        - "订单管理"
        - "个人信息管理"
    
    vip_customer:
      role_name: "VIP客户"
      role_code: "VIP_CUSTOMER"
      description: "高级客户，享有特殊权限和优惠"
      permissions:
        - "所有普通客户权限"
        - "VIP专属商品访问"
        - "优先客服支持"
        - "专属优惠活动"
  
  # 后台管理角色
  backend_roles:
    admin:
      role_name: "系统管理员"
      role_code: "ADMIN"
      description: "系统最高权限用户"
      permissions:
        - "系统配置管理"
        - "用户权限管理"
        - "所有业务功能"
        - "系统监控"
    
    product_manager:
      role_name: "商品管理员"
      role_code: "PRODUCT_MANAGER"
      description: "负责商品信息管理"
      permissions:
        - "商品信息管理"
        - "分类管理"
        - "库存管理"
        - "价格管理"
    
    order_manager:
      role_name: "订单管理员"
      role_code: "ORDER_MANAGER"
      description: "负责订单处理和客户服务"
      permissions:
        - "订单查询处理"
        - "客户服务"
        - "退款处理"
        - "物流跟踪"

# =============================================================================
# 数据字典定义 (Data Dictionary)
# =============================================================================
data_dictionary:
  # 订单状态
  order_status:
    table_name: "sys_dict"
    dict_code: "order_status"
    items:
      - {code: "PENDING", name: "待支付", sort: 1}
      - {code: "PAID", name: "已支付", sort: 2}
      - {code: "SHIPPED", name: "已发货", sort: 3}
      - {code: "DELIVERED", name: "已送达", sort: 4}
      - {code: "COMPLETED", name: "已完成", sort: 5}
      - {code: "CANCELLED", name: "已取消", sort: 6}
      - {code: "REFUNDED", name: "已退款", sort: 7}
  
  # 支付方式
  payment_method:
    table_name: "sys_dict"
    dict_code: "payment_method"
    items:
      - {code: "ALIPAY", name: "支付宝", sort: 1}
      - {code: "WECHAT", name: "微信支付", sort: 2}
      - {code: "UNIONPAY", name: "银联支付", sort: 3}
      - {code: "BALANCE", name: "余额支付", sort: 4}
  
  # 商品状态
  product_status:
    table_name: "sys_dict"
    dict_code: "product_status"
    items:
      - {code: "DRAFT", name: "草稿", sort: 1}
      - {code: "ACTIVE", name: "上架", sort: 2}
      - {code: "INACTIVE", name: "下架", sort: 3}
      - {code: "OUT_OF_STOCK", name: "缺货", sort: 4}

# =============================================================================
# 系统集成接口 (System Integration)
# =============================================================================
system_integration:
  # 第三方服务集成
  third_party_services:
    payment_gateway:
      - name: "支付宝开放平台"
        purpose: "在线支付处理"
        integration_type: "REST API"
      - name: "微信支付"
        purpose: "移动端支付"
        integration_type: "REST API"
    
    logistics_services:
      - name: "顺丰速运API"
        purpose: "快递服务集成"
        integration_type: "REST API"
      - name: "菜鸟物流"
        purpose: "物流跟踪服务"
        integration_type: "REST API"
    
    sms_services:
      - name: "阿里云短信服务"
        purpose: "验证码和通知短信"
        integration_type: "REST API"
  
  # 内部系统集成
  internal_systems:
    erp_system:
      name: "企业资源计划系统"
      purpose: "库存和财务数据同步"
      integration_type: "数据库直连/MQ"
    
    crm_system:
      name: "客户关系管理系统"
      purpose: "客户数据同步"
      integration_type: "REST API"

# =============================================================================
# 非功能性需求 (Non-Functional Requirements)
# =============================================================================
non_functional_requirements:
  # 性能要求
  performance:
    response_time:
      web_page: "≤ 2秒"
      api_response: "≤ 500ms"
      search_query: "≤ 1秒"
    
    throughput:
      concurrent_users: "≥ 1000"
      daily_orders: "≥ 10,000"
      peak_tps: "≥ 500"
  
  # 可用性要求
  availability:
    uptime: "99.9%"
    maintenance_window: "每月不超过4小时"
    disaster_recovery: "RTO ≤ 1小时, RPO ≤ 15分钟"
  
  # 安全性要求
  security:
    data_encryption: "传输加密(HTTPS) + 存储加密"
    authentication: "多因素认证"
    authorization: "基于角色的权限控制(RBAC)"
    audit_logging: "完整的操作日志记录"
    data_privacy: "符合GDPR和个人信息保护法"
  
  # 可扩展性要求
  scalability:
    horizontal_scaling: "支持水平扩展"
    database_sharding: "支持数据库分片"
    cdn_support: "静态资源CDN分发"
    load_balancing: "负载均衡支持"

# =============================================================================
# 文件组织结构说明 (File Organization Structure)
# =============================================================================
file_organization:
  structure_principle: |
    采用分层递进的文件组织结构:
    L0-system-base: 系统基础信息层，定义系统整体架构和基础信息
    L1-requirement-baseline: 需求基线层，建立完整的需求基线
    REQ-SUITE-xxx: 具体需求套件，按功能模块组织的详细需求
    
  directory_explanation:
    L0-system-base:
      purpose: "系统基础信息定义"
      content: "系统架构、技术栈、角色权限、数据字典等基础信息"
      files:
        - "ecommerce_system_base_info.yaml (本文件)"
        - "system_architecture.yaml"
        - "data_dictionary.yaml"
    
    L1-requirement-baseline:
      purpose: "需求基线建立"
      content: "整体需求概述、需求分解、需求优先级、验收标准"
      files:
        - "requirement_baseline.yaml"
        - "requirement_traceability_matrix.yaml"
        - "acceptance_criteria.yaml"
    
    REQ-SUITE-xxx:
      purpose: "具体功能需求套件"
      content: "详细的功能需求、用例设计、接口定义、测试用例"
      example_suites:
        - "REQ-SUITE-001-产品管理功能"
        - "REQ-SUITE-002-购物车管理功能"
        - "REQ-SUITE-003-订单支付功能"

# =============================================================================
# 版本控制和变更管理 (Version Control)
# =============================================================================
version_control:
  current_version: "1.0.0"
  version_history:
    - version: "1.0.0"
      date: "2025-07-31"
      changes: "初始版本创建，建立系统基础信息结构"
      author: "系统架构师"
  
  change_management:
    approval_required: true
    impact_assessment: "必须评估对下游需求套件的影响"
    notification_scope:
      - "项目经理"
      - "系统架构师"
      - "需求分析师"
      - "开发团队负责人"

# =============================================================================
# 文档关联关系 (Document Relationships)
# =============================================================================
document_relationships:
  upstream_documents:
    - "项目立项书"
    - "商业需求文档(BRD)"
    - "技术选型方案"
  
  downstream_documents:
    - "L1-requirement-baseline/requirement_baseline.yaml"
    - "REQ-SUITE-001-产品管理功能/*"
    - "REQ-SUITE-002-购物车管理功能/*"
    - "REQ-SUITE-003-订单支付功能/*"
  
  related_documents:
    - "系统部署手册"
    - "运维监控方案"
    - "安全防护方案"