# =============================================================================
# 架构概述 (Architecture Overview)
# =============================================================================
architecture_overview:
  architecture_principle: |
    采用基于JeecgBoot的分层架构模式，结合领域驱动设计(DDD)思想，
    构建高内聚、低耦合的产品管理架构体系。架构设计充分考虑需求分析中的
    15个EARS需求，确保每个需求都有对应的架构组件支撑。
  
  design_goals:
    maintainability: "高可维护性 - 清晰的分层结构和组件边界"
    scalability: "高可扩展性 - 支持水平扩展和功能扩展"
    performance: "高性能 - 多级缓存和异步处理"
    reliability: "高可靠性 - 完善的容错和恢复机制"
    security: "高安全性 - 多层次安全防护体系"
  
  architecture_constraints:
    technology_stack: "基于JeecgBoot 3.x技术栈"
    database: "MySQL 8.0为主，Redis为辅"
    deployment: "支持Docker容器化部署"
    performance_target: "支持万级商品，千级并发"
    codegen_ratio: "核心功能80%代码自动生成"

# =============================================================================
# 系统架构设计 (System Architecture Design)
# =============================================================================
system_architecture:
  # 总体架构图
  overall_architecture:
    architecture_pattern: "分层架构 + 领域驱动设计"
    layers:
      presentation_layer:
        name: "表现层"
        components:
          - "ProductController - 商品管理控制器"
          - "CategoryController - 分类管理控制器"
          - "InventoryController - 库存管理控制器"
          - "ProductBatchController - 批量操作控制器"
        responsibilities:
          - "接收HTTP请求并参数校验"
          - "调用业务服务层处理逻辑"
          - "返回统一格式的响应结果"
          - "处理异常和错误信息"
        framework_integration: "基于JeecgBoot Controller模板生成"
      
      application_layer:
        name: "应用服务层"
        components:
          - "ProductApplicationService - 商品应用服务"
          - "CategoryApplicationService - 分类应用服务"
          - "InventoryApplicationService - 库存应用服务"
          - "ProductWorkflowService - 商品工作流服务"
        responsibilities:
          - "协调领域服务完成复杂业务流程"
          - "处理事务边界和数据一致性"
          - "实现跨聚合根的业务操作"
          - "处理外部系统集成"
        framework_integration: "基于JeecgBoot Service模板，增加DDD应用服务"
      
      domain_layer:
        name: "领域服务层"
        components:
          - "ProductDomainService - 商品领域服务"
          - "CategoryDomainService - 分类领域服务"
          - "InventoryDomainService - 库存领域服务"
          - "ProductStatusManager - 商品状态管理器"
        responsibilities:
          - "封装核心业务逻辑和业务规则"
          - "处理领域对象之间的协作"
          - "维护业务不变量和约束条件"
          - "实现复杂的业务计算逻辑"
        framework_integration: "自定义领域服务，不依赖代码生成"
      
      infrastructure_layer:
        name: "基础设施层"
        components:
          - "ProductMapper - 商品数据访问"
          - "CategoryMapper - 分类数据访问"
          - "InventoryMapper - 库存数据访问"
          - "ProductSearchRepository - 商品搜索仓储"
          - "ProductCacheManager - 商品缓存管理"
        responsibilities:
          - "数据持久化和查询"
          - "外部系统集成"
          - "缓存管理和搜索服务"
          - "消息队列和事件发布"
        framework_integration: "基于JeecgBoot Mapper模板生成"

  # 模块划分
  module_division:
    product_management_module:
      module_name: "商品管理模块"
      module_code: "PRODUCT"
      responsibilities:
        - "商品基础信息CRUD操作"
        - "商品状态生命周期管理"
        - "商品信息完整性校验"
        - "商品搜索索引维护"
      components:
        entities:
          - "Product - 商品实体"
          - "ProductSpec - 商品规格实体"
          - "ProductImage - 商品图片实体"
        services:
          - "ProductService - 商品业务服务"
          - "ProductValidationService - 商品校验服务"
          - "ProductSearchService - 商品搜索服务"
        repositories:
          - "ProductRepository - 商品仓储接口"
          - "ProductMapper - 商品数据访问实现"
      requirements_mapping:
        - "REQ-UNCON-001: 商品CRUD操作"
        - "REQ-EVENT-001: 商品创建事件"
        - "REQ-EVENT-003: 商品状态变更事件"
        - "REQ-STATE-001~003: 商品状态管理"
        - "REQ-UBIQ-001: 数据一致性"
        - "REQ-UBIQ-002: 操作审计"
    
    category_management_module:
      module_name: "分类管理模块"
      module_code: "CATEGORY"
      responsibilities:
        - "商品分类层级结构管理"
        - "分类树形数据操作"
        - "分类关联商品处理"
        - "分类路径计算和维护"
      components:
        entities:
          - "Category - 分类实体"
          - "CategoryPath - 分类路径实体"
        services:
          - "CategoryService - 分类业务服务"
          - "CategoryTreeService - 分类树形服务"
        repositories:
          - "CategoryRepository - 分类仓储接口"
          - "CategoryMapper - 分类数据访问实现"
      requirements_mapping:
        - "REQ-UNCON-002: 层级分类管理"
        - "SCENARIO-BOUNDARY-002: 分类层级边界测试"
      codegen_applicability: "75% - 基于JeecgBoot树形组件生成"
    
    inventory_management_module:
      module_name: "库存管理模块"
      module_code: "INVENTORY"
      responsibilities:
        - "实时库存数量管理"
        - "库存变更历史记录"
        - "库存预警机制"
        - "批量库存调整处理"
      components:
        entities:
          - "Inventory - 库存实体"
          - "InventoryLog - 库存变更日志"
          - "InventoryAlert - 库存预警"
        services:
          - "InventoryService - 库存业务服务"
          - "InventoryAlertService - 库存预警服务"
          - "InventoryLogService - 库存日志服务"
        repositories:
          - "InventoryRepository - 库存仓储接口"
          - "InventoryMapper - 库存数据访问实现"
      requirements_mapping:
        - "REQ-UNCON-003: 实时库存管理"
        - "REQ-EVENT-002: 库存预警事件"
        - "SCENARIO-NORMAL-002: 批量库存调整"
      codegen_applicability: "60% - 基础CRUD + 自定义逻辑"
    
    batch_operation_module:
      module_name: "批量操作模块"
      module_code: "BATCH"
      responsibilities:
        - "商品批量导入导出"
        - "批量状态变更处理"
        - "批量操作结果统计"
        - "大数据量处理优化"
      components:
        services:
          - "BatchImportService - 批量导入服务"
          - "BatchExportService - 批量导出服务"
          - "BatchUpdateService - 批量更新服务"
        handlers:
          - "ExcelImportHandler - Excel导入处理器"
          - "BatchStatusHandler - 批量状态处理器"
      requirements_mapping:
        - "REQ-OPT-002: 数据导入校验"
        - "SCENARIO-BOUNDARY-001: 大批量数据处理"
        - "SCENARIO-BUSINESS-001: 季节性批量操作"
        - "SCENARIO-BUSINESS-002: 新供应商商品批量上架"
      codegen_applicability: "65% - 基于JeecgBoot导入导出功能"

# =============================================================================
# 数据架构设计 (Data Architecture Design)
# =============================================================================
data_architecture:
  # 数据库设计
  database_design:
    database_strategy: "主库写入，从库读取，缓存加速"
    sharding_strategy: "按商品ID范围分片，支持水平扩展"
    backup_strategy: "每日全量备份，实时增量备份"
    
    # 核心数据表设计
    tables:
      ecom_product:
        table_name: "ecom_product"
        table_comment: "商品信息表"
        engine: "InnoDB"
        charset: "utf8mb4"
        fields:
          - name: "id"
            type: "varchar(32)"
            not_null: true
            primary_key: true
            comment: "主键ID，使用UUID"
          - name: "product_code"
            type: "varchar(50)"
            not_null: true
            unique: true
            comment: "商品编码，格式PRD+8位数字"
          - name: "product_name"
            type: "varchar(200)"
            not_null: true
            comment: "商品名称"
          - name: "category_id"
            type: "varchar(32)"
            not_null: true
            comment: "分类ID，关联ecom_category表"
          - name: "brand_id"
            type: "varchar(32)"
            comment: "品牌ID，可为空"
          - name: "price"
            type: "decimal(10,2)"
            not_null: true
            comment: "商品价格"
          - name: "cost_price"
            type: "decimal(10,2)"
            comment: "成本价格"
          - name: "market_price"
            type: "decimal(10,2)"
            comment: "市场价格"
          - name: "stock_quantity"
            type: "int"
            default: 0
            comment: "库存数量"
          - name: "min_stock"
            type: "int"
            default: 0
            comment: "最小库存，预警阈值"
          - name: "status"
            type: "varchar(20)"
            default: "DRAFT"
            comment: "商品状态：DRAFT-草稿，ACTIVE-上架，INACTIVE-下架"
          - name: "main_image"
            type: "varchar(500)"
            comment: "主图URL"
          - name: "image_urls"
            type: "text"
            comment: "商品图片URLs，JSON格式存储"
          - name: "description"
            type: "text"
            comment: "商品描述"
          - name: "specifications"
            type: "text"
            comment: "商品规格，JSON格式存储"
          - name: "attributes"
            type: "text"
            comment: "商品属性，JSON格式存储"
          - name: "weight"
            type: "decimal(8,2)"
            comment: "商品重量(kg)"
          - name: "volume"
            type: "decimal(10,2)"
            comment: "商品体积(cm³)"
          - name: "sort_order"
            type: "int"
            default: 0
            comment: "排序号"
          - name: "is_deleted"
            type: "tinyint"
            default: 0
            comment: "逻辑删除标志"
          - name: "create_by"
            type: "varchar(50)"
            comment: "创建人"
          - name: "create_time"
            type: "datetime"
            comment: "创建时间"
          - name: "update_by"
            type: "varchar(50)"
            comment: "更新人"
          - name: "update_time"
            type: "datetime"
            comment: "更新时间"
        indexes:
          - name: "idx_product_code"
            columns: ["product_code"]
            unique: true
          - name: "idx_category_id"
            columns: ["category_id"]
          - name: "idx_status"
            columns: ["status"]
          - name: "idx_create_time"
            columns: ["create_time"]
          - name: "idx_name_status"
            columns: ["product_name", "status"]
        requirements_support:
          - "REQ-UNCON-001: 支持商品CRUD操作"
          - "REQ-EVENT-001: 支持商品编码自动生成"
          - "REQ-STATE-001~003: 支持商品状态管理"
          - "REQ-UBIQ-001: 通过事务保证数据一致性"
      
      ecom_category:
        table_name: "ecom_category"
        table_comment: "商品分类表"
        engine: "InnoDB"
        charset: "utf8mb4"
        fields:
          - name: "id"
            type: "varchar(32)"
            not_null: true
            primary_key: true
            comment: "主键ID"
          - name: "category_name"
            type: "varchar(100)"
            not_null: true
            comment: "分类名称"
          - name: "category_code"
            type: "varchar(50)"
            comment: "分类编码"
          - name: "parent_id"
            type: "varchar(32)"
            comment: "父分类ID，顶级分类为空"
          - name: "level"
            type: "int"
            default: 1
            comment: "分类层级，从1开始"
          - name: "path"
            type: "varchar(500)"
            comment: "分类路径，如/1/2/3"
          - name: "sort_order"
            type: "int"
            default: 0
            comment: "排序号"
          - name: "is_leaf"
            type: "tinyint"
            default: 1
            comment: "是否叶子节点：1-是，0-否"
          - name: "icon"
            type: "varchar(100)"
            comment: "分类图标"
          - name: "description"
            type: "varchar(500)"
            comment: "分类描述"
          - name: "is_deleted"
            type: "tinyint"
            default: 0
            comment: "逻辑删除标志"
          - name: "create_by"
            type: "varchar(50)"
            comment: "创建人"
          - name: "create_time"
            type: "datetime"
            comment: "创建时间"
          - name: "update_by"
            type: "varchar(50)"
            comment: "更新人"
          - name: "update_time"
            type: "datetime"
            comment: "更新时间"
        indexes:
          - name: "idx_parent_id"
            columns: ["parent_id"]
          - name: "idx_level"
            columns: ["level"]
          - name: "idx_path"
            columns: ["path"]
          - name: "idx_sort_order"
            columns: ["sort_order"]
        requirements_support:
          - "REQ-UNCON-002: 支持层级分类管理"
          - "SCENARIO-BOUNDARY-002: 支持深层分类结构"
      
      ecom_inventory_log:
        table_name: "ecom_inventory_log"
        table_comment: "库存变更日志表"
        engine: "InnoDB"
        charset: "utf8mb4"
        fields:
          - name: "id"
            type: "varchar(32)"
            not_null: true
            primary_key: true
            comment: "主键ID"
          - name: "product_id"
            type: "varchar(32)"
            not_null: true
            comment: "商品ID"
          - name: "change_type"
            type: "varchar(20)"
            not_null: true
            comment: "变更类型：IN-入库，OUT-出库，ADJUST-调整"
          - name: "change_quantity"
            type: "int"
            not_null: true
            comment: "变更数量，正数为增加，负数为减少"
          - name: "before_quantity"
            type: "int"
            not_null: true
            comment: "变更前数量"
          - name: "after_quantity"
            type: "int"
            not_null: true
            comment: "变更后数量"
          - name: "reason"
            type: "varchar(200)"
            comment: "变更原因"
          - name: "reference_no"
            type: "varchar(50)"
            comment: "关联单据号"
          - name: "operator"
            type: "varchar(50)"
            comment: "操作人"
          - name: "create_time"
            type: "datetime"
            comment: "创建时间"
        indexes:
          - name: "idx_product_id"
            columns: ["product_id"]
          - name: "idx_change_type"
            columns: ["change_type"]
          - name: "idx_create_time"
            columns: ["create_time"]
          - name: "idx_product_time"
            columns: ["product_id", "create_time"]
        requirements_support:
          - "REQ-UNCON-003: 支持库存历史记录"
          - "REQ-UBIQ-002: 满足操作审计要求"
      
      ecom_product_spec:
        table_name: "ecom_product_spec"
        table_comment: "商品规格表"
        engine: "InnoDB"
        charset: "utf8mb4"
        fields:
          - name: "id"
            type: "varchar(32)"
            not_null: true
            primary_key: true
            comment: "主键ID"
          - name: "product_id"
            type: "varchar(32)"
            not_null: true
            comment: "商品ID"
          - name: "spec_name"
            type: "varchar(100)"
            not_null: true
            comment: "规格名称，如颜色、尺寸"
          - name: "spec_value"
            type: "varchar(100)"
            not_null: true
            comment: "规格值，如红色、XL"
          - name: "spec_image"
            type: "varchar(500)"
            comment: "规格图片URL"
          - name: "sort_order"
            type: "int"
            default: 0
            comment: "排序号"
        indexes:
          - name: "idx_product_id"
            columns: ["product_id"]
          - name: "idx_spec_name"
            columns: ["spec_name"]
        requirements_support:
          - "支持商品多规格管理"
          - "支持规格图片展示"

  # 缓存架构设计
  cache_architecture:
    cache_strategy: "多级缓存 + 缓存预热 + 失效策略"
    cache_levels:
      level_1_local_cache:
        cache_type: "Caffeine本地缓存"
        cache_scope: "应用内存缓存"
        cache_content:
          - "热点商品信息"
          - "分类树形结构"
          - "字典数据"
        cache_size: "10000条记录"
        ttl: "30分钟"
        refresh_strategy: "异步刷新"
      
      level_2_distributed_cache:
        cache_type: "Redis分布式缓存"
        cache_scope: "跨应用共享缓存"
        cache_content:
          - "商品详情信息"
          - "商品列表数据"
          - "库存实时数据"
          - "搜索结果缓存"
        cache_structure:
          product_detail: "product:detail:{productId}"
          product_list: "product:list:{categoryId}:{page}:{size}"
          inventory_data: "inventory:{productId}"
          search_result: "search:{keyword}:{filters}:{page}"
        ttl_strategy:
          product_detail: "2小时"
          product_list: "30分钟"
          inventory_data: "10分钟"
          search_result: "20分钟"
        invalidation_strategy:
          - "商品信息变更时清除相关缓存"
          - "库存变更时更新库存缓存"
          - "分类变更时清除分类树缓存"
    
    cache_consistency:
      consistency_model: "最终一致性"
      update_strategy: "写入数据库成功后异步更新缓存"
      conflict_resolution: "以数据库数据为准，缓存失效重建"
      monitoring: "缓存命中率、失效频率、更新延迟监控"

  # 搜索架构设计
  search_architecture:
    search_engine: "Elasticsearch 7.x"
    index_strategy: "按商品状态和分类分索引"
    
    indexes:
      product_active_index:
        index_name: "ecom_product_active"
        description: "上架商品搜索索引"
        mapping:
          properties:
            productId: {type: "keyword"}
            productCode: {type: "keyword"}
            productName: {type: "text", analyzer: "ik_max_word"}
            categoryId: {type: "keyword"}
            categoryPath: {type: "keyword"}
            categoryName: {type: "text"}
            price: {type: "double"}
            stockQuantity: {type: "integer"}
            status: {type: "keyword"}
            mainImage: {type: "keyword"}
            description: {type: "text", analyzer: "ik_max_word"}
            specifications: {type: "object"}
            attributes: {type: "object"}
            createTime: {type: "date"}
            updateTime: {type: "date"}
        sharding: "按分类ID分片"
        replica: "2个副本"
      
      product_all_index:
        index_name: "ecom_product_all"
        description: "全量商品搜索索引（管理端使用）"
        mapping: "与product_active_index相同"
        include_status: ["DRAFT", "ACTIVE", "INACTIVE"]
    
    sync_strategy:
      real_time_sync: "基于消息队列的实时同步"
      batch_sync: "每日全量同步校验"
      conflict_resolution: "以数据库为准，重建索引"
    
    search_features:
      full_text_search: "商品名称和描述全文搜索"
      faceted_search: "按分类、价格、品牌等维度筛选"
      auto_complete: "搜索关键词自动补全"
      relevance_scoring: "基于销量、评分的相关性排序"
      search_analytics: "搜索行为分析和优化"

# =============================================================================
# 应用架构设计 (Application Architecture Design)
# =============================================================================
application_architecture:
  # 服务架构设计
  service_architecture:
    architecture_pattern: "分层服务架构 + 领域驱动设计"
    service_layers:
      controller_layer:
        description: "控制器层，处理HTTP请求"
        components:
          ProductController:
            path: "/api/product"
            responsibilities:
              - "商品CRUD操作接口"
              - "商品状态变更接口"
              - "商品搜索查询接口"
              - "商品批量操作接口"
            endpoints:
              - "POST /api/product - 创建商品"
              - "GET /api/product/{id} - 获取商品详情"
              - "PUT /api/product/{id} - 更新商品信息"
              - "DELETE /api/product/{id} - 删除商品"
              - "GET /api/product/list - 商品列表查询"
              - "POST /api/product/batch - 批量操作"
            requirements_mapping:
              - "REQ-UNCON-001: 商品CRUD接口"
              - "REQ-STATE-001~003: 商品状态管理接口"
            codegen_applicable: true
            codegen_template: "jeecg-boot-controller.ftl"
          
          CategoryController:
            path: "/api/category"
            responsibilities:
              - "分类树形结构接口"
              - "分类CRUD操作接口"
              - "分类拖拽排序接口"
            endpoints:
              - "GET /api/category/tree - 获取分类树"
              - "POST /api/category - 创建分类"
              - "PUT /api/category/{id} - 更新分类"
              - "DELETE /api/category/{id} - 删除分类"
              - "POST /api/category/sort - 分类排序"
            requirements_mapping:
              - "REQ-UNCON-002: 分类管理接口"
            codegen_applicable: true
            codegen_template: "jeecg-boot-tree-controller.ftl"
          
          InventoryController:
            path: "/api/inventory"
            responsibilities:
              - "库存查询和调整接口"
              - "库存变更历史接口"
              - "库存预警管理接口"
            endpoints:
              - "GET /api/inventory/{productId} - 获取商品库存"
              - "POST /api/inventory/adjust - 库存调整"
              - "POST /api/inventory/batch-adjust - 批量库存调整"
              - "GET /api/inventory/log - 库存变更历史"
              - "GET /api/inventory/alert - 库存预警列表"
            requirements_mapping:
              - "REQ-UNCON-003: 库存管理接口"
              - "REQ-EVENT-002: 库存预警接口"
            codegen_applicable: false
            custom_development: "需要自定义库存逻辑"
      
      service_layer:
        description: "服务层，封装业务逻辑"
        components:
          ProductService:
            responsibilities:
              - "商品业务逻辑处理"
              - "商品信息校验"
              - "商品状态流转控制"
              - "商品搜索索引维护"
            methods:
              - "createProduct(ProductDTO) - 创建商品"
              - "updateProduct(String id, ProductDTO) - 更新商品"
              - "deleteProduct(String id) - 删除商品"
              - "getProductById(String id) - 获取商品详情"
              - "queryProducts(ProductQueryDTO) - 查询商品列表"
              - "changeProductStatus(String id, String status) - 变更商品状态"
              - "batchUpdateProducts(List<ProductUpdateDTO>) - 批量更新商品"
            business_rules:
              - "商品编码唯一性校验"
              - "商品信息完整性校验"
              - "商品状态变更规则校验"
              - "商品删除前置条件检查"
            requirements_mapping:
              - "REQ-UNCON-001: 商品CRUD业务逻辑"
              - "REQ-EVENT-001: 商品创建业务规则"
              - "REQ-EVENT-003: 商品状态变更业务规则"
            codegen_applicable: true
            codegen_template: "jeecg-boot-service.ftl"
            custom_additions:
              - "状态变更业务规则"
              - "搜索索引同步逻辑"
              - "缓存更新逻辑"
          
          CategoryService:
            responsibilities:
              - "分类树形结构管理"
              - "分类层级关系维护"
              - "分类关联商品处理"
            methods:
              - "createCategory(CategoryDTO) - 创建分类"
              - "updateCategory(String id, CategoryDTO) - 更新分类"
              - "deleteCategory(String id) - 删除分类"
              - "getCategoryTree() - 获取分类树"
              - "sortCategories(List<CategorySortDTO>) - 分类排序"
              - "getCategoryPath(String id) - 获取分类路径"
            business_rules:
              - "分类删除前检查子分类和关联商品"
              - "分类层级深度限制检查"
              - "分类路径自动计算和更新"
            requirements_mapping:
              - "REQ-UNCON-002: 分类管理业务逻辑"
            codegen_applicable: true
            codegen_template: "jeecg-boot-tree-service.ftl"
          
          InventoryService:
            responsibilities:
              - "库存实时管理"
              - "库存变更记录"
              - "库存预警处理"
            methods:
              - "adjustInventory(String productId, int quantity, String reason) - 库存调整"
              - "batchAdjustInventory(List<InventoryAdjustDTO>) - 批量库存调整"
              - "getInventoryByProductId(String productId) - 获取商品库存"
              - "getInventoryLog(String productId) - 获取库存变更历史"
              - "checkLowStockAlert() - 检查库存预警"
            business_rules:
              - "库存数量不能为负数"
              - "库存变更必须记录操作日志"
              - "库存低于安全阈值触发预警"
            requirements_mapping:
              - "REQ-UNCON-003: 库存管理业务逻辑"
              - "REQ-EVENT-002: 库存预警业务逻辑"
            codegen_applicable: false
            custom_development: "需要自定义库存管理逻辑"
      
      repository_layer:
        description: "数据访问层，封装数据操作"
        components:
          ProductMapper:
            responsibilities:
              - "商品数据CRUD操作"
              - "商品列表分页查询"
              - "商品状态批量更新"
            methods:
              - "insert(Product) - 插入商品"
              - "selectById(String id) - 根据ID查询商品"
              - "updateById(Product) - 根据ID更新商品"
              - "deleteById(String id) - 根据ID删除商品"
              - "selectPage(ProductQueryDTO) - 分页查询商品"
              - "batchUpdateStatus(List<String> ids, String status) - 批量更新状态"
            codegen_applicable: true
            codegen_template: "jeecg-boot-mapper.ftl"
          
          CategoryMapper:
            responsibilities:
              - "分类数据CRUD操作"
              - "分类树形结构查询"
              - "分类层级关系维护"
            methods:
              - "insert(Category) - 插入分类"
              - "selectById(String id) - 根据ID查询分类"
              - "updateById(Category) - 根据ID更新分类"
              - "deleteById(String id) - 根据ID删除分类"
              - "selectTreeList() - 查询分类树形列表"
              - "selectByParentId(String parentId) - 查询子分类"
            codegen_applicable: true
            codegen_template: "jeecg-boot-tree-mapper.ftl"
          
          InventoryLogMapper:
            responsibilities:
              - "库存变更日志数据操作"
              - "库存历史记录查询"
            methods:
              - "insert(InventoryLog) - 插入库存日志"
              - "selectByProductId(String productId) - 根据商品ID查询日志"
              - "selectPage(InventoryLogQueryDTO) - 分页查询库存日志"
            codegen_applicable: true
            codegen_template: "jeecg-boot-mapper.ftl"

  # 事件驱动架构
  event_driven_architecture:
    event_bus: "Spring Event + RocketMQ"
    
    domain_events:
      ProductCreatedEvent:
        description: "商品创建事件"
        payload:
          - "productId - 商品ID"
          - "productCode - 商品编码"
          - "categoryId - 分类ID"
          - "createTime - 创建时间"
        handlers:
          - "ProductSearchIndexHandler - 更新搜索索引"
          - "ProductCacheHandler - 清除相关缓存"
        requirements_mapping:
          - "REQ-EVENT-001: 商品创建事件处理"
      
      ProductStatusChangedEvent:
        description: "商品状态变更事件"
        payload:
          - "productId - 商品ID"
          - "oldStatus - 原状态"
          - "newStatus - 新状态"
          - "changeTime - 变更时间"
        handlers:
          - "ProductSearchIndexHandler - 更新搜索索引"
          - "ProductCacheHandler - 清除相关缓存"
          - "ProductValidationHandler - 执行状态变更校验"
        requirements_mapping:
          - "REQ-EVENT-003: 商品状态变更事件处理"
      
      InventoryChangedEvent:
        description: "库存变更事件"
        payload:
          - "productId - 商品ID"
          - "oldQuantity - 原库存数量"
          - "newQuantity - 新库存数量"
          - "changeType - 变更类型"
          - "changeTime - 变更时间"
        handlers:
          - "InventoryAlertHandler - 库存预警检查"
          - "InventoryLogHandler - 记录库存日志"
          - "InventoryCacheHandler - 更新库存缓存"
        requirements_mapping:
          - "REQ-EVENT-002: 库存预警事件处理"
      
      LowStockAlertEvent:
        description: "库存预警事件"
        payload:
          - "productId - 商品ID"
          - "productName - 商品名称"
          - "currentQuantity - 当前库存"
          - "minStock - 最小库存"
          - "alertTime - 预警时间"
        handlers:
          - "NotificationHandler - 发送预警通知"
          - "AlertLogHandler - 记录预警日志"
        requirements_mapping:
          - "REQ-EVENT-002: 库存预警通知处理"

  # 工作流架构
  workflow_architecture:
    workflow_engine: "自定义状态机 + Flowable"
    
    product_status_workflow:
      description: "商品状态流转工作流"
      states:
        DRAFT:
          description: "草稿状态"
          allowed_transitions: ["ACTIVE"]
          business_rules:
            - "草稿状态可以编辑所有字段"
            - "草稿状态不在前台显示"
          requirements_mapping:
            - "REQ-STATE-001: 草稿状态处理"
        
        ACTIVE:
          description: "上架状态"
          allowed_transitions: ["INACTIVE"]
          business_rules:
            - "上架前必须校验信息完整性"
            - "上架状态在前台显示"
            - "上架状态可以购买"
          requirements_mapping:
            - "REQ-STATE-002: 上架状态处理"
        
        INACTIVE:
          description: "下架状态"
          allowed_transitions: ["ACTIVE"]
          business_rules:
            - "下架状态不在前台显示"
            - "下架状态不能购买"
            - "保留商品信息和历史数据"
          requirements_mapping:
            - "REQ-STATE-003: 下架状态处理"
      
      transitions:
        DRAFT_TO_ACTIVE:
          description: "草稿到上架"
          preconditions:
            - "商品名称不为空"
            - "商品价格大于0"
            - "商品分类已选择"
            - "商品主图已上传"
          actions:
            - "校验商品信息完整性"
            - "更新搜索索引"
            - "清除相关缓存"
            - "发布商品上架事件"
        
        ACTIVE_TO_INACTIVE:
          description: "上架到下架"
          preconditions:
            - "商品当前状态为上架"
          actions:
            - "更新搜索索引"
            - "清除相关缓存"
            - "发布商品下架事件"
        
        INACTIVE_TO_ACTIVE:
          description: "下架到上架"
          preconditions:
            - "商品信息完整性校验通过"
          actions:
            - "更新搜索索引"
            - "清除相关缓存"
            - "发布商品重新上架事件"

# =============================================================================
# 技术架构设计 (Technical Architecture Design)
# =============================================================================
technical_architecture:
  # JeecgBoot集成架构
  jeecg_boot_integration:
    framework_version: "JeecgBoot 3.5.0+"
    integration_strategy: "深度集成，最大化利用框架特性"
    
    code_generation:
      generation_ratio: "80%"
      applicable_components:
        highly_applicable:
          - "Entity实体类 - 100%自动生成"
          - "Mapper数据访问 - 100%自动生成"
          - "基础Service - 80%自动生成"
          - "基础Controller - 80%自动生成"
          - "前端CRUD页面 - 70%自动生成"
        moderately_applicable:
          - "复杂Service逻辑 - 60%自动生成"
          - "树形组件处理 - 75%自动生成"
          - "导入导出功能 - 65%自动生成"
        not_applicable:
          - "事件处理逻辑 - 需要自定义开发"
          - "工作流逻辑 - 需要自定义开发"
          - "搜索集成 - 需要自定义开发"
      
      template_customization:
        entity_template: "jeecg-boot-entity.ftl"
        controller_template: "jeecg-boot-controller.ftl"
        service_template: "jeecg-boot-service.ftl"
        mapper_template: "jeecg-boot-mapper.ftl"
        vue_template: "jeecg-boot-vue.ftl"
        custom_templates:
          - "product-management.ftl - 商品管理专用模板"
          - "tree-category.ftl - 分类树形管理模板"
          - "inventory-management.ftl - 库存管理模板"
    
    framework_features:
      security_integration:
        feature: "Spring Security + JWT"
        usage: "基于角色的权限控制"
        configuration:
          - "商品管理员角色权限配置"
          - "API接口权限控制"
          - "前端菜单权限控制"
        requirements_mapping:
          - "支持多角色权限管理"
          - "满足安全性需求"
      
      cache_integration:
        feature: "Redis集成"
        usage: "多级缓存架构"
        configuration:
          - "商品信息缓存配置"
          - "分类树缓存配置"
          - "库存数据缓存配置"
        cache_annotations:
          - "@Cacheable - 缓存查询结果"
          - "@CacheEvict - 清除缓存"
          - "@CachePut - 更新缓存"
      
      validation_integration:
        feature: "@Valid + 自定义校验器"
        usage: "多层次数据校验"
        validators:
          - "ProductCodeValidator - 商品编码校验"
          - "CategoryPathValidator - 分类路径校验"
          - "InventoryQuantityValidator - 库存数量校验"
        requirements_mapping:
          - "REQ-UBIQ-001: 数据一致性校验"
          - "商品信息完整性校验"
      
      audit_integration:
        feature: "@CreatedBy + @LastModifiedBy"
        usage: "自动审计字段填充"
        configuration:
          - "创建时间、创建人自动填充"
          - "更新时间、更新人自动填充"
        requirements_mapping:
          - "REQ-UBIQ-002: 操作审计日志"
      
      tree_structure_support:
        feature: "树形数据结构支持"
        usage: "分类层级管理"
        components:
          - "TreeTable组件"
          - "TreeSelect组件"
          - "TreeUtil工具类"
        requirements_mapping:
          - "REQ-UNCON-002: 层级分类管理"
      
      import_export_support:
        feature: "Excel导入导出"
        usage: "批量商品数据处理"
        annotations:
          - "@Excel - 标记导出字段"
          - "@ExcelCollection - 标记集合字段"
        templates:
          - "商品信息导入模板"
          - "库存调整导入模板"
        requirements_mapping:
          - "REQ-OPT-002: 数据导入校验"
          - "SCENARIO-BOUNDARY-001: 大批量数据处理"

  # 微服务架构设计
  microservice_architecture:
    architecture_approach: "单体架构优先，微服务演进"
    current_phase: "单体架构阶段"
    future_evolution: "基于业务边界拆分微服务"
    
    service_decomposition_plan:
      product_service:
        description: "商品管理服务"
        boundaries:
          - "商品信息管理"
          - "商品状态管理"
          - "商品搜索服务"
        data_ownership:
          - "ecom_product表"
          - "ecom_product_spec表"
        apis:
          - "商品CRUD API"
          - "商品搜索API"
          - "商品状态管理API"
      
      category_service:
        description: "分类管理服务"
        boundaries:
          - "分类层级管理"
          - "分类树形操作"
        data_ownership:
          - "ecom_category表"
        apis:
          - "分类树形API"
          - "分类CRUD API"
      
      inventory_service:
        description: "库存管理服务"
        boundaries:
          - "库存实时管理"
          - "库存预警服务"
          - "库存日志服务"
        data_ownership:
          - "ecom_inventory_log表"
        apis:
          - "库存查询API"
          - "库存调整API"
          - "库存预警API"
    
    service_communication:
      internal_communication: "同步HTTP调用"
      external_communication: "异步消息队列"
      service_discovery: "Nacos服务注册与发现"
      load_balancing: "Ribbon客户端负载均衡"
      circuit_breaker: "Hystrix熔断器"

  # 部署架构设计
  deployment_architecture:
    deployment_strategy: "Docker容器化 + Kubernetes编排"
    
    containerization:
      base_image: "openjdk:8-jre-alpine"
      application_image: "jeecg-boot-product-management:latest"
      image_optimization:
        - "多阶段构建减少镜像大小"
        - "使用.dockerignore忽略不必要文件"
        - "镜像分层优化"
      
      container_configuration:
        resources:
          cpu_limit: "2000m"
          cpu_request: "500m"
          memory_limit: "2Gi"
          memory_request: "1Gi"
        health_check:
          readiness_probe: "/actuator/health"
          liveness_probe: "/actuator/health"
          initial_delay: "30s"
          period: "10s"
    
    kubernetes_deployment:
      namespace: "ecommerce-system"
      deployment_replicas: 3
      service_type: "ClusterIP"
      ingress_configuration:
        host: "product-api.ecommerce.local"
        path: "/api/product"
        ssl_enabled: true
      
      config_management:
        config_map: "product-management-config"
        secret: "product-management-secret"
        environment_variables:
          - "SPRING_PROFILES_ACTIVE=prod"
          - "MYSQL_HOST=mysql.ecommerce.svc.cluster.local"
          - "REDIS_HOST=redis.ecommerce.svc.cluster.local"
          - "ELASTICSEARCH_HOST=elasticsearch.ecommerce.svc.cluster.local"
    
    environment_configuration:
      development:
        database: "MySQL单实例"
        cache: "Redis单实例"
        search: "Elasticsearch单节点"
        replica_count: 1
      
      testing:
        database: "MySQL主从"
        cache: "Redis Sentinel"
        search: "Elasticsearch 3节点集群"
        replica_count: 2
      
      production:
        database: "MySQL集群 + 读写分离"
        cache: "Redis Cluster"
        search: "Elasticsearch 5节点集群"
        replica_count: 3
        auto_scaling: "基于CPU和内存使用率"

# =============================================================================
# 安全架构设计 (Security Architecture Design)
# =============================================================================
security_architecture:
  # 认证授权架构
  authentication_authorization:
    authentication_mechanism: "JWT Token + Spring Security"
    authorization_model: "RBAC (基于角色的访问控制)"
    
    role_definitions:
      product_manager:
        role_name: "商品管理员"
        role_code: "PRODUCT_MANAGER"
        permissions:
          - "product:create - 创建商品"
          - "product:read - 查看商品"
          - "product:update - 更新商品"
          - "product:delete - 删除商品"
          - "product:status - 商品状态管理"
          - "category:manage - 分类管理"
        requirements_mapping:
          - "支持商品管理员角色权限控制"
      
      inventory_manager:
        role_name: "库存管理员"
        role_code: "INVENTORY_MANAGER"
        permissions:
          - "product:read - 查看商品"
          - "inventory:read - 查看库存"
          - "inventory:adjust - 库存调整"
          - "inventory:log - 库存日志查看"
          - "inventory:alert - 库存预警管理"
        requirements_mapping:
          - "支持库存管理员角色权限控制"
      
      system_admin:
        role_name: "系统管理员"
        role_code: "SYSTEM_ADMIN"
        permissions:
          - "所有商品管理权限"
          - "所有库存管理权限"
          - "系统配置管理权限"
          - "用户权限管理权限"
        requirements_mapping:
          - "支持系统管理员最高权限"
    
    token_management:
      token_type: "JWT Bearer Token"
      token_expiration: "2小时"
      refresh_token_expiration: "7天"
      token_storage: "Redis集中存储"
      token_validation: "每次请求验证"
  
  # 数据安全架构
  data_security:
    data_encryption:
      transport_encryption: "HTTPS/TLS 1.3"
      database_encryption: "MySQL透明数据加密(TDE)"
      sensitive_field_encryption: "AES-256对称加密"
      key_management: "阿里云KMS密钥管理"
    
    data_masking:
      sensitive_data_fields:
        - "商品成本价格 - 脱敏显示"
        - "供应商信息 - 部分脱敏"
      masking_rules:
        - "价格字段：保留整数部分，小数部分用*替代"
        - "联系方式：中间数字用*替代"
    
    data_access_control:
      database_access: "应用专用数据库账号"
      connection_encryption: "SSL连接"
      access_logging: "数据库访问日志记录"
      privilege_principle: "最小权限原则"
  
  # 接口安全架构
  api_security:
    api_authentication: "Bearer Token验证"
    api_authorization: "方法级权限控制"
    rate_limiting: "基于用户的接口限流"
    input_validation: "严格的输入参数校验"
    
    security_headers:
      - "X-Content-Type-Options: nosniff"
      - "X-Frame-Options: DENY"
      - "X-XSS-Protection: 1; mode=block"
      - "Strict-Transport-Security: max-age=31536000"
    
    api_security_policies:
      sql_injection_prevention: "参数化查询 + ORM框架"
      xss_prevention: "输入转义 + 输出编码"
      csrf_prevention: "CSRF Token验证"
      file_upload_security: "文件类型检查 + 病毒扫描"

# =============================================================================
# 监控架构设计 (Monitoring Architecture Design)
# =============================================================================
monitoring_architecture:
  # 应用监控
  application_monitoring:
    monitoring_framework: "Spring Boot Actuator + Micrometer"
    metrics_collection: "Prometheus"
    metrics_visualization: "Grafana"
    
    key_metrics:
      business_metrics:
        - "商品创建数量/小时"
        - "商品状态变更频率"
        - "库存调整操作频率"
        - "商品搜索查询QPS"
        - "缓存命中率"
      
      technical_metrics:
        - "API响应时间分布"
        - "数据库连接池使用率"
        - "JVM内存使用情况"
        - "垃圾回收频率和耗时"
        - "线程池使用情况"
      
      error_metrics:
        - "API错误率"
        - "数据库操作失败率"
        - "缓存操作失败率"
        - "搜索索引同步失败率"
    
    alerting_rules:
      critical_alerts:
        - "API错误率 > 5% 持续5分钟"
        - "数据库连接池使用率 > 90%"
        - "JVM内存使用率 > 85%"
        - "磁盘使用率 > 90%"
      
      warning_alerts:
        - "API响应时间 > 2秒 持续10分钟"
        - "缓存命中率 < 80% 持续15分钟"
        - "搜索索引同步延迟 > 5分钟"
  
  # 业务监控
  business_monitoring:
    monitoring_dimensions:
      product_operations:
        - "商品创建成功率"
        - "商品信息完整率"
        - "商品状态变更成功率"
        - "商品搜索响应时间"
      
      inventory_operations:
        - "库存调整成功率"
        - "库存预警触发频率"
        - "库存数据一致性检查"
      
      user_behavior:
        - "管理员操作频率分析"
        - "功能使用率统计"
        - "操作错误率分析"
    
    business_dashboards:
      product_management_dashboard:
        - "商品数量趋势图"
        - "商品状态分布饼图"
        - "商品操作热力图"
        - "商品搜索关键词TOP10"
      
      inventory_management_dashboard:
        - "库存变更趋势图"
        - "库存预警分布图"
        - "库存周转率分析"
        - "库存异常操作统计"
  
  # 日志监控
  log_monitoring:
    log_collection: "ELK Stack (Elasticsearch + Logstash + Kibana)"
    log_levels:
      - "ERROR - 错误日志，需要立即处理"
      - "WARN - 警告日志，需要关注"
      - "INFO - 信息日志，业务操作记录"
      - "DEBUG - 调试日志，开发阶段使用"
    
    log_categories:
      business_logs:
        - "商品创建日志"
        - "商品状态变更日志"
        - "库存调整日志"
        - "用户操作日志"
      
      technical_logs:
        - "API请求响应日志"
        - "数据库操作日志"
        - "缓存操作日志"
        - "搜索索引同步日志"
      
      security_logs:
        - "用户登录日志"
        - "权限验证日志"
        - "异常访问日志"
        - "数据变更审计日志"
    
    log_analysis:
      real_time_analysis: "基于Kibana的实时日志分析"
      pattern_detection: "异常模式自动检测"
      alert_integration: "与监控告警系统集成"

# =============================================================================
# 性能架构设计 (Performance Architecture Design)
# =============================================================================
performance_architecture:
  # 性能目标
  performance_targets:
    response_time:
      api_response: "95%请求 < 500ms，99%请求 < 2s"
      page_load: "首页加载时间 < 2s"
      search_query: "商品搜索响应时间 < 1s"
    
    throughput:
      concurrent_users: "支持1000并发用户"
      api_qps: "峰值QPS 500"
      database_tps: "数据库TPS 1000"
    
    scalability:
      horizontal_scaling: "支持水平扩展到10个实例"
      data_scaling: "支持百万级商品数据"
      user_scaling: "支持万级用户同时在线"
  
  # 性能优化策略
  performance_optimization:
    database_optimization:
      index_strategy:
        - "商品表主键索引 (id)"
        - "商品编码唯一索引 (product_code)"
        - "分类ID索引 (category_id)"
        - "商品状态索引 (status)"
        - "创建时间索引 (create_time)"
        - "组合索引 (product_name, status)"
      
      query_optimization:
        - "避免SELECT *，只查询需要的字段"
        - "使用分页查询避免大结果集"
        - "优化JOIN查询，避免笛卡尔积"
        - "使用EXISTS替代IN子查询"
      
      connection_pool:
        - "HikariCP连接池"
        - "最小连接数: 10"
        - "最大连接数: 50"
        - "连接超时时间: 30s"
        - "空闲连接回收时间: 10分钟"
    
    cache_optimization:
      cache_strategy: "多级缓存 + 预热 + 更新策略"
      
      local_cache:
        - "热点商品信息缓存"
        - "分类树结构缓存"
        - "字典数据缓存"
        - "缓存大小: 10000条"
        - "TTL: 30分钟"
      
      distributed_cache:
        - "商品详情缓存 (2小时TTL)"
        - "商品列表缓存 (30分钟TTL)"
        - "库存数据缓存 (10分钟TTL)"
        - "搜索结果缓存 (20分钟TTL)"
      
      cache_warming:
        - "系统启动时预热热点数据"
        - "定时任务更新缓存"
        - "基于访问频率的智能预热"
    
    search_optimization:
      elasticsearch_tuning:
        - "索引分片策略: 按分类分片"
        - "副本策略: 2个副本保证高可用"
        - "刷新间隔: 30秒"
        - "合并策略: 优化大段合并"
      
      query_optimization:
        - "使用filter查询替代query查询"
        - "合理使用聚合查询"
        - "避免深度分页"
        - "使用scroll API处理大结果集"
    
    jvm_optimization:
      heap_configuration:
        - "初始堆大小: -Xms1g"
        - "最大堆大小: -Xmx2g"
        - "新生代比例: -XX:NewRatio=3"
        - "存活区比例: -XX:SurvivorRatio=8"
      
      gc_configuration:
        - "垃圾收集器: G1GC"
        - "GC参数: -XX:+UseG1GC"
        - "最大GC停顿时间: -XX:MaxGCPauseMillis=200"
        - "GC日志: -Xloggc:gc.log"
      
      performance_tuning:
        - "编译器优化: -server"
        - "内存映射: -XX:+UseFastAccessorMethods"
        - "字符串优化: -XX:+OptimizeStringConcat"

# =============================================================================
# 质量属性架构 (Quality Attributes Architecture)
# =============================================================================
quality_attributes_architecture:
  # 可用性架构
  availability_architecture:
    availability_target: "99.9% (年停机时间不超过8.76小时)"
    
    high_availability_design:
      redundancy:
        - "应用服务器多实例部署"
        - "数据库主从复制"
        - "缓存集群部署"
        - "负载均衡器双机热备"
      
      fault_tolerance:
        - "服务降级策略"
        - "熔断器机制"
        - "超时重试机制"
        - "数据备份策略"
      
      disaster_recovery:
        - "RTO (恢复时间目标): 1小时"
        - "RPO (恢复点目标): 15分钟"
        - "异地备份策略"
        - "灾难演练计划"
  
  # 可扩展性架构
  scalability_architecture:
    horizontal_scaling:
      application_scaling:
        - "无状态应用设计"
        - "容器化部署"
        - "自动扩缩容"
        - "负载均衡分发"
      
      database_scaling:
        - "读写分离"
        - "分库分表策略"
        - "数据分片规则"
        - "跨库事务处理"
      
      cache_scaling:
        - "缓存集群"
        - "缓存分片"
        - "缓存一致性"
        - "缓存容量规划"
    
    vertical_scaling:
      resource_optimization:
        - "CPU密集型优化"
        - "内存使用优化"
        - "I/O性能优化"
        - "网络带宽优化"
  
  # 可维护性架构
  maintainability_architecture:
    code_maintainability:
      code_organization:
        - "分层架构清晰"
        - "模块职责明确"
        - "接口设计简洁"
        - "依赖关系清晰"
      
      code_quality:
        - "代码规范统一"
        - "单元测试覆盖率 > 80%"
        - "代码审查制度"
        - "技术债务管理"
    
    operational_maintainability:
      monitoring_observability:
        - "全链路监控"
        - "日志集中管理"
        - "性能指标监控"
        - "业务指标监控"
      
      deployment_automation:
        - "CI/CD流水线"
        - "自动化测试"
        - "灰度发布"
        - "一键回滚"

# =============================================================================
# 架构决策记录 (Architecture Decision Records)
# =============================================================================
architecture_decisions:
  ADR_001_分层架构选择:
    decision: "采用分层架构 + 领域驱动设计"
    context: "产品管理功能复杂度中等，需要清晰的职责分离"
    alternatives:
      - "六边形架构"
      - "微服务架构"
      - "事件驱动架构"
    decision_rationale:
      - "分层架构简单清晰，团队熟悉"
      - "DDD能够很好地封装业务逻辑"
      - "便于利用JeecgBoot框架特性"
      - "后续可演进为微服务架构"
    consequences:
      positive:
        - "架构清晰，易于理解和维护"
        - "职责分离明确"
        - "便于单元测试"
      negative:
        - "层间调用可能带来性能开销"
        - "需要处理跨层事务"
    requirements_alignment:
      - "支持REQ-UNCON-001~003的实现"
      - "满足80%代码生成要求"
      - "支持后续扩展需求"
  
  ADR_002_数据库设计策略:
    decision: "MySQL主库 + Redis缓存 + Elasticsearch搜索"
    context: "需要支持OLTP事务 + 高性能缓存 + 全文搜索"
    alternatives:
      - "MySQL + MongoDB"
      - "PostgreSQL + Redis"
      - "MySQL + Solr"
    decision_rationale:
      - "MySQL事务支持完善，生态成熟"
      - "Redis性能优秀，支持多种数据结构"
      - "Elasticsearch全文搜索能力强"
      - "JeecgBoot对这套技术栈支持完善"
    consequences:
      positive:
        - "性能表现优秀"
        - "技术栈成熟稳定"
        - "运维经验丰富"
      negative:
        - "需要处理数据一致性"
        - "运维复杂度增加"
    requirements_alignment:
      - "支持REQ-UBIQ-001数据一致性"
      - "满足性能和并发要求"
      - "支持商品搜索功能"
  
  ADR_003_缓存架构策略:
    decision: "多级缓存架构 (本地缓存 + 分布式缓存)"
    context: "需要平衡性能和数据一致性"
    alternatives:
      - "仅使用分布式缓存"
      - "仅使用本地缓存"
      - "数据库缓存为主"
    decision_rationale:
      - "本地缓存响应速度最快"
      - "分布式缓存保证数据一致性"
      - "多级缓存提供最佳性能"
    consequences:
      positive:
        - "查询性能显著提升"
        - "减少数据库压力"
        - "提升用户体验"
      negative:
        - "缓存一致性复杂"
        - "内存使用增加"
        - "缓存失效策略复杂"
    requirements_alignment:
      - "支持高并发查询"
      - "提升系统响应速度"
      - "满足性能目标"
  
  ADR_004_事件驱动架构:
    decision: "Spring Event + RocketMQ混合事件架构"
    context: "需要处理商品状态变更和库存预警等异步事件"
    alternatives:
      - "仅使用Spring Event"
      - "仅使用消息队列"
      - "不使用事件驱动"
    decision_rationale:
      - "Spring Event处理同步事件"
      - "RocketMQ处理异步事件和解耦"
      - "混合架构兼顾性能和可靠性"
    consequences:
      positive:
        - "系统解耦程度高"
        - "异步处理提升性能"
        - "事件可追溯和重放"
      negative:
        - "复杂度增加"
        - "需要处理事件重复和顺序"
        - "调试难度增加"
    requirements_alignment:
      - "支持REQ-EVENT-001~003事件处理"
      - "支持库存预警等异步功能"
      - "提升系统响应性能"

