# 需求分析专家 - 输入模板 (扁平化引用优化)
# ========================================================================
# 版本: v1.1.0 | 创建日期: 2025-07-27 | 优化: 2025-07-27
# 专家: requirements_analyst
# 用途: 接收用户原始需求，基于统一配置进行标准化输入处理

requirements_analyst_input:
  # 统一配置引用 (扁平化架构)
  config_reference: "../shared/config.yaml"
  
  # 基础项目信息 (从config中获取)
  project_info:
    project_id: ""                   # 从config.project_identity.project_id获取
    project_name: ""                 # 从config.project_identity.project_name获取
    system_name: ""                  # 从config.project_identity.system_name获取
    module_name: ""                  # 从config.business_classification.module_name获取
    business_domain: ""              # 从config.business_classification.business_domain获取
    complexity_level: ""             # 从config.business_classification.complexity_level获取
    
  # 需求输入信息
  requirement_input:
    # 需求基本信息
    requirement_basic:
      requirement_name: ""             # type: string, required
      requirement_type: ""             # type: requirement_type enum, required
      priority: ""                     # type: priority_level enum, required
      urgency: ""                      # type: priority_level enum, required
      
    # 原始需求描述
    raw_requirements:
      business_description: ""         # type: text, required - 用户原始业务需求描述
      business_background: ""          # type: text, required - 业务背景和上下文
      current_situation: ""            # type: text, required - 当前业务现状
      expected_outcome: ""             # type: text, required - 期望达成的效果
      pain_points: []                  # type: array[text] - 当前痛点问题
      
    # 利益相关方信息
    stakeholder_info:
      primary_stakeholders: []         # type: array[stakeholder] - 主要利益相关方
      secondary_stakeholders: []       # type: array[stakeholder] - 次要利益相关方
      end_users: []                    # type: array[stakeholder] - 最终用户
      decision_makers: []              # type: array[stakeholder] - 决策者
      
    # 业务范围界定
    scope_definition:
      included_functions: []           # type: array[text] - 包含的功能
      excluded_functions: []           # type: array[text] - 明确排除的功能
      functional_boundaries: []        # type: array[text] - 功能边界说明
      integration_requirements: []    # type: array[text] - 集成需求
      
    # 约束条件
    constraints:
      business_constraints: []         # type: array[text] - 业务约束
      technical_constraints: []        # type: array[text] - 技术约束
      time_constraints: ""             # type: text - 时间约束
      budget_constraints: ""           # type: text - 预算约束
      resource_constraints: []         # type: array[text] - 资源约束
      
    # 质量期望
    quality_expectations:
      performance_requirements: []     # type: array[text] - 性能要求
      security_requirements: []        # type: array[text] - 安全要求
      usability_requirements: []       # type: array[text] - 易用性要求
      compatibility_requirements: []   # type: array[text] - 兼容性要求
      
    # JeecgBoot特定信息
    jeecgboot_context:
      framework_version: ""            # type: string - 使用的框架版本
      existing_modules: []             # type: array[text] - 现有相关模块
      codegen_expectations: ""         # type: text - 对CodeGen的期望
      custom_development_areas: []     # type: array[text] - 预期需要自定义开发的领域
      
  # 附加支撑信息
  supporting_information:
    # 参考资料
    reference_materials:
      business_documents: []           # type: array[text] - 业务文档引用
      existing_systems: []             # type: array[text] - 现有系统参考
      industry_standards: []           # type: array[text] - 行业标准参考
      competitor_analysis: []          # type: array[text] - 竞品分析
      
    # 验收预期
    acceptance_expectations:
      success_criteria: []             # type: array[text] - 成功标准
      validation_methods: []           # type: array[text] - 验证方法
      testing_expectations: []         # type: array[text] - 测试期望
      user_training_needs: []          # type: array[text] - 用户培训需求
      
  # 处理指令
  processing_instructions:
    analysis_depth: ""                 # type: enum[basic|standard|detailed|comprehensive]
    focus_areas: []                    # type: array[text] - 重点关注领域
    output_format_preference: ""       # type: enum[standard|detailed|executive_summary]
    timeline_requirements: ""          # type: text - 时间要求
    
# 输入验证规则
input_validation:
  required_fields:
    - "project_info.project_name"
    - "project_info.system_name"
    - "project_info.business_domain"
    - "requirement_input.requirement_basic.requirement_name"
    - "requirement_input.raw_requirements.business_description"
    - "requirement_input.stakeholder_info.primary_stakeholders"
    
  data_quality_checks:
    completeness_check:
      minimum_description_length: 50   # 最少50字符的业务描述
      minimum_stakeholders: 1          # 至少1个主要利益相关方
      
    consistency_check:
      project_info_alignment: true     # 项目信息与共享基线一致性
      business_domain_validity: true   # 业务领域有效性
      
    feasibility_check:
      jeecgboot_compatibility: true    # JeecgBoot兼容性检查
      complexity_assessment: true      # 复杂度评估合理性
      
# 使用指南
usage_guidelines:
  purpose: "为requirements_analyst专家提供标准化的需求输入接收格式"
  
  input_preparation:
    - "填写前请先确认项目基础信息的准确性"
    - "业务描述应尽可能详细和具体"
    - "利益相关方信息要完整，包含联系方式"
    - "约束条件要明确和可验证"
    
  quality_standards:
    - "所有必填字段必须完整填写"
    - "描述性字段要求清晰、无歧义"
    - "枚举字段值必须从预定义列表选择"
    - "引用共享基线信息确保一致性"
    
  expert_processing:
    - "专家将基于此输入进行深度需求分析"
    - "输出将包含详细的需求规格说明书"
    - "分析结果将用于后续专家的输入"