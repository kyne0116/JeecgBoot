# ============================================================================
# 质量保证检查点 (Agent-C自检要求)
# ============================================================================
quality_assurance_checkpoints:
  # 任务完整性检查
  task_completeness_check:
    traceability_validation:
      - check_item: "所有任务都有源需求和设计追溯"
        validation_result: "{{TRACEABILITY_COMPLETE}}" # pass | fail
        missing_traceability: [{{MISSING_TRACEABILITY}}]
        
    gwt_mapping_validation:
      - check_item: "Given-When-Then任务映射完整"
        validation_result: "{{GWT_MAPPING_COMPLETE}}" # pass | fail
        incomplete_mappings: [{{INCOMPLETE_MAPPINGS}}]
        
    codegen_analysis_validation:
      - check_item: "所有任务都有CodeGen适用性分析"
        validation_result: "{{CODEGEN_ANALYSIS_COMPLETE}}" # pass | fail
        missing_analysis: [{{MISSING_ANALYSIS}}]
        
  # 工作量估算合理性检查
  effort_estimation_validation:
    story_points_consistency:
      total_estimated_points: {{TOTAL_ESTIMATED_POINTS}}
      estimation_consistency_score: {{ESTIMATION_CONSISTENCY_SCORE}} # 1-10
      outlier_tasks: [{{OUTLIER_TASKS}}] # 估算明显不合理的任务
      
    hours_vs_points_alignment:
      points_to_hours_ratio: {{POINTS_TO_HOURS_RATIO}} # 平均每个故事点对应的小时数
      ratio_consistency: "{{RATIO_CONSISTENCY}}" # consistent | inconsistent
      adjustment_recommendations: [{{ADJUSTMENT_RECOMMENDATIONS}}]
      
  # 依赖关系逻辑检查
  dependency_logic_validation:
    circular_dependency_check:
      circular_dependencies_detected: {{CIRCULAR_DEPENDENCIES}} # true | false
      circular_dependency_chains: [{{CIRCULAR_CHAINS}}]
      
    critical_path_feasibility:
      critical_path_realistic: {{CRITICAL_PATH_REALISTIC}} # true | false
      potential_bottlenecks: [{{POTENTIAL_BOTTLENECKS}}]
      resource_conflict_risks: [{{RESOURCE_CONFLICTS}}]
      
  # 技术可行性检查  
  technical_feasibility_validation:
    technology_stack_alignment:
      jeecg_framework_alignment: {{JEECG_ALIGNMENT}} # full | partial | none
      unsupported_technologies: [{{UNSUPPORTED_TECHNOLOGIES}}]
      compatibility_risks: [{{COMPATIBILITY_RISKS}}]
      
    codegen_configuration_validity:
      valid_codegen_configurations: {{VALID_CODEGEN_CONFIGS}}
      invalid_configurations: [{{INVALID_CONFIGURATIONS}}]
      configuration_conflicts: [{{CONFIG_CONFLICTS}}]

