# JeecgBoot AI Agent协作开发任务分解模板
# 基于TBDWBS (Traceability-Based Development Work Breakdown Structure)协议
# 专为Agent-C（开发工程师）设计
#
# 📁 文件组织建议（第二轮评估反馈优化）：
# 建议保存路径：/ContextDev/example/REQ-SUITE-XXX-需求名称/development-tasks.yaml
# 文件命名规范：development-tasks.yaml (固定命名，便于统一管理)
# 输入依赖：同目录下的 requirements-analysis.yaml 和 architecture-design.yaml
# 并行开发支持：基于需求套件的独立性，支持多团队并行开发
# 共享组件开发：涉及共享组件的开发任务需要跨需求协调

# ============================================================================
# Agent协作协议声明
# ============================================================================
agent_collaboration_protocol:
  source_agent: "Agent-C (开发工程师)"
  input_agents: ["Agent-A (需求分析师)", "Agent-B (架构设计师)"]
  output_target: "开发团队执行 | 项目管理跟踪"
  communication_standard: "TBDWBS结构化任务分解协议"
  quality_target: "任务完整性100%, 可执行性>95%, 追溯性100%"
  processing_time_target: "<60秒/需求群组"

# ============================================================================
# 输出元数据规范 (Agent-C必须填写)
# ============================================================================
task_breakdown_metadata:
  # 文档标识
  document_identity:
    wbs_doc_id: "WBS-DOC-{{YYYYMMDD}}-{{SEQUENCE}}" # 如：WBS-DOC-20250731-001
    created_timestamp: "{{YYYY-MM-DD HH:MM:SS}}"
    agent_version: "Agent-C v{{VERSION}}"
    processing_duration: "{{SECONDS}}s"
    
  # 基线和系统关联信息
  baseline_and_system_reference:
    # 需求基线引用
    baseline_reference:
      baseline_id: "{{BASELINE_ID}}" # 来自需求基线模板
      baseline_version: "{{BASELINE_VERSION}}" # 基线版本
      requirement_suite_id: "{{REQUIREMENT_SUITE_ID}}" # 本需求在基线中的套件ID
      baseline_doc_path: "{{BASELINE_DOC_PATH}}" # 基线文档路径
      
    # 系统基础信息引用  
    system_reference:
      system_id: "{{SYSTEM_ID}}" # 来自系统基础模板
      system_name: "{{SYSTEM_NAME}}" # 系统名称
      system_base_doc_path: "{{SYSTEM_BASE_DOC_PATH}}" # 系统基础文档路径
      jeecg_version: "{{JEECG_VERSION}}" # 继承的JeecgBoot版本
      base_working_directory: "{{BASE_WORKING_DIRECTORY}}" # 继承的工作目录
      
  # 输入源信息
  source_input_info:
    requirement_doc_id: "{{REQ_DOC_ID}}" # 来自Agent-A
    requirement_doc_path: "{{REQ_DOC_PATH}}" # Agent-A文档路径
    design_doc_id: "{{DESIGN_DOC_ID}}" # 来自Agent-B
    design_doc_path: "{{DESIGN_DOC_PATH}}" # Agent-B文档路径
    input_requirements_count: {{INPUT_REQ_COUNT}}
    input_design_decisions_count: {{INPUT_DESIGN_COUNT}}
    input_scenarios_count: {{INPUT_SCENARIO_COUNT}}
    
    # 追溯链延续
    inherited_traceability:
      baseline_traceability_id: "{{BASELINE_TRACEABILITY_ID}}" # 来自Agent-A和Agent-B
      system_traceability_id: "{{SYSTEM_TRACEABILITY_ID}}" # 来自Agent-A和Agent-B
    
  # JeecgBoot开发环境上下文
  development_context:
    framework_version: "{{JEECG_VERSION}}" # 默认3.8.1
    codegen_version: "{{CODEGEN_VERSION}}"
    development_mode: "{{DEV_MODE}}" # local | dev | test | prod
    target_sprint: "{{SPRINT_NUMBER}}"
    team_size: {{TEAM_SIZE}}

# ============================================================================
# TBDWBS任务分解结果 (完整工作分解结构)
# ============================================================================
tbdwbs_task_breakdown:
  # 分解统计摘要
  breakdown_summary:
    total_task_groups: {{TOTAL_TASK_GROUPS}}
    total_individual_tasks: {{TOTAL_TASKS}}
    codegen_tasks_count: {{CODEGEN_TASKS}}
    manual_development_tasks_count: {{MANUAL_TASKS}}
    testing_tasks_count: {{TESTING_TASKS}}
    integration_tasks_count: {{INTEGRATION_TASKS}}
    estimated_total_story_points: {{TOTAL_STORY_POINTS}}
    estimated_total_hours: {{TOTAL_HOURS}}
    
  # 任务组分解 (基于需求和设计的组合)
  task_groups:
    - task_group_id: "TG-001"
      task_group_name: "{{TASK_GROUP_NAME_1}}"
      task_group_type: "feature_implementation" # feature_implementation | integration | testing | deployment | infrastructure
      
      # 完整追溯链
      traceability_chain:
        source_requirement_id: "{{SOURCE_REQ_ID_1}}" # 来自Agent-A
        source_requirement_type: "{{SOURCE_REQ_TYPE_1}}" # ubiquitous | event_driven | unwanted_behavior | state_driven | optional
        source_scenario_id: "{{SOURCE_SCENARIO_ID_1}}" # 来自Agent-A
        source_design_decision_id: "{{SOURCE_DESIGN_ID_1}}" # 来自Agent-B
        source_design_pattern: "{{SOURCE_DESIGN_PATTERN_1}}" # 来自Agent-B
        traceability_validation: "{{TRACEABILITY_VALID_1}}" # pass | fail
        
      # 业务上下文信息
      business_context:
        business_capability: "{{BUSINESS_CAPABILITY_1}}"
        user_story: "{{USER_STORY_1}}"
        acceptance_criteria: "{{ACCEPTANCE_CRITERIA_1}}"
        business_priority: "{{BUSINESS_PRIORITY_1}}" # high | medium | low
        business_value_score: {{BUSINESS_VALUE_SCORE_1}} # 1-10
        
      # TBDWBS分解 - Given-When-Then任务映射
      gwt_task_mapping:
        # Given Tasks - 前置条件任务 (环境准备、数据初始化)
        given_tasks:
          - task_id: "TASK-GIVEN-001"
            task_name: "{{GIVEN_TASK_NAME_1}}"
            task_description: "建立{{GIVEN_CONDITION_1}}"
            work_type: "data_preparation" # data_preparation | environment_setup | dependency_configuration
            
            # 任务执行规范
            task_specifications:
              acceptance_criteria: "{{GIVEN_ACCEPTANCE_1}}"
              definition_of_done: "{{GIVEN_DOD_1}}"
              testing_requirement: "{{GIVEN_TEST_REQ_1}}"
              
            # CodeGen适用性分析
            codegen_analysis:
              codegen_applicable: {{CODEGEN_APPLICABLE_1}} # true | false
              codegen_coverage_percentage: {{CODEGEN_COVERAGE_1}}% # 0-100
              codegen_configuration: "{{CODEGEN_CONFIG_1}}"
              manual_work_required: "{{MANUAL_WORK_1}}"
              
            # 工作量估算
            effort_estimation:
              story_points: {{STORY_POINTS_1}} # 1,2,3,5,8,13
              estimated_hours: {{ESTIMATED_HOURS_1}}
              complexity_level: {{COMPLEXITY_LEVEL_1}} # 1-5
              risk_level: "{{RISK_LEVEL_1}}" # low | medium | high
              
            # 任务依赖
            task_dependencies:
              prerequisite_tasks: [{{PREREQUISITE_TASKS_1}}]
              parallel_tasks: [{{PARALLEL_TASKS_1}}]
              dependent_tasks: [{{DEPENDENT_TASKS_1}}]
              
            # 技术实现细节
            technical_details:
              technology_stack: [{{TECH_STACK_1}}]
              framework_components: [{{FRAMEWORK_COMPONENTS_1}}]
              database_tables: [{{DB_TABLES_1}}]
              api_endpoints: [{{API_ENDPOINTS_1}}]
              
            priority: "{{GIVEN_PRIORITY_1}}"
            assigned_developer: "{{ASSIGNED_DEV_1}}"
            
          - task_id: "TASK-GIVEN-002"
            task_name: "{{GIVEN_TASK_NAME_2}}"
            task_description: "准备{{GIVEN_CONDITION_2}}"
            work_type: "environment_setup"
            task_specifications:
              acceptance_criteria: "{{GIVEN_ACCEPTANCE_2}}"
              definition_of_done: "{{GIVEN_DOD_2}}"
              testing_requirement: "{{GIVEN_TEST_REQ_2}}"
            codegen_analysis:
              codegen_applicable: {{CODEGEN_APPLICABLE_2}}
              codegen_coverage_percentage: {{CODEGEN_COVERAGE_2}}%
              codegen_configuration: "{{CODEGEN_CONFIG_2}}"
              manual_work_required: "{{MANUAL_WORK_2}}"
            effort_estimation:
              story_points: {{STORY_POINTS_2}}
              estimated_hours: {{ESTIMATED_HOURS_2}}
              complexity_level: {{COMPLEXITY_LEVEL_2}}
              risk_level: "{{RISK_LEVEL_2}}"
            task_dependencies:
              prerequisite_tasks: [{{PREREQUISITE_TASKS_2}}]
              parallel_tasks: [{{PARALLEL_TASKS_2}}]
              dependent_tasks: [{{DEPENDENT_TASKS_2}}]
            technical_details:
              technology_stack: [{{TECH_STACK_2}}]
              framework_components: [{{FRAMEWORK_COMPONENTS_2}}]
              database_tables: [{{DB_TABLES_2}}]
              api_endpoints: [{{API_ENDPOINTS_2}}]
            priority: "{{GIVEN_PRIORITY_2}}"
            assigned_developer: "{{ASSIGNED_DEV_2}}"
            # 继续添加Given任务...
            
        # When Tasks - 核心实现任务 (业务逻辑、接口、界面)
        when_tasks:
          - task_id: "TASK-WHEN-001"
            task_name: "{{WHEN_TASK_NAME_1}}"
            task_description: "实现{{WHEN_ACTION_1}}"
            work_type: "business_logic" # business_logic | user_interface | api_development | database_work
            
            task_specifications:
              acceptance_criteria: "{{WHEN_ACCEPTANCE_1}}"
              definition_of_done: "{{WHEN_DOD_1}}"
              testing_requirement: "{{WHEN_TEST_REQ_1}}"
              
            codegen_analysis:
              codegen_applicable: {{WHEN_CODEGEN_APPLICABLE_1}}
              codegen_coverage_percentage: {{WHEN_CODEGEN_COVERAGE_1}}%
              codegen_configuration: "{{WHEN_CODEGEN_CONFIG_1}}"
              manual_work_required: "{{WHEN_MANUAL_WORK_1}}"
              custom_logic_complexity: "{{CUSTOM_LOGIC_COMPLEXITY_1}}"
              
            effort_estimation:
              story_points: {{WHEN_STORY_POINTS_1}}
              estimated_hours: {{WHEN_ESTIMATED_HOURS_1}}
              complexity_level: {{WHEN_COMPLEXITY_LEVEL_1}}
              risk_level: "{{WHEN_RISK_LEVEL_1}}"
              
            task_dependencies:
              prerequisite_tasks: [{{WHEN_PREREQUISITE_TASKS_1}}]
              parallel_tasks: [{{WHEN_PARALLEL_TASKS_1}}]
              dependent_tasks: [{{WHEN_DEPENDENT_TASKS_1}}]
              
            technical_details:
              technology_stack: [{{WHEN_TECH_STACK_1}}]
              framework_components: [{{WHEN_FRAMEWORK_COMPONENTS_1}}]
              database_operations: [{{WHEN_DB_OPERATIONS_1}}] # create | read | update | delete | query
              api_design: "{{WHEN_API_DESIGN_1}}"
              business_rules: [{{WHEN_BUSINESS_RULES_1}}]
              validation_rules: [{{WHEN_VALIDATION_RULES_1}}]
              
            # JeecgBoot特有配置
            jeecg_configuration:
              module_name: "{{JEECG_MODULE_NAME_1}}"
              submodule_name: "{{JEECG_SUBMODULE_NAME_1}}"
              business_entity: "{{JEECG_BUSINESS_ENTITY_1}}"
              dict_usage: [{{JEECG_DICT_USAGE_1}}]
              permission_codes: [{{JEECG_PERMISSION_CODES_1}}]
              
            priority: "{{WHEN_PRIORITY_1}}"
            assigned_developer: "{{WHEN_ASSIGNED_DEV_1}}"
            
          - task_id: "TASK-WHEN-002"
            task_name: "{{WHEN_TASK_NAME_2}}"
            task_description: "开发{{WHEN_ACTION_2}}"
            work_type: "user_interface"
            task_specifications:
              acceptance_criteria: "{{WHEN_ACCEPTANCE_2}}"
              definition_of_done: "{{WHEN_DOD_2}}"
              testing_requirement: "{{WHEN_TEST_REQ_2}}"
            codegen_analysis:
              codegen_applicable: {{WHEN_CODEGEN_APPLICABLE_2}}
              codegen_coverage_percentage: {{WHEN_CODEGEN_COVERAGE_2}}%
              codegen_configuration: "{{WHEN_CODEGEN_CONFIG_2}}"
              manual_work_required: "{{WHEN_MANUAL_WORK_2}}"
              custom_logic_complexity: "{{CUSTOM_LOGIC_COMPLEXITY_2}}"
            effort_estimation:
              story_points: {{WHEN_STORY_POINTS_2}}
              estimated_hours: {{WHEN_ESTIMATED_HOURS_2}}
              complexity_level: {{WHEN_COMPLEXITY_LEVEL_2}}
              risk_level: "{{WHEN_RISK_LEVEL_2}}"
            task_dependencies:
              prerequisite_tasks: [{{WHEN_PREREQUISITE_TASKS_2}}]
              parallel_tasks: [{{WHEN_PARALLEL_TASKS_2}}]
              dependent_tasks: [{{WHEN_DEPENDENT_TASKS_2}}]
            technical_details:
              technology_stack: [{{WHEN_TECH_STACK_2}}]
              framework_components: [{{WHEN_FRAMEWORK_COMPONENTS_2}}]
              database_operations: [{{WHEN_DB_OPERATIONS_2}}]
              api_design: "{{WHEN_API_DESIGN_2}}"
              business_rules: [{{WHEN_BUSINESS_RULES_2}}]
              validation_rules: [{{WHEN_VALIDATION_RULES_2}}]
            jeecg_configuration:
              module_name: "{{JEECG_MODULE_NAME_2}}"
              submodule_name: "{{JEECG_SUBMODULE_NAME_2}}"
              business_entity: "{{JEECG_BUSINESS_ENTITY_2}}"
              dict_usage: [{{JEECG_DICT_USAGE_2}}]
              permission_codes: [{{JEECG_PERMISSION_CODES_2}}]
            priority: "{{WHEN_PRIORITY_2}}"
            assigned_developer: "{{WHEN_ASSIGNED_DEV_2}}"
            # 继续添加When任务...
            
        # Then Tasks - 验证任务 (测试、确认、验收)
        then_tasks:
          - task_id: "TASK-THEN-001"
            task_name: "{{THEN_TASK_NAME_1}}"
            task_description: "验证{{THEN_RESULT_1}}"
            work_type: "acceptance_validation" # unit_testing | integration_testing | acceptance_validation | performance_testing
            
            task_specifications:
              acceptance_criteria: "{{THEN_ACCEPTANCE_1}}"
              definition_of_done: "{{THEN_DOD_1}}"
              testing_approach: "{{THEN_TEST_APPROACH_1}}" # manual | automated | hybrid
              
            testing_details:
              test_types: [{{TEST_TYPES_1}}] # unit | integration | functional | regression | performance
              test_data_requirements: "{{TEST_DATA_REQ_1}}"
              test_environment: "{{TEST_ENVIRONMENT_1}}"
              test_automation_level: {{TEST_AUTOMATION_LEVEL_1}}% # 0-100
              
            codegen_analysis:
              test_generation_applicable: {{TEST_CODEGEN_APPLICABLE_1}}
              test_template_usage: "{{TEST_TEMPLATE_USAGE_1}}"
              manual_test_effort: "{{MANUAL_TEST_EFFORT_1}}"
              
            effort_estimation:
              story_points: {{THEN_STORY_POINTS_1}}
              estimated_hours: {{THEN_ESTIMATED_HOURS_1}}
              complexity_level: {{THEN_COMPLEXITY_LEVEL_1}}
              risk_level: "{{THEN_RISK_LEVEL_1}}"
              
            task_dependencies:
              prerequisite_tasks: [{{THEN_PREREQUISITE_TASKS_1}}]
              parallel_tasks: [{{THEN_PARALLEL_TASKS_1}}]
              dependent_tasks: [{{THEN_DEPENDENT_TASKS_1}}]
              
            validation_criteria:
              functional_validation: "{{FUNCTIONAL_VALIDATION_1}}"
              performance_validation: "{{PERFORMANCE_VALIDATION_1}}"
              security_validation: "{{SECURITY_VALIDATION_1}}"
              usability_validation: "{{USABILITY_VALIDATION_1}}"
              
            priority: "{{THEN_PRIORITY_1}}"
            assigned_tester: "{{ASSIGNED_TESTER_1}}"
            
          - task_id: "TASK-THEN-002"
            task_name: "{{THEN_TASK_NAME_2}}"
            task_description: "测试{{THEN_RESULT_2}}"
            work_type: "integration_testing"
            task_specifications:
              acceptance_criteria: "{{THEN_ACCEPTANCE_2}}"
              definition_of_done: "{{THEN_DOD_2}}"
              testing_approach: "{{THEN_TEST_APPROACH_2}}"
            testing_details:
              test_types: [{{TEST_TYPES_2}}]
              test_data_requirements: "{{TEST_DATA_REQ_2}}"
              test_environment: "{{TEST_ENVIRONMENT_2}}"
              test_automation_level: {{TEST_AUTOMATION_LEVEL_2}}%
            codegen_analysis:
              test_generation_applicable: {{TEST_CODEGEN_APPLICABLE_2}}
              test_template_usage: "{{TEST_TEMPLATE_USAGE_2}}"
              manual_test_effort: "{{MANUAL_TEST_EFFORT_2}}"
            effort_estimation:
              story_points: {{THEN_STORY_POINTS_2}}
              estimated_hours: {{THEN_ESTIMATED_HOURS_2}}
              complexity_level: {{THEN_COMPLEXITY_LEVEL_2}}
              risk_level: "{{THEN_RISK_LEVEL_2}}"
            task_dependencies:
              prerequisite_tasks: [{{THEN_PREREQUISITE_TASKS_2}}]
              parallel_tasks: [{{THEN_PARALLEL_TASKS_2}}]
              dependent_tasks: [{{THEN_DEPENDENT_TASKS_2}}]
            validation_criteria:
              functional_validation: "{{FUNCTIONAL_VALIDATION_2}}"
              performance_validation: "{{PERFORMANCE_VALIDATION_2}}"
              security_validation: "{{SECURITY_VALIDATION_2}}"
              usability_validation: "{{USABILITY_VALIDATION_2}}"
            priority: "{{THEN_PRIORITY_2}}"
            assigned_tester: "{{ASSIGNED_TESTER_2}}"
            # 继续添加Then任务...
            
        # But Tasks - 异常处理任务 (错误处理、边界条件、异常情况)
        but_tasks:
          - task_id: "TASK-BUT-001"
            task_name: "{{BUT_TASK_NAME_1}}"
            task_description: "处理{{BUT_EXCEPTION_1}}"
            work_type: "error_handling" # error_handling | boundary_testing | security_validation | exception_recovery
            
            task_specifications:
              acceptance_criteria: "{{BUT_ACCEPTANCE_1}}"
              definition_of_done: "{{BUT_DOD_1}}"
              error_scenarios: [{{ERROR_SCENARIOS_1}}]
              
            exception_handling_details:
              exception_types: [{{EXCEPTION_TYPES_1}}] # business_exception | system_exception | validation_exception
              error_response_format: "{{ERROR_RESPONSE_FORMAT_1}}"
              recovery_mechanism: "{{RECOVERY_MECHANISM_1}}"
              logging_requirements: "{{LOGGING_REQUIREMENTS_1}}"
              user_notification: "{{USER_NOTIFICATION_1}}"
              
            codegen_analysis:
              exception_template_applicable: {{EXCEPTION_CODEGEN_APPLICABLE_1}}
              standard_error_handling: "{{STANDARD_ERROR_HANDLING_1}}"
              custom_exception_effort: "{{CUSTOM_EXCEPTION_EFFORT_1}}"
              
            effort_estimation:
              story_points: {{BUT_STORY_POINTS_1}}
              estimated_hours: {{BUT_ESTIMATED_HOURS_1}}
              complexity_level: {{BUT_COMPLEXITY_LEVEL_1}}
              risk_level: "{{BUT_RISK_LEVEL_1}}"
              
            task_dependencies:
              prerequisite_tasks: [{{BUT_PREREQUISITE_TASKS_1}}]
              parallel_tasks: [{{BUT_PARALLEL_TASKS_1}}]
              dependent_tasks: [{{BUT_DEPENDENT_TASKS_1}}]
              
            priority: "{{BUT_PRIORITY_1}}"
            assigned_developer: "{{BUT_ASSIGNED_DEV_1}}"
            # 继续添加But任务...
            
      # 任务组级别汇总
      task_group_summary:
        total_tasks_in_group: {{TOTAL_TASKS_IN_GROUP_1}}
        total_story_points: {{GROUP_STORY_POINTS_1}}
        total_estimated_hours: {{GROUP_ESTIMATED_HOURS_1}}
        codegen_coverage_percentage: {{GROUP_CODEGEN_COVERAGE_1}}%
        risk_assessment: "{{GROUP_RISK_ASSESSMENT_1}}"
        recommended_sprint_allocation: "{{SPRINT_ALLOCATION_1}}"
        
    - task_group_id: "TG-002"
      task_group_name: "{{TASK_GROUP_NAME_2}}"
      task_group_type: "integration"
      traceability_chain:
        source_requirement_id: "{{SOURCE_REQ_ID_2}}"
        source_requirement_type: "{{SOURCE_REQ_TYPE_2}}"
        source_scenario_id: "{{SOURCE_SCENARIO_ID_2}}"
        source_design_decision_id: "{{SOURCE_DESIGN_ID_2}}"
        source_design_pattern: "{{SOURCE_DESIGN_PATTERN_2}}"
        traceability_validation: "{{TRACEABILITY_VALID_2}}"
      business_context:
        business_capability: "{{BUSINESS_CAPABILITY_2}}"
        user_story: "{{USER_STORY_2}}"
        acceptance_criteria: "{{ACCEPTANCE_CRITERIA_2}}"
        business_priority: "{{BUSINESS_PRIORITY_2}}"
        business_value_score: {{BUSINESS_VALUE_SCORE_2}}
      gwt_task_mapping:
        # 集成任务的Given-When-Then结构略有不同，更侧重于系统间的交互
        given_tasks: [{{INTEGRATION_GIVEN_TASKS}}]
        when_tasks: [{{INTEGRATION_WHEN_TASKS}}]
        then_tasks: [{{INTEGRATION_THEN_TASKS}}]
        but_tasks: [{{INTEGRATION_BUT_TASKS}}]
      task_group_summary:
        total_tasks_in_group: {{TOTAL_TASKS_IN_GROUP_2}}
        total_story_points: {{GROUP_STORY_POINTS_2}}
        total_estimated_hours: {{GROUP_ESTIMATED_HOURS_2}}
        codegen_coverage_percentage: {{GROUP_CODEGEN_COVERAGE_2}}%
        risk_assessment: "{{GROUP_RISK_ASSESSMENT_2}}"
        recommended_sprint_allocation: "{{SPRINT_ALLOCATION_2}}"
      # 继续添加任务组...

# ============================================================================
# CodeGen配置分析 (JeecgBoot代码生成配置)
# ============================================================================
codegen_configuration_analysis:
  # CodeGen适用任务统计
  codegen_applicability_summary:
    total_codegen_suitable_tasks: {{CODEGEN_SUITABLE_TASKS}}
    total_partial_codegen_tasks: {{PARTIAL_CODEGEN_TASKS}}
    total_manual_development_tasks: {{MANUAL_DEVELOPMENT_TASKS}}
    overall_codegen_coverage: {{OVERALL_CODEGEN_COVERAGE}}%
    
  # 标准CodeGen配置 (MODULE_NAME, SUBMODULE_NAME, BUSINESS_ENTITY)
  standard_codegen_configurations:
    - config_id: "CODEGEN-001"
      related_tasks: [{{RELATED_TASKS_1}}]
      module_name: "{{MODULE_NAME_1}}"
      submodule_name: "{{SUBMODULE_NAME_1}}"
      business_entity: "{{BUSINESS_ENTITY_1}}" # PascalCase命名
      
      # 代码生成覆盖范围
      generation_scope:
        backend_entity: {{GENERATE_BACKEND_ENTITY}} # true | false
        backend_controller: {{GENERATE_BACKEND_CONTROLLER}}
        backend_service: {{GENERATE_BACKEND_SERVICE}}
        backend_mapper: {{GENERATE_BACKEND_MAPPER}}
        frontend_list: {{GENERATE_FRONTEND_LIST}}
        frontend_form: {{GENERATE_FRONTEND_FORM}}
        sql_scripts: {{GENERATE_SQL_SCRIPTS}}
        
      # 数据字典使用
      dictionary_usage:
        used_dictionaries: [{{USED_DICTIONARIES_1}}] # 来自Code_Gen_DICT.json
        custom_dictionaries: [{{CUSTOM_DICTIONARIES_1}}]
        
      # 自定义配置需求
      custom_configurations:
        validation_rules: [{{VALIDATION_RULES_1}}]
        business_rules: [{{BUSINESS_RULES_1}}]
        permission_controls: [{{PERMISSION_CONTROLS_1}}]
        ui_customizations: [{{UI_CUSTOMIZATIONS_1}}]
        
    - config_id: "CODEGEN-002" 
      related_tasks: [{{RELATED_TASKS_2}}]
      module_name: "{{MODULE_NAME_2}}"
