# 系统架构专家 - 系统架构设计输出模板
# Template: system_architecture.yaml
# Version: v2.0.0
# Description: 标准化系统架构设计交付格式，供task_planner专家使用

system_architecture:
  # 文档信息
  document_info:
    document_title: string                  # 系统架构设计文档标题
    document_version: string                # 文档版本号
    created_by: string                      # 架构师姓名
    created_date: datetime                  # 创建时间
    reviewed_by: string                     # 评审人
    review_date: datetime                   # 评审时间
    approved_by: string                     # 批准人
    approval_date: datetime                 # 批准时间
    document_status: enum                   # 状态: draft|reviewed|approved|baseline
  
  # 项目基础信息
  project_info:
    project_id: string                      # 项目唯一标识
    project_name: string                    # 项目名称
    business_domain: enum                   # 业务领域
    complexity_level: enum                  # 复杂度级别
    architecture_style: string              # 架构风格
    technology_stack: string                # 技术栈
    estimated_effort: string                # 预估工作量
    risk_level: enum                        # 风险等级
  
  # 架构愿景和原则
  architecture_vision:
    vision_statement: string                # 架构愿景声明
    business_objectives: array              # 业务目标映射
      - objective_id: string
        objective_description: string
        architectural_strategy: string      # 架构策略
        success_metrics: array
          - metric_name: string
            target_value: string
            measurement_method: string
    
    design_principles: array                # 设计原则
      - principle_name: string
        principle_description: string
        implementation_guidance: string
        validation_criteria: string
    
    quality_attributes: array               # 质量属性
      - attribute_name: enum                # performance|scalability|availability|security|usability|maintainability
        priority: enum                      # critical|important|nice_to_have
        target_value: string
        measurement_criteria: string
        architectural_tactics: array        # 架构策略
          - tactic_name: string
            tactic_description: string
            implementation_approach: string
  
  # 整体架构设计
  overall_architecture:
    architecture_overview: string           # 架构概述
    architecture_style: enum               # layered|event_driven|domain_driven|service_oriented
    
    # 4+1视图模型
    architectural_views:
      logical_view:                         # 逻辑视图
        description: string
        key_abstractions: array             # 关键抽象
          - abstraction_name: string
            abstraction_type: enum          # module|component|interface|service
            responsibility: string
            key_attributes: string
        component_relationships: array      # 组件关系
          - from_component: string
            to_component: string
            relationship_type: enum         # uses|implements|extends|aggregates
            interaction_mechanism: string
            
      process_view:                         # 进程视图
        description: string
        concurrent_processes: array         # 并发进程
          - process_name: string
            process_type: enum              # main|background|scheduled|event_driven
            concurrency_level: string
            synchronization_mechanism: string
        communication_mechanisms: array     # 通信机制
          - mechanism_type: enum            # method_call|message_passing|shared_memory|database
            usage_scenario: string
            performance_characteristics: string
            
      development_view:                     # 开发视图
        description: string
        package_structure: array            # 包结构
          - package_name: string
            package_type: enum              # presentation|business|data|integration|utility
            package_purpose: string
            key_classes: array
              - class_name: string
                class_type: enum            # controller|service|entity|repository|dto
                class_responsibility: string
        dependency_management: string       # 依赖管理策略
        build_configuration: string         # 构建配置说明
        
      physical_view:                        # 物理视图
        description: string
        deployment_architecture: string     # 部署架构说明
        infrastructure_requirements: array  # 基础设施要求
          - component_name: string
            component_type: enum            # server|database|cache|message_queue|load_balancer
            specifications: string
            scalability_options: string
        network_topology: string            # 网络拓扑
        
      scenarios:                            # 场景视图
        description: string
        key_scenarios: array                # 关键场景
          - scenario_id: string
            scenario_name: string
            scenario_description: string
            architectural_significance: string
            quality_attributes_addressed: array
            involved_components: array
              - component_name: string
                component_role: string
  
  # 分层架构设计
  layered_architecture:
    layer_definition: string                # 分层定义说明
    
    layers: array                           # 架构层次
      - layer_name: enum                    # presentation|business|data|integration
        layer_purpose: string
        layer_responsibilities: array
          - responsibility_area: string
            responsibility_description: string
        
        # JeecgBoot框架映射
        jeecgboot_mapping:
          framework_components: array       # 框架组件
            - component_name: string
              component_type: string
              configuration_requirements: string
          code_generation_support: boolean  # 代码生成支持
          custom_development_areas: array   # 需要定制开发的区域
            - area_name: string
              development_complexity: enum  # simple|medium|complex
              estimated_effort: string
        
        # 层内组件设计
        layer_components: array
          - component_id: string
            component_name: string
            component_type: enum            # controller|service|repository|dto|entity|mapper
            component_purpose: string
            
            # 组件接口设计
            interfaces: array
              - interface_name: string
                interface_type: enum        # public|internal|external
                interface_description: string
                method_signatures: array
                  - method_name: string
                    method_purpose: string
                    input_parameters: array
                      - parameter_name: string
                        parameter_type: string
                        parameter_description: string
                        validation_rules: string
                    return_type: string
                    exception_handling: string
            
            # 组件实现要求
            implementation_requirements:
              naming_conventions: string     # 命名规范
              annotations_required: array    # 必需注解
                - annotation_name: string
                  annotation_purpose: string
                  configuration_parameters: string
              error_handling_strategy: string # 错误处理策略
              logging_requirements: string   # 日志记录要求
              transaction_requirements: string # 事务要求
              caching_strategy: string       # 缓存策略
              
        # 层间交互设计
        layer_interactions: array
          - interaction_id: string
            from_layer: string
            to_layer: string
            interaction_type: enum          # synchronous_call|asynchronous_message|data_access
            interaction_mechanism: string
            data_flow_description: string
            performance_requirements: string
            error_propagation_strategy: string
  
  # 数据库架构设计
  database_architecture:
    database_strategy: string               # 数据库策略
    database_technology: string             # MySQL 8.0+
    
    # 数据模型设计
    data_model:
      conceptual_model: string              # 概念模型说明
      logical_model: string                 # 逻辑模型说明
      physical_model: string                # 物理模型说明
      
      # 核心实体表设计
      core_entities: array
        - entity_id: string
          entity_name: string               # 业务实体名称
          table_name: string                # 物理表名 (us_{domain}_{module}_{entity})
          table_purpose: string             # 表用途说明
          entity_type: enum                 # master|transaction|reference|configuration|log
          
          # 表字段设计
          columns: array
            - column_id: string
              column_name: string           # 字段名称
              business_name: string         # 业务名称
              data_type: string             # MySQL数据类型
              max_length: number            # 最大长度
              precision: number             # 数值精度
              scale: number                 # 数值标度
              is_nullable: boolean          # 是否可空
              default_value: string         # 默认值
              is_primary_key: boolean       # 是否主键
              is_foreign_key: boolean       # 是否外键
              foreign_key_reference: string # 外键引用
              is_unique: boolean            # 是否唯一
              column_comment: string        # 字段注释
              
              # 业务约束
              validation_rules: array
                - rule_type: enum           # not_null|unique|check|format|range
                  rule_expression: string
                  error_message: string
              dictionary_mapping: string    # 数据字典映射
              
          # 索引设计
          indexes: array
            - index_id: string
              index_name: string
              index_type: enum              # primary|unique|normal|composite|fulltext
              index_columns: array
                - column_name: string
                  sort_order: enum          # asc|desc
              index_purpose: string         # 索引用途
              performance_impact: string    # 性能影响分析
              
          # 约束设计
          constraints: array
            - constraint_id: string
              constraint_name: string
              constraint_type: enum         # primary_key|foreign_key|unique|check
              constraint_definition: string
              constraint_purpose: string
              
          # 分区策略 (如适用)
          partitioning:
            is_partitioned: boolean
            partition_type: enum            # range|list|hash|key
            partition_key: string
            partition_strategy: string
            estimated_partitions: number
            
          # 性能特性
          performance_characteristics:
            estimated_row_count: number     # 预估行数
            growth_rate: string             # 增长率
            query_patterns: array           # 查询模式
              - query_type: enum            # select|insert|update|delete
                frequency: enum             # high|medium|low
                complexity: enum            # simple|medium|complex
                performance_requirement: string
            maintenance_requirements: string # 维护要求
            
      # 表关系设计
      entity_relationships: array
        - relationship_id: string
          parent_entity: string
          child_entity: string
          relationship_type: enum           # one_to_one|one_to_many|many_to_many
          relationship_name: string
          foreign_key_column: string
          referential_integrity: enum       # cascade|restrict|set_null|no_action
          relationship_purpose: string
          
      # 数据库优化策略
      optimization_strategies:
        indexing_strategy: string           # 索引策略
        partitioning_strategy: string       # 分区策略
        caching_strategy: string            # 缓存策略
        query_optimization: string          # 查询优化
        maintenance_strategy: string        # 维护策略
        backup_strategy: string             # 备份策略
        
    # Redis缓存架构
    cache_architecture:
      cache_strategy: string                # 缓存策略说明
      cache_layers: array                   # 缓存层次
        - layer_name: string
          cache_purpose: string
          cache_type: enum                  # local|distributed|hybrid
          cache_technology: string          # Redis|EhCache|Caffeine
          cache_patterns: array             # 缓存模式
            - pattern_name: enum            # cache_aside|write_through|write_behind
              usage_scenario: string
              implementation_details: string
          cache_configuration:
            ttl_strategy: string            # TTL策略
            eviction_policy: string         # 淘汰策略
            memory_allocation: string       # 内存分配
            persistence_strategy: string    # 持久化策略
  
  # API接口架构设计
  api_architecture:
    api_design_philosophy: string           # API设计理念
    api_style: enum                         # restful|rpc|graphql
    
    # RESTful API设计
    restful_design:
      resource_modeling: string             # 资源建模方法
      uri_design_principles: array          # URI设计原则
        - principle_name: string
          principle_description: string
          implementation_example: string
      
      # API端点设计
      api_endpoints: array
        - endpoint_id: string
          resource_name: string             # 资源名称
          endpoint_purpose: string          # 端点用途
          
          # HTTP方法映射
          http_methods: array
            - method: enum                  # GET|POST|PUT|PATCH|DELETE
              endpoint_path: string         # API路径
              operation_description: string # 操作描述
              
              # 请求规格
              request_specification:
                path_parameters: array      # 路径参数
                  - parameter_name: string
                    parameter_type: string
                    parameter_description: string
                    validation_rules: string
                query_parameters: array     # 查询参数
                  - parameter_name: string
                    parameter_type: string
                    parameter_description: string
                    is_required: boolean
                    default_value: string
                request_body_schema: string # 请求体结构
                request_headers: array      # 请求头
                  - header_name: string
                    header_purpose: string
                    is_required: boolean
                
              # 响应规格
              response_specification:
                success_responses: array    # 成功响应
                  - status_code: number
                    response_description: string
                    response_schema: string
                    response_examples: string
                error_responses: array      # 错误响应
                  - status_code: number
                    error_description: string
                    error_schema: string
                    error_examples: string
                response_headers: array     # 响应头
                  - header_name: string
                    header_description: string
                    
              # 业务逻辑要求
              business_logic_requirements:
                validation_rules: array     # 验证规则
                  - rule_description: string
                    validation_logic: string
                    error_handling: string
                business_rules: array       # 业务规则
                  - rule_description: string
                    implementation_approach: string
                transaction_requirements: string # 事务要求
                performance_requirements: string # 性能要求
                
      # API数据传输对象设计
      dto_design:
        dto_design_principles: string       # DTO设计原则
        data_transfer_objects: array        # 数据传输对象
          - dto_id: string
            dto_name: string               # DTO名称
            dto_purpose: string            # DTO用途
            dto_type: enum                 # request|response|internal
            
            # DTO字段设计
            dto_fields: array
              - field_name: string
                field_type: string         # TypeScript/Java类型
                field_description: string
                is_required: boolean
                validation_rules: array
                  - rule_type: string
                    rule_expression: string
                default_value: string
                field_constraints: string
                
            # DTO转换规则
            conversion_rules: array
              - source_type: string         # 源类型 (Entity/VO)
                target_type: string         # 目标类型 (DTO)
                conversion_logic: string    # 转换逻辑
                validation_requirements: string
    
    # API安全架构
    api_security:
      authentication_architecture: string   # 认证架构
      authorization_architecture: string    # 授权架构
      
      # JWT认证设计
      jwt_authentication:
        token_structure: string             # 令牌结构
        token_lifecycle: string             # 令牌生命周期
        token_refresh_strategy: string      # 令牌刷新策略
        token_validation_logic: string      # 令牌验证逻辑
        
      # 权限控制设计
      permission_control:
        rbac_model: string                  # RBAC模型设计
        permission_granularity: string      # 权限粒度
        data_permission_strategy: string    # 数据权限策略
        permission_caching_strategy: string # 权限缓存策略
        
      # API安全措施
      security_measures: array
        - measure_name: string
          measure_type: enum                # authentication|authorization|validation|encryption|monitoring
          measure_description: string
          implementation_approach: string
          effectiveness_metrics: string
  
  # 集成架构设计
  integration_architecture:
    integration_strategy: string            # 集成策略
    integration_patterns: array             # 集成模式
      - pattern_name: string
        pattern_type: enum                  # api|database|file|message
        usage_scenarios: string
        implementation_guidelines: string
    
    # 内部集成设计
    internal_integrations: array
      - integration_id: string
        target_system: string
        integration_purpose: string
        integration_approach: enum          # synchronous|asynchronous|batch
        
        # 集成接口设计
        integration_interface:
          interface_type: enum              # rest_api|database_sync|file_exchange
          data_format: enum                 # json|xml|csv|sql
          communication_protocol: string
          authentication_method: string
          error_handling_strategy: string
          
        # 数据映射设计
        data_mapping: array
          - source_system: string
            source_data_structure: string
            target_system: string
            target_data_structure: string
            transformation_rules: array
              - field_mapping: string
                transformation_logic: string
                validation_rules: string
                
        # 集成质量要求
        quality_requirements:
          performance_sla: string           # 性能SLA
          availability_requirement: string  # 可用性要求
          data_consistency_strategy: string # 数据一致性策略
          error_recovery_mechanism: string  # 错误恢复机制
    
    # 外部集成设计
    external_integrations: array
      - integration_id: string
        vendor_system: string
        integration_purpose: string
        integration_protocol: enum          # rest|soap|ftp|sftp|mq
        
        # 外部接口适配
        interface_adapter:
          adapter_pattern: string           # 适配器模式
          protocol_translation: string      # 协议转换
          data_format_conversion: string    # 数据格式转换
          error_mapping_strategy: string    # 错误映射策略
          
        # 外部服务治理
        service_governance:
          circuit_breaker_configuration: string # 熔断器配置
          retry_policy: string              # 重试策略
          timeout_configuration: string     # 超时配置
          monitoring_strategy: string       # 监控策略
  
  # 非功能架构设计
  non_functional_architecture:
    # 性能架构
    performance_architecture:
      performance_objectives: array        # 性能目标
        - objective_name: string
          target_metric: string
          measurement_method: string
          acceptance_criteria: string
          
      # 性能优化策略
      optimization_strategies: array
        - strategy_name: string
          strategy_type: enum               # caching|indexing|pooling|compression|cdn
          strategy_description: string
          implementation_approach: string
          expected_improvement: string
          
      # 缓存架构
      caching_architecture:
        cache_layers: array                 # 缓存层次
          - cache_level: enum               # l1_local|l2_distributed|l3_persistent
            cache_technology: string
            cache_scope: string
            cache_policy: string
            performance_impact: string
            
    # 可扩展性架构
    scalability_architecture:
      scalability_dimensions: array        # 可扩展性维度
        - dimension: enum                   # horizontal|vertical|functional
          scaling_strategy: string
          scaling_triggers: string
          scaling_limits: string
          
      # 扩展性设计模式
      scalability_patterns: array
        - pattern_name: string
          pattern_type: enum                # load_balancing|partitioning|replication|federation
          pattern_description: string
          implementation_guidelines: string
          
    # 可用性架构  
    availability_architecture:
      availability_requirements: string    # 可用性要求
      high_availability_design: string     # 高可用设计
      disaster_recovery_strategy: string   # 灾难恢复策略
      backup_and_restore_strategy: string  # 备份恢复策略
      
    # 安全架构
    security_architecture:
      security_model: string               # 安全模型
      threat_model: string                 # 威胁模型
      
      # 安全控制措施
      security_controls: array
        - control_name: string
          control_type: enum                # preventive|detective|corrective
          control_description: string
          implementation_approach: string
          effectiveness_measurement: string
          
      # 数据保护
      data_protection:
        encryption_strategy: string        # 加密策略
        key_management_strategy: string    # 密钥管理策略
        data_classification: string        # 数据分类
        privacy_protection: string         # 隐私保护
  
  # JeecgBoot框架集成
  jeecgboot_integration:
    framework_version: string              # JeecgBoot版本
    
    # 核心功能集成
    core_feature_integration:
      code_generation: string              # 代码生成器集成
      permission_system: string            # 权限系统集成
      workflow_engine: string              # 工作流引擎集成
      report_system: string                # 报表系统集成
      dictionary_system: string            # 数据字典集成
      
    # 技术栈映射
    technology_mapping:
      backend_mapping:
        spring_boot_configuration: string  # Spring Boot配置
        mybatis_plus_configuration: string # MyBatis-Plus配置
        spring_security_configuration: string # Spring Security配置
        redis_configuration: string        # Redis配置
        
      frontend_mapping:
        vue3_architecture: string          # Vue 3架构
        typescript_configuration: string   # TypeScript配置
        antd_integration: string           # Ant Design Vue集成
        pinia_state_management: string     # Pinia状态管理
        
    # 定制开发指导
    customization_guidance:
      code_generation_customization: string # 代码生成定制
      framework_extension_points: array    # 框架扩展点
        - extension_point: string
          customization_approach: string
          implementation_guidelines: string
      performance_tuning_guidelines: string # 性能调优指导
      
  # 架构决策记录
  architecture_decisions: array
    - decision_id: string
      decision_title: string
      decision_date: datetime
      decision_status: enum                 # proposed|accepted|deprecated|superseded
      decision_context: string              # 决策背景
      decision_options: array               # 决策选项
        - option_name: string
          option_description: string
          pros_and_cons: string
      decision_rationale: string            # 决策理由
      decision_consequences: string         # 决策后果
      decision_owner: string                # 决策负责人
      
  # 架构风险评估
  architecture_risks: array
    - risk_id: string
      risk_category: enum                   # technical|performance|security|integration|maintainability
      risk_description: string
      risk_probability: enum                # high|medium|low
      risk_impact: enum                     # high|medium|low
      risk_level: enum                      # critical|high|medium|low
      mitigation_strategies: array
        - strategy_description: string
          strategy_owner: string
          strategy_timeline: string
      contingency_plans: array
        - plan_description: string
          trigger_conditions: string
          execution_steps: string
          
  # 架构约束
  architectural_constraints:
    business_constraints: array            # 业务约束
      - constraint_type: string
        constraint_description: string
        architectural_impact: string
        
    technical_constraints: array           # 技术约束
      - constraint_type: string
        constraint_description: string
        design_implications: string
        
    regulatory_constraints: array          # 法规约束
      - regulation_name: string
        compliance_requirements: string
        architectural_controls: string
        
  # 架构验证
  architecture_validation:
    validation_criteria: array             # 验证标准
      - criteria_name: string
        criteria_description: string
        validation_method: string
        acceptance_threshold: string
        
    architecture_reviews: array            # 架构评审
      - review_type: enum                   # design|implementation|deployment
        review_participants: array
        review_findings: string
        action_items: array
          - action_description: string
            responsible_party: string
            due_date: datetime
            
  # 实施指导
  implementation_guidance:
    development_approach: string            # 开发方法
    implementation_phases: array            # 实施阶段
      - phase_name: string
        phase_objectives: string
        phase_deliverables: array
        phase_duration: string
        phase_dependencies: string
        
    technology_setup_guide: string         # 技术环境搭建指导
    development_standards: string          # 开发标准和规范
    testing_strategy: string               # 测试策略
    deployment_strategy: string            # 部署策略
    
