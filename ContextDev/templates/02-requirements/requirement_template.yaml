  # CodeGen适用性分析
  codegen_applicability_assessment:
    # 标准CRUD需求（适合CodeGen）
    standard_crud_requirements:
      - requirement_id: "{{CRUD_REQ_ID_1}}"
        business_entity: "{{BUSINESS_ENTITY_1}}" # PascalCase命名
        crud_operations: [{{CRUD_OPERATIONS_1}}] # create | read | update | delete | query | export | import
        codegen_coverage: "{{CODEGEN_COVERAGE_1}}%" # 预估CodeGen覆盖率
        custom_logic_requirements: [{{CUSTOM_LOGIC_1}}] # 需要自定义的部分
        
      - requirement_id: "{{CRUD_REQ_ID_2}}"
        business_entity: "{{BUSINESS_ENTITY_2}}"
        crud_operations: [{{CRUD_OPERATIONS_2}}]
        codegen_coverage: "{{CODEGEN_COVERAGE_2}}%"
        custom_logic_requirements: [{{CUSTOM_LOGIC_2}}]
        # 继续添加CRUD需求...
    
    # 复杂业务需求（需要自定义开发）
    custom_development_requirements:
      - requirement_id: "{{CUSTOM_REQ_ID_1}}"
        complexity_reason: "{{COMPLEXITY_REASON_1}}"
        custom_development_scope: "{{CUSTOM_SCOPE_1}}"
        integration_with_codegen: "{{CODEGEN_INTEGRATION_1}}" # none | partial | full
        estimated_effort: "{{EFFORT_ESTIMATION_1}}" # small | medium | large
        
      - requirement_id: "{{CUSTOM_REQ_ID_2}}"
        complexity_reason: "{{COMPLEXITY_REASON_2}}"
        custom_development_scope: "{{CUSTOM_SCOPE_2}}"
        integration_with_codegen: "{{CODEGEN_INTEGRATION_2}}"
        estimated_effort: "{{EFFORT_ESTIMATION_2}}"
        # 继续添加自定义需求...
  
  # JeecgBoot特性使用分析
  jeecg_feature_usage:
    permission_management: {{USE_PERMISSION}} # true | false
    data_dictionary: {{USE_DICT}} # true | false
    workflow_engine: {{USE_WORKFLOW}} # true | false
    report_generation: {{USE_REPORT}} # true | false
    system_integration: {{USE_INTEGRATION}} # true | false
    
    # 特性使用详细说明
    feature_usage_details:
      - feature: "{{JEECG_FEATURE_1}}"
        usage_scenario: "{{USAGE_SCENARIO_1}}"
        related_requirements: [{{RELATED_REQ_1_1}}, {{RELATED_REQ_1_2}}]
        configuration_needs: "{{CONFIGURATION_NEEDS_1}}"

# ============================================================================
# 质量保证检查点 (Agent-A自检要求)
# ============================================================================
quality_assurance_checkpoints:
  # 格式完整性自检
  format_completeness_check:
    ears_format_validation:
      - check_item: "所有EARS语句符合标准格式"
        validation_result: "{{EARS_FORMAT_VALID}}" # pass | fail
        issue_description: "{{EARS_FORMAT_ISSUES}}"
        
    bdd_scenario_validation:
      - check_item: "所有BDD场景包含Given-When-Then"
        validation_result: "{{BDD_FORMAT_VALID}}" # pass | fail
        issue_description: "{{BDD_FORMAT_ISSUES}}"
        
    traceability_validation:
      - check_item: "所有BDD场景都有源EARS需求ID"
        validation_result: "{{TRACEABILITY_VALID}}" # pass | fail
        issue_description: "{{TRACEABILITY_ISSUES}}"
  
  # 逻辑一致性自检
  logic_consistency_check:
    requirement_dependency_check:
      circular_dependency_detected: {{CIRCULAR_DEPENDENCY}} # true | false
      missing_dependencies: [{{MISSING_DEPENDENCIES}}]
      
    priority_consistency_check:
      priority_conflicts: [{{PRIORITY_CONFLICTS}}]
      priority_alignment_issues: "{{PRIORITY_ISSUES}}"
      
    business_logic_coherence:
      logic_contradictions: [{{LOGIC_CONTRADICTIONS}}]
      missing_business_rules: [{{MISSING_RULES}}]
  
  # 覆盖完整性自检
  coverage_completeness_check:
    ears_type_coverage:
      ubiquitous_coverage: {{UBIQUITOUS_COVERAGE}} # adequate | insufficient
      event_driven_coverage: {{EVENT_DRIVEN_COVERAGE}}
      unwanted_behavior_coverage: {{UNWANTED_COVERAGE}}
      state_driven_coverage: {{STATE_DRIVEN_COVERAGE}}
      optional_coverage: {{OPTIONAL_COVERAGE}}
      
    scenario_type_coverage:
      functional_scenario_coverage: {{FUNCTIONAL_COVERAGE}}
      exception_scenario_coverage: {{EXCEPTION_COVERAGE}}
      boundary_scenario_coverage: {{BOUNDARY_COVERAGE}}
      integration_scenario_coverage: {{INTEGRATION_COVERAGE}}
      
    business_process_coverage:
      end_to_end_process_covered: {{E2E_COVERAGE}} # true | false
      key_business_functions_covered: {{KEY_FUNCTIONS_COVERAGE}}
      stakeholder_needs_covered: {{STAKEHOLDER_COVERAGE}}

