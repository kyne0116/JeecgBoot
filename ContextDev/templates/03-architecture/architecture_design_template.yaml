# ============================================================================
# BDD场景驱动设计 (四种场景类型的设计响应)
# ============================================================================
bdd_scenario_driven_design:
  # 功能场景设计响应 (Functional Scenarios → Implementation Design)
  functional_scenarios_design:
    - scenario_id: "{{SOURCE_BDD_F_ID_1}}" # 来自Agent-A的BDD-F-001
      scenario_title: "{{SOURCE_BDD_F_TITLE_1}}"
      source_requirement_id: "{{SOURCE_BDD_F_REQ_ID_1}}" # 追溯到EARS需求
      
      # BDD场景解析
      bdd_scenario_parsing:
        given_analysis: "{{GIVEN_ANALYSIS_1}}" # 对Given条件的理解和分析
        when_analysis: "{{WHEN_ANALYSIS_1}}" # 对When动作的理解和分析
        then_analysis: "{{THEN_ANALYSIS_1}}" # 对Then结果的理解和分析
        and_conditions_analysis: [{{AND_ANALYSIS_1_1}}]
        but_exceptions_analysis: [{{BUT_ANALYSIS_1_1}}]
        
      # 设计解决方案
      design_solution:
        - solution_id: "SOL-F-001"
          solution_type: "{{SOLUTION_TYPE_1}}" # service_method | controller_action | business_logic | data_validation
          implementation_approach: "{{IMPL_APPROACH_1}}" # codegen | custom | hybrid
          
          # 具体实现设计
          implementation_details:
            class_name: "{{CLASS_NAME_1}}"
            method_name: "{{METHOD_NAME_1}}"
            method_signature: "{{METHOD_SIGNATURE_1}}"
            implementation_logic: "{{IMPLEMENTATION_LOGIC_1}}"
            error_handling: "{{ERROR_HANDLING_1}}"
            
          # 与CodeGen的集成点
          codegen_integration_points:
            - integration_point: "{{INTEGRATION_POINT_1_1}}"
              integration_type: "{{INTEGRATION_TYPE_1_1}}" # hook | override | extension
              integration_description: "{{INTEGRATION_DESC_1_1}}"
              
      # 测试策略设计
      test_strategy_design:
        unit_test_design:
          test_class_name: "{{TEST_CLASS_NAME_1}}"
          test_method_name: "{{TEST_METHOD_NAME_1}}"
          test_given_setup: "{{TEST_GIVEN_SETUP_1}}"
          test_when_execution: "{{TEST_WHEN_EXECUTION_1}}"
          test_then_verification: "{{TEST_THEN_VERIFICATION_1}}"
          
        integration_test_design:
          test_scenario_name: "{{INTEGRATION_TEST_SCENARIO_1}}"
          test_data_requirements: [{{TEST_DATA_REQ_1_1}}]
          test_environment_setup: "{{TEST_ENV_SETUP_1}}"
          
      # 验收标准映射
      acceptance_criteria_mapping:
        - acceptance_criterion: "{{ACCEPTANCE_CRITERION_1}}"
          validation_method: "{{VALIDATION_METHOD_1}}"
          implementation_verification: "{{IMPL_VERIFICATION_1}}"
          
    - scenario_id: "{{SOURCE_BDD_F_ID_2}}"
      scenario_title: "{{SOURCE_BDD_F_TITLE_2}}"
      source_requirement_id: "{{SOURCE_BDD_F_REQ_ID_2}}"
      bdd_scenario_parsing:
        given_analysis: "{{GIVEN_ANALYSIS_2}}"
        when_analysis: "{{WHEN_ANALYSIS_2}}"
        then_analysis: "{{THEN_ANALYSIS_2}}"
        and_conditions_analysis: [{{AND_ANALYSIS_2_1}}]
        but_exceptions_analysis: [{{BUT_ANALYSIS_2_1}}]
      design_solution:
        - solution_id: "SOL-F-002"
          solution_type: "{{SOLUTION_TYPE_2}}"
          implementation_approach: "{{IMPL_APPROACH_2}}"
          implementation_details:
            class_name: "{{CLASS_NAME_2}}"
            method_name: "{{METHOD_NAME_2}}"
            method_signature: "{{METHOD_SIGNATURE_2}}"
            implementation_logic: "{{IMPLEMENTATION_LOGIC_2}}"
            error_handling: "{{ERROR_HANDLING_2}}"
          codegen_integration_points:
            - integration_point: "{{INTEGRATION_POINT_2_1}}"
              integration_type: "{{INTEGRATION_TYPE_2_1}}"
              integration_description: "{{INTEGRATION_DESC_2_1}}"
      test_strategy_design:
        unit_test_design:
          test_class_name: "{{TEST_CLASS_NAME_2}}"
          test_method_name: "{{TEST_METHOD_NAME_2}}"
          test_given_setup: "{{TEST_GIVEN_SETUP_2}}"
          test_when_execution: "{{TEST_WHEN_EXECUTION_2}}"
          test_then_verification: "{{TEST_THEN_VERIFICATION_2}}"
        integration_test_design:
          test_scenario_name: "{{INTEGRATION_TEST_SCENARIO_2}}"
          test_data_requirements: [{{TEST_DATA_REQ_2_1}}]
          test_environment_setup: "{{TEST_ENV_SETUP_2}}"
      acceptance_criteria_mapping:
        - acceptance_criterion: "{{ACCEPTANCE_CRITERION_2}}"
          validation_method: "{{VALIDATION_METHOD_2}}"
          implementation_verification: "{{IMPL_VERIFICATION_2}}"
      # 继续添加功能场景设计...
  
  # 异常场景设计响应 (Exception Scenarios → Error Handling Design)
  exception_scenarios_design:
    - scenario_id: "{{SOURCE_BDD_E_ID_1}}" # 来自Agent-A的BDD-E-001
      scenario_title: "{{SOURCE_BDD_E_TITLE_1}}"
      source_requirement_id: "{{SOURCE_BDD_E_REQ_ID_1}}"
      exception_type: "{{EXCEPTION_TYPE_1}}"
      
      # 异常处理设计
      exception_handling_design:
        - exception_handler_id: "EXC-HANDLER-001"
          exception_detection:
            detection_point: "{{EXCEPTION_DETECTION_POINT_1}}"
            detection_mechanism: "{{EXCEPTION_DETECTION_MECHANISM_1}}"
            detection_timing: "{{EXCEPTION_DETECTION_TIMING_1}}"
            
          exception_response:
            immediate_action: "{{EXCEPTION_IMMEDIATE_ACTION_1}}"
            error_message: "{{EXCEPTION_ERROR_MESSAGE_1}}"
            error_code: "{{EXCEPTION_ERROR_CODE_1}}"
            log_level: "{{EXCEPTION_LOG_LEVEL_1}}"
            
          exception_recovery:
            recovery_strategy: "{{EXCEPTION_RECOVERY_STRATEGY_1}}"
            rollback_mechanism: "{{EXCEPTION_ROLLBACK_1}}"
            compensation_actions: [{{COMPENSATION_ACTION_1_1}}]
            
          # 与CodeGen集成
          codegen_exception_integration:
            global_exception_handler: {{GLOBAL_EXCEPTION_HANDLER_1}} # true | false
            custom_exception_class: "{{CUSTOM_EXCEPTION_CLASS_1}}"
            validation_integration: {{VALIDATION_INTEGRATION_1}}
            
    - scenario_id: "{{SOURCE_BDD_E_ID_2}}"
      scenario_title: "{{SOURCE_BDD_E_TITLE_2}}"
      source_requirement_id: "{{SOURCE_BDD_E_REQ_ID_2}}"
      exception_type: "{{EXCEPTION_TYPE_2}}"
      exception_handling_design:
        - exception_handler_id: "EXC-HANDLER-002"
          exception_detection:
            detection_point: "{{EXCEPTION_DETECTION_POINT_2}}"
            detection_mechanism: "{{EXCEPTION_DETECTION_MECHANISM_2}}"
            detection_timing: "{{EXCEPTION_DETECTION_TIMING_2}}"
          exception_response:
            immediate_action: "{{EXCEPTION_IMMEDIATE_ACTION_2}}"
            error_message: "{{EXCEPTION_ERROR_MESSAGE_2}}"
            error_code: "{{EXCEPTION_ERROR_CODE_2}}"
            log_level: "{{EXCEPTION_LOG_LEVEL_2}}"
          exception_recovery:
            recovery_strategy: "{{EXCEPTION_RECOVERY_STRATEGY_2}}"
            rollback_mechanism: "{{EXCEPTION_ROLLBACK_2}}"
            compensation_actions: [{{COMPENSATION_ACTION_2_1}}]
          codegen_exception_integration:
            global_exception_handler: {{GLOBAL_EXCEPTION_HANDLER_2}}
            custom_exception_class: "{{CUSTOM_EXCEPTION_CLASS_2}}"
            validation_integration: {{VALIDATION_INTEGRATION_2}}
      # 继续添加异常场景设计...
  
  # 边界场景设计响应 (Boundary Scenarios → Validation & Constraint Design)
  boundary_scenarios_design:
    - scenario_id: "{{SOURCE_BDD_B_ID_1}}" # 来自Agent-A的BDD-B-001
      scenario_title: "{{SOURCE_BDD_B_TITLE_1}}"
      source_requirement_id: "{{SOURCE_BDD_B_REQ_ID_1}}"
      boundary_type: "{{BOUNDARY_TYPE_1}}"
      
      # 边界验证设计
      boundary_validation_design:
        - validation_id: "BOUND-VAL-001"
          validation_point: "{{VALIDATION_POINT_1}}" # input | process | output
          boundary_conditions:
            - condition_type: "{{BOUNDARY_CONDITION_TYPE_1_1}}" # min_value | max_value | length_limit | format_constraint
              condition_value: "{{BOUNDARY_CONDITION_VALUE_1_1}}"
              validation_rule: "{{BOUNDARY_VALIDATION_RULE_1_1}}"
              error_message: "{{BOUNDARY_ERROR_MESSAGE_1_1}}"
              
          # 边界测试设计
          boundary_test_design:
            test_cases:
              - test_case_type: "{{BOUNDARY_TEST_TYPE_1_1}}" # below_minimum | at_minimum | above_maximum | invalid_format
                test_input: "{{BOUNDARY_TEST_INPUT_1_1}}"
                expected_result: "{{BOUNDARY_EXPECTED_RESULT_1_1}}"
                expected_behavior: "{{BOUNDARY_EXPECTED_BEHAVIOR_1_1}}"
                
          # 与CodeGen集成
          codegen_boundary_integration:
            validation_annotation: "{{VALIDATION_ANNOTATION_1}}" # @Min, @Max, @Size, @Pattern等
            custom_validator: "{{CUSTOM_VALIDATOR_1}}"
            client_side_validation: {{CLIENT_SIDE_VALIDATION_1}} # true | false
            
    - scenario_id: "{{SOURCE_BDD_B_ID_2}}"
      scenario_title: "{{SOURCE_BDD_B_TITLE_2}}"
      source_requirement_id: "{{SOURCE_BDD_B_REQ_ID_2}}"
      boundary_type: "{{BOUNDARY_TYPE_2}}"
      boundary_validation_design:
        - validation_id: "BOUND-VAL-002"
