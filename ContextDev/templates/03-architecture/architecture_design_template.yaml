      source_requirement_id: "{{SOURCE_BDD_I_REQ_ID_1}}"
      integration_type: "{{INTEGRATION_TYPE_1}}"
      external_system: "{{EXTERNAL_SYSTEM_1}}"
      
      # 集成架构设计
      integration_architecture_design:
        - integration_design_id: "INT-DES-001"
          integration_pattern: "{{INTEGRATION_PATTERN_1}}" # rest_client | message_queue | file_transfer | database_sync
          integration_direction: "{{INTEGRATION_DIRECTION_1}}" # inbound | outbound | bidirectional
          
          # 接口设计
          interface_design:
            interface_name: "{{INTERFACE_NAME_1}}"
            interface_type: "{{INTERFACE_TYPE_1}}" # synchronous | asynchronous
            data_format: "{{DATA_FORMAT_1}}" # json | xml | csv | binary
            protocol: "{{PROTOCOL_1}}" # http | https | ftp | tcp
            
          # 数据映射设计
          data_mapping_design:
            - mapping_id: "MAP-001"
              source_field: "{{SOURCE_FIELD_1_1}}"
              target_field: "{{TARGET_FIELD_1_1}}"
              transformation_rule: "{{TRANSFORMATION_RULE_1_1}}"
              validation_rule: "{{MAPPING_VALIDATION_1_1}}"
              
          # 错误处理设计
          integration_error_handling:
            connection_failure_handling: "{{CONNECTION_FAILURE_HANDLING_1}}"
            timeout_handling: "{{TIMEOUT_HANDLING_1}}"
            data_format_error_handling: "{{DATA_FORMAT_ERROR_HANDLING_1}}"
            retry_strategy: "{{RETRY_STRATEGY_1}}"
            circuit_breaker_pattern: {{CIRCUIT_BREAKER_1}} # true | false
            
          # 与CodeGen集成
          codegen_integration_design:
            integration_service_generation: {{INTEGRATION_SERVICE_GEN_1}} # true | false
