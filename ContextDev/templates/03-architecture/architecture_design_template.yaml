                expected_behavior: "{{BOUNDARY_EXPECTED_BEHAVIOR_2_1}}"
          codegen_boundary_integration:
            validation_annotation: "{{VALIDATION_ANNOTATION_2}}"
            custom_validator: "{{CUSTOM_VALIDATOR_2}}"
            client_side_validation: {{CLIENT_SIDE_VALIDATION_2}}
      # 继续添加边界场景设计...
  
  # 集成场景设计响应 (Integration Scenarios → Integration Architecture Design)
  integration_scenarios_design:
