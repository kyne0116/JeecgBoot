# ============================================================================
# 设计质量验证 (Agent-B自检要求)
# ============================================================================
design_quality_validation:
  # 追溯完整性验证
  traceability_completeness_validation:
    requirement_coverage_check:
      - validation_item: "所有EARS需求都有对应的设计决策"
        validation_result: "{{REQ_COVERAGE_VALID}}" # pass | fail
        coverage_percentage: "{{REQ_COVERAGE_PERCENTAGE}}%" # 目标100%
        missing_coverage: [{{MISSING_COVERAGE_1}}]
        
    scenario_coverage_check:
      - validation_item: "所有BDD场景都有对应的实现设计"
        validation_result: "{{SCENARIO_COVERAGE_VALID}}" # pass | fail
        coverage_percentage: "{{SCENARIO_COVERAGE_PERCENTAGE}}%" # 目标100%
        missing_implementations: [{{MISSING_IMPL_1}}]
        
    design_decision_traceability:
      - validation_item: "所有设计决策都能追溯到源需求"
        validation_result: "{{DECISION_TRACEABILITY_VALID}}" # pass | fail
        orphaned_decisions: [{{ORPHANED_DECISION_1}}] # 无源需求的设计决策
        
  # 设计一致性验证
  design_consistency_validation:
    entity_relationship_consistency:
      - validation_item: "实体关系设计与业务规则一致"
        validation_result: "{{ENTITY_REL_CONSISTENT}}" # pass | fail
        inconsistency_issues: [{{INCONSISTENCY_ISSUE_1}}]
        
    module_interface_consistency:
      - validation_item: "模块接口设计与服务职责一致"
        validation_result: "{{MODULE_INTERFACE_CONSISTENT}}" # pass | fail
        interface_issues: [{{INTERFACE_ISSUE_1}}]
        
    codegen_config_consistency:
      - validation_item: "CodeGen配置与实体设计一致"
        validation_result: "{{CODEGEN_CONFIG_CONSISTENT}}" # pass | fail
        configuration_conflicts: [{{CONFIG_CONFLICT_1}}]
        
  # 实现可行性验证
  implementation_feasibility_validation:
    technical_feasibility_check:
      - validation_item: "所有设计方案在JeecgBoot框架下可实现"
        validation_result: "{{TECH_FEASIBLE}}" # pass | fail
        infeasible_designs: [{{INFEASIBLE_DESIGN_1}}]
        alternative_suggestions: [{{ALTERNATIVE_SUGGESTION_1}}]
        
    codegen_applicability_check:
      - validation_item: "CodeGen覆盖率估算合理"
        validation_result: "{{CODEGEN_ESTIMATE_REASONABLE}}" # pass | fail
        estimated_coverage: "{{ESTIMATED_CODEGEN_COVERAGE}}%"
        coverage_justification: "{{COVERAGE_JUSTIFICATION}}"
        
    dependency_resolution_check:
      - validation_item: "模块依赖关系可以实现"
        validation_result: "{{DEPENDENCY_RESOLVABLE}}" # pass | fail
        circular_dependencies: [{{CIRCULAR_DEPENDENCY_1}}]
        unresolvable_dependencies: [{{UNRESOLVABLE_DEP_1}}]
        
  # 业务价值验证
  business_value_validation:
    requirement_value_alignment:
      - validation_item: "设计解决方案与业务目标对齐"
        validation_result: "{{BUSINESS_ALIGNED}}" # pass | fail
        misalignment_issues: [{{MISALIGNMENT_ISSUE_1}}]
        
    priority_implementation_check:
      - validation_item: "高优先级需求得到优先实现"
        validation_result: "{{PRIORITY_RESPECTED}}" # pass | fail
        priority_violations: [{{PRIORITY_VIOLATION_1}}]
        
  # 整体质量评分
  overall_quality_score:
    traceability_score: "{{TRACEABILITY_SCORE}}/100" # 目标>95
    consistency_score: "{{CONSISTENCY_SCORE}}/100" # 目标>90
    feasibility_score: "{{FEASIBILITY_SCORE}}/100" # 目标>95
    business_value_score: "{{BUSINESS_VALUE_SCORE}}/100" # 目标>85
    overall_weighted_score: "{{OVERALL_DESIGN_SCORE}}/100" # 目标>90

