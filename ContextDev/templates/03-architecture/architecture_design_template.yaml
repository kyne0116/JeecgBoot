# JeecgBoot AI Agent协作架构设计模板 v4.0
# 基于BDD/EARS需求追溯的结构化架构设计，专为Agent-B（架构设计师）设计
# 支持三层架构的Layer 3 - 需求层 (Requirement Level)

# ============================================================================
# 📁 v4.0 三层架构存储规范 (重要更新)
# ============================================================================
# 本模板属于: Layer 3 - 需求层 (Requirement Level)
# 命名格式: [SYSTEM]-[MODULE]-[TIMESTAMP]-ARCH-[TITLE].yaml
# 存储位置: ${base_working_directory}/AIGC/[SYSTEM]_[MODULE]/[SYSTEM]-[MODULE]-[TIMESTAMP]-ARCH-[TITLE].yaml
# 
# 示例路径:
# - 汽车4S店-基础信息: /Users/admin/Work/Github/JeecgBoot/AIGC/AUTO_INFO/AUTO-INFO-20250731150000-ARCH-汽车基本信息维护.yaml
# - 汽车4S店-销售信息: /Users/admin/Work/Github/JeecgBoot/AIGC/AUTO_SALE/AUTO-SALE-20250731160000-ARCH-汽车销售信息维护.yaml
#
# Agent-B协作链位置:
# - 输入: AUTO-INFO-20250731150000-REQ-汽车基本信息维护.yaml (Agent-A产出)
# - 输出: AUTO-INFO-20250731150000-ARCH-汽车基本信息维护.yaml (Agent-B产出)
# - 下游: AUTO-INFO-20250731150000-DEV-汽车基本信息维护.yaml (传递给Agent-C)
# ============================================================================
#
# ============================================================================
# 📁 新文件命名规范 (重要更新)
# ============================================================================
# 需求编号格式: 系统功能模块-子功能模块-年月日时分秒
# 示例: ECOM-PROD-20250731143000 (电商-产品管理-2025年7月31日14:30:00)
#
# 此文档命名: ECOM-PROD-20250731143000-ARCH-产品管理功能.yaml
# 建议保存路径: /ContextDev/example/ECOM-PROD-20250731143000-产品管理功能/ECOM-PROD-20250731143000-ARCH-产品管理功能.yaml
# 输入依赖: 同目录下的 ECOM-PROD-20250731143000-REQ-产品管理功能.yaml
#
# 命名说明:
# - ARCH: 标识这是架构设计环节的文档
# - 其他命名规则与需求文档保持一致
# ============================================================================

# ============================================================================
# Agent协作协议声明
# ============================================================================
agent_collaboration_protocol:
  source_agent: "Agent-B (架构设计师)"
  input_from_agent: "Agent-A (需求分析师)"
  communication_standard: "BDD/EARS结构化协议"
  traceability_requirement: "100%需求追溯，所有设计决策必须映射到源需求"
  quality_target: "设计一致性>90%, 实现可行性>95%"
  processing_time_target: "<60秒/需求项"

# ============================================================================
# 设计输入解析 (从Agent-A需求文档解析)
# ============================================================================
design_input_parsing:
  # 基线和系统关联信息
  baseline_and_system_reference:
    # 需求基线引用
    baseline_reference:
      baseline_id: "{{BASELINE_ID}}" # 来自需求基线模板
      baseline_version: "{{BASELINE_VERSION}}" # 基线版本
      requirement_suite_id: "{{REQUIREMENT_SUITE_ID}}" # 本需求在基线中的套件ID
      baseline_doc_path: "{{BASELINE_DOC_PATH}}" # 基线文档路径
      
    # 系统基础信息引用  
    system_reference:
      system_id: "{{SYSTEM_ID}}" # 来自系统基础模板
      system_name: "{{SYSTEM_NAME}}" # 系统名称
      system_base_doc_path: "{{SYSTEM_BASE_DOC_PATH}}" # 系统基础文档路径
      jeecg_version: "{{JEECG_VERSION}}" # 继承的JeecgBoot版本
      tech_stack_reference: "{{TECH_STACK_REFERENCE}}" # 技术栈约束
      
  # 需求文档引用
  requirement_document_reference:
    source_requirement_doc_id: "{{SOURCE_REQ_DOC_ID}}" # 来自Agent-A的文档ID
    source_requirement_doc_path: "{{SOURCE_REQ_DOC_PATH}}" # Agent-A文档路径
    requirement_doc_version: "{{REQ_DOC_VERSION}}"
    parsing_timestamp: "{{PARSING_TIMESTAMP}}"
    agent_b_version: "Agent-B v{{VERSION}}"
    
    # 追溯链延续
    inherited_traceability:
      baseline_traceability_id: "{{BASELINE_TRACEABILITY_ID}}" # 来自Agent-A
      system_traceability_id: "{{SYSTEM_TRACEABILITY_ID}}" # 来自Agent-A
    
  # 输入解析验证
  input_parsing_validation:
    ears_format_validation:
      total_ears_requirements_parsed: {{PARSED_EARS_COUNT}}
      parsing_success_rate: "{{PARSING_SUCCESS_RATE}}%" # 目标>95%
      parsing_errors: [{{PARSING_ERROR_1}}, {{PARSING_ERROR_2}}]
      
    bdd_scenario_validation:
      total_bdd_scenarios_parsed: {{PARSED_BDD_COUNT}}
      scenario_completeness_check: "{{SCENARIO_COMPLETENESS}}" # pass | fail
      missing_given_when_then: [{{MISSING_GWT_1}}]
      
    traceability_validation:
      traceability_chain_integrity: "{{TRACEABILITY_INTEGRITY}}" # complete | incomplete
      orphaned_scenarios: [{{ORPHANED_SCENARIO_1}}] # 没有源需求的BDD场景
      unmapped_requirements: [{{UNMAPPED_REQ_1}}] # 没有BDD场景的EARS需求
      
  # 理解验证检查
  understanding_verification:
    business_context_comprehension:
      business_domain_identified: "{{BUSINESS_DOMAIN}}"
      core_business_processes: [{{CORE_PROCESS_1}}, {{CORE_PROCESS_2}}]
      stakeholder_roles_understood: [{{STAKEHOLDER_ROLE_1}}, {{STAKEHOLDER_ROLE_2}}]
      
    technical_feasibility_assessment:
      jeecg_framework_compatibility: "{{JEECG_COMPATIBILITY}}" # high | medium | low
      codegen_applicability_confirmed: "{{CODEGEN_CONFIRMED}}%" # 与Agent-A估算的对比
      technical_complexity_assessment: "{{TECH_COMPLEXITY}}" # simple | medium | complex
      
    requirement_priority_analysis:
      high_priority_requirements: [{{HIGH_PRIORITY_REQ_1}}, {{HIGH_PRIORITY_REQ_2}}]
      dependency_critical_requirements: [{{CRITICAL_DEP_REQ_1}}]
      optional_requirements_identified: [{{OPTIONAL_REQ_1}}]

# ============================================================================
# EARS需求到设计决策映射 (逐一响应)
# ============================================================================
ears_to_design_mapping:
  # 通用需求设计响应 (Ubiquitous Requirements → Standard Design Patterns)
  ubiquitous_requirements_response:
    - requirement_id: "{{SOURCE_EARS_U_ID_1}}" # 来自Agent-A的REQ-U-001
      ears_statement: "{{SOURCE_EARS_STATEMENT_1}}" # 重复源EARS语句以确保理解正确
      
      # 设计决策
      design_decisions:
        - decision_id: "DES-U-001"
          decision_type: "architecture_pattern"
          chosen_pattern: "{{CHOSEN_PATTERN_1}}" # standard_crud | enhanced_crud | custom_service
          pattern_rationale: "{{PATTERN_RATIONALE_1}}"
          
        - decision_id: "DES-U-002"
          decision_type: "implementation_approach"
          chosen_approach: "{{CHOSEN_APPROACH_1}}" # codegen | custom | hybrid
          approach_rationale: "{{APPROACH_RATIONALE_1}}"
          codegen_coverage_estimate: "{{CODEGEN_COVERAGE_1}}%"
          
      # 领域模型设计
      domain_model_response:
        primary_entity: "{{PRIMARY_ENTITY_1}}" # PascalCase
        entity_description: "{{ENTITY_DESCRIPTION_1}}"
        table_name: "{{TABLE_NAME_1}}" # us_module_submodule_entity
        
        # 核心属性设计 (基于EARS需求推导)
        core_attributes:
          - attribute_name: "{{ATTR_NAME_1_1}}"
            attribute_type: "{{ATTR_TYPE_1_1}}" # String | Integer | BigDecimal | Date | LocalDateTime
            business_meaning: "{{ATTR_BUSINESS_MEANING_1_1}}"
            source_requirement_rationale: "{{ATTR_SOURCE_RATIONALE_1_1}}"
            required: {{ATTR_REQUIRED_1_1}} # true | false
            dict_code: "{{ATTR_DICT_CODE_1_1}}" # 使用现有字典或新建字典
            validation_rules: "{{ATTR_VALIDATION_1_1}}"
            
          - attribute_name: "{{ATTR_NAME_1_2}}"
            attribute_type: "{{ATTR_TYPE_1_2}}"
            business_meaning: "{{ATTR_BUSINESS_MEANING_1_2}}"
            source_requirement_rationale: "{{ATTR_SOURCE_RATIONALE_1_2}}"
            required: {{ATTR_REQUIRED_1_2}}
            dict_code: "{{ATTR_DICT_CODE_1_2}}"
            validation_rules: "{{ATTR_VALIDATION_1_2}}"
            # 继续添加属性...
            
        # 关系设计
        relationships:
          - relationship_id: "REL-001"
            target_entity: "{{TARGET_ENTITY_1_1}}"
            relationship_type: "{{REL_TYPE_1_1}}" # one_to_one | one_to_many | many_to_many
            business_justification: "{{REL_BUSINESS_JUSTIFICATION_1_1}}"
            source_requirement_reference: "{{REL_SOURCE_REQ_1_1}}"
            implementation_strategy: "{{REL_IMPL_STRATEGY_1_1}}"
            
      # CodeGen配置设计
      codegen_configuration:
        module_name: "{{MODULE_NAME_1}}" # lowercase
        submodule_name: "{{SUBMODULE_NAME_1}}" # lowercase  
        business_entity: "{{BUSINESS_ENTITY_1}}" # PascalCase
        
        # 功能开关配置
        function_switches:
          enable_add: {{ENABLE_ADD_1}} # true | false
          enable_edit: {{ENABLE_EDIT_1}}
          enable_delete: {{ENABLE_DELETE_1}}
          enable_query: {{ENABLE_QUERY_1}}
          enable_export: {{ENABLE_EXPORT_1}}
          enable_import: {{ENABLE_IMPORT_1}}
          
        # 页面配置
        page_configuration:
          list_page_title: "{{LIST_PAGE_TITLE_1}}"
          form_page_title: "{{FORM_PAGE_TITLE_1}}"
          search_fields: [{{SEARCH_FIELD_1_1}}, {{SEARCH_FIELD_1_2}}]
          display_fields: [{{DISPLAY_FIELD_1_1}}, {{DISPLAY_FIELD_1_2}}]
          sort_fields: [{{SORT_FIELD_1_1}}]
          
    - requirement_id: "{{SOURCE_EARS_U_ID_2}}"
      ears_statement: "{{SOURCE_EARS_STATEMENT_2}}"
      design_decisions:
        - decision_id: "DES-U-003"
          decision_type: "architecture_pattern"
          chosen_pattern: "{{CHOSEN_PATTERN_2}}"
          pattern_rationale: "{{PATTERN_RATIONALE_2}}"
      domain_model_response:
        primary_entity: "{{PRIMARY_ENTITY_2}}"
        entity_description: "{{ENTITY_DESCRIPTION_2}}"
        table_name: "{{TABLE_NAME_2}}"
        core_attributes:
          - attribute_name: "{{ATTR_NAME_2_1}}"
            attribute_type: "{{ATTR_TYPE_2_1}}"
            business_meaning: "{{ATTR_BUSINESS_MEANING_2_1}}"
            source_requirement_rationale: "{{ATTR_SOURCE_RATIONALE_2_1}}"
            required: {{ATTR_REQUIRED_2_1}}
            dict_code: "{{ATTR_DICT_CODE_2_1}}"
        relationships:
          - relationship_id: "REL-002"
            target_entity: "{{TARGET_ENTITY_2_1}}"
            relationship_type: "{{REL_TYPE_2_1}}"
            business_justification: "{{REL_BUSINESS_JUSTIFICATION_2_1}}"
            source_requirement_reference: "{{REL_SOURCE_REQ_2_1}}"
      codegen_configuration:
        module_name: "{{MODULE_NAME_2}}"
        submodule_name: "{{SUBMODULE_NAME_2}}"
        business_entity: "{{BUSINESS_ENTITY_2}}"
        function_switches:
          enable_add: {{ENABLE_ADD_2}}
          enable_edit: {{ENABLE_EDIT_2}}
          enable_delete: {{ENABLE_DELETE_2}}
          enable_query: {{ENABLE_QUERY_2}}
        page_configuration:
          list_page_title: "{{LIST_PAGE_TITLE_2}}"
          form_page_title: "{{FORM_PAGE_TITLE_2}}"
          search_fields: [{{SEARCH_FIELD_2_1}}]
          display_fields: [{{DISPLAY_FIELD_2_1}}]
      # 继续添加通用需求响应...
  
  # 事件驱动需求设计响应 (Event-driven Requirements → Event-Driven Architecture)
  event_driven_requirements_response:
    - requirement_id: "{{SOURCE_EARS_E_ID_1}}" # 来自Agent-A的REQ-E-001
      ears_statement: "{{SOURCE_EARS_E_STATEMENT_1}}"
      
      # 事件架构设计
      event_architecture_design:
        - event_design_id: "EVT-DES-001"
          event_name: "{{EVENT_NAME_1}}"
          event_source: "{{EVENT_SOURCE_1}}" # 来自Agent-A的分析结果
          event_trigger: "{{EVENT_TRIGGER_1}}"
          
          # 事件处理设计
          event_handler_design:
            handler_class_name: "{{HANDLER_CLASS_NAME_1}}"
            handler_method: "{{HANDLER_METHOD_1}}"
            handler_logic: "{{HANDLER_LOGIC_1}}"
            error_handling_strategy: "{{ERROR_HANDLING_STRATEGY_1}}"
            
          # 事件响应设计
          event_response_design:
            response_type: "{{RESPONSE_TYPE_1}}" # sync | async | batch
            response_timing: "{{RESPONSE_TIMING_1}}" # immediate | delayed | scheduled
            response_actions: [{{RESPONSE_ACTION_1_1}}, {{RESPONSE_ACTION_1_2}}]
            
          # 与CodeGen集成
          codegen_integration:
            custom_logic_required: {{CUSTOM_LOGIC_REQUIRED_1}} # true | false
            custom_implementation_scope: "{{CUSTOM_IMPL_SCOPE_1}}"
            codegen_hook_points: [{{HOOK_POINT_1_1}}] # 需要在CodeGen生成代码中添加钩子的地方
            
    - requirement_id: "{{SOURCE_EARS_E_ID_2}}"
      ears_statement: "{{SOURCE_EARS_E_STATEMENT_2}}"
      event_architecture_design:
        - event_design_id: "EVT-DES-002"
          event_name: "{{EVENT_NAME_2}}"
          event_source: "{{EVENT_SOURCE_2}}"
          event_trigger: "{{EVENT_TRIGGER_2}}"
          event_handler_design:
            handler_class_name: "{{HANDLER_CLASS_NAME_2}}"
            handler_method: "{{HANDLER_METHOD_2}}"
            handler_logic: "{{HANDLER_LOGIC_2}}"
            error_handling_strategy: "{{ERROR_HANDLING_STRATEGY_2}}"
          event_response_design:
            response_type: "{{RESPONSE_TYPE_2}}"
            response_timing: "{{RESPONSE_TIMING_2}}"
            response_actions: [{{RESPONSE_ACTION_2_1}}]
          codegen_integration:
            custom_logic_required: {{CUSTOM_LOGIC_REQUIRED_2}}
            custom_implementation_scope: "{{CUSTOM_IMPL_SCOPE_2}}"
            codegen_hook_points: [{{HOOK_POINT_2_1}}]
      # 继续添加事件驱动需求响应...
  
  # 不希望行为需求设计响应 (Unwanted Behavior → Defensive Programming & Validation)
  unwanted_behavior_requirements_response:
    - requirement_id: "{{SOURCE_EARS_UB_ID_1}}" # 来自Agent-A的REQ-UB-001
      ears_statement: "{{SOURCE_EARS_UB_STATEMENT_1}}"
      
      # 防护设计
      defensive_design:
        - protection_design_id: "PROTECT-001"
          unwanted_condition: "{{UNWANTED_CONDITION_1}}" # 来自Agent-A的分析
          risk_level: "{{RISK_LEVEL_1}}" # high | medium | low
          
          # 检测机制设计
          detection_mechanism:
            detection_point: "{{DETECTION_POINT_1}}" # where to detect
            detection_method: "{{DETECTION_METHOD_1}}" # how to detect
            detection_timing: "{{DETECTION_TIMING_1}}" # when to detect
            
          # 预防措施设计
          prevention_measures:
            - prevention_id: "PREV-001"
              prevention_type: "{{PREVENTION_TYPE_1}}" # validation | authorization | rate_limiting | sanitization
              prevention_implementation: "{{PREVENTION_IMPL_1}}"
              integration_with_codegen: "{{PREV_CODEGEN_INTEGRATION_1}}"
              
          # 恢复机制设计
          recovery_mechanism:
            recovery_strategy: "{{RECOVERY_STRATEGY_1}}" # rollback | compensate | alert | shutdown
            recovery_implementation: "{{RECOVERY_IMPL_1}}"
            recovery_notification: "{{RECOVERY_NOTIFICATION_1}}"
            
          # 日志与监控设计
          logging_monitoring:
            log_level: "{{LOG_LEVEL_1}}" # error | warn | info | debug
            log_content: "{{LOG_CONTENT_1}}"
            monitoring_metrics: [{{MONITORING_METRIC_1_1}}]
            alert_conditions: [{{ALERT_CONDITION_1_1}}]
            
    - requirement_id: "{{SOURCE_EARS_UB_ID_2}}"
      ears_statement: "{{SOURCE_EARS_UB_STATEMENT_2}}"
      defensive_design:
        - protection_design_id: "PROTECT-002"
          unwanted_condition: "{{UNWANTED_CONDITION_2}}"
          risk_level: "{{RISK_LEVEL_2}}"
          detection_mechanism:
            detection_point: "{{DETECTION_POINT_2}}"
            detection_method: "{{DETECTION_METHOD_2}}"
            detection_timing: "{{DETECTION_TIMING_2}}"
          prevention_measures:
            - prevention_id: "PREV-002"
              prevention_type: "{{PREVENTION_TYPE_2}}"
              prevention_implementation: "{{PREVENTION_IMPL_2}}"
              integration_with_codegen: "{{PREV_CODEGEN_INTEGRATION_2}}"
          recovery_mechanism:
            recovery_strategy: "{{RECOVERY_STRATEGY_2}}"
            recovery_implementation: "{{RECOVERY_IMPL_2}}"
            recovery_notification: "{{RECOVERY_NOTIFICATION_2}}"
          logging_monitoring:
            log_level: "{{LOG_LEVEL_2}}"
            log_content: "{{LOG_CONTENT_2}}"
            monitoring_metrics: [{{MONITORING_METRIC_2_1}}]
            alert_conditions: [{{ALERT_CONDITION_2_1}}]
      # 继续添加不希望行为需求响应...
  
  # 状态驱动需求设计响应 (State-driven Requirements → State Machine Design)
  state_driven_requirements_response:
    - requirement_id: "{{SOURCE_EARS_S_ID_1}}" # 来自Agent-A的REQ-S-001
      ears_statement: "{{SOURCE_EARS_S_STATEMENT_1}}"
      
      # 状态机设计
      state_machine_design:
        - state_machine_id: "SM-001"
          entity_name: "{{STATE_MACHINE_ENTITY_1}}"
          state_field_name: "{{STATE_FIELD_NAME_1}}" # 状态字段名
          
          # 状态定义
          state_definitions:
            - state_id: "{{STATE_ID_1_1}}"
              state_name: "{{STATE_NAME_1_1}}"
              state_value: "{{STATE_VALUE_1_1}}" # 存储在数据库中的值
              state_description: "{{STATE_DESCRIPTION_1_1}}"
              is_initial_state: {{IS_INITIAL_STATE_1_1}} # true | false
              is_final_state: {{IS_FINAL_STATE_1_1}} # true | false
              
            - state_id: "{{STATE_ID_1_2}}"
              state_name: "{{STATE_NAME_1_2}}"
              state_value: "{{STATE_VALUE_1_2}}"
              state_description: "{{STATE_DESCRIPTION_1_2}}"
              is_initial_state: {{IS_INITIAL_STATE_1_2}}
              is_final_state: {{IS_FINAL_STATE_1_2}}
              # 继续添加状态...
              
          # 状态转换设计
          state_transitions:
            - transition_id: "TRANS-001"
              from_state: "{{FROM_STATE_1_1}}"
              to_state: "{{TO_STATE_1_1}}"
              transition_name: "{{TRANSITION_NAME_1_1}}"
              trigger_condition: "{{TRIGGER_CONDITION_1_1}}"
              guard_conditions: [{{GUARD_CONDITION_1_1_1}}] # 额外的前置条件
              transition_actions: [{{TRANSITION_ACTION_1_1_1}}] # 转换时执行的动作
              
            - transition_id: "TRANS-002"
              from_state: "{{FROM_STATE_1_2}}"
              to_state: "{{TO_STATE_1_2}}"
              transition_name: "{{TRANSITION_NAME_1_2}}"
              trigger_condition: "{{TRIGGER_CONDITION_1_2}}"
              guard_conditions: [{{GUARD_CONDITION_1_2_1}}]
              transition_actions: [{{TRANSITION_ACTION_1_2_1}}]
              # 继续添加转换...
              
          # 状态行为设计
          state_behaviors:
            - state_behavior_id: "BEHAV-001"
              target_state: "{{TARGET_STATE_1_1}}"
              behavior_type: "{{BEHAVIOR_TYPE_1_1}}" # entry | exit | during
              behavior_description: "{{BEHAVIOR_DESCRIPTION_1_1}}"
              behavior_implementation: "{{BEHAVIOR_IMPLEMENTATION_1_1}}"
              
          # 与CodeGen集成
          codegen_state_integration:
            state_enum_generation: {{GENERATE_STATE_ENUM_1}} # true | false
            state_validation_generation: {{GENERATE_STATE_VALIDATION_1}} # true | false
            transition_method_generation: {{GENERATE_TRANSITION_METHODS_1}} # true | false
            state_change_log_generation: {{GENERATE_STATE_LOG_1}} # true | false
            
    - requirement_id: "{{SOURCE_EARS_S_ID_2}}"
      ears_statement: "{{SOURCE_EARS_S_STATEMENT_2}}"
      state_machine_design:
        - state_machine_id: "SM-002"
          entity_name: "{{STATE_MACHINE_ENTITY_2}}"
          state_field_name: "{{STATE_FIELD_NAME_2}}"
          state_definitions:
            - state_id: "{{STATE_ID_2_1}}"
              state_name: "{{STATE_NAME_2_1}}"
              state_value: "{{STATE_VALUE_2_1}}"
              state_description: "{{STATE_DESCRIPTION_2_1}}"
              is_initial_state: {{IS_INITIAL_STATE_2_1}}
              is_final_state: {{IS_FINAL_STATE_2_1}}
          state_transitions:
            - transition_id: "TRANS-003"
              from_state: "{{FROM_STATE_2_1}}"
              to_state: "{{TO_STATE_2_1}}"
              transition_name: "{{TRANSITION_NAME_2_1}}"
              trigger_condition: "{{TRIGGER_CONDITION_2_1}}"
              guard_conditions: [{{GUARD_CONDITION_2_1_1}}]
              transition_actions: [{{TRANSITION_ACTION_2_1_1}}]
          state_behaviors:
            - state_behavior_id: "BEHAV-002"
              target_state: "{{TARGET_STATE_2_1}}"
              behavior_type: "{{BEHAVIOR_TYPE_2_1}}"
              behavior_description: "{{BEHAVIOR_DESCRIPTION_2_1}}"
              behavior_implementation: "{{BEHAVIOR_IMPLEMENTATION_2_1}}"
          codegen_state_integration:
            state_enum_generation: {{GENERATE_STATE_ENUM_2}}
            state_validation_generation: {{GENERATE_STATE_VALIDATION_2}}
            transition_method_generation: {{GENERATE_TRANSITION_METHODS_2}}
            state_change_log_generation: {{GENERATE_STATE_LOG_2}}
      # 继续添加状态驱动需求响应...
  
  # 可选需求设计响应 (Optional Requirements → Configurable Features)
  optional_requirements_response:
    - requirement_id: "{{SOURCE_EARS_O_ID_1}}" # 来自Agent-A的REQ-O-001
      ears_statement: "{{SOURCE_EARS_O_STATEMENT_1}}"
      
      # 可选功能设计
      optional_feature_design:
        - optional_feature_id: "OPT-001"
          feature_name: "{{OPTIONAL_FEATURE_NAME_1}}"
          implementation_priority: "{{IMPL_PRIORITY_1}}" # phase_1 | phase_2 | phase_3 | future
          business_value_score: {{BUSINESS_VALUE_SCORE_1}} # 1-10
