      source_requirements: [{{SOURCE_REQUIREMENT_1_1}}, {{SOURCE_REQUIREMENT_1_2}}] # 来源需求追溯
      
      # 模块内实体设计
      module_entities:
        - entity_name: "{{MODULE_ENTITY_1_1}}"
          entity_role: "{{ENTITY_ROLE_1_1}}" # aggregate_root | entity | value_object
          related_ears_requirements: [{{RELATED_EARS_1_1_1}}]
          related_bdd_scenarios: [{{RELATED_BDD_1_1_1}}]
          
