# JeecgBoot需求基线跟踪管理模板
# 系统基础信息与多需求关联管理的核心桥梁
# 支持一个系统的多个需求全生命周期跟踪

# ============================================================================
# 基线标识与元数据信息
# ============================================================================
baseline_identity:
  # 基线文档标识
  baseline_id: "REQ-BASELINE-{{YYYYMMDD}}-{{SEQUENCE}}" # 如：REQ-BASELINE-20250731-001
  baseline_name: "{{BASELINE_NAME}}" # 如：电商系统需求基线V1.0
  baseline_version: "{{BASELINE_VERSION}}" # 如：v1.0
  created_timestamp: "{{YYYY-MM-DD HH:MM:SS}}"
  last_updated: "{{YYYY-MM-DD HH:MM:SS}}"
  baseline_status: "{{BASELINE_STATUS}}" # active | archived | deprecated
  
  # 基线负责人信息
  baseline_owner: "{{OWNER_NAME}}" # 需求基线负责人
  baseline_team: [{{TEAM_MEMBERS}}] # 相关团队成员
  review_board: [{{REVIEW_BOARD_MEMBERS}}] # 评审委员会成员

# ============================================================================
# 系统基础信息关联
# ============================================================================
system_base_reference:
  # 系统基础文档引用
  system_base_doc_path: "{{SYSTEM_BASE_DOC_PATH}}" # 如：/ContextDev/templates/01-baseline/system_base_info.yaml
  system_id: "{{SYSTEM_ID}}" # 来自系统基础文档的系统标识
  system_name: "{{SYSTEM_NAME}}" # 来自系统基础文档的系统名称
  
  # 继承的系统配置
  inherited_system_config:
    jeecg_version: "{{JEECG_VERSION}}" # 继承JeecgBoot版本
    base_working_directory: "{{BASE_WORKING_DIRECTORY}}" # 继承工作目录
    tech_stack_reference: "{{TECH_STACK_REFERENCE}}" # 技术栈引用
    environment_matrix: [{{ENVIRONMENT_MATRIX}}] # 环境配置引用
    
  # 系统约束条件
  system_constraints:
    architectural_constraints: [{{ARCHITECTURAL_CONSTRAINTS}}] # 架构约束
    technical_constraints: [{{TECHNICAL_CONSTRAINTS}}] # 技术约束
    business_constraints: [{{BUSINESS_CONSTRAINTS}}] # 业务约束
    compliance_requirements: [{{COMPLIANCE_REQUIREMENTS}}] # 合规要求

# ============================================================================
# 共享组件管理 (第二轮评估反馈新增)
# ============================================================================
shared_components_management:
  # 共享组件概览
  shared_components_overview:
    total_shared_components: {{TOTAL_SHARED_COMPONENTS}}
    cross_suite_dependencies: {{CROSS_SUITE_DEPENDENCIES}}
    shared_entities_count: {{SHARED_ENTITIES_COUNT}}
    shared_services_count: {{SHARED_SERVICES_COUNT}}
    
  # 共享组件注册表
  shared_component_registry:
    - component_id: "SHARED-COMP-001"
      component_name: "{{SHARED_COMPONENT_NAME_1}}" # 如：UserEntity
      component_type: "{{COMPONENT_TYPE_1}}" # entity | service | util | config
      component_description: "{{COMPONENT_DESCRIPTION_1}}"
      
      # 使用此组件的需求套件
      consuming_suites:
        - suite_id: "{{CONSUMING_SUITE_ID_1}}" # 如：REQ-SUITE-001-产品管理功能
          usage_type: "{{USAGE_TYPE_1}}" # dependency | inheritance | composition
          usage_description: "{{USAGE_DESCRIPTION_1}}"
          
        - suite_id: "{{CONSUMING_SUITE_ID_2}}" # 如：REQ-SUITE-002-购物车管理功能
          usage_type: "{{USAGE_TYPE_2}}"
          usage_description: "{{USAGE_DESCRIPTION_2}}"
          
      # 组件管理信息
      component_management:
        owner_suite: "{{OWNER_SUITE_1}}" # 主要负责的需求套件
        version: "{{COMPONENT_VERSION_1}}" # 组件版本
        stability_level: "{{STABILITY_LEVEL_1}}" # stable | evolving | experimental
        change_impact_level: "{{CHANGE_IMPACT_LEVEL_1}}" # high | medium | low
        
  # 跨需求组件依赖图
  cross_suite_dependency_graph:
    - source_suite: "{{SOURCE_SUITE_1}}" # 如：REQ-SUITE-001-产品管理功能
      target_suite: "{{TARGET_SUITE_1}}" # 如：REQ-SUITE-002-购物车管理功能
      dependency_type: "data_dependency"
      shared_components: [{{SHARED_COMPONENTS_LIST_1}}] # 共享的组件列表
      dependency_strength: "{{DEPENDENCY_STRENGTH_1}}" # strong | medium | weak

# ============================================================================
# 需求套件注册管理 (基于第二轮评估反馈优化)
# ============================================================================
requirement_registry:
  # 需求注册摘要
  registry_summary:
    total_requirements: {{TOTAL_REQUIREMENTS}} # 总需求数量
    active_requirements: {{ACTIVE_REQUIREMENTS}} # 活跃需求数量
    completed_requirements: {{COMPLETED_REQUIREMENTS}} # 已完成需求数量
    blocked_requirements: {{BLOCKED_REQUIREMENTS}} # 阻塞需求数量
    high_priority_requirements: {{HIGH_PRIORITY_COUNT}} # 高优先级需求数量
    
  # 需求套件列表
  requirement_suites:
    - requirement_suite_id: "REQ-SUITE-001"
      business_requirement_title: "{{BUSINESS_REQUIREMENT_TITLE_1}}" # 如：用户管理功能
      business_requirement_description: "{{BUSINESS_REQUIREMENT_DESCRIPTION_1}}"
      
      # 需求基本信息
      requirement_basic_info:
        requirement_category: "{{REQUIREMENT_CATEGORY_1}}" # core_function | enhancement | integration | compliance
        business_domain: "{{BUSINESS_DOMAIN_1}}" # 如：用户管理 | 订单处理 | 支付系统
        stakeholders: [{{STAKEHOLDERS_1}}] # 利益相关者
        business_value_score: {{BUSINESS_VALUE_SCORE_1}} # 1-10，业务价值评分
        
      # 需求优先级和状态
      requirement_priority_status:
        priority: "{{PRIORITY_1}}" # critical | high | medium | low
        status: "{{STATUS_1}}" # planned | in_analysis | in_design | in_development | in_testing | completed | blocked | cancelled
        urgency: "{{URGENCY_1}}" # urgent | normal | low
        complexity: "{{COMPLEXITY_1}}" # simple | medium | complex
        
      # 时间规划
      timeline_planning:
        planned_start_date: "{{PLANNED_START_DATE_1}}" # YYYY-MM-DD
        planned_end_date: "{{PLANNED_END_DATE_1}}" # YYYY-MM-DD
        actual_start_date: "{{ACTUAL_START_DATE_1}}" # YYYY-MM-DD (如果已开始)
        estimated_completion_date: "{{ESTIMATED_COMPLETION_DATE_1}}" # YYYY-MM-DD
        target_sprint: "{{TARGET_SPRINT_1}}" # 如：Sprint-2025-Q1-S3
        
      # 文档关联路径 (核心关联机制)
      document_references:
        # Agent-A需求分析文档
        requirement_analysis_doc:
          doc_path: "{{REQ_DOC_PATH_1}}" # 如：/ContextDev/example/REQ-SUITE-001-产品管理功能/requirements-analysis.yaml
          doc_id: "{{REQ_DOC_ID_1}}" # 文档内标识ID
          doc_status: "{{REQ_DOC_STATUS_1}}" # draft | review | approved | outdated
          doc_version: "{{REQ_DOC_VERSION_1}}" # v1.0
          last_modified: "{{REQ_DOC_LAST_MODIFIED_1}}" # YYYY-MM-DD HH:MM:SS
          
        # Agent-B架构设计文档
        architecture_design_doc:
          doc_path: "{{DESIGN_DOC_PATH_1}}" # 如：/ContextDev/example/REQ-SUITE-001-产品管理功能/architecture-design.yaml
          doc_id: "{{DESIGN_DOC_ID_1}}"
          doc_status: "{{DESIGN_DOC_STATUS_1}}"
          doc_version: "{{DESIGN_DOC_VERSION_1}}"
          last_modified: "{{DESIGN_DOC_LAST_MODIFIED_1}}"
          
        # Agent-C开发任务文档
        development_task_doc:
          doc_path: "{{DEV_DOC_PATH_1}}" # 如：/ContextDev/example/REQ-SUITE-001-产品管理功能/development-tasks.yaml
          doc_id: "{{DEV_DOC_ID_1}}"
          doc_status: "{{DEV_DOC_STATUS_1}}"
          doc_version: "{{DEV_DOC_VERSION_1}}"
          last_modified: "{{DEV_DOC_LAST_MODIFIED_1}}"
          
        # Agent-D测试设计文档
        testing_design_doc:
          doc_path: "{{TEST_DOC_PATH_1}}" # 如：/ContextDev/example/REQ-SUITE-001-产品管理功能/testing-design.yaml
          doc_id: "{{TEST_DOC_ID_1}}"
          doc_status: "{{TEST_DOC_STATUS_1}}"
          doc_version: "{{TEST_DOC_VERSION_1}}"
          last_modified: "{{TEST_DOC_LAST_MODIFIED_1}}"
          
      # 完整追溯链标识
      traceability_chain:
        baseline_traceability_id: "TRACE-{{BASELINE_ID}}-{{SUITE_ID_1}}" # 完整追溯链唯一标识
        system_reference: "{{SYSTEM_ID}}" # 系统级追溯
        baseline_reference: "{{BASELINE_ID}}" # 基线级追溯
        requirement_suite_reference: "REQ-SUITE-001" # 需求套件级追溯
        
      # 工作量估算
      effort_estimation:
        estimated_story_points: {{ESTIMATED_STORY_POINTS_1}} # 总故事点
        estimated_person_hours: {{ESTIMATED_PERSON_HOURS_1}} # 总人时
        estimated_person_days: {{ESTIMATED_PERSON_DAYS_1}} # 总人天
        complexity_factor: {{COMPLEXITY_FACTOR_1}} # 复杂度系数
        
      # 资源需求
      resource_requirements:
        required_skills: [{{REQUIRED_SKILLS_1}}] # 需要的技能
        team_composition: [{{TEAM_COMPOSITION_1}}] # 团队组成
        external_dependencies: [{{EXTERNAL_DEPENDENCIES_1}}] # 外部依赖
        infrastructure_needs: [{{INFRASTRUCTURE_NEEDS_1}}] # 基础设施需求
        
      # 需求套件依赖 (第二轮评估反馈新增)
      suite_dependencies:
        upstream_dependencies: # 本需求依赖的其他需求
          - dependency_suite_id: "{{UPSTREAM_DEPENDENCY_SUITE_ID_1}}" # 如：REQ-SUITE-000-基础功能
            dependency_type: "{{DEPENDENCY_TYPE_1}}" # data_dependency | functional_dependency | technical_dependency
            dependency_description: "{{DEPENDENCY_DESCRIPTION_1}}" # 依赖关系描述
            dependency_status: "{{DEPENDENCY_STATUS_1}}" # resolved | pending | blocked
            
        downstream_dependencies: # 依赖本需求的其他需求
          - dependent_suite_id: "{{DOWNSTREAM_DEPENDENT_SUITE_ID_1}}" # 如：REQ-SUITE-002-购物车管理功能
            dependency_type: "{{DEPENDENT_TYPE_1}}" # data_dependency | functional_dependency | technical_dependency
            dependency_description: "{{DEPENDENT_DESCRIPTION_1}}"
            dependency_impact: "{{DEPENDENCY_IMPACT_1}}" # high | medium | low
            
    - requirement_suite_id: "REQ-SUITE-002"
      business_requirement_title: "{{BUSINESS_REQUIREMENT_TITLE_2}}"
      business_requirement_description: "{{BUSINESS_REQUIREMENT_DESCRIPTION_2}}"
      requirement_basic_info:
        requirement_category: "{{REQUIREMENT_CATEGORY_2}}"
        business_domain: "{{BUSINESS_DOMAIN_2}}"
        stakeholders: [{{STAKEHOLDERS_2}}]
        business_value_score: {{BUSINESS_VALUE_SCORE_2}}
      requirement_priority_status:
        priority: "{{PRIORITY_2}}"
        status: "{{STATUS_2}}"
        urgency: "{{URGENCY_2}}"
        complexity: "{{COMPLEXITY_2}}"
      timeline_planning:
        planned_start_date: "{{PLANNED_START_DATE_2}}"
        planned_end_date: "{{PLANNED_END_DATE_2}}"
        actual_start_date: "{{ACTUAL_START_DATE_2}}"
        estimated_completion_date: "{{ESTIMATED_COMPLETION_DATE_2}}"
        target_sprint: "{{TARGET_SPRINT_2}}"
      document_references:
        requirement_analysis_doc:
          doc_path: "{{REQ_DOC_PATH_2}}"
          doc_id: "{{REQ_DOC_ID_2}}"
          doc_status: "{{REQ_DOC_STATUS_2}}"
          doc_version: "{{REQ_DOC_VERSION_2}}"
          last_modified: "{{REQ_DOC_LAST_MODIFIED_2}}"
        architecture_design_doc:
          doc_path: "{{DESIGN_DOC_PATH_2}}"
          doc_id: "{{DESIGN_DOC_ID_2}}"
          doc_status: "{{DESIGN_DOC_STATUS_2}}"
          doc_version: "{{DESIGN_DOC_VERSION_2}}"
          last_modified: "{{DESIGN_DOC_LAST_MODIFIED_2}}"
        development_task_doc:
          doc_path: "{{DEV_DOC_PATH_2}}"
          doc_id: "{{DEV_DOC_ID_2}}"
          doc_status: "{{DEV_DOC_STATUS_2}}"
          doc_version: "{{DEV_DOC_VERSION_2}}"
          last_modified: "{{DEV_DOC_LAST_MODIFIED_2}}"
        testing_design_doc:
          doc_path: "{{TEST_DOC_PATH_2}}"
          doc_id: "{{TEST_DOC_ID_2}}"
          doc_status: "{{TEST_DOC_STATUS_2}}"
          doc_version: "{{TEST_DOC_VERSION_2}}"
          last_modified: "{{TEST_DOC_LAST_MODIFIED_2}}"
      traceability_chain:
        baseline_traceability_id: "TRACE-{{BASELINE_ID}}-{{SUITE_ID_2}}"
        system_reference: "{{SYSTEM_ID}}"
        baseline_reference: "{{BASELINE_ID}}"
        requirement_suite_reference: "REQ-SUITE-002"
      effort_estimation:
        estimated_story_points: {{ESTIMATED_STORY_POINTS_2}}
        estimated_person_hours: {{ESTIMATED_PERSON_HOURS_2}}
        estimated_person_days: {{ESTIMATED_PERSON_DAYS_2}}
        complexity_factor: {{COMPLEXITY_FACTOR_2}}
      resource_requirements:
        required_skills: [{{REQUIRED_SKILLS_2}}]
        team_composition: [{{TEAM_COMPOSITION_2}}]
        external_dependencies: [{{EXTERNAL_DEPENDENCIES_2}}]
        infrastructure_needs: [{{INFRASTRUCTURE_NEEDS_2}}]
      # 继续添加更多需求套件...

# ============================================================================
# 需求间关系管理
# ============================================================================
requirement_relationship_management:
  # 需求依赖关系
  requirement_dependencies:
    - dependency_id: "REQ-DEP-001"
      source_requirement_suite_id: "{{SOURCE_SUITE_ID_1}}" # 依赖源
      target_requirement_suite_id: "{{TARGET_SUITE_ID_1}}" # 依赖目标
      dependency_type: "{{DEPENDENCY_TYPE_1}}" # prerequisite | parallel | conditional | exclusive | enhancement
      dependency_description: "{{DEPENDENCY_DESCRIPTION_1}}"
      dependency_strength: "{{DEPENDENCY_STRENGTH_1}}" # mandatory | preferred | optional
      impact_if_delayed: "{{IMPACT_IF_DELAYED_1}}" # high | medium | low
      mitigation_strategy: "{{MITIGATION_STRATEGY_1}}"
      
    - dependency_id: "REQ-DEP-002"
      source_requirement_suite_id: "{{SOURCE_SUITE_ID_2}}"
      target_requirement_suite_id: "{{TARGET_SUITE_ID_2}}"
      dependency_type: "{{DEPENDENCY_TYPE_2}}"
      dependency_description: "{{DEPENDENCY_DESCRIPTION_2}}"
      dependency_strength: "{{DEPENDENCY_STRENGTH_2}}"
      impact_if_delayed: "{{IMPACT_IF_DELAYED_2}}"
      mitigation_strategy: "{{MITIGATION_STRATEGY_2}}"
      # 继续添加依赖关系...
      
  # 需求冲突管理
  requirement_conflicts:
    - conflict_id: "REQ-CONFLICT-001"
      conflicting_requirements: [{{CONFLICTING_REQ_IDS_1}}] # 冲突的需求套件IDs
      conflict_type: "{{CONFLICT_TYPE_1}}" # resource_conflict | priority_conflict | technical_conflict | business_conflict
      conflict_description: "{{CONFLICT_DESCRIPTION_1}}"
      conflict_severity: "{{CONFLICT_SEVERITY_1}}" # critical | high | medium | low
      resolution_strategy: "{{RESOLUTION_STRATEGY_1}}"
      resolution_owner: "{{RESOLUTION_OWNER_1}}"
      resolution_deadline: "{{RESOLUTION_DEADLINE_1}}" # YYYY-MM-DD
      resolution_status: "{{RESOLUTION_STATUS_1}}" # identified | analyzing | resolving | resolved
      
  # 需求优先级矩阵
  priority_matrix:
    critical_requirements: [{{CRITICAL_REQ_IDS}}] # 关键需求列表
    high_priority_requirements: [{{HIGH_PRIORITY_REQ_IDS}}] # 高优先级需求
    medium_priority_requirements: [{{MEDIUM_PRIORITY_REQ_IDS}}] # 中优先级需求
    low_priority_requirements: [{{LOW_PRIORITY_REQ_IDS}}] # 低优先级需求
    
    # 优先级调整记录
    priority_adjustments:
      - adjustment_id: "PRI-ADJ-001"
        requirement_suite_id: "{{ADJUSTED_REQ_ID_1}}"
        old_priority: "{{OLD_PRIORITY_1}}"
        new_priority: "{{NEW_PRIORITY_1}}"
        adjustment_date: "{{ADJUSTMENT_DATE_1}}" # YYYY-MM-DD
        adjustment_reason: "{{ADJUSTMENT_REASON_1}}"
        approved_by: "{{APPROVED_BY_1}}"

# ============================================================================
# 项目管理集成
# ============================================================================
project_management_integration:
  # Sprint分配规划
  sprint_allocation:
    - sprint_id: "SPRINT-{{YEAR}}-Q{{QUARTER}}-S{{SPRINT_NUMBER}}" # 如：SPRINT-2025-Q1-S3
      sprint_name: "{{SPRINT_NAME_1}}" # 如：用户管理核心功能Sprint
      sprint_duration: "{{SPRINT_DURATION_1}}" # 如：2周
      sprint_capacity: {{SPRINT_CAPACITY_1}} # 故事点容量
      
      # Sprint分配的需求
      allocated_requirements:
        - requirement_suite_id: "{{ALLOCATED_REQ_ID_1}}"
          allocated_story_points: {{ALLOCATED_POINTS_1}}
          planned_completion_percentage: {{PLANNED_COMPLETION_1}}% # 计划完成百分比
          risk_level: "{{RISK_LEVEL_1}}" # low | medium | high
          
        - requirement_suite_id: "{{ALLOCATED_REQ_ID_2}}"
          allocated_story_points: {{ALLOCATED_POINTS_2}}
          planned_completion_percentage: {{PLANNED_COMPLETION_2}}%
          risk_level: "{{RISK_LEVEL_2}}"
          # 继续添加分配的需求...
          
      # Sprint目标和成功标准
      sprint_objectives: [{{SPRINT_OBJECTIVES_1}}]
      success_criteria: [{{SPRINT_SUCCESS_CRITERIA_1}}]
      sprint_risks: [{{SPRINT_RISKS_1}}]
      
  # 里程碑定义
  milestone_definitions:
    - milestone_id: "MILESTONE-001"
      milestone_name: "{{MILESTONE_NAME_1}}" # 如：MVP版本发布
      milestone_date: "{{MILESTONE_DATE_1}}" # YYYY-MM-DD
      milestone_type: "{{MILESTONE_TYPE_1}}" # major_release | minor_release | feature_completion | integration_point
      
      # 里程碑包含的需求
      included_requirements: [{{MILESTONE_REQ_IDS_1}}]
      completion_criteria: [{{MILESTONE_COMPLETION_CRITERIA_1}}]
      deliverables: [{{MILESTONE_DELIVERABLES_1}}]
      stakeholder_review_required: {{STAKEHOLDER_REVIEW_REQUIRED_1}} # true | false
      
    - milestone_id: "MILESTONE-002"
      milestone_name: "{{MILESTONE_NAME_2}}"
      milestone_date: "{{MILESTONE_DATE_2}}"
      milestone_type: "{{MILESTONE_TYPE_2}}"
      included_requirements: [{{MILESTONE_REQ_IDS_2}}]
      completion_criteria: [{{MILESTONE_COMPLETION_CRITERIA_2}}]
      deliverables: [{{MILESTONE_DELIVERABLES_2}}]
      stakeholder_review_required: {{STAKEHOLDER_REVIEW_REQUIRED_2}}
      # 继续添加里程碑...
      
  # 资源分配管理
  resource_allocation:
    # 团队资源分配
    team_allocation:
      - role: "requirements_analyst" # 对应Agent-A
        allocated_person_days: {{RA_PERSON_DAYS}}
        team_members: [{{RA_TEAM_MEMBERS}}]
        workload_distribution: [{{RA_WORKLOAD_DISTRIBUTION}}] # 按需求套件分配
        
      - role: "solution_architect" # 对应Agent-B
        allocated_person_days: {{SA_PERSON_DAYS}}
        team_members: [{{SA_TEAM_MEMBERS}}]
        workload_distribution: [{{SA_WORKLOAD_DISTRIBUTION}}]
        
      - role: "development_engineer" # 对应Agent-C
        allocated_person_days: {{DE_PERSON_DAYS}}
        team_members: [{{DE_TEAM_MEMBERS}}]
        workload_distribution: [{{DE_WORKLOAD_DISTRIBUTION}}]
        
      - role: "test_engineer" # 对应Agent-D
        allocated_person_days: {{TE_PERSON_DAYS}}
        team_members: [{{TE_TEAM_MEMBERS}}]
        workload_distribution: [{{TE_WORKLOAD_DISTRIBUTION}}]
        
    # 基础设施资源分配
    infrastructure_allocation:
      development_environments: [{{DEV_ENV_ALLOCATION}}]
      testing_environments: [{{TEST_ENV_ALLOCATION}}]
      deployment_environments: [{{DEPLOY_ENV_ALLOCATION}}]
      shared_services: [{{SHARED_SERVICES_ALLOCATION}}]

# ============================================================================
# 变更管理与追溯
# ============================================================================
change_management_and_traceability:
  # 变更追踪机制
  change_tracking:
    # 需求变更记录
    requirement_changes:
      - change_id: "REQ-CHANGE-001"
        requirement_suite_id: "{{CHANGED_SUITE_ID_1}}"
        change_date: "{{CHANGE_DATE_1}}" # YYYY-MM-DD HH:MM:SS
        change_type: "{{CHANGE_TYPE_1}}" # add | modify | delete | suspend | reactivate
        change_description: "{{CHANGE_DESCRIPTION_1}}"
        change_reason: "{{CHANGE_REASON_1}}"
        change_initiator: "{{CHANGE_INITIATOR_1}}"
        change_approver: "{{CHANGE_APPROVER_1}}"
        
        # 变更影响分析
        impact_analysis:
          affected_documents: [{{AFFECTED_DOCS_1}}] # 受影响的4类文档
          affected_requirements: [{{AFFECTED_REQ_IDS_1}}] # 受影响的其他需求
          affected_sprints: [{{AFFECTED_SPRINTS_1}}] # 受影响的Sprint
          affected_milestones: [{{AFFECTED_MILESTONES_1}}] # 受影响的里程碑
          
        # 变更传播路径
        propagation_path:
          - layer: "L1_baseline" # 基线层变更
            actions_required: [{{L1_ACTIONS_1}}]
            estimated_effort: "{{L1_EFFORT_1}}"
            
          - layer: "L2_requirements" # 需求分析层变更
            actions_required: [{{L2_ACTIONS_1}}]
            estimated_effort: "{{L2_EFFORT_1}}"
            
          - layer: "L3_architecture" # 架构设计层变更
            actions_required: [{{L3_ACTIONS_1}}]
            estimated_effort: "{{L3_EFFORT_1}}"
            
          - layer: "L4_development" # 开发任务层变更
            actions_required: [{{L4_ACTIONS_1}}]
            estimated_effort: "{{L4_EFFORT_1}}"
            
          - layer: "L5_testing" # 测试设计层变更
            actions_required: [{{L5_ACTIONS_1}}]
            estimated_effort: "{{L5_EFFORT_1}}"
            
        change_status: "{{CHANGE_STATUS_1}}" # proposed | approved | implementing | completed | rejected
        
  # 完整追溯矩阵
  complete_traceability_matrix:
    # 系统→基线→需求→文档追溯
    - traceability_entry_id: "TRACE-ENTRY-001"
      business_requirement: "{{ORIGINAL_BUSINESS_NEED_1}}"
      system_reference: "{{SYSTEM_ID}}"
      baseline_reference: "{{BASELINE_ID}}"
      requirement_suite_reference: "{{REQ_SUITE_ID_1}}"
      
      # 完整文档链
      document_chain:
        requirement_doc_reference: "{{REQ_DOC_ID_1}}"
        design_doc_reference: "{{DESIGN_DOC_ID_1}}"
        development_doc_reference: "{{DEV_DOC_ID_1}}"
        testing_doc_reference: "{{TEST_DOC_ID_1}}"
        
      # 实现追溯
      implementation_traceability:
        ears_requirements: [{{EARS_REQ_IDS_1}}] # Agent-A产生的EARS需求
        bdd_scenarios: [{{BDD_SCENARIO_IDS_1}}] # Agent-A产生的BDD场景
        design_decisions: [{{DESIGN_DECISION_IDS_1}}] # Agent-B产生的设计决策
        development_tasks: [{{DEV_TASK_IDS_1}}] # Agent-C产生的开发任务
        test_cases: [{{TEST_CASE_IDS_1}}] # Agent-D产生的测试用例
        
      # 交付物追溯
      deliverable_traceability:
        generated_code: [{{GENERATED_CODE_1}}] # CodeGen生成的代码
        manual_code: [{{MANUAL_CODE_1}}] # 手工开发的代码
        test_scripts: [{{TEST_SCRIPTS_1}}] # 测试脚本
        documentation: [{{DOCUMENTATION_1}}] # 相关文档
        
      traceability_validation: "{{TRACEABILITY_VALID_1}}" # validated | pending | broken
      
  # 变更影响预测
  change_impact_prediction:
    # 变更影响评估规则
    impact_assessment_rules:
      - rule_id: "IMPACT-RULE-001"
        rule_description: "需求优先级变更影响评估"
        trigger_condition: "requirement_priority_change"
        impact_calculation: "{{IMPACT_CALCULATION_1}}"
        automated_actions: [{{AUTOMATED_ACTIONS_1}}]
        
    # 变更风险评估
    change_risk_assessment:
      - risk_id: "CHANGE-RISK-001"
        risk_description: "{{CHANGE_RISK_DESCRIPTION_1}}"
        risk_probability: "{{RISK_PROBABILITY_1}}" # high | medium | low
        risk_impact: "{{RISK_IMPACT_1}}" # high | medium | low
        risk_mitigation: "{{RISK_MITIGATION_1}}"
        risk_owner: "{{RISK_OWNER_1}}"

# ============================================================================
# 质量保证与监控
# ============================================================================
quality_assurance_and_monitoring:
  # 基线质量指标
  baseline_quality_metrics:
    # 需求覆盖率指标
    requirement_coverage_metrics:
      business_requirements_covered: {{BUSINESS_REQ_COVERED}}%
      functional_requirements_covered: {{FUNCTIONAL_REQ_COVERED}}%
      document_completeness_rate: {{DOC_COMPLETENESS_RATE}}%
      traceability_completeness_rate: {{TRACEABILITY_COMPLETENESS}}%
      
    # 文档质量指标
    document_quality_metrics:
      document_consistency_score: {{DOC_CONSISTENCY_SCORE}} # 1-10
      document_up_to_date_rate: {{DOC_UP_TO_DATE_RATE}}%
      document_review_completion_rate: {{DOC_REVIEW_COMPLETION}}%
      
    # 项目健康指标
    project_health_metrics:
      requirements_on_schedule: {{REQ_ON_SCHEDULE}}%
      requirements_within_budget: {{REQ_WITHIN_BUDGET}}%
      stakeholder_satisfaction_score: {{STAKEHOLDER_SATISFACTION}} # 1-10
      team_velocity_consistency: {{TEAM_VELOCITY_CONSISTENCY}} # stable | improving | declining
      
  # 监控告警规则
  monitoring_alert_rules:
    - alert_rule_id: "ALERT-001"
      alert_name: "需求文档过期告警"
      alert_condition: "document_last_modified > 30_days"
      alert_severity: "warning"
      alert_recipients: [{{ALERT_RECIPIENTS_1}}]
      alert_action: "{{ALERT_ACTION_1}}"
      
    - alert_rule_id: "ALERT-002"
      alert_name: "需求依赖阻塞告警"
      alert_condition: "dependency_blocked > 7_days"
      alert_severity: "critical"
      alert_recipients: [{{ALERT_RECIPIENTS_2}}]
      alert_action: "{{ALERT_ACTION_2}}"
      
  # 定期审查机制
  periodic_review_mechanism:
    # 周审查
    weekly_reviews:
      review_scope: [{{WEEKLY_REVIEW_SCOPE}}] # 需求进展、文档状态、阻塞问题
      review_participants: [{{WEEKLY_REVIEW_PARTICIPANTS}}]
      review_deliverables: [{{WEEKLY_REVIEW_DELIVERABLES}}]
      
    # 月审查
    monthly_reviews:
      review_scope: [{{MONTHLY_REVIEW_SCOPE}}] # 基线健康度、优先级调整、资源重分配
      review_participants: [{{MONTHLY_REVIEW_PARTICIPANTS}}]
      review_deliverables: [{{MONTHLY_REVIEW_DELIVERABLES}}]
      
    # 季度审查
    quarterly_reviews:
      review_scope: [{{QUARTERLY_REVIEW_SCOPE}}] # 战略对齐、基线架构审查、流程改进
      review_participants: [{{QUARTERLY_REVIEW_PARTICIPANTS}}]
      review_deliverables: [{{QUARTERLY_REVIEW_DELIVERABLES}}]

