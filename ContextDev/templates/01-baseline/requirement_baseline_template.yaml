# ============================================================================
# 附加信息
# ============================================================================
additional_information:
  # 重要假设条件
  key_assumptions: |
    {{KEY_ASSUMPTIONS}}
    
  # 基线范围外事项
  out_of_baseline_scope: |
    {{OUT_OF_BASELINE_SCOPE}}
    
  # 风险提示
  risk_alerts: |
    {{RISK_ALERTS}}
    
  # 使用指南
  usage_guidelines: |
    1. 基线创建后，首先建立系统基础信息关联
    2. 逐个注册需求套件，确保文档路径正确
    3. 建立需求间依赖关系，识别并解决冲突
    4. 定期更新需求状态和文档版本信息
    5. 监控质量指标，及时处理告警和风险
    6. 定期审查基线健康度，维护管理流程
    
  # 维护说明
  maintenance_notes: |
    - 本基线模板应定期审查和更新，确保与实际项目情况同步
    - 文档路径变更时，必须同步更新基线中的引用
    - 需求优先级调整需要评估对整体规划的影响
    - 基线状态变更需要相关利益相关者的批准