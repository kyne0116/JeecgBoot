  maintenance_notes: |
    - 本基线模板应定期审查和更新，确保与实际项目情况同步
    - 文档路径变更时，必须同步更新基线中的引用
    - 需求优先级调整需要评估对整体规划的影响
    - 基线状态变更需要相关利益相关者的批准