        testing_approach: "{{TESTING_APPROACH}}"
        key_deliverables: [{{KEY_DELIVERABLES}}]
        success_criteria: [{{SUCCESS_CRITERIA}}]
        
      # 测试策略概述
      test_strategy_overview:
