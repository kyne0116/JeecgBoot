        test_types: [{{TEST_TYPES}}] # functional | performance | security | usability
        test_techniques: [{{TEST_TECHNIQUES}}] # manual | automated | exploratory
        test_environment_strategy: "{{TEST_ENVIRONMENT_STRATEGY}}"
        test_data_strategy: "{{TEST_DATA_STRATEGY}}"
        
      # 资源规划
      resource_planning:
        human_resources: [{{HUMAN_RESOURCES}}]
        infrastructure_resources: [{{INFRASTRUCTURE_RESOURCES}}]
        tool_requirements: [{{TOOL_REQUIREMENTS}}]
        budget_estimation: "{{BUDGET_ESTIMATION}}"
        
      # 风险评估
      risk_assessment:
        identified_risks: [{{IDENTIFIED_RISKS}}]
        risk_mitigation_strategies: [{{RISK_MITIGATION_STRATEGIES}}]
        contingency_plans: [{{CONTINGENCY_PLANS}}]
        
  # 测试执行报告
  test_execution_reporting:
