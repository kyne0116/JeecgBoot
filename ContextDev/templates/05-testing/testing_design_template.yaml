      tests_failed: {{TESTS_FAILED}}
      tests_skipped: {{TESTS_SKIPPED}}
      execution_progress_percentage: {{EXECUTION_PROGRESS}}%
      estimated_completion_time: "{{ESTIMATED_COMPLETION_TIME}}"
      
    # 详细执行日志
    detailed_execution_logs:
      - log_entry_id: "LOG-{{TIMESTAMP}}-{{SEQUENCE}}"
        timestamp: "{{YYYY-MM-DD HH:MM:SS}}"
        test_case_id: "{{TEST_CASE_ID}}"
        execution_status: "{{EXECUTION_STATUS}}" # passed | failed | skipped | error
        execution_duration: {{EXECUTION_DURATION}} # seconds
        failure_reason: "{{FAILURE_REASON}}" # if failed
        stack_trace: "{{STACK_TRACE}}" # if error
        screenshots: [{{SCREENSHOTS}}] # for UI tests
        
  # 测试结果分析报告
  test_result_analysis_reporting:
    # 覆盖率分析
    coverage_analysis:
      requirement_coverage:
        total_requirements: {{TOTAL_REQUIREMENTS}}
        covered_requirements: {{COVERED_REQUIREMENTS}}
        coverage_percentage: {{REQUIREMENT_COVERAGE_PERCENTAGE}}%
        uncovered_requirements: [{{UNCOVERED_REQUIREMENTS}}]
        
      code_coverage: # 如果适用
        line_coverage: {{LINE_COVERAGE}}%
        branch_coverage: {{BRANCH_COVERAGE}}%
        method_coverage: {{METHOD_COVERAGE}}%
        class_coverage: {{CLASS_COVERAGE}}%
        
    # 缺陷分析
    defect_analysis:
      total_defects_found: {{TOTAL_DEFECTS}}
      defects_by_severity:
        critical_defects: {{CRITICAL_DEFECTS}}
        high_defects: {{HIGH_DEFECTS}}
        medium_defects: {{MEDIUM_DEFECTS}}
        low_defects: {{LOW_DEFECTS}}
        
      defects_by_category:
        functional_defects: {{FUNCTIONAL_DEFECTS}}
        performance_defects: {{PERFORMANCE_DEFECTS}}
        security_defects: {{SECURITY_DEFECTS}}
        usability_defects: {{USABILITY_DEFECTS}}
        
      defect_trend_analysis:
        defect_discovery_rate: "{{DEFECT_DISCOVERY_RATE}}" # per day/week
        defect_resolution_rate: "{{DEFECT_RESOLUTION_RATE}}" # per day/week
        open_defect_aging: [{{OPEN_DEFECT_AGING}}]
        
    # 质量指标
    quality_metrics:
      test_effectiveness_metrics:
        defect_detection_percentage: {{DEFECT_DETECTION_PERCENTAGE}}%
        test_case_pass_rate: {{TEST_CASE_PASS_RATE}}%
        test_automation_percentage: {{TEST_AUTOMATION_PERCENTAGE}}%
        
      efficiency_metrics:
        average_test_execution_time: {{AVERAGE_EXECUTION_TIME}} # minutes
        test_environment_utilization: {{TEST_ENV_UTILIZATION}}%
        automation_maintenance_overhead: {{AUTOMATION_MAINTENANCE_OVERHEAD}}%
        
  # 追溯性报告
  traceability_reporting:
    # 需求-测试追溯矩阵
    requirement_test_traceability_matrix:
      - requirement_id: "{{REQ_ID_1}}"
        requirement_description: "{{REQ_DESCRIPTION_1}}"
        associated_test_cases: [{{ASSOCIATED_TEST_CASES_1}}]
        test_coverage_status: "{{TEST_COVERAGE_STATUS_1}}" # covered | partially_covered | not_covered
        verification_status: "{{VERIFICATION_STATUS_1}}" # verified | failed | pending
        
    # 设计-测试追溯矩阵
    design_test_traceability_matrix:
      - design_decision_id: "{{DESIGN_ID_1}}"
        design_description: "{{DESIGN_DESCRIPTION_1}}"
        associated_test_cases: [{{ASSOCIATED_TEST_CASES_DESIGN_1}}]
        design_verification_status: "{{DESIGN_VERIFICATION_STATUS_1}}"
        
    # 任务-测试追溯矩阵
    task_test_traceability_matrix:
      - task_id: "{{TASK_ID_1}}"
        task_description: "{{TASK_DESCRIPTION_1}}"
        associated_test_cases: [{{ASSOCIATED_TEST_CASES_TASK_1}}]
        task_verification_status: "{{TASK_VERIFICATION_STATUS_1}}"
        
  # 建议和管理报告
  recommendations_and_management:
    # 测试过程管理建议
    test_process_management:
      identified_issues: [{{IDENTIFIED_ISSUES}}]
      process_management_suggestions: [{{PROCESS_MANAGEMENT_SUGGESTIONS}}]
      tool_management_recommendations: [{{TOOL_MANAGEMENT_RECOMMENDATIONS}}]
      
    # 测试自动化管理
    test_automation_management:
      automation_gap_analysis: [{{AUTOMATION_GAP_ANALYSIS}}]
      automation_opportunity_identification: [{{AUTOMATION_OPPORTUNITIES}}]
      automation_roi_analysis: "{{AUTOMATION_ROI_ANALYSIS}}"
      
    # 质量管理建议
    quality_management:
      quality_gate_management: [{{QUALITY_GATE_MANAGEMENT}}]
      defect_prevention_strategies: [{{DEFECT_PREVENTION_STRATEGIES}}]
      testing_best_practice_recommendations: [{{TESTING_BEST_PRACTICES}}]

