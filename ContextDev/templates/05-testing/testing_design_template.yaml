            test_scenario: "{{INTEGRATION_TEST_SCENARIO_1}}"
            integration_setup: "{{INTEGRATION_SETUP_1}}"
            test_execution: "{{INTEGRATION_TEST_EXECUTION_1}}"
            expected_integration_result: "{{EXPECTED_INTEGRATION_RESULT_1}}"
            error_handling_validation: "{{ERROR_HANDLING_VALIDATION_1}}"

# ============================================================================
# 测试数据设计与管理
# ============================================================================
test_data_design_and_management:
  # 测试数据设计摘要
  test_data_summary:
    total_test_data_sets: {{TOTAL_TEST_DATA_SETS}}
    synthetic_data_sets: {{SYNTHETIC_DATA_SETS}}
    production_subset_data_sets: {{PRODUCTION_SUBSET_DATA_SETS}}
    mock_data_sets: {{MOCK_DATA_SETS}}
    test_data_volume_estimation: "{{TEST_DATA_VOLUME_ESTIMATION}}" # small | medium | large
    
  # 测试数据分类设计
  test_data_category_design:
    # 正向测试数据 (Happy Path)
    positive_test_data:
      - data_set_id: "POS-DATA-001"
        data_set_name: "{{POSITIVE_DATA_SET_NAME_1}}" # 如：ValidProductData
        data_purpose: "{{POSITIVE_DATA_PURPOSE_1}}" # 支持正向业务流程测试
        
        # 数据结构设计
        data_structure:
          business_entity: "{{DATA_BUSINESS_ENTITY_1}}" # 如：Product
          required_fields: [{{REQUIRED_FIELDS_1}}]
          optional_fields: [{{OPTIONAL_FIELDS_1}}]
          data_relationships: [{{DATA_RELATIONSHIPS_1}}] # 关联的其他实体
          
        # 数据生成策略
        data_generation_strategy:
          generation_method: "{{GENERATION_METHOD_1}}" # manual | faker_library | template_based
          data_volume: {{DATA_VOLUME_1}} # 数据条数
          data_variation: "{{DATA_VARIATION_1}}" # 数据变化程度
          
        # 数据样本
        data_samples:
          - sample_id: "POS-SAMPLE-001"
            sample_data: "{{SAMPLE_DATA_1}}" # JSON或YAML格式的示例数据
            usage_scenarios: [{{USAGE_SCENARIOS_1}}] # 适用的测试场景
            
    # 负向测试数据 (Negative Path)
    negative_test_data:
      - data_set_id: "NEG-DATA-001"
        data_set_name: "{{NEGATIVE_DATA_SET_NAME_1}}" # 如：InvalidProductData
        data_purpose: "{{NEGATIVE_DATA_PURPOSE_1}}" # 验证异常处理和边界条件
        
        # 异常数据类型
        negative_data_types:
          invalid_format_data: [{{INVALID_FORMAT_DATA_1}}] # 格式错误的数据
          boundary_violation_data: [{{BOUNDARY_VIOLATION_DATA_1}}] # 边界值违规数据
          business_rule_violation_data: [{{BUSINESS_RULE_VIOLATION_DATA_1}}] # 业务规则违规
          security_attack_data: [{{SECURITY_ATTACK_DATA_1}}] # 安全攻击测试数据
          
        # 预期异常结果
        expected_error_responses:
          - error_type: "{{ERROR_TYPE_1}}" # validation_error | business_error | system_error
            error_message_pattern: "{{ERROR_MESSAGE_PATTERN_1}}"
            error_code: "{{ERROR_CODE_1}}"
            
    # 边界测试数据 (Boundary Data)
    boundary_test_data:
      - data_set_id: "BOUND-DATA-001"
        data_set_name: "{{BOUNDARY_DATA_SET_NAME_1}}" # 如：ProductBoundaryData
        data_purpose: "{{BOUNDARY_DATA_PURPOSE_1}}" # 验证边界条件处理
        
        # 边界值定义
        boundary_definitions:
          - field_name: "{{BOUNDARY_FIELD_NAME_1}}" # 如：productPrice
            data_type: "{{BOUNDARY_DATA_TYPE_1}}" # numeric | string | date
            min_boundary_value: "{{MIN_BOUNDARY_VALUE_1}}"
            max_boundary_value: "{{MAX_BOUNDARY_VALUE_1}}"
            boundary_test_values: [{{BOUNDARY_TEST_VALUES_1}}] # 包括边界值、边界值±1等
            
    # 集成测试数据 (Integration Data)
    integration_test_data:
      - data_set_id: "INTEG-DATA-001"
        data_set_name: "{{INTEGRATION_DATA_SET_NAME_1}}" # 如：OrderProductIntegrationData
        data_purpose: "{{INTEGRATION_DATA_PURPOSE_1}}" # 支持系统间集成测试
        
        # 集成数据关系
        integration_relationships:
          - relationship_type: "{{RELATIONSHIP_TYPE_1}}" # one_to_one | one_to_many | many_to_many
            source_entity: "{{SOURCE_ENTITY_1}}"
            target_entity: "{{TARGET_ENTITY_1}}"
            relationship_data: "{{RELATIONSHIP_DATA_1}}"
            
        # 外部系统模拟数据
        external_system_mock_data:
          - external_system: "{{EXTERNAL_SYSTEM_1}}" # 如：PaymentService
            mock_response_data: "{{MOCK_RESPONSE_DATA_1}}"
            mock_scenarios: [{{MOCK_SCENARIOS_1}}] # success | timeout | error
            
  # 测试数据管理策略
  test_data_management_strategy:
    # 数据生命周期管理
    data_lifecycle_management:
      data_creation_strategy: "{{DATA_CREATION_STRATEGY}}" # on_demand | pre_created | hybrid
      data_refresh_strategy: "{{DATA_REFRESH_STRATEGY}}" # per_test | per_suite | per_run
      data_cleanup_strategy: "{{DATA_CLEANUP_STRATEGY}}" # immediate | deferred | manual
      data_isolation_strategy: "{{DATA_ISOLATION_STRATEGY}}" # separate_db | separate_schema | data_partitioning
      
