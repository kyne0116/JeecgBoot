      execution_environment: "developer_machine | ci_server"
      execution_timeout: {{UNIT_TEST_TIMEOUT}} # minutes
      failure_handling: "fail_fast" # fail_fast | continue_on_failure
      
      # 并行执行策略
      parallel_execution_config:
        parallel_test_classes: {{PARALLEL_TEST_CLASSES}} # true | false
        parallel_test_methods: {{PARALLEL_TEST_METHODS}} # true | false
        thread_pool_size: {{THREAD_POOL_SIZE}}
        
    # L2: 集成测试执行
    integration_test_execution:
      execution_priority: "high"
      execution_trigger: "unit_tests_passed" # unit_tests_passed | manual | scheduled
      execution_frequency: "daily"
      execution_environment: "integration_test_server"
      execution_timeout: {{INTEGRATION_TEST_TIMEOUT}} # minutes
      failure_handling: "continue_on_failure"
      
      # 依赖管理
      dependency_management:
        database_setup: "{{DATABASE_SETUP}}" # fresh_db | existing_db | in_memory_db
        external_service_setup: [{{EXTERNAL_SERVICE_SETUP}}] # mock | real | wiremock
        test_data_preparation: "{{TEST_DATA_PREPARATION}}" # automatic | manual
        
    # L3: 系统测试执行
    system_test_execution:
      execution_priority: "medium"
      execution_trigger: "integration_tests_passed" # integration_tests_passed | manual | scheduled
      execution_frequency: "weekly"
      execution_environment: "system_test_environment"
      execution_timeout: {{SYSTEM_TEST_TIMEOUT}} # hours
      failure_handling: "stop_on_critical_failure"
      
      # 环境准备
      environment_preparation:
        environment_provisioning: "{{ENVIRONMENT_PROVISIONING}}" # automatic | manual
        application_deployment: "{{APPLICATION_DEPLOYMENT}}" # automatic | manual
        test_data_loading: "{{TEST_DATA_LOADING}}" # automatic | manual
        
    # L4: 验收测试执行
    acceptance_test_execution:
      execution_priority: "medium"
      execution_trigger: "system_tests_passed" # system_tests_passed | manual | scheduled
      execution_frequency: "release_candidate"
      execution_environment: "staging_environment"
      execution_timeout: {{ACCEPTANCE_TEST_TIMEOUT}} # hours
      failure_handling: "manual_review_required"
      
      # 利益相关者参与
      stakeholder_involvement:
        business_analyst_review: {{BA_REVIEW_REQUIRED}} # true | false
        product_owner_signoff: {{PO_SIGNOFF_REQUIRED}} # true | false
        user_acceptance_testing: {{UAT_REQUIRED}} # true | false
        
  # 测试执行依赖图
  test_execution_dependency_graph:
    # 测试执行节点
    execution_nodes:
      - node_id: "EXEC-NODE-001"
        node_name: "{{EXECUTION_NODE_NAME_1}}" # 如：UnitTestExecution
        node_type: "{{EXECUTION_NODE_TYPE_1}}" # unit | integration | system | acceptance
        execution_criteria: "{{EXECUTION_CRITERIA_1}}" # 执行条件
        success_criteria: "{{SUCCESS_CRITERIA_1}}" # 成功标准
        failure_criteria: "{{FAILURE_CRITERIA_1}}" # 失败标准
        
    # 依赖关系
    execution_dependencies:
      - dependency_id: "EXEC-DEP-001"
        source_node_id: "{{SOURCE_NODE_ID_1}}"
        target_node_id: "{{TARGET_NODE_ID_1}}"
        dependency_type: "{{DEPENDENCY_TYPE_1}}" # prerequisite | parallel | conditional
        dependency_condition: "{{DEPENDENCY_CONDITION_1}}"
        
  # 测试结果处理策略
  test_result_processing_strategy:
    # 结果收集
    result_collection:
      result_format: [{{RESULT_FORMAT}}] # junit_xml | testng_xml | cucumber_json | custom
      result_storage: "{{RESULT_STORAGE}}" # file_system | database | cloud_storage
      result_retention: "{{RESULT_RETENTION}}" # 结果保留时间
      
    # 结果分析
    result_analysis:
      trend_analysis: {{TREND_ANALYSIS_ENABLED}} # true | false
      failure_pattern_analysis: {{FAILURE_PATTERN_ANALYSIS}} # true | false
      coverage_analysis: {{COVERAGE_ANALYSIS_ENABLED}} # true | false
      performance_analysis: {{PERFORMANCE_ANALYSIS_ENABLED}} # true | false
      
    # 结果通知
    result_notification:
      notification_channels: [{{NOTIFICATION_CHANNELS}}] # email | slack | teams | webhook
      notification_recipients: [{{NOTIFICATION_RECIPIENTS}}]
      notification_triggers: [{{NOTIFICATION_TRIGGERS}}] # failure | success | always
      
  # 测试环境管理
  test_environment_management:
    # 环境配置
    environment_configurations:
      - environment_id: "TEST-ENV-001"
        environment_name: "{{TEST_ENVIRONMENT_NAME_1}}" # 如：unit_test_env
        environment_type: "{{TEST_ENVIRONMENT_TYPE_1}}" # local | ci | staging | production_like
        environment_resources: [{{TEST_ENVIRONMENT_RESOURCES_1}}]
        environment_setup_time: {{ENVIRONMENT_SETUP_TIME_1}} # minutes
        environment_teardown_time: {{ENVIRONMENT_TEARDOWN_TIME_1}} # minutes
        
    # 环境调度
    environment_scheduling:
      environment_availability: "{{ENVIRONMENT_AVAILABILITY}}" # 24x7 | business_hours | on_demand
      environment_booking_system: {{ENVIRONMENT_BOOKING_REQUIRED}} # true | false
      environment_conflict_resolution: "{{ENVIRONMENT_CONFLICT_RESOLUTION}}" # queue | priority | abort
      
    # 环境监控
    environment_monitoring:
      resource_monitoring: [{{RESOURCE_MONITORING}}] # cpu | memory | disk | network
      application_health_monitoring: [{{APP_HEALTH_MONITORING}}]
      test_execution_monitoring: [{{TEST_EXECUTION_MONITORING}}]

# ============================================================================
# 质量保证检查点 (Agent-D自检要求)
# ============================================================================
quality_assurance_checkpoints:
  # 测试设计完整性检查
  test_design_completeness_check:
    traceability_validation:
      - check_item: "所有测试用例都有完整的追溯链"
        validation_result: "{{TRACEABILITY_COMPLETE}}" # pass | fail
        missing_traceability: [{{MISSING_TRACEABILITY}}]
        traceability_coverage_percentage: {{TRACEABILITY_COVERAGE}}%
        
    test_coverage_validation:
      - check_item: "需求覆盖完整性检查"
        validation_result: "{{REQUIREMENT_COVERAGE_COMPLETE}}" # pass | fail
        uncovered_requirements: [{{UNCOVERED_REQUIREMENTS}}]
        requirement_coverage_percentage: {{REQUIREMENT_COVERAGE}}%
        
    scenario_coverage_validation:
      - check_item: "BDD场景覆盖完整性检查"
        validation_result: "{{SCENARIO_COVERAGE_COMPLETE}}" # pass | fail
        uncovered_scenarios: [{{UNCOVERED_SCENARIOS}}]
        scenario_coverage_percentage: {{SCENARIO_COVERAGE}}%
        
    test_type_coverage_validation:
      - check_item: "测试类型覆盖完整性检查"
        validation_result: "{{TEST_TYPE_COVERAGE_COMPLETE}}" # pass | fail
        missing_test_types: [{{MISSING_TEST_TYPES}}]
        functional_test_coverage: {{FUNCTIONAL_TEST_COVERAGE}}%
        non_functional_test_coverage: {{NON_FUNCTIONAL_TEST_COVERAGE}}%
        
  # 测试可执行性检查
  test_executability_validation:
    automation_feasibility_check:
      total_test_cases: {{TOTAL_TEST_CASES}}
      automatable_test_cases: {{AUTOMATABLE_TEST_CASES}}
      automation_feasibility_percentage: {{AUTOMATION_FEASIBILITY}}%
      manual_test_cases: {{MANUAL_TEST_CASES}}
      automation_challenges: [{{AUTOMATION_CHALLENGES}}]
      
    test_environment_dependency_check:
      environment_requirements_defined: {{ENV_REQUIREMENTS_DEFINED}} # true | false
      environment_availability_confirmed: {{ENV_AVAILABILITY_CONFIRMED}} # true | false
      environment_setup_documented: {{ENV_SETUP_DOCUMENTED}} # true | false
      environment_conflicts_identified: [{{ENV_CONFLICTS}}]
      
    test_data_dependency_check:
      test_data_requirements_defined: {{TEST_DATA_REQUIREMENTS_DEFINED}} # true | false
      test_data_generation_strategy_defined: {{TEST_DATA_STRATEGY_DEFINED}} # true | false
      test_data_privacy_compliance: {{TEST_DATA_PRIVACY_COMPLIANCE}} # compliant | non_compliant | needs_review
      test_data_volume_feasibility: {{TEST_DATA_VOLUME_FEASIBLE}} # feasible | challenging | infeasible
      
  # 测试逻辑一致性检查
  test_logic_consistency_validation:
    test_case_logic_validation:
      logical_errors_detected: [{{LOGICAL_ERRORS}}]
      contradictory_test_cases: [{{CONTRADICTORY_TEST_CASES}}]
      incomplete_test_scenarios: [{{INCOMPLETE_TEST_SCENARIOS}}]
      
    test_data_consistency_validation:
      data_inconsistencies_detected: [{{DATA_INCONSISTENCIES}}]
      invalid_test_data_samples: [{{INVALID_TEST_DATA_SAMPLES}}]
      missing_test_data_relationships: [{{MISSING_DATA_RELATIONSHIPS}}]
      
    expected_result_validation:
      unrealistic_expected_results: [{{UNREALISTIC_EXPECTED_RESULTS}}]
      undefined_expected_results: [{{UNDEFINED_EXPECTED_RESULTS}}]
      ambiguous_validation_criteria: [{{AMBIGUOUS_VALIDATION_CRITERIA}}]
      
  # 测试策略合理性检查
  test_strategy_rationality_validation:
    test_approach_appropriateness:
      over_engineered_test_approaches: [{{OVER_ENGINEERED_APPROACHES}}]
      under_engineered_test_approaches: [{{UNDER_ENGINEERED_APPROACHES}}]
      inappropriate_test_techniques: [{{INAPPROPRIATE_TECHNIQUES}}]
      
    resource_requirement_realism:
      unrealistic_resource_requirements: [{{UNREALISTIC_RESOURCES}}]
      resource_conflicts_identified: [{{RESOURCE_CONFLICTS}}]
      budget_constraint_violations: [{{BUDGET_VIOLATIONS}}]
      
    timeline_feasibility:
      unrealistic_execution_timelines: [{{UNREALISTIC_TIMELINES}}]
      timeline_conflicts_identified: [{{TIMELINE_CONFLICTS}}]
      critical_path_bottlenecks: [{{CRITICAL_PATH_BOTTLENECKS}}]

# ============================================================================
