# JeecgBoot AI Agent协作测试设计模板 v4.0
# 基于BTDTP (BDD-Traceability-Driven Test Planning)协议
# 专为Agent-D（测试工程师）设计
# 支持三层架构的Layer 3 - 需求层 (Requirement Level)

# ============================================================================
# 📁 v4.0 三层架构存储规范 (重要更新)
# ============================================================================
# 本模板属于: Layer 3 - 需求层 (Requirement Level)
# 命名格式: [SYSTEM]-[MODULE]-[TIMESTAMP]-TEST-[TITLE].yaml
# 存储位置: ${base_working_directory}/AIGC/[SYSTEM]_[MODULE]/[SYSTEM]-[MODULE]-[TIMESTAMP]-TEST-[TITLE].yaml
# 
# 示例路径:
# - 汽车4S店-基础信息: /Users/admin/Work/Github/JeecgBoot/AIGC/AUTO_INFO/AUTO-INFO-20250731150000-TEST-汽车基本信息维护.yaml
# - 汽车4S店-销售信息: /Users/admin/Work/Github/JeecgBoot/AIGC/AUTO_SALE/AUTO-SALE-20250731160000-TEST-汽车销售信息维护.yaml
#
# Agent-D协作链位置 (4-Agent协作链终点):
# - 输入1: AUTO-INFO-20250731150000-REQ-汽车基本信息维护.yaml (Agent-A产出)
# - 输入2: AUTO-INFO-20250731150000-ARCH-汽车基本信息维护.yaml (Agent-B产出)
# - 输入3: AUTO-INFO-20250731150000-DEV-汽车基本信息维护.yaml (Agent-C产出)
# - 输出: AUTO-INFO-20250731150000-TEST-汽车基本信息维护.yaml (Agent-D产出，协作链完成)
# ============================================================================
#
# ============================================================================
# 📁 新文件命名规范 (重要更新)
# ============================================================================
# 需求编号格式: 系统功能模块-子功能模块-年月日时分秒
# 示例: ECOM-PROD-20250731143000 (电商-产品管理-2025年7月31日14:30:00)
#
# 此文档命名: ECOM-PROD-20250731143000-TEST-产品管理功能.yaml
# 建议保存路径: /ContextDev/example/ECOM-PROD-20250731143000-产品管理功能/ECOM-PROD-20250731143000-TEST-产品管理功能.yaml
# 输入依赖: 同目录下的前三个环节文档
#   - ECOM-PROD-20250731143000-REQ-产品管理功能.yaml
#   - ECOM-PROD-20250731143000-ARCH-产品管理功能.yaml
#   - ECOM-PROD-20250731143000-DEV-产品管理功能.yaml
#
# 命名说明:
# - TEST: 标识这是测试设计环节的文档
# - 集成测试策略：针对共享组件和需求依赖关系设计专门的集成测试
# - 并行测试执行：支持按需求套件独立执行测试，提高测试效率
# ============================================================================

# ============================================================================
# Agent协作协议声明
# ============================================================================
agent_collaboration_protocol:
  source_agent: "Agent-D (测试工程师)"
  input_agents: ["Agent-A (需求分析师)", "Agent-B (架构设计师)", "Agent-C (开发工程师)"]
  output_target: "QA团队执行 | 自动化测试平台 | 质量报告系统"
  communication_standard: "BTDTP结构化测试设计协议"
  quality_target: "测试覆盖率100%, 追溯完整性100%, 自动化率>80%"
  processing_time_target: "<90秒/测试群组"

# ============================================================================
# 输出元数据规范 (Agent-D必须填写)
# ============================================================================
test_design_metadata:
  # 文档标识
  document_identity:
    test_doc_id: "TEST-DOC-{{YYYYMMDD}}-{{SEQUENCE}}" # 如：TEST-DOC-20250731-001
    created_timestamp: "{{YYYY-MM-DD HH:MM:SS}}"
    agent_version: "Agent-D v{{VERSION}}"
    processing_duration: "{{SECONDS}}s"
    
  # 基线和系统关联信息
  baseline_and_system_reference:
    # 需求基线引用
    baseline_reference:
      baseline_id: "{{BASELINE_ID}}" # 来自需求基线模板
      baseline_version: "{{BASELINE_VERSION}}" # 基线版本
      requirement_suite_id: "{{REQUIREMENT_SUITE_ID}}" # 本需求在基线中的套件ID
      baseline_doc_path: "{{BASELINE_DOC_PATH}}" # 基线文档路径
      
    # 系统基础信息引用  
    system_reference:
      system_id: "{{SYSTEM_ID}}" # 来自系统基础模板
      system_name: "{{SYSTEM_NAME}}" # 系统名称
      system_base_doc_path: "{{SYSTEM_BASE_DOC_PATH}}" # 系统基础文档路径
      jeecg_version: "{{JEECG_VERSION}}" # 继承的JeecgBoot版本
      test_environments: [{{INHERITED_TEST_ENVIRONMENTS}}] # 继承的测试环境
      
  # 多源输入信息
  multi_source_input_info:
    requirement_doc_id: "{{REQ_DOC_ID}}" # 来自Agent-A
    requirement_doc_path: "{{REQ_DOC_PATH}}" # Agent-A文档路径
    design_doc_id: "{{DESIGN_DOC_ID}}" # 来自Agent-B
    design_doc_path: "{{DESIGN_DOC_PATH}}" # Agent-B文档路径
    wbs_doc_id: "{{WBS_DOC_ID}}" # 来自Agent-C
    wbs_doc_path: "{{WBS_DOC_PATH}}" # Agent-C文档路径
    
    # 输入统计
    input_requirements_count: {{INPUT_REQ_COUNT}}
    input_scenarios_count: {{INPUT_SCENARIO_COUNT}}
    input_design_decisions_count: {{INPUT_DESIGN_COUNT}}
    input_tasks_count: {{INPUT_TASKS_COUNT}}
    
    # 完整追溯链
    complete_traceability_chain:
      baseline_traceability_id: "{{BASELINE_TRACEABILITY_ID}}" # 来自基线
      system_traceability_id: "{{SYSTEM_TRACEABILITY_ID}}" # 来自系统
      requirement_traceability_id: "{{REQUIREMENT_TRACEABILITY_ID}}" # 来自Agent-A
      design_traceability_id: "{{DESIGN_TRACEABILITY_ID}}" # 来自Agent-B
      development_traceability_id: "{{DEVELOPMENT_TRACEABILITY_ID}}" # 来自Agent-C
    
  # JeecgBoot测试环境上下文
  testing_context:
    framework_version: "{{JEECG_VERSION}}" # 默认3.8.1
    test_framework_stack: [{{TEST_FRAMEWORK_STACK}}] # junit5, testng, cucumber, selenium, postman
    test_environment: "{{TEST_ENVIRONMENT}}" # local | dev | test | staging | prod
    test_data_strategy: "{{TEST_DATA_STRATEGY}}" # synthetic | production_subset | mock
    test_automation_platform: "{{TEST_AUTOMATION_PLATFORM}}" # jenkins | gitlab_ci | github_actions

# ============================================================================
# 多源输入解析与融合 (Agent-A/B/C输出理解)
# ============================================================================
multi_source_input_parsing:
  # Agent-A需求文档解析
  requirements_parsing:
    ears_requirements_analysis:
      # EARS五种类型解析
      ubiquitous_requirements:
        - requirement_id: "{{PARSED_REQ_U_ID_1}}" # 来自Agent-A
          ears_statement: "{{PARSED_EARS_STATEMENT_1}}"
          acceptance_criteria: [{{PARSED_ACCEPTANCE_CRITERIA_1}}]
          test_implications: "{{TEST_IMPLICATIONS_1}}" # Agent-D的测试理解
          testability_score: {{TESTABILITY_SCORE_1}} # 1-10，可测试性评分
          
      event_driven_requirements:
        - requirement_id: "{{PARSED_REQ_E_ID_1}}"
          ears_statement: "{{PARSED_EARS_STATEMENT_E_1}}"
          event_trigger: "{{PARSED_EVENT_TRIGGER_1}}"
          expected_response: "{{PARSED_EXPECTED_RESPONSE_1}}"
          test_implications: "{{TEST_IMPLICATIONS_E_1}}"
          testability_score: {{TESTABILITY_SCORE_E_1}}
          
      unwanted_behavior_requirements:
        - requirement_id: "{{PARSED_REQ_UB_ID_1}}"
          ears_statement: "{{PARSED_EARS_STATEMENT_UB_1}}"
          unwanted_scenario: "{{PARSED_UNWANTED_SCENARIO_1}}"
          prevention_mechanism: "{{PARSED_PREVENTION_MECHANISM_1}}"
          test_implications: "{{TEST_IMPLICATIONS_UB_1}}"
          testability_score: {{TESTABILITY_SCORE_UB_1}}
          
      state_driven_requirements:
        - requirement_id: "{{PARSED_REQ_S_ID_1}}"
          ears_statement: "{{PARSED_EARS_STATEMENT_S_1}}"
          state_transitions: [{{PARSED_STATE_TRANSITIONS_1}}]
          test_implications: "{{TEST_IMPLICATIONS_S_1}}"
          testability_score: {{TESTABILITY_SCORE_S_1}}
          
      optional_requirements:
        - requirement_id: "{{PARSED_REQ_O_ID_1}}"
          ears_statement: "{{PARSED_EARS_STATEMENT_O_1}}"
          optional_conditions: [{{PARSED_OPTIONAL_CONDITIONS_1}}]
          test_implications: "{{TEST_IMPLICATIONS_O_1}}"
          testability_score: {{TESTABILITY_SCORE_O_1}}
          
    bdd_scenarios_analysis:
      # BDD四种场景解析
      functional_scenarios:
        - scenario_id: "{{PARSED_BDD_F_ID_1}}" # 来自Agent-A
          scenario_title: "{{PARSED_BDD_F_TITLE_1}}"
          given: "{{PARSED_GIVEN_1}}"
          when: "{{PARSED_WHEN_1}}"
          then: "{{PARSED_THEN_1}}"
          and_conditions: [{{PARSED_AND_CONDITIONS_1}}]
          but_exceptions: [{{PARSED_BUT_EXCEPTIONS_1}}]
          test_case_generation_potential: "{{TEST_GENERATION_POTENTIAL_1}}" # high | medium | low
          automation_feasibility: "{{AUTOMATION_FEASIBILITY_1}}" # high | medium | low
          
      exception_scenarios:
        - scenario_id: "{{PARSED_BDD_E_ID_1}}"
          scenario_title: "{{PARSED_BDD_E_TITLE_1}}"
          exception_type: "{{PARSED_EXCEPTION_TYPE_1}}"
          given: "{{PARSED_GIVEN_E_1}}"
          when: "{{PARSED_WHEN_E_1}}"
          then: "{{PARSED_THEN_E_1}}"
          test_case_generation_potential: "{{TEST_GENERATION_POTENTIAL_E_1}}"
          automation_feasibility: "{{AUTOMATION_FEASIBILITY_E_1}}"
          
      boundary_scenarios:
        - scenario_id: "{{PARSED_BDD_B_ID_1}}"
          scenario_title: "{{PARSED_BDD_B_TITLE_1}}"
          boundary_type: "{{PARSED_BOUNDARY_TYPE_1}}"
          boundary_value: "{{PARSED_BOUNDARY_VALUE_1}}"
          given: "{{PARSED_GIVEN_B_1}}"
          when: "{{PARSED_WHEN_B_1}}"
          then: "{{PARSED_THEN_B_1}}"
          test_case_generation_potential: "{{TEST_GENERATION_POTENTIAL_B_1}}"
          automation_feasibility: "{{AUTOMATION_FEASIBILITY_B_1}}"
          
      integration_scenarios:
        - scenario_id: "{{PARSED_BDD_I_ID_1}}"
          scenario_title: "{{PARSED_BDD_I_TITLE_1}}"
          integration_type: "{{PARSED_INTEGRATION_TYPE_1}}"
          external_system: "{{PARSED_EXTERNAL_SYSTEM_1}}"
          given: "{{PARSED_GIVEN_I_1}}"
          when: "{{PARSED_WHEN_I_1}}"
          then: "{{PARSED_THEN_I_1}}"
          test_case_generation_potential: "{{TEST_GENERATION_POTENTIAL_I_1}}"
          automation_feasibility: "{{AUTOMATION_FEASIBILITY_I_1}}"
          
  # Agent-B设计文档解析
  design_parsing:
    architectural_decisions_analysis:
      - design_decision_id: "{{PARSED_DESIGN_ID_1}}" # 来自Agent-B
        source_requirement_ids: [{{PARSED_SOURCE_REQ_IDS_1}}]
        design_pattern: "{{PARSED_DESIGN_PATTERN_1}}"
        implementation_approach: "{{PARSED_IMPLEMENTATION_APPROACH_1}}"
        test_strategy_suggestion: "{{PARSED_TEST_STRATEGY_1}}" # Agent-B的测试策略建议
        testing_challenges: [{{PARSED_TESTING_CHALLENGES_1}}] # Agent-D识别的测试挑战
        test_design_implications: "{{TEST_DESIGN_IMPLICATIONS_1}}"
        
    codegen_configuration_analysis:
      - codegen_config_id: "{{PARSED_CODEGEN_ID_1}}"
        module_name: "{{PARSED_MODULE_NAME_1}}"
        business_entity: "{{PARSED_BUSINESS_ENTITY_1}}"
        generated_components: [{{PARSED_GENERATED_COMPONENTS_1}}]
        test_generation_opportunity: "{{TEST_GENERATION_OPPORTUNITY_1}}" # standard_tests | enhanced_tests | custom_tests_needed
        standard_test_applicability: {{STANDARD_TEST_APPLICABILITY_1}}% # 0-100
        
  # Agent-C任务分解解析
  task_breakdown_parsing:
    task_groups_analysis:
      - task_group_id: "{{PARSED_TASK_GROUP_ID_1}}" # 来自Agent-C
        gwt_task_mapping:
          given_tasks: [{{PARSED_GIVEN_TASKS_1}}]
          when_tasks: [{{PARSED_WHEN_TASKS_1}}]
          then_tasks: [{{PARSED_THEN_TASKS_1}}]
          but_tasks: [{{PARSED_BUT_TASKS_1}}]
        test_task_identification: # Agent-D识别的测试相关任务
          identified_test_tasks: [{{IDENTIFIED_TEST_TASKS_1}}]
          missing_test_coverage: [{{MISSING_TEST_COVERAGE_1}}]
          test_task_dependencies: [{{TEST_TASK_DEPENDENCIES_1}}]
          
    codegen_vs_manual_analysis:
      codegen_tasks:
        - task_id: "{{CODEGEN_TASK_ID_1}}"
          codegen_coverage: {{CODEGEN_COVERAGE_1}}%
          standard_test_applicability: "{{STANDARD_TEST_APPLICABILITY_1}}"
          test_template_usage: "{{TEST_TEMPLATE_USAGE_1}}"
          
      manual_tasks:
        - task_id: "{{MANUAL_TASK_ID_1}}"
          complexity_reason: "{{COMPLEXITY_REASON_1}}"
          custom_test_requirements: [{{CUSTOM_TEST_REQUIREMENTS_1}}]
          test_design_complexity: "{{TEST_DESIGN_COMPLEXITY_1}}" # simple | medium | complex

# ============================================================================
# BTDTP测试规划 (四维测试空间映射)
# ============================================================================
btdtp_test_planning:
  # 测试规划摘要
  test_planning_summary:
    total_test_scenarios_planned: {{TOTAL_TEST_SCENARIOS}}
    total_test_cases_planned: {{TOTAL_TEST_CASES}}
    automation_coverage_target: {{AUTOMATION_COVERAGE_TARGET}}%
    manual_testing_percentage: {{MANUAL_TESTING_PERCENTAGE}}%
    estimated_test_execution_time: {{ESTIMATED_EXECUTION_TIME}} # hours
    test_environment_requirements: [{{TEST_ENV_REQUIREMENTS}}]
    
  # 四维测试映射矩阵
  four_dimensional_test_mapping:
    # 维度映射说明
    mapping_dimensions:
      dimension_1: "EARS需求类型" # 5种
      dimension_2: "BDD场景类型" # 4种
      dimension_3: "开发任务类型" # 4种Given-When-Then-But
      dimension_4: "测试层次" # 4种Unit-Integration-System-Acceptance
      
    # 核心测试类型映射 (从320种组合筛选为关键测试类型)
    core_test_type_mappings:
      - mapping_id: "BTM-001"
        ears_type: "ubiquitous"
        bdd_scenario_type: "functional"
        task_type: "when_task"
        test_level: "unit"
        test_type_description: "通用功能单元测试"
        test_approach: "标准CRUD测试模板"
        automation_priority: "high"
        codegen_applicable: true
        
      - mapping_id: "BTM-002"
        ears_type: "event_driven"
        bdd_scenario_type: "functional"
        task_type: "when_task"
        test_level: "integration"
        test_type_description: "事件驱动集成测试"
        test_approach: "事件触发-响应验证"
        automation_priority: "high"
        codegen_applicable: false
        
      - mapping_id: "BTM-003"
        ears_type: "unwanted_behavior"
        bdd_scenario_type: "exception"
        task_type: "but_task"
        test_level: "system"
        test_type_description: "异常行为系统测试"
        test_approach: "负面测试和边界测试"
        automation_priority: "medium"
        codegen_applicable: false
        
      - mapping_id: "BTM-004"
        ears_type: "state_driven"
        bdd_scenario_type: "functional"
        task_type: "given_task"
        test_level: "system"
        test_type_description: "状态驱动系统测试"
        test_approach: "状态机转换测试"
        automation_priority: "medium"
        codegen_applicable: false
        
      - mapping_id: "BTM-005"
        ears_type: "optional"
        bdd_scenario_type: "boundary"
        task_type: "then_task"
        test_level: "acceptance"
        test_type_description: "可选功能验收测试"
        test_approach: "条件化验收测试"
        automation_priority: "low"
        codegen_applicable: false
        # 继续添加核心映射...
        
  # 测试策略定义
  test_strategy_definitions:
    # 单元测试策略
    unit_test_strategy:
      applicable_scenarios: [{{UNIT_TEST_SCENARIOS}}]
      test_framework: "{{UNIT_TEST_FRAMEWORK}}" # junit5 | testng
      mock_strategy: "{{MOCK_STRATEGY}}" # mockito | powermock | manual_mock
      coverage_target: {{UNIT_COVERAGE_TARGET}}% # 目标代码覆盖率
      execution_approach: "automated"
      
    # 集成测试策略
    integration_test_strategy:
      applicable_scenarios: [{{INTEGRATION_TEST_SCENARIOS}}]
      integration_levels: [{{INTEGRATION_LEVELS}}] # component | service | system
      test_framework: "{{INTEGRATION_TEST_FRAMEWORK}}" # spring_boot_test | testcontainers
      database_strategy: "{{DATABASE_STRATEGY}}" # h2_memory | testcontainers | dedicated_db
      external_service_strategy: "{{EXTERNAL_SERVICE_STRATEGY}}" # mock | wiremock | real_service
      execution_approach: "automated"
      
    # 系统测试策略
    system_test_strategy:
      applicable_scenarios: [{{SYSTEM_TEST_SCENARIOS}}]
      test_types: [{{SYSTEM_TEST_TYPES}}] # functional | performance | security | usability
      test_environment: "{{SYSTEM_TEST_ENVIRONMENT}}" # dedicated_test_env | staging_env
      data_strategy: "{{SYSTEM_DATA_STRATEGY}}" # synthetic | production_subset
      execution_approach: "automated_with_manual_validation"
      
    # 验收测试策略
    acceptance_test_strategy:
      applicable_scenarios: [{{ACCEPTANCE_TEST_SCENARIOS}}]
      test_approach: "bdd_cucumber" # bdd_cucumber | manual_checklist | automated_e2e
      stakeholder_involvement: [{{STAKEHOLDER_ROLES}}] # business_analyst | product_owner | end_user
      test_environment: "{{ACCEPTANCE_TEST_ENVIRONMENT}}" # staging | production_like
      execution_approach: "mixed_automated_manual"

# ============================================================================
# 测试用例生成 (可执行测试用例规范)
# ============================================================================
test_case_generation:
  # 测试用例生成摘要
  generation_summary:
    total_generated_test_cases: {{TOTAL_GENERATED_TEST_CASES}}
    automated_test_cases: {{AUTOMATED_TEST_CASES}}
    manual_test_cases: {{MANUAL_TEST_CASES}}
    generated_test_data_sets: {{GENERATED_TEST_DATA_SETS}}
    
  # BDD Gherkin格式测试用例
  bdd_gherkin_test_cases:
    - test_case_id: "BDD-TC-001"
      test_case_name: "{{BDD_TEST_CASE_NAME_1}}"
      
      # 完整追溯链
      traceability_chain:
        source_requirement_id: "{{SOURCE_REQ_ID_1}}" # 追溯到Agent-A
        source_scenario_id: "{{SOURCE_SCENARIO_ID_1}}" # 追溯到Agent-A
        source_design_id: "{{SOURCE_DESIGN_ID_1}}" # 追溯到Agent-B
        source_task_id: "{{SOURCE_TASK_ID_1}}" # 追溯到Agent-C
        
      # Gherkin结构
      gherkin_structure:
        feature: "{{FEATURE_DESCRIPTION_1}}"
        background: "{{BACKGROUND_SETUP_1}}" # 可选
        scenario: "{{SCENARIO_DESCRIPTION_1}}"
        given: "{{GHERKIN_GIVEN_1}}"
        when: "{{GHERKIN_WHEN_1}}"
        then: "{{GHERKIN_THEN_1}}"
        and_steps: [{{GHERKIN_AND_STEPS_1}}]
        but_steps: [{{GHERKIN_BUT_STEPS_1}}]
        
      # 执行规范
      execution_specification:
        test_level: "{{TEST_LEVEL_1}}" # unit | integration | system | acceptance
        automation_type: "{{AUTOMATION_TYPE_1}}" # fully_automated | semi_automated | manual
        test_framework: "{{TEST_FRAMEWORK_1}}" # cucumber_java | cucumber_js
        execution_priority: "{{EXECUTION_PRIORITY_1}}" # high | medium | low
        execution_environment: "{{EXECUTION_ENVIRONMENT_1}}"
        
      # 测试数据要求
      test_data_requirements:
        input_data: "{{INPUT_DATA_1}}"
        expected_output: "{{EXPECTED_OUTPUT_1}}"
        test_data_setup: "{{TEST_DATA_SETUP_1}}"
        test_data_cleanup: "{{TEST_DATA_CLEANUP_1}}"
        
      # 验证点
      validation_points:
        functional_validations: [{{FUNCTIONAL_VALIDATIONS_1}}]
        data_validations: [{{DATA_VALIDATIONS_1}}]
        ui_validations: [{{UI_VALIDATIONS_1}}] # 如果适用
        api_validations: [{{API_VALIDATIONS_1}}] # 如果适用
        
    - test_case_id: "BDD-TC-002"
      test_case_name: "{{BDD_TEST_CASE_NAME_2}}"
      traceability_chain:
        source_requirement_id: "{{SOURCE_REQ_ID_2}}"
        source_scenario_id: "{{SOURCE_SCENARIO_ID_2}}"
        source_design_id: "{{SOURCE_DESIGN_ID_2}}"
        source_task_id: "{{SOURCE_TASK_ID_2}}"
      gherkin_structure:
        feature: "{{FEATURE_DESCRIPTION_2}}"
        background: "{{BACKGROUND_SETUP_2}}"
        scenario: "{{SCENARIO_DESCRIPTION_2}}"
        given: "{{GHERKIN_GIVEN_2}}"
        when: "{{GHERKIN_WHEN_2}}"
        then: "{{GHERKIN_THEN_2}}"
        and_steps: [{{GHERKIN_AND_STEPS_2}}]
        but_steps: [{{GHERKIN_BUT_STEPS_2}}]
      execution_specification:
        test_level: "{{TEST_LEVEL_2}}"
        automation_type: "{{AUTOMATION_TYPE_2}}"
        test_framework: "{{TEST_FRAMEWORK_2}}"
        execution_priority: "{{EXECUTION_PRIORITY_2}}"
        execution_environment: "{{EXECUTION_ENVIRONMENT_2}}"
      test_data_requirements:
        input_data: "{{INPUT_DATA_2}}"
        expected_output: "{{EXPECTED_OUTPUT_2}}"
        test_data_setup: "{{TEST_DATA_SETUP_2}}"
