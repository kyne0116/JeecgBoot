  reporting_summary:
    total_report_types: {{TOTAL_REPORT_TYPES}}
    automated_report_generation: {{AUTOMATED_REPORT_COUNT}}
    manual_report_compilation: {{MANUAL_REPORT_COUNT}}
    real_time_reporting_capability: {{REAL_TIME_REPORTING}} # true | false
    
  # 测试计划报告
  test_plan_reporting:
    test_plan_document:
      document_id: "TEST-PLAN-{{YYYYMMDD}}-{{SEQUENCE}}"
      document_version: "{{TEST_PLAN_VERSION}}"
      
      # 执行摘要
      executive_summary:
