jeecg_integration_testing:
  # CodeGen生成代码测试
  codegen_generated_code_testing:
    # 标准CRUD测试模板
    standard_crud_test_templates:
      - template_id: "CRUD-TEMPLATE-001"
        business_entity: "{{BUSINESS_ENTITY_1}}" # 如：Product
        
        # CRUD操作测试覆盖
        crud_operations_coverage:
          create_operation_tests:
            - test_name: "testCreate{{BUSINESS_ENTITY_1}}_ValidInput_ReturnsSuccess"
              test_type: "positive_test"
              validation_points: [{{CREATE_VALIDATION_POINTS_1}}]
              
          read_operation_tests:
            - test_name: "testGet{{BUSINESS_ENTITY_1}}_ValidId_ReturnsEntity"
              test_type: "positive_test"
              validation_points: [{{READ_VALIDATION_POINTS_1}}]
              
          update_operation_tests:
            - test_name: "testUpdate{{BUSINESS_ENTITY_1}}_ValidInput_ReturnsSuccess"
              test_type: "positive_test"
              validation_points: [{{UPDATE_VALIDATION_POINTS_1}}]
              
          delete_operation_tests:
            - test_name: "testDelete{{BUSINESS_ENTITY_1}}_ValidId_ReturnsSuccess"
              test_type: "positive_test"
              validation_points: [{{DELETE_VALIDATION_POINTS_1}}]
              
          query_operation_tests:
            - test_name: "testQuery{{BUSINESS_ENTITY_1}}_ValidCriteria_ReturnsResults"
              test_type: "positive_test"
              validation_points: [{{QUERY_VALIDATION_POINTS_1}}]
              
        # 数据字典验证测试
        dictionary_validation_tests:
          used_dictionaries: [{{USED_DICTIONARIES_1}}] # 来自Code_Gen_DICT.json
          dictionary_tests:
            - dictionary_name: "{{DICTIONARY_NAME_1}}" # 如：sex
              dictionary_values: [{{DICTIONARY_VALUES_1}}] # 如：["M", "F"]
              validation_test_cases:
                - test_case: "test{{BUSINESS_ENTITY_1}}_ValidDictionaryValue_AcceptsValue"
                  test_input: "{{VALID_DICTIONARY_VALUE_1}}"
                  expected_result: "success"
                - test_case: "test{{BUSINESS_ENTITY_1}}_InvalidDictionaryValue_RejectsValue"
                  test_input: "{{INVALID_DICTIONARY_VALUE_1}}"
                  expected_result: "validation_error"
                  
    # 自定义业务逻辑测试
    custom_business_logic_testing:
      - custom_logic_id: "CUSTOM-LOGIC-001"
        logic_description: "{{CUSTOM_LOGIC_DESCRIPTION_1}}"
        complexity_level: "{{COMPLEXITY_LEVEL_1}}" # simple | medium | complex
        
        # 自定义测试策略
        custom_test_strategy:
          test_approach: "{{CUSTOM_TEST_APPROACH_1}}" # white_box | black_box | grey_box
          test_techniques: [{{CUSTOM_TEST_TECHNIQUES_1}}] # equivalence_partitioning | boundary_value_analysis | decision_table
          test_coverage_requirements: [{{CUSTOM_COVERAGE_REQUIREMENTS_1}}]
          
        # 自定义测试用例
        custom_test_cases:
          - custom_test_case_id: "CUSTOM-TC-001"
            test_case_description: "{{CUSTOM_TEST_CASE_DESCRIPTION_1}}"
            test_complexity: "{{CUSTOM_TEST_COMPLEXITY_1}}"
            test_data_requirements: "{{CUSTOM_TEST_DATA_REQUIREMENTS_1}}"
            expected_challenges: [{{CUSTOM_TEST_CHALLENGES_1}}]
            
  # JeecgBoot框架特性测试
  jeecg_framework_features_testing:
    # 权限控制测试
    permission_control_testing:
      - permission_test_suite_id: "PERM-TS-001"
        tested_permissions: [{{TESTED_PERMISSIONS_1}}] # 来自Agent-B的权限设计
        
        permission_test_cases:
          - permission_test_case_id: "PERM-TC-001"
            test_scenario: "有权限用户访问受保护资源"
            user_role: "{{USER_ROLE_1}}"
            required_permission: "{{REQUIRED_PERMISSION_1}}"
            test_action: "{{TEST_ACTION_1}}"
            expected_result: "access_granted"
            
          - permission_test_case_id: "PERM-TC-002"
            test_scenario: "无权限用户访问受保护资源"
            user_role: "{{USER_ROLE_2}}"
            required_permission: "{{REQUIRED_PERMISSION_2}}"
            test_action: "{{TEST_ACTION_2}}"
            expected_result: "access_denied"
            
    # 工作流引擎测试 (如果使用)
    workflow_engine_testing:
      - workflow_test_suite_id: "WF-TS-001"
        tested_workflow: "{{TESTED_WORKFLOW_1}}"
        
        workflow_test_cases:
          - workflow_test_case_id: "WF-TC-001"
            test_scenario: "正常工作流执行"
            workflow_input: "{{WORKFLOW_INPUT_1}}"
            expected_workflow_states: [{{EXPECTED_WF_STATES_1}}]
            expected_final_state: "{{EXPECTED_FINAL_STATE_1}}"
            
    # 系统集成测试
    system_integration_testing:
      - integration_test_suite_id: "INTEG-TS-001"
        integration_type: "{{INTEGRATION_TYPE_1}}" # database | external_service | message_queue
        
        integration_test_cases:
