# 系统架构专家 - 输入模板
# ========================================================================
# 版本: v1.0.0 | 创建日期: 2025-07-27
# 专家: system_architect
# 用途: 接收requirements_analyst输出，进行系统架构设计

system_architect_input:
  # 引用共享基础信息基线
  baseline_reference:
    shared_baseline: "../shared/baseline_shared.yaml#/shared_baseline"
    project_context: "../shared/project_context.yaml#/project_context"
    data_types: "../shared/data_types.yaml#/data_types"
    
  # 输入来源信息
  input_source:
    source_expert: "requirements_analyst"   # 输入来源专家
    source_document: "requirement_specification"
    source_version: ""                      # type: version - 源文档版本
    handoff_date: ""                        # type: datetime - 交接时间
    
  # 项目基础信息 (继承自需求分析输出)
  project_info:
    project_id: "$inherited_from_requirements"
    project_name: "$inherited_from_requirements"
    system_name: "$inherited_from_requirements"
    module_name: "$inherited_from_requirements"
    business_domain: "$inherited_from_requirements"
    complexity_level: "$inherited_from_requirements"
    
  # 需求规格输入 (来自requirements_analyst输出)
  requirements_specification:
    # 业务需求概述
    business_requirements:
      business_objectives: []           # type: array[text] - 从需求输出继承
      business_scope: ""                # type: text - 业务范围
      success_criteria: []              # type: array[text] - 成功标准
      
    # 功能需求详细信息
    functional_requirements:
      core_functions: []                # type: array[requirement_item] - 核心功能
      support_functions: []             # type: array[requirement_item] - 支撑功能
      integration_functions: []         # type: array[requirement_item] - 集成功能
      reporting_functions: []           # type: array[requirement_item] - 报表功能
      
      # 详细需求列表 (带技术映射)
      detailed_requirements: []         # 完整的需求列表，包含technical_mapping
      
    # 非功能需求约束
    non_functional_constraints:
      performance_requirements: {}      # 性能要求约束
      security_requirements: {}         # 安全要求约束
      usability_requirements: {}        # 易用性要求约束
      reliability_requirements: {}      # 可靠性要求约束
      
    # 接口需求规格
    interface_specifications:
      external_interfaces: []           # 外部接口规格
      internal_interfaces: []           # 内部接口规格
      data_interfaces: []               # 数据接口规格
      user_interfaces: []               # 用户接口规格
      
    # 数据需求规格
    data_specifications:
      data_entities: []                 # 数据实体规格
      data_relationships: []            # 数据关系规格
      data_quality_requirements: {}     # 数据质量要求
      data_volume_estimates: {}         # 数据量估算
      
  # JeecgBoot技术约束输入
  jeecgboot_constraints:
    # 框架兼容性分析 (来自需求分析)
    framework_compatibility:
      compatible_features: []           # 兼容特性列表
      incompatible_features: []         # 不兼容特性列表
      workarounds: []                   # 变通方案
      
    # CodeGen系统约束
    codegen_constraints:
      codegen_coverage: ""              # type: codegen_applicability - 覆盖率
      auto_generated_components: []     # 自动生成组件
      custom_development_needs: []      # 自定义开发需求
      generation_complexity: ""         # 生成复杂度
      
    # 技术栈约束
    technology_stack_constraints:
      backend_framework: "Spring Boot 3.x"    # 后端框架约束
      frontend_framework: "Vue 3 + TypeScript" # 前端框架约束
      database: "MySQL 8.0+"                  # 数据库约束
      cache: "Redis 7.x"                      # 缓存约束
      architecture_pattern: "monolithic"      # 架构模式约束
      
  # 架构设计指令
  architecture_design_requirements:
    # 设计重点
    design_focus_areas:
      primary_focus: []                 # type: array[text] - 主要关注点
      secondary_focus: []               # type: array[text] - 次要关注点
      critical_decisions: []            # type: array[text] - 关键决策点
      
    # 设计约束
    design_constraints:
      architectural_patterns: []        # 可使用的架构模式
      design_principles: []             # 设计原则
      quality_attributes: []            # 质量属性要求
      
    # 设计交付要求
    deliverable_requirements:
      architecture_views: []            # 需要的架构视图
      documentation_level: ""           # 文档详细程度
      review_criteria: []               # 评审标准
      
  # 追溯信息输入
  traceability_input:
    requirement_traceability: {}        # 需求追溯信息
    business_objective_mapping: {}      # 业务目标映射
    stakeholder_impact_analysis: {}     # 利益相关方影响分析
    
  # 质量保证输入
  quality_assurance_input:
    requirements_validation_status: ""  # 需求验证状态
    completeness_assessment: ""         # 完整性评估
    consistency_verification: ""        # 一致性验证
    feasibility_confirmation: ""        # 可行性确认
    
# 输入验证规则
input_validation:
  required_sections:
    - "requirements_specification.functional_requirements"
    - "requirements_specification.non_functional_constraints"
    - "jeecgboot_constraints.framework_compatibility"
    - "architecture_design_requirements.design_focus_areas"
    
  data_integrity_checks:
    requirements_completeness: "至少包含5个功能需求"
    technical_mapping_presence: "所有核心功能需求必须有technical_mapping"
    non_functional_completeness: "性能和安全要求必须完整"
    jeecgboot_compatibility_confirmed: "框架兼容性必须确认"
    
  consistency_validation:
    project_info_consistency: "项目信息与需求分析输出一致"
    technical_constraint_alignment: "技术约束与JeecgBoot能力对齐"
    requirement_traceability_integrity: "需求追溯信息完整"
    
# 处理指导
processing_guidance:
  architecture_design_approach:
    - "基于functional_requirements进行系统分层设计"
    - "根据non_functional_constraints确定架构质量属性"
    - "遵循jeecgboot_constraints进行技术选型"
    - "确保设计满足codegen_constraints要求"
    
  key_design_considerations:
    - "单体分层架构模式应用"
    - "JeecgBoot框架能力最大化利用"
    - "数据库设计优化和性能考虑"
    - "API接口设计标准化"
    
  output_expectations:
    - "完整的系统架构设计"
    - "详细的数据库设计"
    - "API接口规范定义"
    - "技术实现指导建议"
    
# 使用指南
usage_guidelines:
  purpose: "为system_architect专家提供完整的架构设计输入"
  
  input_preparation:
    - "确认requirements_analyst输出的完整性"
    - "验证technical_mapping的准确性"
    - "确保non_functional_constraints清晰明确"
    - "检查jeecgboot_constraints的合理性"
    
  processing_approach:
    - "从业务需求出发进行架构设计"
    - "严格遵循JeecgBoot技术栈约束"
    - "优先考虑CodeGen系统的应用"
    - "确保架构设计的可实现性"
    
  quality_standards:
    - "架构设计必须满足所有非功能需求"
    - "技术选型必须符合框架约束"
    - "设计方案必须具备良好的可扩展性"
    - "接口设计必须遵循RESTful规范"