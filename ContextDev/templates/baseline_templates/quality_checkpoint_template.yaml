# 需求基线管理质量检查点模板
# Template: quality_checkpoint_template.yaml
# Version: v4.0.0
# Description: 标准化质量检查点定义，确保基线管理体系的质量保证

quality_checkpoint:
  # === 检查点基本信息 ===
  checkpoint_info:
    checkpoint_id: string               # 检查点唯一标识
    checkpoint_name: string             # 检查点名称
    checkpoint_type: enum               # phase_gate|milestone|continuous|ad_hoc
    checkpoint_level: enum              # critical|high|medium|low
    responsible_expert: enum            # baseline_manager|requirements_analyst|system_architect|task_planner|code_developer|quality_tester
    checkpoint_version: string          # 检查点版本
    
  # === 触发条件 ===
  trigger_conditions:
    trigger_events: array               # 触发事件
      - event_type: enum                # expert_completion|phase_transition|milestone_reached|time_based|quality_threshold
        event_description: string
        event_condition: string
        automatic_trigger: boolean
        
    prerequisite_checks: array          # 前置条件检查
      - prerequisite_name: string
        prerequisite_description: string
        validation_method: string
        required_status: string
        
    timing_requirements:
      earliest_execution_time: datetime # 最早执行时间
      latest_execution_time: datetime   # 最晚执行时间
      execution_window: string          # 执行时间窗口
      time_zone: string                 # 时区
  
  # === 质量标准定义 ===
  quality_standards:
    completeness_standards: array       # 完整性标准
      - standard_name: string
        standard_description: string
        measurement_method: string
        pass_threshold: string          # 通过阈值
        fail_threshold: string          # 失败阈值
        measurement_unit: string
        
    consistency_standards: array        # 一致性标准
      - standard_name: string
        standard_description: string
        validation_rules: array
          - rule_name: string
            rule_expression: string
            rule_description: string
        consistency_scope: string
        
    accuracy_standards: array           # 准确性标准
      - standard_name: string
        standard_description: string
        accuracy_metrics: array
          - metric_name: string
            metric_calculation: string
            target_value: string
            tolerance_range: string
            
    usability_standards: array          # 可用性标准
      - standard_name: string
        standard_description: string
        usability_criteria: array
          - criteria_name: string
            criteria_description: string
            evaluation_method: string
            acceptance_level: string
  
  # === 检查项目清单 ===
  checkpoint_checklist:
    mandatory_checks: array             # 强制检查项
      - check_id: string
        check_name: string
        check_description: string
        check_method: enum              # automated|manual|hybrid
        check_criteria: string
        pass_condition: string
        fail_action: enum               # block|warn|log
        automation_script: string      # 自动化检查脚本
        
    optional_checks: array              # 可选检查项
      - check_id: string
        check_name: string
        check_description: string
        check_rationale: string
        recommended_condition: string
        skip_condition: string
        
    domain_specific_checks: array       # 领域特定检查
      - domain: enum                    # core_system|finance_management|supply_chain|crm|hrm
        check_items: array
          - check_name: string
            domain_requirement: string
            specialized_criteria: string
  
  # === 数据验证规则 ===
  data_validation:
    schema_validation: array            # 数据结构验证
      - validation_name: "基线模板符合性验证"
        validation_method: "yaml_schema_validation"
        schema_reference: "requirement_baseline_template.yaml"
        validation_tools: ["yamllint", "jsonschema"]
        error_handling: "detailed_error_report"
        
    business_rule_validation: array     # 业务规则验证
      - validation_name: string
        validation_logic: string
        validation_context: string
        error_message_template: string
        
    cross_reference_validation: array   # 交叉引用验证
      - validation_name: string
        reference_sources: array
          - source_type: string
            source_path: string
            reference_field: string
        validation_rule: string
        
    constraint_validation: array        # 约束条件验证
      - constraint_name: string
        constraint_type: enum           # jeecgboot_constraint|business_constraint|technical_constraint
        constraint_expression: string
        violation_severity: enum        # critical|high|medium|low
  
  # === 专家协作验证 ===
  expert_collaboration_validation:
    handoff_validation: array           # 专家交接验证
      - from_expert: string
        to_expert: string
        handoff_requirements: array
          - requirement_name: string
            validation_method: string
            pass_criteria: string
            quality_metric: string
            
    interface_compatibility: array      # 接口兼容性验证
      - interface_name: string
        interface_specification: string
        compatibility_test: string
        backward_compatibility: boolean
        
    collaboration_efficiency: array     # 协作效率验证
      - efficiency_metric: string
        measurement_method: string
        target_value: string
        improvement_threshold: string
  
  # === 追溯性验证 ===
  traceability_validation:
    forward_traceability: array         # 前向追溯验证
      - trace_from: string              # 追溯起点
        trace_to: string                # 追溯终点
        trace_relationship: string      # 追溯关系
        completeness_check: string      # 完整性检查
        
    backward_traceability: array        # 后向追溯验证
      - trace_from: string
        trace_to: string
        trace_relationship: string
        accuracy_check: string
        
    trace_coverage_analysis:
      coverage_scope: array             # 覆盖范围
        - scope_area: string
          expected_coverage: string
          actual_coverage: string
          gap_analysis: string
          
    trace_quality_metrics:
      trace_completeness: string        # 追溯完整性
      trace_accuracy: string            # 追溯准确性
      trace_consistency: string         # 追溯一致性
      trace_maintainability: string     # 追溯可维护性
  
  # === 技术合规性检查 ===
  technical_compliance:
    jeecgboot_compliance: array         # JeecgBoot框架合规性
      - compliance_area: string
        compliance_standard: string
        validation_method: string
        compliance_level: enum          # full|partial|non_compliant
        remediation_action: string
        
    code_quality_standards: array       # 代码质量标准
      - standard_name: string
        quality_metric: string
        measurement_tool: string
        target_threshold: string
        current_measurement: string
        
    security_compliance: array          # 安全合规性
      - security_requirement: string
        compliance_check: string
        vulnerability_assessment: string
        risk_level: enum                # critical|high|medium|low
        mitigation_plan: string
        
    performance_standards: array        # 性能标准
      - performance_metric: string
        measurement_method: string
      target_value: string
      current_value: string
      performance_gap: string
  
  # === 执行流程 ===
  execution_process:
    preparation_phase:
      preparation_tasks: array          # 准备任务
        - task_name: string
          task_description: string
          responsible_party: string
          estimated_duration: string
          required_resources: array
          
      readiness_assessment:
        assessment_criteria: array      # 评估标准
          - criteria_name: string
            criteria_description: string
            readiness_indicator: string
            
    execution_phase:
      execution_steps: array            # 执行步骤
        - step_number: number
          step_name: string
          step_description: string
          step_method: enum             # automated|manual|hybrid
          estimated_time: string
          success_criteria: string
          failure_handling: string
          
      parallel_activities: array       # 并行活动
        - activity_name: string
          activity_description: string
          parallel_condition: string
          synchronization_point: string
          
    validation_phase:
      result_validation: array          # 结果验证
        - validation_name: string
          validation_method: string
          validation_criteria: string
          validation_tools: array
          
      quality_assessment:
        assessment_dimensions: array    # 评估维度
          - dimension_name: string
            assessment_method: string
            scoring_system: string
            weight: number
  
  # === 结果处理 ===
  result_handling:
    pass_actions: array                 # 通过时的动作
      - action_type: enum               # notification|status_update|process_continuation|documentation
        action_description: string
        automatic_execution: boolean
        required_approvals: array
        
    fail_actions: array                 # 失败时的动作
      - action_type: enum               # block_process|require_remediation|escalate|rollback
        action_description: string
        escalation_level: enum          # immediate|urgent|standard
        responsible_party: string
        remediation_plan: string
        
    warning_actions: array              # 警告时的动作
      - warning_condition: string
        warning_message: string
        action_required: boolean
        follow_up_timeline: string
        
    documentation_requirements:
      result_documentation: array      # 结果文档化
        - document_type: string
          document_content: string
          document_format: string
          storage_location: string
          retention_period: string
  
  # === 改进和优化 ===
  continuous_improvement:
    performance_metrics: array          # 性能指标
      - metric_name: string
        metric_description: string
        measurement_frequency: string
        target_trend: enum              # increasing|decreasing|stable
        improvement_threshold: string
        
    feedback_collection:
      feedback_sources: array          # 反馈来源
        - source_type: enum             # expert_feedback|automated_analysis|stakeholder_input
          source_description: string
          collection_method: string
          feedback_frequency: string
          
    optimization_opportunities: array   # 优化机会
      - opportunity_area: string
        improvement_potential: string
        implementation_effort: enum     # low|medium|high
        expected_benefit: string
        priority_level: enum            # critical|high|medium|low
        
    version_evolution:
      version_history: array           # 版本历史
        - version_number: string
          version_date: datetime
          changes_summary: string
          improvement_rationale: string
          
      next_version_planning:
        planned_improvements: array     # 计划改进
          - improvement_name: string
            improvement_description: string
            implementation_timeline: string
            resource_requirements: string
  
  # === 元数据 ===
  metadata:
    template_info:
      template_author: "ContextDev Team"
      template_version: "v1.0.0"
      creation_date: datetime
      last_updated: datetime
      review_cycle: "quarterly"
      
    usage_context:
      applicable_scenarios: array      # 适用场景
        - scenario_name: string
          scenario_description: string
          usage_frequency: string
          
      customization_guidelines: array  # 定制指导
        - guideline_area: string
          guideline_description: string
          customization_examples: array
          
    integration_dependencies:
      required_templates: array        # 依赖模板
        - template_name: string
          template_version: string
          dependency_type: enum         # required|optional|recommended
          
      required_tools: array            # 依赖工具
        - tool_name: string
          tool_version: string
          tool_purpose: string
          
    compliance_certifications:
      quality_standards: array         # 质量标准
        - standard_name: string
          standard_version: string
          compliance_level: string
          certification_date: datetime