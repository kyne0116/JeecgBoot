# 需求基线管理核心模板
# Template: requirement_baseline_template.yaml
# Version: v4.0.0
# Description: 标准化需求基线管理格式，支持完整追溯和专家协作

requirement_baseline:
  # === 基本信息 ===
  basic_info:
    requirement_id: string              # 需求标识 {SYSTEM}_{MODULE}_{FUNCTION}_{VERSION}
    title: string                       # 需求标题
    description: string                 # 需求描述
    type: enum                          # functional|non-functional|constraint
    priority: enum                      # high|medium|low
    complexity: enum                    # simple|standard|complex|enterprise
    business_domain: enum               # core_system|finance_management|supply_chain|crm|hrm|inventory|order|reporting|workflow|integration
    
  # === 状态信息 ===
  status_info:
    current_status: enum                # draft|approved|in_analysis|in_architecture|in_planning|in_development|in_testing|completed|deprecated
    current_phase: enum                 # analysis|architecture|planning|development|testing|deployment
    responsible_expert: enum            # baseline_manager|requirements_analyst|system_architect|task_planner|code_developer|quality_tester
    progress_percentage: number         # 0-100
    last_update_time: datetime          # 最后更新时间
    
  # === 时间信息 ===
  timeline:
    created_time: datetime              # 创建时间
    updated_time: datetime              # 更新时间
    approved_time: datetime             # 审批时间
    target_completion: datetime         # 目标完成时间
    actual_completion: datetime         # 实际完成时间
    phase_durations:                    # 各阶段耗时
      analysis_duration: string
      architecture_duration: string
      planning_duration: string
      development_duration: string
      testing_duration: string
    
  # === 关联信息 ===
  relationships:
    parent_requirements: array          # 父需求列表
      - requirement_id: string
        relationship_type: string
    child_requirements: array           # 子需求列表
      - requirement_id: string
        relationship_type: string
    dependent_requirements: array       # 依赖需求列表
      - requirement_id: string
        dependency_type: string
        dependency_description: string
    related_modules: array              # 相关模块
      - module_id: string
        module_name: string
        relationship_description: string
        
  # === 业务信息 ===
  business_context:
    stakeholders: array                 # 利益相关方
      - stakeholder_name: string
        stakeholder_role: string
        stakeholder_department: string
        contact_info: string
        involvement_level: enum         # high|medium|low
    business_rules: array               # 业务规则
      - rule_id: string
        rule_name: string
        rule_description: string
        rule_type: enum                 # validation|calculation|derivation|constraint
        rule_expression: string
        error_handling: string
    acceptance_criteria: array          # 验收标准
      - criteria_id: string
        criteria_description: string
        test_method: string
        success_criteria: string
        priority: enum                  # must_have|should_have|could_have
    
  # === 技术信息 ===
  technical_context:
    jeecgboot_modules: array            # JeecgBoot模块依赖
      - module_name: string
        module_version: string
        usage_purpose: string
    database_tables: array              # 数据库表结构
      - table_name: string
        table_comment: string
        primary_key: string
        estimated_rows: number
    api_endpoints: array                # API接口定义
      - endpoint_path: string
        method: enum                    # GET|POST|PUT|DELETE
        purpose: string
        request_params: array
        response_format: string
    ui_components: array                # UI组件清单
      - component_name: string
        component_type: enum            # list|form|detail|modal|drawer
        component_purpose: string
        
  # === 追溯信息 ===
  traceability:
    source_documents: array             # 源文档
      - path: string
        type: enum                      # requirement_spec|business_rule|user_story
        expert: string
        creation_time: datetime
        version: string
    design_documents: array             # 设计文档
      - path: string  
        type: enum                      # system_architecture|data_model|api_spec
        expert: string
        creation_time: datetime
        version: string
    implementation_files: array         # 实现文件
      - path: string
        type: enum                      # entity|controller|service|mapper|vue_component
        expert: string
        creation_time: datetime
        version: string
        traceability_id: string
    test_cases: array                   # 测试用例
      - path: string
        type: enum                      # unit_test|integration_test|acceptance_test
        expert: string
        creation_time: datetime
        coverage_percentage: number
        
  # === 变更历史 ===
  change_history: array
    - version: string                   # 版本号
      change_type: enum                 # initial_creation|requirement_update|scope_change|technical_adjustment
      description: string               # 变更描述
      changed_by: string                # 变更人
      change_time: datetime             # 变更时间
      impact_analysis: string           # 影响分析
      approval_status: enum             # pending|approved|rejected
      approval_by: string               # 审批人
      approval_time: datetime           # 审批时间
      
  # === 质量信息 ===
  quality_metrics:
    requirement_completeness: number    # 需求完整性评分 0-100
    design_consistency: number          # 设计一致性评分 0-100
    implementation_compliance: number   # 实现符合性评分 0-100
    test_coverage: number               # 测试覆盖率 0-100
    overall_quality_score: number       # 总体质量评分 0-100
    quality_checkpoints: array          # 质量检查点
      - checkpoint_name: string
        checkpoint_status: enum         # passed|failed|pending
        checkpoint_time: datetime
        checker: string
        issues_found: array
          - issue_id: string
            issue_description: string
            issue_severity: enum        # critical|high|medium|low
            resolution_status: enum     # open|resolved|closed
            
  # === 专家协作信息 ===
  expert_collaboration:
    assigned_experts: array             # 分配的专家
      - expert_role: string
        expert_name: string
        assignment_time: datetime
        completion_time: datetime
        work_status: enum               # assigned|in_progress|completed|blocked
    collaboration_history: array        # 协作历史
      - collaboration_id: string
        from_expert: string
        to_expert: string
        handoff_time: datetime
        handoff_content: string
        handoff_status: enum            # successful|failed|partial
    current_bottlenecks: array          # 当前瓶颈
      - bottleneck_id: string
        bottleneck_description: string
        affected_expert: string
        impact_level: enum              # high|medium|low
        resolution_plan: string
        
  # === 风险管理 ===
  risk_management:
    identified_risks: array             # 识别的风险
      - risk_id: string
        risk_category: enum             # technical|business|resource|timeline|quality
        risk_description: string
        probability: enum               # high|medium|low
        impact: enum                    # high|medium|low
        risk_level: enum                # critical|high|medium|low
        mitigation_strategy: string
        risk_owner: string
        risk_status: enum               # open|mitigated|closed
    contingency_plans: array            # 应急计划
      - plan_id: string
        trigger_conditions: string
        contingency_actions: string
        responsible_party: string
        activation_criteria: string
        
  # === 度量指标 ===
  metrics:
    development_metrics:
      estimated_effort_hours: number   # 预估工时
      actual_effort_hours: number      # 实际工时
      productivity_score: number       # 生产力评分
      defect_density: number           # 缺陷密度
    collaboration_metrics:
      handoff_efficiency: number       # 交接效率
      rework_rate: number              # 返工率
      communication_effectiveness: number # 沟通有效性
    business_metrics:
      user_satisfaction: number        # 用户满意度
      business_value_delivered: number # 交付的业务价值
      roi_estimate: number             # ROI估算
      
  # === 配置管理 ===
  configuration:
    baseline_lock_status: enum          # unlocked|locked|frozen
    access_permissions: array           # 访问权限
      - role: string
        permissions: array              # read|write|approve|delete
    notification_settings:
      status_change_notifications: boolean
      milestone_notifications: boolean
      risk_alert_notifications: boolean
    integration_settings:
      codegen_integration: boolean
      git_integration: boolean
      ci_cd_integration: boolean
      
  # === 元数据 ===
  metadata:
    template_version: string            # 模板版本
    schema_version: string              # 数据schema版本
    creation_method: enum               # manual|automated|imported
    data_source: string                 # 数据来源
    validation_status: enum             # valid|invalid|pending
    validation_errors: array            # 验证错误
      - error_code: string
        error_message: string
        error_field: string
    export_settings:
      export_format: enum               # yaml|json|xml|excel
      export_scope: array               # 导出范围
      last_export_time: datetime