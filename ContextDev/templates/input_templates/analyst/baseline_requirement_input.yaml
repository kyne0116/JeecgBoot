# 需求分析专家 - 基线驱动需求输入模板
# Template: baseline_requirement_input.yaml
# Version: v4.0.0
# Description: 基于需求基线的标准化需求分析输入格式

baseline_requirement_input:
  # === 基线上下文信息 ===
  baseline_context:
    requirement_id: string              # 需求标识 (来自baseline_manager)
    baseline_version: string            # 当前基线版本
    baseline_file_path: string          # 基线文件路径
    last_sync_time: datetime            # 最后同步时间
    baseline_lock_status: enum          # unlocked|locked|frozen
    
  # === 专家任务分配 ===
  expert_assignment:
    assigned_by: string                 # 分配者 (baseline_manager)
    assignment_time: datetime           # 分配时间
    expected_completion: datetime       # 预期完成时间
    priority_level: enum                # high|medium|low
    complexity_assessment: enum         # simple|standard|complex|enterprise
    estimated_effort_hours: number     # 预估工时
    
  # === 分析任务定义 ===
  analysis_tasks:
    primary_tasks: array                # 主要分析任务
      - task_id: string
        task_name: string
        task_description: string
        task_priority: enum             # must_do|should_do|could_do
        expected_deliverable: string
        success_criteria: string
        
    secondary_tasks: array              # 次要分析任务
      - task_id: string
        task_name: string
        task_description: string
        optional_condition: string
        expected_deliverable: string
        
    quality_requirements: array        # 质量要求
      - quality_aspect: string
        quality_standard: string
        measurement_method: string
        acceptance_threshold: string
  
  # === 业务需求上下文 ===
  business_context:
    original_requirement: string        # 原始需求描述
    business_background: string         # 业务背景
    current_pain_points: array          # 当前痛点
      - pain_point_id: string
        pain_point_description: string
        impact_level: enum              # high|medium|low
        affected_stakeholders: array
        
    expected_benefits: array            # 预期收益
      - benefit_type: enum              # cost_saving|efficiency_improvement|revenue_increase|risk_reduction
        benefit_description: string
        quantified_expectation: string
        measurement_method: string
        
    business_constraints: array        # 业务约束
      - constraint_type: enum           # regulatory|policy|budget|timeline|resource
        constraint_description: string
        impact_on_analysis: string
        compliance_requirement: string
  
  # === 利益相关方信息 ===
  stakeholder_context:
    primary_stakeholders: array         # 主要利益相关方
      - stakeholder_id: string
        stakeholder_name: string
        stakeholder_role: string
        department: string
        contact_info: string
        influence_level: enum           # high|medium|low
        interest_level: enum            # high|medium|low
        key_concerns: array
          - concern_description: string
            concern_priority: enum      # critical|high|medium|low
            
    secondary_stakeholders: array       # 次要利益相关方
      - stakeholder_id: string
        stakeholder_name: string
        stakeholder_role: string
        involvement_type: string
        expected_interaction: string
        
    decision_makers: array              # 决策者
      - decision_maker_id: string
        decision_maker_name: string
        authority_scope: string
        decision_criteria: array
          - criteria_name: string
            criteria_weight: number
            criteria_description: string
  
  # === 技术约束上下文 ===
  technical_context:
    jeecgboot_constraints:
      framework_version: string         # JeecgBoot版本
      required_modules: array           # 必需模块
        - module_name: string
          module_version: string
          usage_reason: string
      prohibited_technologies: array    # 禁用技术
        - technology_name: string
          prohibition_reason: string
        
    existing_systems: array            # 现有系统
      - system_name: string
        system_type: string
        integration_requirement: enum   # required|optional|prohibited
        integration_method: string
        data_exchange_requirement: string
        
    infrastructure_constraints: array  # 基础设施约束
      - constraint_type: enum           # hardware|network|security|compliance
        constraint_description: string
        impact_on_requirements: string
        mitigation_approach: string
  
  # === 分析指导信息 ===
  analysis_guidance:
    focus_areas: array                  # 重点关注领域
      - focus_area: string
        focus_reason: string
        analysis_depth: enum            # surface|standard|deep|comprehensive
        special_considerations: string
        
    analysis_methods: array            # 推荐分析方法
      - method_name: string
        method_description: string
        applicable_scenarios: string
        expected_outcome: string
        
    risk_areas: array                   # 风险关注点
      - risk_category: enum             # technical|business|resource|timeline|quality
        risk_description: string
        risk_indicators: array
          - indicator_name: string
            indicator_description: string
            threshold_value: string
            
    success_factors: array              # 成功要素
      - factor_name: string
        factor_description: string
        measurement_approach: string
        target_value: string
  
  # === 协作接口定义 ===
  collaboration_interface:
    baseline_manager_interface:
      communication_frequency: enum     # real_time|hourly|daily|milestone
      status_reporting_format: string
      escalation_criteria: array
        - criteria_name: string
          criteria_condition: string
          escalation_action: string
          
    downstream_expert_preparation:
      target_expert: string             # system_architect
      handoff_requirements: array
        - requirement_name: string
          requirement_description: string
          quality_standard: string
      expected_deliverables: array
        - deliverable_name: string
          deliverable_format: string
          quality_criteria: string
        
    quality_checkpoints: array         # 质量检查点
      - checkpoint_name: string
        checkpoint_timing: string
        checkpoint_criteria: array
          - criteria_name: string
            criteria_description: string
            pass_threshold: string
        checkpoint_deliverable: string
  
  # === 追溯要求 ===
  traceability_requirements:
    source_traceability: array          # 源追溯要求
      - source_type: enum               # original_requirement|business_rule|stakeholder_input|regulation
        source_identifier: string
        traceability_level: enum        # direct|indirect|derived
        traceability_method: string
        
    target_traceability: array          # 目标追溯要求
      - target_type: enum               # functional_requirement|non_functional_requirement|constraint|assumption
        target_identifier: string
        traceability_relationship: string
        validation_method: string
        
    change_impact_tracking:
      change_detection_method: string
      impact_analysis_scope: array
        - scope_area: string
          scope_description: string
          impact_assessment_method: string
      change_propagation_rules: array
        - rule_name: string
          rule_condition: string
          rule_action: string
  
  # === 验证和确认 ===
  validation_requirements:
    input_validation: array             # 输入验证要求
      - validation_rule: string
        validation_method: string
        error_handling: string
        
    completeness_check: array          # 完整性检查
      - check_item: string
        check_method: string
        completion_criteria: string
        
    consistency_verification: array    # 一致性验证
      - consistency_aspect: string
        verification_method: string
      consistency_criteria: string
      
    approval_requirements:
      approval_stages: array            # 审批阶段
        - stage_name: string
          approver_role: string
          approval_criteria: string
          approval_method: string
      final_sign_off:
        sign_off_authority: string
        sign_off_criteria: string
        sign_off_documentation: string
  
  # === 元数据 ===
  metadata:
    template_version: string            # 模板版本
    creation_time: datetime             # 创建时间
    created_by: string                  # 创建者
    last_modified_time: datetime        # 最后修改时间
    modified_by: string                 # 修改者
    usage_context: string               # 使用上下文
    template_customizations: array     # 模板定制
      - customization_type: string
        customization_description: string
        customization_reason: string