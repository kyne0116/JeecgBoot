# 系统架构专家 - 需求规格输入模板
# Template: requirement_spec_input.yaml
# Version: v4.0.0
# Description: 接收requirements_analyst输出的requirement_specification.yaml作为标准化输入

requirement_spec_input:
  # 输入来源验证
  input_source:
    source_expert: "requirements_analyst"     # 输入来源专家
    source_template: "requirement_specification.yaml"  # 源模板文件
    input_validation_status: enum            # validated|needs_review|rejected
    validation_notes: string                 # 验证说明
  
  # 项目基础信息 (从需求规格继承)
  project_info:
    project_id: string                       # 项目唯一标识
    project_name: string                     # 项目名称
    business_domain: enum                    # 业务领域: core|finance|supply|crm|hrm|inventory|order|reporting|workflow|integration
    complexity_level: enum                  # 复杂度级别: simple|standard|complex|enterprise
    priority: enum                          # 项目优先级: high|medium|low
    estimated_duration: string              # 预估工期
    
  # 业务需求理解 (架构设计依据)
  business_requirements:
    business_objectives: array              # 业务目标
      - objective_id: string
        objective_description: string
        success_metrics: array
          - metric_name: string
            target_value: string
            architectural_impact: string    # 对架构设计的影响
    
    key_business_processes: array           # 关键业务流程
      - process_id: string
        process_name: string
        process_description: string
        process_type: enum                  # linear|parallel|conditional|loop
        performance_requirements: string    # 性能要求
        scalability_requirements: string    # 可扩展性要求
        reliability_requirements: string    # 可靠性要求
  
  # 功能需求规格 (架构设计输入)
  functional_requirements:
    module_breakdown: array                 # 功能模块分解
      - module_id: string
        module_name: string
        module_description: string
        module_priority: enum               # must_have|should_have|could_have
        module_type: enum                   # crud|workflow|calculation|integration|reporting
        complexity: enum                    # simple|standard|complex
        
        # 技术实现要求
        technical_requirements:
          data_persistence: boolean          # 是否需要数据持久化
          real_time_processing: boolean      # 是否需要实时处理
          batch_processing: boolean          # 是否需要批处理
          external_integration: boolean      # 是否需要外部集成
          reporting_capability: boolean      # 是否需要报表功能
          workflow_support: boolean          # 是否需要工作流支持
          file_processing: boolean           # 是否需要文件处理
          notification_support: boolean      # 是否需要通知功能
        
        # 子功能详细规格
        sub_functions: array
          - function_id: string
            function_name: string
            function_description: string
            function_type: enum             # create|read|update|delete|query|calculate|validate|transform
            
            # 输入输出规格 (影响接口设计)
            input_specification: array
              - input_name: string
                input_type: string          # form|file|api|database
                data_type: string           # 映射到数据库字段类型
                validation_rules: array
                  - rule_type: string
                    rule_description: string
                is_required: boolean
                
            output_specification: array
              - output_name: string
                output_type: string         # screen|file|api|database
                data_format: string
                response_structure: string  # 影响API设计
            
            # 业务规则 (影响服务层设计)
            business_rules: array
              - rule_id: string
                rule_description: string
                rule_type: enum             # validation|calculation|derivation|workflow
                rule_complexity: enum       # simple|medium|complex
                implementation_notes: string
  
  # 非功能需求 (架构约束)
  non_functional_requirements:
    performance_requirements:
      response_time_sla: string             # 响应时间SLA
      throughput_requirement: string        # 吞吐量要求
      concurrent_users: number              # 并发用户数
      data_volume_estimate: string          # 数据量估算
      peak_load_estimate: string            # 峰值负载估算
      
    scalability_requirements:
      horizontal_scaling: boolean           # 是否需要水平扩展
      vertical_scaling: boolean             # 是否需要垂直扩展
      auto_scaling: boolean                 # 是否需要自动扩展
      growth_projection: string             # 增长预期
      
    availability_requirements:
      uptime_requirement: string            # 可用性要求
      disaster_recovery: boolean            # 是否需要灾难恢复
      backup_strategy: string               # 备份策略需求
      failover_requirement: string          # 故障转移需求
      
    security_requirements:
      authentication_method: enum           # jwt|oauth|saml|custom
      authorization_model: enum             # rbac|abac|custom
      data_encryption: boolean              # 是否需要数据加密
      transmission_encryption: boolean      # 是否需要传输加密
      audit_logging: boolean                # 是否需要审计日志
      compliance_standards: array           # 合规标准
        - standard_name: string
          compliance_level: string
      
    usability_requirements:
      browser_support: array                # 浏览器支持
        - browser_name: string
          version_requirement: string
      mobile_support: boolean               # 移动端支持
      internationalization: boolean         # 国际化需求
      accessibility_level: string           # 可访问性等级
      user_experience_standards: string     # 用户体验标准
  
  # 业务实体模型 (数据库设计输入)
  business_entities:
    core_entities: array                    # 核心业务实体
      - entity_id: string
        entity_name: string                 # 实体名称
        entity_description: string          # 实体描述
        entity_category: enum               # master|transaction|reference|configuration
        business_importance: enum           # critical|important|normal
        
        # 实体属性 (映射到数据库字段)
        attributes: array
          - attribute_id: string
            attribute_name: string
            attribute_description: string
            business_data_type: string      # 业务数据类型
            technical_data_type: string     # 技术数据类型 (MySQL)
            max_length: number
            precision: number               # 数值精度
            scale: number                   # 数值标度
            is_required: boolean
            is_unique: boolean
            is_indexed: boolean             # 是否需要索引
            default_value: string
            
            # 业务约束
            validation_rules: array
              - rule_type: enum             # format|range|enum|pattern|custom
                rule_expression: string
                error_message: string
            dictionary_code: string         # 数据字典编码
            
        # 实体关系 (外键设计依据)
        relationships: array
          - relationship_id: string
            related_entity: string
            relationship_type: enum         # one_to_one|one_to_many|many_to_many
            relationship_description: string
            foreign_key_attribute: string
            referential_integrity: enum     # cascade|restrict|set_null
            index_requirement: boolean      # 是否需要外键索引
            
        # 数据量和性能要求
        data_volume_estimate: string        # 数据量估算
        growth_rate_estimate: string        # 增长率估算
        query_frequency: enum               # high|medium|low
        update_frequency: enum              # high|medium|low
        performance_requirements: string    # 性能要求
  
  # 业务流程模型 (服务层设计输入)
  business_processes:
    core_processes: array                   # 核心业务流程
      - process_id: string
        process_name: string
        process_description: string
        process_type: enum                  # synchronous|asynchronous|batch|real_time
        process_complexity: enum            # simple|standard|complex
        
        # 流程步骤 (服务方法设计依据)
        process_steps: array
          - step_id: string
            step_name: string
            step_description: string
            step_type: enum                 # validation|calculation|persistence|integration|notification
            execution_mode: enum            # synchronous|asynchronous
            
            # 步骤输入输出 (方法参数设计)
            input_data: array
              - data_name: string
                data_type: string
                data_source: enum           # user_input|database|external_api|file
                validation_required: boolean
                
            output_data: array
              - data_name: string
                data_type: string
                data_destination: enum      # database|external_api|file|user_interface
                
            # 业务规则实现要求
            business_rules: array
              - rule_description: string
                rule_complexity: enum       # simple|medium|complex
                implementation_approach: string
                
            # 异常处理要求
            exception_handling: array
              - exception_type: string
                handling_strategy: enum     # retry|fallback|abort|log
                recovery_procedure: string
                
            # 性能要求
            performance_requirements:
              max_execution_time: string
              memory_usage_limit: string
              resource_requirements: string
        
        # 流程控制逻辑
        process_flow: array
          - from_step: string
            to_step: string
            condition_type: enum            # always|conditional|parallel|loop
            condition_expression: string
            
        # 事务要求
        transaction_requirements:
          transaction_boundary: string      # 事务边界定义
          isolation_level: enum             # read_uncommitted|read_committed|repeatable_read|serializable
          rollback_strategy: string         # 回滚策略
          compensation_logic: string        # 补偿逻辑
  
  # 集成需求 (接口设计输入)
  integration_requirements:
    internal_integrations: array            # 内部系统集成
      - integration_id: string
        target_system: string
        integration_purpose: string
        integration_pattern: enum           # api_call|database_sync|file_exchange|message_queue
        data_flow_direction: enum           # inbound|outbound|bidirectional
        
        # 接口规格要求
        interface_specification:
          protocol: enum                    # http|https|tcp|udp|mq
          data_format: enum                 # json|xml|csv|binary
          message_structure: string
          authentication_method: string
          error_handling_strategy: string
          
        # 性能和可靠性要求
        performance_requirements:
          response_time_sla: string
          throughput_requirement: string
          availability_requirement: string
          retry_strategy: string
          
    external_integrations: array           # 外部系统集成
      - integration_id: string
        vendor_system: string
        integration_purpose: string
        integration_protocol: enum          # rest_api|soap|graphql|ftp|sftp|email
        
        # 外部接口约束
        external_constraints:
          api_rate_limits: string
          authentication_requirements: string
          data_format_constraints: string
          availability_windows: string
          
        # 数据映射要求
        data_mapping: array
          - source_field: string
            target_field: string
            transformation_rule: string
            validation_requirement: string
  
  # 约束条件 (架构约束)
  constraints:
    technical_constraints:
      # JeecgBoot框架约束
      jeecgboot_constraints:
        framework_version: "JeecgBoot 3.8.1+"
        required_components: ["CodeGen", "权限管理", "工作流引擎", "报表系统"]
        prohibited_technologies: ["MongoDB", "Elasticsearch", "微服务架构", "GraphQL"]
        required_technologies: 
          backend: ["Spring Boot 3.x", "MyBatis-Plus", "Spring Security", "MySQL 8.0+", "Redis"]
          frontend: ["Vue 3", "TypeScript", "Ant Design Vue", "Vite", "Pinia"]
          
      # 基础设施约束
      infrastructure_constraints:
        deployment_environment: string     # 部署环境约束
        database_constraints: string       # 数据库约束
        network_constraints: string        # 网络约束
        security_constraints: string       # 安全约束
        
    business_constraints:
      regulatory_constraints: array        # 法规约束
        - regulation_name: string
          compliance_requirement: string
          architectural_impact: string
          
      policy_constraints: array            # 政策约束
        - policy_name: string
          policy_requirement: string
          design_impact: string
        
    resource_constraints:
      budget_constraints: string           # 预算约束
      timeline_constraints: string         # 时间约束
      team_constraints: string             # 团队约束
      infrastructure_constraints: string   # 基础设施约束
  
  # 验收标准 (架构验证依据)
  acceptance_criteria:
    functional_criteria: array             # 功能验收标准
      - criteria_id: string
        criteria_description: string
        verification_method: string
        architectural_validation_point: string
        
    performance_criteria: array            # 性能验收标准
      - performance_metric: string
        target_value: string
        measurement_method: string
        architectural_design_requirement: string
        
    security_criteria: array               # 安全验收标准
      - security_requirement: string
        verification_method: string
        architectural_security_control: string
        
    integration_criteria: array            # 集成验收标准
      - integration_point: string
        success_criteria: string
        test_method: string
        interface_requirement: string
  
  # 架构设计指导信息
  architectural_guidance:
    preferred_patterns: array              # 推荐的架构模式
      - pattern_name: string
        pattern_description: string
        applicability: string
        
    design_principles: array               # 设计原则
      - principle_name: string
        principle_description: string
        implementation_guidance: string
        
    quality_attributes: array              # 质量属性
      - attribute_name: string
        attribute_importance: enum          # critical|important|nice_to_have
        measurement_criteria: string
        design_impact: string
  
  # 输入验证检查清单
  input_validation_checklist:
    completeness_check: boolean            # 完整性检查
    consistency_check: boolean             # 一致性检查
    technical_feasibility_check: boolean   # 技术可行性检查
    jeecgboot_compatibility_check: boolean # JeecgBoot兼容性检查
    
  # 元数据
  metadata:
    input_received_date: datetime          # 输入接收时间
    input_processed_by: string             # 输入处理人
    validation_status: enum                # validated|needs_clarification|rejected
    validation_notes: string               # 验证说明
    architect_assigned: string             # 分配的架构师
    expected_completion_date: datetime     # 预期完成时间