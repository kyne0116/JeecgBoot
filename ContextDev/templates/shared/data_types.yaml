# 统一数据类型定义 (ContextDev标准数据类型库)
# ========================================================================
# 版本: v1.0.0 | 创建日期: 2025-07-27
# 用途: 所有模板和专家使用的统一数据类型定义，确保类型一致性
# 引用: 所有模板通过引用此文件确保数据类型标准化

data_types:
  # 基础数据类型
  primitive_types:
    string:
      type: "string"
      description: "文本字符串"
      validation: "非空字符串，最大长度500字符"
      
    text:
      type: "string" 
      description: "长文本内容"
      validation: "支持多行文本，最大长度5000字符"
      
    integer:
      type: "integer"
      description: "整数类型"
      validation: "32位有符号整数"
      
    decimal:
      type: "number"
      description: "小数类型"
      validation: "双精度浮点数"
      
    boolean:
      type: "boolean"
      description: "布尔类型"
      validation: "true或false"
      
    datetime:
      type: "string"
      description: "日期时间"
      format: "ISO 8601"
      validation: "YYYY-MM-DDTHH:mm:ssZ格式"
      
    date:
      type: "string"
      description: "日期"
      format: "ISO 8601"
      validation: "YYYY-MM-DD格式"
      
    email:
      type: "string"
      description: "电子邮箱"
      validation: "符合RFC 5322标准的邮箱格式"
      
    url:
      type: "string"
      description: "URL地址"
      validation: "符合RFC 3986标准的URL格式"
      
  # 业务枚举类型
  business_enums:
    business_domain:
      type: "enum"
      description: "业务领域分类"
      values:
        - value: "core"
          label: "核心系统"
          description: "系统核心功能模块"
        - value: "finance"
          label: "财务管理"
          description: "财务相关业务功能"
        - value: "hr"
          label: "人力资源"
          description: "人力资源管理功能"
        - value: "scm"
          label: "供应链管理"
          description: "供应链相关功能"
        - value: "crm"
          label: "客户关系管理"
          description: "客户关系相关功能"
        - value: "inventory"
          label: "库存管理"
          description: "库存相关功能"
        - value: "order"
          label: "订单处理"
          description: "订单处理相关功能"
        - value: "reporting"
          label: "报表分析"
          description: "报表和数据分析功能"
        - value: "workflow"
          label: "工作流管理"
          description: "工作流程管理功能"
        - value: "integration"
          label: "集成服务"
          description: "系统集成相关功能"
          
    complexity_level:
      type: "enum"
      description: "复杂度级别"
      values:
        - value: "simple"
          label: "简单"
          description: "基础CRUD操作，1-3个实体"
        - value: "standard"
          label: "标准"
          description: "标准业务逻辑，4-8个实体"
        - value: "complex"
          label: "复杂"
          description: "复杂业务流程，9-15个实体"
        - value: "enterprise"
          label: "企业级"
          description: "企业级解决方案，16+个实体"
          
    priority_level:
      type: "enum"
      description: "优先级级别"
      values:
        - value: "critical"
          label: "关键"
          description: "关键优先级，必须立即处理"
        - value: "high"
          label: "高"
          description: "高优先级，需要优先处理"
        - value: "medium"
          label: "中"
          description: "中等优先级，按计划处理"
        - value: "low"
          label: "低"
          description: "低优先级，可延后处理"
          
    requirement_type:
      type: "enum"
      description: "需求类型"
      values:
        - value: "functional"
          label: "功能需求"
          description: "系统功能性需求"
        - value: "non_functional"
          label: "非功能需求"
          description: "性能、安全等非功能需求"
        - value: "interface"
          label: "接口需求"
          description: "系统接口相关需求"
        - value: "data"
          label: "数据需求"
          description: "数据相关需求"
          
    status:
      type: "enum"
      description: "状态值"
      values:
        - value: "draft"
          label: "草稿"
          description: "初始创建状态"
        - value: "review"
          label: "审查中"
          description: "正在审查阶段"
        - value: "approved"
          label: "已批准"
          description: "审查通过，已批准"
        - value: "released"
          label: "已发布"
          description: "正式发布状态"
        - value: "archived"
          label: "已归档"
          description: "已归档保存"
          
  # 技术类型定义
  technical_types:
    project_id:
      type: "string"
      description: "项目唯一标识"
      format: "JG-{业务域}-{序号}"
      pattern: "^JG-[A-Z]{2,5}-[0-9]{3}$"
      example: "JG-EDU-001"
      
    requirement_id:
      type: "string"
      description: "需求唯一标识"
      format: "REQ-{类别}-{序号}"
      pattern: "^REQ-[A-Z]{2,8}-[0-9]{3}$"
      example: "REQ-FUNC-001"
      
    baseline_id:
      type: "string"
      description: "基线唯一标识"
      format: "RBL-{项目代码}-{日期}-{序号}"
      pattern: "^RBL-[A-Z0-9-]+-[0-9]{8}-[0-9]{3}$"
      example: "RBL-JG-EDU-001-20250727-001"
      
    version:
      type: "string"
      description: "语义化版本号"
      format: "major.minor.patch"
      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      example: "1.0.0"
      
    codegen_applicability:
      type: "string"
      description: "CodeGen适用性百分比"
      format: "数字+百分号"
      pattern: "^[0-9]{1,3}%$"
      example: "85%"
      
  # 复合数据类型
  composite_types:
    stakeholder:
      type: "object"
      description: "利益相关方信息"
      properties:
        name:
          type: "string"
          description: "姓名"
          required: true
        role:
          type: "string"
          description: "角色"
          required: true
        department:
          type: "string"
          description: "部门"
          required: false
        contact:
          type: "email"
          description: "联系方式"
          required: false
        influence_level:
          type: "priority_level"
          description: "影响力级别"
          required: false
          
    requirement_item:
      type: "object"
      description: "需求项信息"
      properties:
        requirement_id:
          type: "requirement_id"
          description: "需求ID"
          required: true
        requirement_name:
          type: "string"
          description: "需求名称"
          required: true
        requirement_type:
          type: "requirement_type"
          description: "需求类型"
          required: true
        priority:
          type: "priority_level"
          description: "优先级"
          required: true
        description:
          type: "text"
          description: "需求描述"
          required: true
        acceptance_criteria:
          type: "array"
          items: "text"
          description: "验收标准列表"
          required: true
          
    technical_mapping:
      type: "object"
      description: "技术映射信息"
      properties:
        entity_design:
          type: "string"
          description: "实体设计"
          required: false
        codegen_applicability:
          type: "codegen_applicability"
          description: "CodeGen适用性"
          required: false
        framework_components:
          type: "array"
          items: "string"
          description: "框架组件列表"
          required: false
        custom_development:
          type: "text"
          description: "自定义开发需求"
          required: false
          
  # 验证规则
  validation_rules:
    field_validation:
      required_fields: "标记为required的字段必须填写"
      data_type_validation: "字段值必须符合定义的数据类型"
      enum_validation: "枚举字段值必须从预定义列表中选择"
      format_validation: "格式化字段必须符合指定的格式规范"
      pattern_validation: "模式字段必须匹配指定的正则表达式"
      
    cross_field_validation:
      consistency_check: "相关字段之间必须保持逻辑一致性"
      dependency_check: "依赖字段必须满足依赖关系"
      completeness_check: "相关字段组合必须完整"
      
    business_validation:
      business_rule_compliance: "必须符合业务规则约束"
      jeecgboot_compatibility: "必须兼容JeecgBoot框架要求"
      technical_feasibility: "技术实现必须可行"

# 使用指南
usage_guidelines:
  purpose: "为所有ContextDev模板和专家提供统一的数据类型标准"
  
  reference_method:
    yaml_reference: "使用$ref: 'data_types.yaml#/data_types/...'引用"
    direct_import: "直接导入并使用预定义类型"
    validation_use: "使用验证规则进行数据校验"
    
  best_practices:
    - "优先使用预定义的业务枚举类型"
    - "遵循技术类型的格式和模式规范"
    - "使用复合类型减少重复定义"
    - "应用验证规则确保数据质量"
    
  extension_guidelines:
    - "新增类型时必须遵循现有命名规范"
    - "枚举类型新增值时必须包含完整的描述信息"
    - "复合类型设计时考虑可扩展性和向后兼容性"