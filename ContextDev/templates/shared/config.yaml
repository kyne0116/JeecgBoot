# ContextDev v4.1 统一共享配置 (扁平化引用优化)
# ========================================================================
# 版本: v1.1.0 | 创建日期: 2025-07-27 | 优化: 扁平化引用架构
# 用途: 所有专家模板的统一配置文件，消除复杂嵌套引用
# 引用方式: 简单相对路径 "../shared/config.yaml"

# 项目核心标识信息
project_identity:
  project_id: ""                     # 项目唯一标识 格式: JG-{业务域}-{序号}
  project_name: ""                   # 项目名称
  project_code: ""                   # 项目代码 (简短标识)
  system_name: ""                    # 系统名称
  
# 业务分类信息
business_classification:
  business_domain: ""                # 业务领域: core/finance/hr/scm/crm/inventory/order/reporting/workflow/integration
  module_name: ""                    # 模块名称
  functional_area: ""                # 功能领域
  complexity_level: ""               # 复杂度: simple/standard/complex/enterprise
  
# 版本控制信息
version_control:
  current_version: "1.0.0"           # 当前版本 (语义化版本)
  baseline_version: ""               # 基线版本
  change_version: ""                 # 变更版本
  
# 时间轴信息 (ISO 8601格式)
timeline:
  created_date: ""                   # 创建时间
  last_modified: ""                  # 最后修改时间
  baseline_date: ""                  # 基线确立时间
  planned_completion: ""             # 计划完成时间
  
# 责任人信息
responsibility:
  project_owner: ""                  # 项目负责人
  business_analyst: ""               # 业务分析师
  technical_lead: ""                 # 技术负责人
  quality_assurance: ""              # 质量保证人员
  
# 状态管理
status_management:
  project_status: ""                 # 项目状态: planning/analysis/design/development/testing/deployment
  baseline_status: ""                # 基线状态: draft/review/approved/released/archived
  change_status: ""                  # 变更状态: stable/changing/locked
  
# JeecgBoot技术约束
jeecgboot_constraints:
  framework_version: "3.8.1+"        # JeecgBoot框架版本要求
  java_version: "JDK 17"             # Java版本要求
  spring_boot_version: "3.x"         # Spring Boot版本
  database_type: "MySQL 8.0+"        # 数据库类型
  cache_type: "Redis 7.x"            # 缓存类型
  
  # 强制技术栈
  mandatory_backend_stack:
    - "Spring Boot 3.x"
    - "MyBatis-Plus"
    - "Spring Security"
    
  mandatory_frontend_stack:
    - "Vue 3"
    - "TypeScript"
    - "Ant Design Vue"
    - "Vite"
    - "Pinia"
    
  # 禁用技术栈
  forbidden_technologies:
    - "微服务架构"
    - "MongoDB"
    - "Elasticsearch"
    - "Docker"
    - "Kubernetes"
    - "消息队列"

# 需求分析上下文
requirements_context:
  # 需求来源信息
  requirement_sources:
    business_stakeholders: []        # 业务相关方列表
    user_groups: []                  # 用户群体
    regulatory_requirements: []      # 法规要求
    market_drivers: []               # 市场驱动因素
    
  # 需求范围界定
  scope_definition:
    included_functions: []           # 包含功能
    excluded_functions: []           # 排除功能
    integration_points: []           # 集成点
    external_interfaces: []          # 外部接口
    
  # 业务背景上下文
  business_context:
    current_business_process: ""     # 当前业务流程
    pain_points: []                  # 痛点问题
    success_criteria: []             # 成功标准
    constraints: []                  # 约束条件

# 系统架构上下文
architecture_context:
  # 架构原则
  architectural_principles:
    - "单一职责原则"
    - "开闭原则"
    - "分层架构"
    - "前后端分离"
    
  # 设计约束
  design_constraints:
    performance_requirements: []     # 性能要求
    security_requirements: []        # 安全要求
    scalability_requirements: []     # 可扩展性要求
    compatibility_requirements: []   # 兼容性要求
    
  # 技术选型原则
  technology_selection_criteria:
    stability: "high"               # 稳定性要求
    community_support: "strong"     # 社区支持
    learning_curve: "moderate"      # 学习曲线
    maintenance_cost: "low"         # 维护成本

# 开发上下文
development_context:
  # 开发规范
  coding_standards:
    naming_convention: "camelCase"   # 命名规范
    code_style: "standard"          # 代码风格
    comment_requirements: "moderate" # 注释要求
    
  # 质量要求
  quality_requirements:
    unit_test_coverage: 80          # 单元测试覆盖率 (%)
    code_complexity_limit: 10       # 圈复杂度限制
    code_duplication_limit: 3       # 代码重复率限制 (%)
    
  # CodeGen使用策略
  codegen_strategy:
    auto_generation_scope: []       # 自动生成范围
    manual_development_scope: []    # 手动开发范围
    customization_points: []        # 定制化点

# 测试上下文
testing_context:
  # 测试策略
  testing_strategy:
    test_levels: ["unit", "integration", "system", "acceptance"]
    test_types: ["functional", "performance", "security", "usability"]
    automation_level: "high"        # 自动化程度
    
  # 质量门禁
  quality_gates:
    functional_test_pass_rate: 95   # 功能测试通过率 (%)
    performance_benchmark: []       # 性能基准
    security_scan_requirements: []  # 安全扫描要求
    
  # 验收标准
  acceptance_criteria:
    user_satisfaction_threshold: 85 # 用户满意度阈值 (%)
    defect_density_limit: 1        # 缺陷密度限制 (个/KLOC)
    response_time_limit: 2000      # 响应时间限制 (ms)

# 统一数据类型定义
data_types:
  # 基础数据类型
  primitive_types:
    string:
      type: "string"
      description: "文本字符串"
      validation: "非空字符串，最大长度500字符"
      
    text:
      type: "string" 
      description: "长文本内容"
      validation: "支持多行文本，最大长度5000字符"
      
    integer:
      type: "integer"
      description: "整数类型"
      validation: "32位有符号整数"
      
    decimal:
      type: "number"
      description: "小数类型"
      validation: "双精度浮点数"
      
    boolean:
      type: "boolean"
      description: "布尔类型"
      validation: "true或false"
      
    datetime:
      type: "string"
      description: "日期时间类型"
      validation: "ISO 8601格式 (YYYY-MM-DDTHH:mm:ssZ)"
      
    date:
      type: "string"
      description: "日期类型"
      validation: "YYYY-MM-DD格式"
      
    email:
      type: "string"
      description: "邮箱类型"
      validation: "符合RFC 5322标准的邮箱格式"
      
    url:
      type: "string"  
      description: "URL类型"
      validation: "符合RFC 3986标准的URL格式"
      
    uuid:
      type: "string"
      description: "UUID类型"
      validation: "符合RFC 4122标准的UUID格式"

  # 业务数据类型
  business_types:
    project_id:
      type: "string"
      description: "项目ID"
      validation: "格式: JG-{业务域}-{序号}"
      pattern: "^JG-[A-Z]{2,6}-\\d{3,6}$"
      
    version:
      type: "string"
      description: "版本号"
      validation: "语义化版本格式 (major.minor.patch)"
      pattern: "^\\d+\\.\\d+\\.\\d+$"
      
    priority:
      type: "string"
      description: "优先级"
      validation: "枚举值: critical/high/medium/low"
      enum: ["critical", "high", "medium", "low"]
      
    status:
      type: "string"
      description: "状态"
      validation: "枚举值: draft/active/completed/archived"
      enum: ["draft", "active", "completed", "archived"]
      
    complexity:
      type: "string"
      description: "复杂度"
      validation: "枚举值: simple/standard/complex/enterprise"
      enum: ["simple", "standard", "complex", "enterprise"]

  # JeecgBoot专用类型
  jeecgboot_types:
    table_name:
      type: "string"
      description: "数据库表名"
      validation: "小写字母+下划线，以字母开头"
      pattern: "^[a-z][a-z0-9_]*$"
      
    field_name:
      type: "string"
      description: "字段名"
      validation: "驼峰命名法"
      pattern: "^[a-z][a-zA-Z0-9]*$"
      
    api_path:
      type: "string"
      description: "API路径"
      validation: "REST风格路径"
      pattern: "^/[a-z0-9/-]+$"
      
    permission_code:
      type: "string"
      description: "权限码"
      validation: "模块:操作格式"
      pattern: "^[a-z]+:[a-z]+$"

# 模板使用说明
template_usage:
  reference_method: "使用相对路径引用: ../shared/config.yaml"
  access_pattern: "直接访问字段，无需复杂嵌套"
  example_usage: |
    # 在专家模板中的使用示例
    config_reference: "../shared/config.yaml"
    project_name: "从config中获取project_identity.project_name"
    
# 版本历史
version_history:
  v1.1.0:
    date: "2025-07-27"
    changes: ["扁平化引用架构", "合并3个shared文件", "简化引用语法"]
    migration_notes: "将baseline_reference替换为config_reference"
  v1.0.0:
    date: "2025-07-27"
    changes: ["初始版本", "建立共享基线架构"]