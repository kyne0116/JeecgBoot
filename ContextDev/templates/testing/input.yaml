# ContextDev v4.1 - Quality Tester Expert Input Template
# 质量测试专家输入模板 - 基于代码交付进行全面质量验证

quality_tester_input:
  # 基线引用 - 继承共享基线和项目上下文
  baseline_reference: 
    shared_baseline: "../shared/baseline_shared.yaml#/shared_baseline"
    project_context: "../shared/project_context.yaml#/project_context"
    
  # 输入来源 - 接收代码开发专家的输出
  input_source:
    source_expert: "code_developer"
    source_document: "backend_code_delivery.yaml"
    delivery_version: ""
    
  # 代码交付输入信息
  code_delivery_input:
    # 交付物清单
    delivery_inventory:
      backend_components:
        - component_name: ""
          component_type: ""        # entity/service/controller/mapper
          file_path: ""
          functionality: []
          
      frontend_components:
        - component_name: ""
          component_type: ""        # page/component/service
          file_path: ""
          functionality: []
          
      database_components:
        - component_name: ""
          component_type: ""        # table/view/procedure/index
          ddl_script: ""
          
    # 实现的功能特性
    implemented_features:
      - feature_id: ""
        feature_name: ""
        implementation_scope: []
        acceptance_criteria: []
        priority_level: ""
        
  # 测试环境配置
  testing_environment:
    # 环境配置要求
    environment_setup:
      test_database_config:
        database_type: "MySQL"
        database_version: "8.0+"
        test_data_requirements: []
        
      application_server_config:
        server_type: "Spring Boot Embedded"
        jvm_configuration: {}
        memory_settings: ""
        
      frontend_test_environment:
        browser_requirements: []
        node_version: ""
        test_frameworks: []
        
    # 测试数据准备
    test_data_preparation:
      # 基础数据
      master_data:
        - data_category: ""
          data_source: ""
          data_volume: 0
          data_quality_requirements: []
          
      # 业务测试数据
      business_test_data:
        - business_scenario: ""
          test_data_set: ""
          data_relationships: []
          
  # 质量标准与要求
  quality_standards:
    # 功能质量标准
    functional_quality:
      functionality_completeness: "100%"  # 功能完整性要求
      functionality_correctness: "100%"   # 功能正确性要求
      business_rule_compliance: "100%"    # 业务规则符合度
      
    # 非功能质量标准
    non_functional_quality:
      performance_requirements:
        response_time_limit: "< 300ms"
        throughput_requirement: ""
        concurrent_users_limit: 0
        
      security_requirements:
        authentication_testing: true
        authorization_testing: true
        data_protection_testing: true
        
      usability_requirements:
        user_interface_testing: true
        accessibility_testing: true
        
  # 测试策略与方法
  testing_strategy:
    # 测试层次策略
    testing_levels:
      unit_testing:
        coverage_target: ">= 80%"
        testing_scope: []
        testing_tools: ["JUnit 5", "Vue Test Utils"]
        
      integration_testing:
        coverage_target: ">= 60%"
        integration_points: []
        testing_approach: ""
        
      system_testing:
        testing_scope: "end-to-end"
        business_scenarios: []
        
      acceptance_testing:
        acceptance_criteria: []
        stakeholder_involvement: []
        
    # 测试类型策略
    testing_types:
      functional_testing:
        test_categories:
          - category: "CRUD Operations"
            test_methods: []
          - category: "Business Logic"
            test_methods: []
          - category: "Data Validation"
            test_methods: []
            
      non_functional_testing:
        performance_testing:
          load_testing: true
          stress_testing: false
          volume_testing: false
          
        security_testing:
          vulnerability_scanning: true
          penetration_testing: false
          
        compatibility_testing:
          browser_compatibility: []
          device_compatibility: []
          
  # JeecgBoot框架特定测试要求
  jeecgboot_testing_requirements:
    # 框架集成测试
    framework_integration_testing:
      security_framework_testing:
        permission_system_testing: true
        role_based_access_testing: true
        
      codegen_system_testing:
        generated_code_testing: true
        customization_testing: true
        
      system_integration_testing:
        database_integration: true
        cache_integration: true
        
    # 框架约束验证
    framework_constraints_validation:
      technology_stack_compliance: []
      coding_standard_compliance: []
      architecture_pattern_compliance: []
      
  # 测试执行计划
  test_execution_plan:
    # 测试阶段规划
    testing_phases:
      preparation_phase:
        duration: ""
        activities: []
        deliverables: []
        
      execution_phase:
        duration: ""
        test_cycles: []
        parallel_execution: []
        
      reporting_phase:
        duration: ""
        reporting_activities: []
        
    # 测试资源配置
    test_resources:
      testing_tools: []
      test_environments: []
      test_data_sets: []
      
  # 缺陷管理要求
  defect_management:
    # 缺陷分类标准
    defect_classification:
      severity_levels:
        - level: "Critical"
          criteria: ""
        - level: "High"
          criteria: ""
        - level: "Medium"
          criteria: ""
        - level: "Low"
          criteria: ""
          
    # 缺陷处理流程
    defect_handling_process:
      defect_reporting: ""
      defect_tracking: ""
      defect_resolution: ""
      
  # 验收标准
  acceptance_criteria:
    # 功能验收标准
    functional_acceptance:
      feature_completeness: "100%"
      business_requirement_coverage: "100%"
      user_story_acceptance: "100%"
      
    # 质量验收标准
    quality_acceptance:
      defect_density_limit: "< 1 defect per 100 LOC"
      critical_defects_allowed: 0
      high_defects_allowed: 0
      
    # 性能验收标准
    performance_acceptance:
      response_time_compliance: "100%"
      throughput_compliance: "100%"
      resource_utilization_limit: ""

# 输入验证规则
input_validation:
  required_components:
    - "code_delivery_input.delivery_inventory"
    - "code_delivery_input.implemented_features"
    - "testing_environment.environment_setup"
    - "quality_standards"
    
  testing_completeness:
    - "All delivered components must be included in test scope"
    - "All implemented features must have acceptance criteria"
    - "Test environment must support all testing requirements"
    
  jeecgboot_compliance:
    - "Testing strategy must align with JeecgBoot framework"
    - "Framework-specific testing requirements must be addressed"
    - "Security and permission system testing must be included"
    
  quality_standards_validation:
    - "Quality standards must be measurable and achievable"
    - "Testing methods must be appropriate for quality objectives"
    - "Acceptance criteria must be clearly defined and verifiable"