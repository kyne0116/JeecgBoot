# ContextDev v4.1 - Code Developer Expert Input Template
# 代码开发专家输入模板 - 基于开发计划进行全栈代码实现

code_developer_input:
  # 基线引用 - 继承共享基线和项目上下文
  config_reference: "../shared/config.yaml" 
    
  # 输入来源 - 接收系统架构专家的输出
  input_source:
    source_expert: "system_architect"
    source_document: "system_architecture.yaml"
    plan_version: ""
    
  # 开发计划输入信息
  development_plan_input:
    # 开发任务分解
    development_tasks:
      # CodeGen自动生成任务
      codegen_tasks:
        - task_id: ""
          module_name: ""
          entity_definition: ""
          generation_scope: []     # entity/controller/service/mapper/vue
          codegen_config: {}
          
      # 手动开发任务
      manual_tasks:
        - task_id: ""
          component_name: ""
          component_type: ""       # business_logic/integration/custom_ui/workflow
          development_approach: ""
          technology_requirements: []
          
    # 技术实现要求
    technical_requirements:
      architecture_constraints: []
      performance_requirements: []
      security_requirements: []
      integration_requirements: []
      
  # JeecgBoot开发环境配置
  development_environment:
    # 框架版本信息
    framework_versions:
      jeecgboot_version: ""
      spring_boot_version: ""
      vue_version: ""
      ant_design_vue_version: ""
      
    # 开发工具配置
    development_tools:
      jdk_version: "17"
      maven_version: "3.9+"
      node_version: ""
      npm_registry: ""
      
    # 数据库配置
    database_config:
      database_type: "MySQL"      # 强制MySQL 8.0+
      database_version: "8.0+"
      connection_config: {}
      
  # CodeGen系统配置
  codegen_configuration:
    # 代码生成配置
    generation_settings:
      base_package: ""             # 基础包名
      module_package: ""           # 模块包名
      author_name: ""              # 作者信息
      table_prefix: ""             # 表前缀
      
    # 生成选项
    generation_options:
      generate_entity: true
      generate_mapper: true
      generate_service: true
      generate_controller: true
      generate_vue_pages: true
      generate_api_js: true
      
    # 模板定制
    template_customization:
      entity_template_config: {}
      controller_template_config: {}
      service_template_config: {}
      vue_template_config: {}
      
  # 业务模块开发要求
  business_modules:
    # 数据管理模块
    data_modules:
      - module_name: ""
        entity_definitions:
          - entity_name: ""
            table_name: ""
            fields:
              - field_name: ""
                field_type: ""     # 参考data_types.yaml
                field_length: 0
                nullable: false
                default_value: ""
                comment: ""
            indexes: []
            constraints: []
            
    # 业务逻辑模块
    business_logic_modules:
      - module_name: ""
        business_rules: []
        workflow_definitions: []
        validation_rules: []
        
    # 集成模块
    integration_modules:
      - module_name: ""
        integration_type: ""       # rest_api/database/file_system
        endpoint_config: {}
        data_mapping: []
        
  # 前端开发要求
  frontend_requirements:
    # 页面开发
    page_development:
      - page_name: ""
        page_type: ""              # list/form/detail/dashboard
        component_requirements: []
        routing_config: {}
        
    # 组件开发
    component_development:
      - component_name: ""
        component_type: ""         # business/ui/utility
        reusability_level: ""      # project/module/global
        
    # 样式要求
    styling_requirements:
      theme_config: "ant-design-vue"
      custom_styles: []
      responsive_design: true
      
  # 后端开发要求
  backend_requirements:
    # API开发
    api_development:
      - api_module: ""
        endpoints:
          - endpoint_path: ""
            http_method: ""
            request_dto: ""
            response_dto: ""
            business_logic: ""
            
    # 服务层开发
    service_development:
      - service_name: ""
        service_methods: []
        transaction_requirements: []
        
    # 数据访问层
    data_access_development:
      - mapper_name: ""
        sql_operations: []
        custom_queries: []
        
  # 质量要求
  code_quality_requirements:
    # 代码标准
    coding_standards:
      java_coding_standard: "JeecgBoot"
      javascript_coding_standard: "ESLint + Prettier"
      naming_conventions: []
      
    # 测试要求
    testing_requirements:
      unit_test_coverage: ">= 80%"
      integration_test_coverage: ">= 60%"
      test_frameworks: ["JUnit 5", "Vue Test Utils"]
      
    # 文档要求
    documentation_requirements:
      api_documentation: "Swagger/OpenAPI"
      code_comments: "JavaDoc + JSDoc"
      technical_documentation: true
      
  # 部署配置要求
  deployment_configuration:
    # 构建配置
    build_configuration:
      maven_profile: ""
      npm_build_script: ""
      environment_variables: {}
      
    # 打包要求
    packaging_requirements:
      backend_packaging: "jar"
      frontend_packaging: "static_files"
      resource_optimization: true

# 输入验证规则
input_validation:
  required_sections:
    - "development_plan_input.development_tasks"
    - "codegen_configuration.generation_settings"
    - "business_modules"
    - "code_quality_requirements"
    
  jeecgboot_compliance:
    - "Must use only approved JeecgBoot technology stack"
    - "Must prioritize CodeGen system for CRUD operations"
    - "Must follow JeecgBoot coding standards and conventions"
    - "Must integrate with existing security and permission system"
    
  development_standards:
    - "All database operations must use MyBatis-Plus"
    - "All frontend development must use Vue 3 + TypeScript"
    - "All API endpoints must follow RESTful conventions"
    - "All custom development must extend JeecgBoot base classes"