# CodeGen系统与需求基线管理集成配置模板
# Template: codegen_baseline_integration.yaml
# Version: v4.0.0
# Description: CodeGen系统基线驱动增强配置，支持需求追溯和自动化基线更新

codegen_baseline_integration:
  # === 集成配置元信息 ===
  integration_info:
    integration_name: "CodeGen需求基线管理集成"
    integration_version: "v1.0.0"
    integration_type: "bidirectional"
    last_updated: datetime
    maintained_by: "code_developer + baseline_manager"
    
  # === 基线数据源配置 ===
  baseline_data_source:
    baseline_file_path: string          # requirement_baseline_{ID}.yaml路径
    baseline_version: string            # 基线版本号
    baseline_lock_check: boolean        # 是否检查基线锁定状态
    sync_frequency: enum                # real_time|on_demand|scheduled
    
    data_extraction_mapping:
      basic_info_extraction:
        requirement_id: "basic_info.requirement_id"
        requirement_title: "basic_info.title"
        requirement_description: "basic_info.description"
        complexity_level: "basic_info.complexity"
        business_domain: "basic_info.business_domain"
        
      technical_context_extraction:
        database_tables: "technical_context.database_tables"
        api_endpoints: "technical_context.api_endpoints"
        ui_components: "technical_context.ui_components"
        jeecgboot_modules: "technical_context.jeecgboot_modules"
        
      business_rules_extraction:
        validation_rules: "business_context.business_rules[rule_type='validation']"
        calculation_rules: "business_context.business_rules[rule_type='calculation']"
        constraint_rules: "business_context.business_rules[rule_type='constraint']"
        
      stakeholder_info_extraction:
        primary_users: "business_context.stakeholders[involvement_level='high']"
        approval_workflow: "business_context.business_rules[rule_type='workflow']"
  
  # === CodeGen增强配置生成器 ===
  enhanced_codegen_config_generator:
    config_generation_rules:
      table_config_generation:
        table_name_source: "technical_context.database_tables[0].table_name"
        table_comment_template: "${basic_info.title} - 需求ID: ${basic_info.requirement_id}"
        primary_key_strategy: "auto_detect_or_default_id"
        
        automatic_fields: array
          - field_name: "requirement_trace_id"
            field_type: "String"
            database_type: "VARCHAR(50)"
            field_comment: "需求追溯标识: ${basic_info.requirement_id}"
            default_value: "${basic_info.requirement_id}"
            is_system_field: true
            
          - field_name: "baseline_version"
            field_type: "String"
            database_type: "VARCHAR(20)"
            field_comment: "需求基线版本"
            default_value: "${baseline_version}"
            is_system_field: true
            
          - field_name: "last_baseline_sync"
            field_type: "LocalDateTime"
            database_type: "DATETIME"
            field_comment: "最后基线同步时间"
            auto_update: true
            is_system_field: true
      
      field_mapping_generation:
        business_field_mapping:
          source: "technical_context.database_tables[0].columns"
          mapping_rules: array
            - source_pattern: "business_rules[].validation_rules"
              target_annotation: "@NotNull, @Length, @Pattern"
              error_message_template: "${field_comment}${validation_rule.error_message}"
              
            - source_pattern: "business_rules[].constraint_rules"
              target_constraint: "database_constraint"
              constraint_template: "CONSTRAINT chk_${table_name}_${field_name} CHECK (${constraint_rule.rule_expression})"
              
        system_field_integration:
          created_by: "继承JeecgBoot标准字段"
          created_time: "继承JeecgBoot标准字段"
          updated_by: "继承JeecgBoot标准字段"
          updated_time: "继承JeecgBoot标准字段"
          
      permission_config_generation:
        permission_source: "business_context.stakeholders"
        permission_generation_rules: array
          - stakeholder_role: "primary_users"
            permission_template: "${module_name}:${entity_name}:list,add,edit,delete"
            permission_name_template: "${basic_info.title}${permission_action}"
            
          - stakeholder_role: "approval_users"
            permission_template: "${module_name}:${entity_name}:approve,reject"
            permission_name_template: "${basic_info.title}审批权限"
            
        role_integration:
          inherit_from_jeecgboot: true
          custom_role_creation: false
          role_permission_mapping: "基于stakeholder_role自动映射"
  
  # === 追溯信息注入配置 ===
  traceability_injection:
    code_comment_injection:
      java_class_comment_template: |
        /**
         * ${basic_info.title}
         * 
         * 需求追溯信息:
         * - 需求ID: ${basic_info.requirement_id}
         * - 需求描述: ${basic_info.description}
         * - 复杂度级别: ${basic_info.complexity}
         * - 业务领域: ${basic_info.business_domain}
         * - 生成时间: ${generation_time}
         * - 基线版本: ${baseline_version}
         * - 架构设计: ${traceability.design_documents[0].path}
         * 
         * @author CodeGen
         * @since ${generation_date}
         */
         
      method_comment_template: |
        /**
         * ${method_description}
         * 
         * 对应需求: ${related_requirement_id}
         * 业务规则: ${related_business_rules}
         * 验收标准: ${related_acceptance_criteria}
         */
         
      database_comment_injection:
        table_comment_template: "${basic_info.title} - 需求追溯: ${basic_info.requirement_id}"
        column_comment_template: "${column_description} (需求: ${basic_info.requirement_id})"
        
    api_documentation_injection:
      swagger_annotation_enhancement:
        api_class_annotation: |
          @Api(tags = "${basic_info.title}")
          @ApiOperation(value = "${basic_info.title}管理接口", notes = "需求ID: ${basic_info.requirement_id}, 基线版本: ${baseline_version}")
          
        api_method_annotation: |
          @ApiOperation(value = "${method_description}", notes = "需求追溯: ${basic_info.requirement_id}")
          @ApiResponses({
              @ApiResponse(code = 200, message = "操作成功"),
              @ApiResponse(code = 500, message = "操作失败")
          })
          
      api_response_traceability:
        include_traceability_header: true
        traceability_header_name: "X-Requirement-Trace-ID"
        traceability_header_value: "${basic_info.requirement_id}"
        
    frontend_comment_injection:
      vue_component_comment_template: |
        <!--
        ${basic_info.title}
        
        需求追溯信息:
        需求ID: ${basic_info.requirement_id}
        页面描述: ${basic_info.description}
        生成时间: ${generation_time}
        基线版本: ${baseline_version}
        
        对应后端API: ${related_api_endpoints}
        业务规则: ${related_business_rules}
        -->
        
      javascript_comment_template: |
        /**
         * ${basic_info.title} - 前端逻辑
         * 
         * 需求追溯: ${basic_info.requirement_id}
         * 业务规则实现: ${implemented_business_rules}
         * 数据验证: ${validation_rules}
         */
  
  # === 基线状态同步配置 ===
  baseline_status_synchronization:
    sync_triggers: array
      - trigger_event: "codegen_started"
        baseline_update: 
          field: "status_info.current_status"
          value: "in_development"
          field: "status_info.current_phase"
          value: "development"
          field: "expert_collaboration.assigned_experts[role='code_developer'].work_status"
          value: "in_progress"
          
      - trigger_event: "database_schema_created"
        baseline_update:
          field: "status_info.progress_percentage"
          value: "increment_by_20"
          field: "traceability.implementation_files"
          value: "append_database_scripts"
          
      - trigger_event: "entity_generated"
        baseline_update:
          field: "status_info.progress_percentage"
          value: "increment_by_15"
          field: "traceability.implementation_files"
          value: "append_entity_files"
          
      - trigger_event: "controller_generated"
        baseline_update:
          field: "status_info.progress_percentage"
          value: "increment_by_20"
          field: "traceability.implementation_files"
          value: "append_controller_files"
          
      - trigger_event: "service_generated"
        baseline_update:
          field: "status_info.progress_percentage"
          value: "increment_by_15"
          field: "traceability.implementation_files"
          value: "append_service_files"
          
      - trigger_event: "vue_pages_generated"
        baseline_update:
          field: "status_info.progress_percentage"
          value: "increment_by_20"
          field: "traceability.implementation_files"
          value: "append_vue_files"
          
      - trigger_event: "codegen_completed"
        baseline_update:
          field: "status_info.current_status"
          value: "in_testing"
          field: "status_info.progress_percentage"
          value: "85"
          field: "expert_collaboration.assigned_experts[role='code_developer'].work_status"
          value: "completed"
          field: "expert_collaboration.assigned_experts[role='code_developer'].completion_time"
          value: "current_timestamp"
    
    sync_mechanisms:
      real_time_sync:
        enabled: true
        sync_method: "baseline_status_api"
        sync_frequency: "immediate"
        retry_policy: "exponential_backoff"
        
      batch_sync:
        enabled: true
        sync_interval: "5_minutes"
        batch_size: "all_pending_updates"
        
      conflict_resolution:
        strategy: "last_writer_wins"
        conflict_notification: "notify_baseline_manager"
        manual_resolution_required: false
  
  # === 代码文件映射管理 ===
  code_file_mapping:
    file_mapping_generation:
      entity_files:
        pattern: "${package_path}/entity/${EntityName}.java"
        traceability_type: "entity"
        baseline_section: "technical_context.database_tables"
        relationship_description: "实现${table_name}表的实体映射"
        
      controller_files:
        pattern: "${package_path}/controller/${EntityName}Controller.java"
        traceability_type: "controller"
        baseline_section: "technical_context.api_endpoints"
        relationship_description: "实现${entity_name}的RESTful API接口"
        
      service_files:
        pattern: "${package_path}/service/${EntityName}Service.java"
        traceability_type: "service"
        baseline_section: "business_context.business_rules"
        relationship_description: "实现${entity_name}的业务逻辑"
        
      mapper_files:
        pattern: "${package_path}/mapper/${EntityName}Mapper.java"
        traceability_type: "mapper"
        baseline_section: "technical_context.database_tables"
        relationship_description: "实现${entity_name}的数据访问"
        
      vue_files:
        list_page: "${vue_path}/views/${module_name}/${entity_name}/index.vue"
        form_page: "${vue_path}/views/${module_name}/${entity_name}/components/${EntityName}Form.vue"
        detail_page: "${vue_path}/views/${module_name}/${entity_name}/components/${EntityName}Detail.vue"
        traceability_type: "vue_component"
        baseline_section: "technical_context.ui_components"
        
    mapping_metadata:
      generation_time: datetime
      generated_by: "code_developer"
      baseline_version: string
      code_quality_score: number
      compilation_status: enum            # success|failed|warning
      integration_test_status: enum       # passed|failed|pending
  
  # === 质量检查集成 ===
  quality_integration:
    pre_generation_checks: array
      - check_name: "基线数据完整性检查"
        check_method: "baseline_schema_validation"
        pass_criteria: "所有必需字段已填写"
        failure_action: "阻止生成，要求补充数据"
        
      - check_name: "JeecgBoot兼容性检查"
        check_method: "framework_compatibility_validation"
        pass_criteria: "所有配置符合框架约束"
        failure_action: "阻止生成，要求修正配置"
        
      - check_name: "业务规则一致性检查"
        check_method: "business_rule_consistency_validation"
        pass_criteria: "业务规则无逻辑冲突"
        failure_action: "警告并记录，允许继续"
    
    post_generation_checks: array
      - check_name: "代码编译检查"
        check_method: "maven_compile_test"
        pass_criteria: "编译无错误"
        failure_action: "标记失败，回滚生成"
        
      - check_name: "API接口验证"
        check_method: "api_endpoint_test"
        pass_criteria: "所有API正常响应"
        failure_action: "标记警告，记录问题"
        
      - check_name: "前端页面验证"
        check_method: "vue_component_render_test"
        pass_criteria: "页面正常渲染"
        failure_action: "标记警告，记录问题"
    
    continuous_quality_monitoring:
      code_quality_metrics:
        sonarqube_integration: true
        quality_gate_threshold: "A级"
        
      test_coverage_monitoring:
        jacoco_integration: true
        coverage_threshold: "80%"
        
      performance_monitoring:
        api_response_time_threshold: "300ms"
        database_query_optimization: true
  
  # === 错误处理和恢复 ===
  error_handling:
    generation_errors: array
      - error_type: "baseline_data_missing"
        error_message: "基线数据不完整，无法继续生成"
        recovery_action: "通知baseline_manager补充数据"
        
      - error_type: "framework_constraint_violation"
        error_message: "违反JeecgBoot框架约束"
        recovery_action: "调整配置以符合框架要求"
        
      - error_type: "code_generation_failure"
        error_message: "代码生成过程失败"
        recovery_action: "回滚已生成文件，重新生成"
    
    baseline_sync_errors: array
      - error_type: "baseline_file_locked"
        error_message: "基线文件被锁定，无法更新"
        recovery_action: "等待解锁或联系baseline_manager"
        
      - error_type: "baseline_version_conflict"
        error_message: "基线版本冲突"
        recovery_action: "合并冲突或使用最新版本"
    
    rollback_mechanisms:
      automatic_rollback: true
      rollback_scope: ["generated_files", "database_changes", "baseline_updates"]
      rollback_confirmation: "require_manual_confirmation"
      
  # === 性能优化配置 ===
  performance_optimization:
    caching_strategy:
      baseline_data_cache: true
      cache_duration: "30_minutes"
      cache_invalidation: "on_baseline_update"
      
    parallel_processing:
      enable_parallel_generation: true
      max_parallel_threads: 4
      thread_safety_checks: true
      
    incremental_updates:
      detect_changes: true
      only_update_changed_files: true
      change_detection_method: "hash_comparison"
  
  # === 元数据和配置 ===
  metadata:
    integration_author: "ContextDev Team"
    integration_version: "v1.0.0"
    last_updated: "2025-07-26"
    compatibility: 
      jeecgboot_version: "3.x+"
      codegen_version: "latest"
      baseline_template_version: "v1.0.0+"
    
    customization_options: array
      - option_name: "traceability_comment_format"
        option_description: "自定义追溯信息注释格式"
        default_value: "standard_format"
        
      - option_name: "baseline_sync_frequency"
        option_description: "基线状态同步频率"
        default_value: "real_time"
        
      - option_name: "quality_check_level"
        option_description: "质量检查严格程度"
        default_value: "standard"