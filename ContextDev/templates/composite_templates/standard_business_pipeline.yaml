# 标准业务开发流水线 - 组合模板
# Template: standard_business_pipeline.yaml
# Version: v2.0.0
# Description: 标准业务需求的完整开发流水线，整合5个专家的协作流程

standard_business_pipeline:
  # 流水线概述
  pipeline_info:
    pipeline_name: "标准业务需求开发流水线"
    pipeline_version: "2.0.0"
    target_complexity: "standard"                # 适用于标准复杂度业务需求
    estimated_duration: "5-15个工作日"           # 总体时间估算
    team_size: "2-4人"                          # 推荐团队规模
    success_criteria: "交付完整可运行的业务功能模块"
  
  # 适用场景定义
  applicable_scenarios:
    business_domains: ["finance", "supply", "crm", "hrm", "inventory", "order"]
    complexity_indicators:
      entity_count: "5-15个业务实体"
      process_steps: "10-30个流程步骤"
      integration_points: "2-5个集成点"
      business_rules: "中等复杂度业务规则"
      user_roles: "3-8个用户角色"
    technical_characteristics:
      database_tables: "5-20个数据表"
      api_endpoints: "15-50个API接口"
      ui_pages: "5-15个界面页面"
      codegen_usage: "60-80%代码可生成"
  
  # 流水线阶段定义
  pipeline_stages:
    # 阶段1: 需求分析阶段
    stage_1_requirements_analysis:
      stage_name: "需求分析阶段"
      responsible_expert: "requirements_analyst"
      stage_duration: "1-3个工作日"
      stage_objective: "将业务需求转化为结构化的技术需求规格"
      
      # 输入要求
      stage_inputs:
        primary_input:
          input_name: "业务需求描述"
          input_format: "自然语言 + 业务背景材料"
          input_template: "/templates/input_templates/analyst/basic_requirement_input.yaml"
          input_validation:
            - "业务需求描述完整清晰"
            - "利益相关方信息完整"
            - "业务流程初步定义"
            - "约束条件明确说明"
            
        supporting_inputs: array
          - input_name: "现有系统文档"
            input_optional: true
            input_purpose: "了解系统现状和集成要求"
          - input_name: "类似系统参考"
            input_optional: true  
            input_purpose: "借鉴最佳实践和设计模式"
      
      # 处理流程
      stage_process:
        process_template: "/templates/process_templates/analyst/requirement_analysis_process.yaml"
        key_activities: array
          - activity_name: "业务需求理解"
            activity_duration: "0.5-1天"
            activity_deliverable: "需求理解报告"
            
          - activity_name: "利益相关方分析"
            activity_duration: "0.5天"
            activity_deliverable: "利益相关方需求清单"
            
          - activity_name: "业务实体建模"
            activity_duration: "0.5-1天"
            activity_deliverable: "业务实体关系模型"
            
          - activity_name: "业务流程建模"
            activity_duration: "1-1.5天"
            activity_deliverable: "业务流程图和规则"
            
          - activity_name: "需求规格编写"
            activity_duration: "0.5-1天"
            activity_deliverable: "正式需求规格说明书"
      
      # 输出交付物
      stage_outputs:
        primary_outputs: array
          - output_name: "需求规格说明书"
            output_template: "/templates/output_templates/analyst/requirement_specification.yaml"
            output_validation:
              - "所有功能需求使用EARS语法规范化"
              - "业务实体和属性定义完整"
              - "业务流程和规则清晰明确"
              - "验收标准可测试可验证"
              
        supporting_outputs: array
          - output_name: "业务规则文档"
            output_template: "/templates/output_templates/analyst/business_rules_document.yaml"
          - output_name: "验收标准文档"
            output_template: "/templates/output_templates/analyst/acceptance_criteria.yaml"
          - output_name: "利益相关方分析"
            output_template: "/templates/output_templates/analyst/stakeholder_analysis.yaml"
          - output_name: "数据模型需求"
            output_template: "/templates/output_templates/analyst/data_model_requirements.yaml"
      
      # 质量检查点
      stage_quality_gates:
        - gate_name: "需求完整性检查"
          gate_criteria: "所有业务需求都已识别和分析"
          validation_method: "需求覆盖度检查清单"
          
        - gate_name: "需求一致性检查"
          gate_criteria: "需求间无冲突和矛盾"
          validation_method: "需求一致性矩阵验证"
          
        - gate_name: "技术可行性检查"
          gate_criteria: "所有需求在JeecgBoot框架内可实现"
          validation_method: "技术约束符合性检查"
    
    # 阶段2: 系统架构设计阶段
    stage_2_system_architecture:
      stage_name: "系统架构设计阶段"
      responsible_expert: "system_architect"
      stage_duration: "2-4个工作日"
      stage_objective: "设计完整的技术架构和实现方案"
      
      # 输入要求
      stage_inputs:
        primary_input:
          input_name: "需求规格说明书"
          input_source: "stage_1_requirements_analysis"
          input_template: "/templates/input_templates/architect/requirement_spec_input.yaml"
          input_validation:
            - "需求规格完整且已通过质量检查"
            - "业务实体和流程定义清晰"
            - "非功能需求明确具体"
            - "约束条件和限制明确"
      
      # 处理流程
      stage_process:
        process_template: "/templates/process_templates/architect/system_architecture_process.yaml"
        key_activities: array
          - activity_name: "架构需求分析"
            activity_duration: "0.5-1天"
            activity_deliverable: "架构需求清单"
            
          - activity_name: "整体架构设计"
            activity_duration: "1-1.5天"
            activity_deliverable: "系统架构图和组件设计"
            
          - activity_name: "数据库架构设计"
            activity_duration: "1-1.5天"
            activity_deliverable: "数据库设计文档"
            
          - activity_name: "API接口架构设计"
            activity_duration: "0.5-1天"
            activity_deliverable: "API接口规范"
            
          - activity_name: "安全架构设计"
            activity_duration: "0.5天"
            activity_deliverable: "安全架构文档"
      
      # 输出交付物
      stage_outputs:
        primary_outputs: array
          - output_name: "系统架构文档"
            output_template: "/templates/output_templates/architect/system_architecture.yaml"
            output_validation:
              - "架构设计完整且技术可行"
              - "严格遵循JeecgBoot框架约束"
              - "数据库设计符合MySQL规范"
              - "API设计符合RESTful原则"
              
        supporting_outputs: array
          - output_name: "数据库设计文档"
            output_template: "/templates/output_templates/architect/database_schema.yaml"
          - output_name: "API接口规范"
            output_template: "/templates/output_templates/architect/api_specification.yaml"
          - output_name: "安全架构文档"
            output_template: "/templates/output_templates/architect/security_architecture.yaml"
          - output_name: "技术选型文档"
            output_template: "/templates/output_templates/architect/technology_selection.yaml"
      
      # 质量检查点
      stage_quality_gates:
        - gate_name: "架构完整性检查"
          gate_criteria: "所有架构视图完整设计"
          validation_method: "架构完整性检查清单"
          
        - gate_name: "JeecgBoot兼容性检查"
          gate_criteria: "完全符合JeecgBoot技术栈约束"
          validation_method: "框架兼容性验证清单"
          
        - gate_name: "性能可达性检查"
          gate_criteria: "架构设计能够满足性能要求"
          validation_method: "性能目标可达性分析"
    
    # 阶段3: 任务规划阶段
    stage_3_task_planning:
      stage_name: "任务规划阶段"
      responsible_expert: "task_planner"
      stage_duration: "1-2个工作日"
      stage_objective: "制定详细的开发计划和任务分解"
      
      # 输入要求
      stage_inputs:
        primary_input:
          input_name: "系统架构文档"
          input_source: "stage_2_system_architecture"
          input_template: "/templates/input_templates/planner/system_architecture_input.yaml"
          input_validation:
            - "系统架构设计完整且已审核通过"
            - "数据库设计具体可实施"
            - "API接口定义清晰完整"
            - "技术方案确定可行"
      
      # 处理流程
      stage_process:
        process_template: "/templates/process_templates/planner/task_breakdown_process.yaml"
        key_activities: array
          - activity_name: "开发任务分解"
            activity_duration: "0.5-1天"
            activity_deliverable: "WBS任务分解结构"
            
          - activity_name: "工作量估算"
            activity_duration: "0.5天"
            activity_deliverable: "工作量估算报告"
            
          - activity_name: "依赖关系分析"
            activity_duration: "0.5天"
            activity_deliverable: "任务依赖关系图"
            
          - activity_name: "开发计划制定"
            activity_duration: "0.5天"
            activity_deliverable: "详细开发计划"
      
      # 输出交付物
      stage_outputs:
        primary_outputs: array
          - output_name: "开发计划文档"
            output_template: "/templates/output_templates/planner/development_plan.yaml"
            output_validation:
              - "任务分解粒度适中可执行"
              - "工作量估算基于JeecgBoot经验"
              - "依赖关系清晰合理"
              - "计划具有可操作性"
              
        supporting_outputs: array
          - output_name: "任务分解结构"
            output_template: "/templates/output_templates/planner/work_breakdown_structure.yaml"
          - output_name: "技术实施方案"
            output_template: "/templates/output_templates/planner/implementation_roadmap.yaml"
          - output_name: "质量控制计划"
            output_template: "/templates/output_templates/planner/quality_control_plan.yaml"
          - output_name: "风险控制方案"
            output_template: "/templates/output_templates/planner/risk_mitigation_plan.yaml"
      
      # 质量检查点
      stage_quality_gates:
        - gate_name: "任务可执行性检查"
          gate_criteria: "所有任务都具体可执行"
          validation_method: "任务可执行性验证清单"
          
        - gate_name: "工作量合理性检查"
          gate_criteria: "工作量估算合理准确"
          validation_method: "工作量估算合理性评审"
          
        - gate_name: "依赖关系完整性检查"
          gate_criteria: "任务依赖关系完整正确"
          validation_method: "依赖关系完整性验证"
    
    # 阶段4: 代码开发阶段
    stage_4_code_development:
      stage_name: "代码开发阶段"
      responsible_expert: "code_developer"
      stage_duration: "3-8个工作日"
      stage_objective: "实现完整的功能代码和用户界面"
      
      # 输入要求
      stage_inputs:
        primary_input:
          input_name: "开发计划文档"
          input_source: "stage_3_task_planning"
          input_template: "/templates/input_templates/developer/development_plan_input.yaml"
          input_validation:
            - "开发计划详细具体可执行"
            - "技术方案确定且可实施"
            - "任务分解合理完整"
            - "质量标准明确定义"
            
        supporting_inputs: array
          - input_name: "系统架构文档"
            input_source: "stage_2_system_architecture"
            input_purpose: "技术实现参考"
          - input_name: "需求规格说明书"
            input_source: "stage_1_requirements_analysis"
            input_purpose: "业务需求理解"
      
      # 处理流程
      stage_process:
        process_template: "/templates/process_templates/developer/codegen_generation_process.yaml"
        key_activities: array
          - activity_name: "环境准备和CodeGen配置"
            activity_duration: "0.5天"
            activity_deliverable: "开发环境和代码生成配置"
            
          - activity_name: "数据库表创建和CodeGen执行"
            activity_duration: "0.5-1天"
            activity_deliverable: "基础CRUD代码和界面"
            
          - activity_name: "后端业务逻辑开发"
            activity_duration: "1.5-3天"
            activity_deliverable: "完整后端业务功能"
            
          - activity_name: "前端界面定制开发"
            activity_duration: "1-2.5天"
            activity_deliverable: "完整前端用户界面"
            
          - activity_name: "集成测试和BUG修复"
            activity_duration: "0.5-1天"
            activity_deliverable: "可运行的完整功能"
      
      # 输出交付物
      stage_outputs:
        primary_outputs: array
          - output_name: "后端代码交付"
            output_template: "/templates/output_templates/developer/backend_code_delivery.yaml"
            output_validation:
              - "代码编译通过无语法错误"
              - "业务逻辑完全符合需求"
              - "代码规范符合JeecgBoot标准"
              - "单元测试覆盖率达标"
              
          - output_name: "前端代码交付"
            output_template: "/templates/output_templates/developer/frontend_code_delivery.yaml"
            output_validation:
              - "界面功能完整可用"
              - "用户体验符合设计要求"
              - "TypeScript类型定义完整"
              - "组件化设计合理"
              
        supporting_outputs: array
          - output_name: "数据库脚本"
            output_template: "/templates/output_templates/developer/database_scripts.yaml"
          - output_name: "配置文件"
            output_template: "/templates/output_templates/developer/configuration_files.yaml"
          - output_name: "开发文档"
            output_template: "/templates/output_templates/developer/development_documentation.yaml"
      
      # 质量检查点
      stage_quality_gates:
        - gate_name: "代码质量检查"
          gate_criteria: "代码质量符合企业级标准"
          validation_method: "代码质量检查清单"
          
        - gate_name: "功能完整性检查"
          gate_criteria: "所有功能完全实现需求"
          validation_method: "功能完整性验证"
          
        - gate_name: "集成可用性检查"
          gate_criteria: "系统集成正常可用"
          validation_method: "集成测试验证"
    
    # 阶段5: 质量测试阶段
    stage_5_quality_testing:
      stage_name: "质量测试阶段"
      responsible_expert: "quality_tester"
      stage_duration: "2-4个工作日"
      stage_objective: "全面验证系统质量和用户验收"
      
      # 输入要求
      stage_inputs:
        primary_input:
          input_name: "完整功能代码"
          input_source: "stage_4_code_development"
          input_template: "/templates/input_templates/tester/code_delivery_input.yaml"
          input_validation:
            - "代码完整且编译通过"
            - "基本功能验证通过"
            - "开发文档完整"
            - "部署环境就绪"
            
        supporting_inputs: array
          - input_name: "需求规格说明书"
            input_source: "stage_1_requirements_analysis"
            input_purpose: "测试用例设计依据"
          - input_name: "验收标准文档"
            input_source: "stage_1_requirements_analysis"
            input_purpose: "验收测试标准"
      
      # 处理流程
      stage_process:
        process_template: "/templates/process_templates/tester/functional_testing_process.yaml"
        key_activities: array
          - activity_name: "测试计划制定"
            activity_duration: "0.5天"
            activity_deliverable: "详细测试计划"
            
          - activity_name: "功能测试执行"
            activity_duration: "1-1.5天"
            activity_deliverable: "功能测试报告"
            
          - activity_name: "性能和安全测试"
            activity_duration: "0.5-1天"
            activity_deliverable: "性能安全测试报告"
            
          - activity_name: "用户验收测试"
            activity_duration: "0.5-1天"
            activity_deliverable: "用户验收测试报告"
            
          - activity_name: "质量评估和报告"
            activity_duration: "0.5天"
            activity_deliverable: "质量评估报告"
      
      # 输出交付物
      stage_outputs:
        primary_outputs: array
          - output_name: "测试执行报告"
            output_template: "/templates/output_templates/tester/test_execution_report.yaml"
            output_validation:
              - "测试覆盖率达到95%以上"
              - "所有测试用例执行完成"
              - "缺陷分类管理完整"
              - "质量评估客观准确"
              
          - output_name: "验收测试报告"
            output_template: "/templates/output_templates/tester/acceptance_test_report.yaml"
            output_validation:
              - "用户验收标准全部通过"
              - "业务流程验证完整"
              - "用户体验满足要求"
              - "系统稳定性验证通过"
              
        supporting_outputs: array
          - output_name: "测试计划文档"
            output_template: "/templates/output_templates/tester/test_plan_document.yaml"
          - output_name: "测试用例集合"
            output_template: "/templates/output_templates/tester/test_case_suite.yaml"
          - output_name: "缺陷管理报告"
            output_template: "/templates/output_templates/tester/defect_management_report.yaml"
          - output_name: "质量评估报告"
            output_template: "/templates/output_templates/tester/quality_assessment_report.yaml"
      
      # 质量检查点
      stage_quality_gates:
        - gate_name: "测试完整性检查"
          gate_criteria: "测试覆盖率和测试深度达标"
          validation_method: "测试完整性检查清单"
          
        - gate_name: "缺陷收敛检查"
          gate_criteria: "严重缺陷全部修复"
          validation_method: "缺陷收敛标准验证"
          
        - gate_name: "用户验收检查"
          gate_criteria: "用户验收标准全部通过"
          validation_method: "用户验收确认"
  
  # 流水线协作机制
  collaboration_mechanism:
    # 专家间数据传递规范
    data_flow_protocol:
      interface_validation: "每个阶段的输出必须通过下游专家的输入验证"
      format_standardization: "所有数据传递使用标准化YAML模板格式"
      version_control: "所有交付物进行版本控制和变更跟踪"
      quality_assurance: "上游输出质量直接影响下游专家工作效率"
    
    # 协作检查点
    collaboration_checkpoints: array
      - checkpoint_name: "需求-架构对接检查"
        checkpoint_between: ["requirements_analyst", "system_architect"]
        checkpoint_purpose: "确保需求理解准确，架构设计有据"
        checkpoint_criteria: "架构师完全理解业务需求，设计方案可行"
        
      - checkpoint_name: "架构-规划对接检查"
        checkpoint_between: ["system_architect", "task_planner"]
        checkpoint_purpose: "确保架构设计可执行，任务分解合理"
        checkpoint_criteria: "规划师理解技术方案，任务分解具体可行"
        
      - checkpoint_name: "规划-开发对接检查"
        checkpoint_between: ["task_planner", "code_developer"]
        checkpoint_purpose: "确保开发计划可执行，技术路线清晰"
        checkpoint_criteria: "开发者理解开发要求，具备实施能力"
        
      - checkpoint_name: "开发-测试对接检查"
        checkpoint_between: ["code_developer", "quality_tester"]
        checkpoint_purpose: "确保代码质量达标，测试环境就绪"
        checkpoint_criteria: "测试者理解功能特性，测试环境完整"
    
    # 问题升级机制
    escalation_mechanism:
      level_1_team_resolution: "阶段内问题由责任专家解决"
      level_2_cross_stage_coordination: "跨阶段问题由相关专家协调解决"
      level_3_architecture_decision: "架构层面问题由架构师主导决策"
      level_4_stakeholder_decision: "业务层面问题提交业务方决策"
  
  # 流水线质量保证
  pipeline_quality_assurance:
    # 整体质量标准
    overall_quality_standards:
      functional_completeness: "100% - 所有功能需求完全实现"
      technical_correctness: "100% - 技术实现正确无误"
      code_quality: ">90% - 代码质量评分"
      test_coverage: ">95% - 测试覆盖率"
      user_satisfaction: ">90% - 用户满意度"
      performance_compliance: "100% - 性能指标达标"
      security_compliance: "100% - 安全要求符合"
    
    # 质量控制措施
    quality_control_measures: array
      - measure_name: "阶段质量门禁"
        measure_description: "每个阶段设置质量检查点，不达标不允许进入下一阶段"
        
      - measure_name: "输出物标准化"
