# 需求基线质量检查清单 (IEEE 830 + CMMI Level 3 + ISO 9001)
# ========================================================================
# 版本: v1.1.0 | 创建日期: 2025-07-27
# 标准依据: IEEE 830-1998, CMMI-DEV Level 3 REQ Practice, ISO 9001:2015
# 用途: JeecgBoot项目需求基线质量保证和合规性检查

baseline_quality_checklist:
  # 检查清单基本信息
  checklist_info:
    checklist_id: ""                   # 检查清单ID 格式: QC-{项目代码}-{版本}
    baseline_id: ""                    # 关联基线ID
    project_code: ""                   # 项目代码
    checklist_version: "1.0.0"         # 清单版本
    
    # 检查信息
    check_date: ""                     # 检查日期
    checker: ""                        # 检查人
    review_status: ""                  # 审查状态: in_progress/completed/approved
    overall_compliance_score: ""       # 总体合规评分 (0-100%)
    
    # 检查范围
    check_scope:
      ieee_830_compliance: true        # IEEE 830标准合规性检查
      cmmi_level3_compliance: true     # CMMI Level 3合规性检查
      iso_9001_compliance: true        # ISO 9001合规性检查
      jeecgboot_compatibility: true    # JeecgBoot兼容性检查
      internal_quality_standards: true # 内部质量标准检查

  # IEEE 830标准合规性检查
  ieee_830_compliance_check:
    section_name: "IEEE 830-1998 Software Requirements Specifications"
    compliance_score: ""               # 合规评分 (0-100%)
    
    # 1. 介绍 (Introduction)
    introduction_section:
      - check_item: "1.1 项目目的明确定义"
        requirement: "基线文档明确说明项目的目的和预期用途"
        status: ""                     # pass/fail/partial/not_applicable
        evidence: ""                   # 证据/参考位置
        comments: ""                   # 检查意见
        
      - check_item: "1.2 项目范围完整描述"
        requirement: "明确定义软件产品的功能边界和约束条件"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "1.3 定义和缩略语完整"
        requirement: "所有专业术语、缩略语和定义清晰说明"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "1.4 参考文档完整列出"
        requirement: "列出所有相关的参考文档和标准"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "1.5 文档概述结构清晰"
        requirement: "提供文档其余部分的概述和组织结构"
        status: ""
        evidence: ""
        comments: ""
    
    # 2. 总体描述 (Overall Description)
    overall_description_section:
      - check_item: "2.1 产品视角明确定义"
        requirement: "清晰描述产品与其他系统的关系和接口"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "2.2 产品功能高层描述"
        requirement: "提供软件功能的高层概述"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "2.3 用户特征明确识别"
        requirement: "描述预期用户的特征和技能水平"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "2.4 约束条件完整列出"
        requirement: "识别所有限制开发的约束条件"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "2.5 假设和依赖明确说明"
        requirement: "列出影响需求的假设和外部依赖"
        status: ""
        evidence: ""
        comments: ""
    
    # 3. 详细需求 (Specific Requirements)
    specific_requirements_section:
      - check_item: "3.1 功能需求完整详细"
        requirement: "每个功能需求都有唯一标识、清晰描述和验收标准"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "3.2 性能需求量化定义"
        requirement: "性能需求使用可测量的术语明确定义"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "3.3 数据库需求明确规定"
        requirement: "数据库需求包括数据类型、频率、访问等"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "3.4 设计约束明确列出"
        requirement: "硬件、软件、通信接口等约束明确规定"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "3.5 软件系统属性定义"
        requirement: "可靠性、可用性、安全性等属性量化定义"
        status: ""
        evidence: ""
        comments: ""

  # CMMI Level 3需求管理实践检查
  cmmi_level3_req_compliance_check:
    section_name: "CMMI-DEV Level 3 Requirements Management (REQ)"
    compliance_score: ""
    
    # REQ 1.1 需求理解
    req_1_1_understanding:
      - check_item: "REQ 1.1-1 双向需求理解建立"
        requirement: "需求开发人员和需求提供者达成对需求含义的共同理解"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "REQ 1.1-2 需求理解文档化"
        requirement: "需求理解通过正式文档、审查或其他方式记录"
        status: ""
        evidence: ""
        comments: ""
    
    # REQ 1.2 需求承诺
    req_1_2_commitment:
      - check_item: "REQ 1.2-1 项目参与者承诺获得"
        requirement: "获得项目参与者对需求的承诺"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "REQ 1.2-2 承诺变更管理"
        requirement: "当需求变更时，重新评估和获得承诺"
        status: ""
        evidence: ""
        comments: ""
    
    # REQ 1.3 需求变更管理
    req_1_3_change_management:
      - check_item: "REQ 1.3-1 变更控制过程建立"
        requirement: "建立管理需求变更的过程"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "REQ 1.3-2 变更影响分析"
        requirement: "分析需求变更的影响并采取纠正行动"
        status: ""
        evidence: ""
        comments: ""
    
    # REQ 1.4 需求与项目计划双向追溯
    req_1_4_traceability:
      - check_item: "REQ 1.4-1 双向追溯关系维护"
        requirement: "维护需求与项目计划和工作产品的双向追溯"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "REQ 1.4-2 追溯关系一致性"
        requirement: "确保追溯关系准确反映当前状态"
        status: ""
        evidence: ""
        comments: ""
    
    # REQ 1.5 项目计划与工作产品一致性
    req_1_5_consistency:
      - check_item: "REQ 1.5-1 计划与需求一致性识别"
        requirement: "识别项目计划与需求之间的不一致"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "REQ 1.5-2 不一致性纠正"
        requirement: "采取纠正行动解决不一致性"
        status: ""
        evidence: ""
        comments: ""

  # ISO 9001质量管理体系检查
  iso_9001_compliance_check:
    section_name: "ISO 9001:2015 Quality Management Systems"
    compliance_score: ""
    
    # 4.1 理解组织及其环境
    context_understanding:
      - check_item: "4.1-1 内外部环境因素识别"
        requirement: "识别影响需求质量的内外部环境因素"
        status: ""
        evidence: ""
        comments: ""
    
    # 5.1 领导作用和承诺
    leadership_commitment:
      - check_item: "5.1-1 最高管理者承诺证据"
        requirement: "最高管理者对需求质量管理的承诺有明确证据"
        status: ""
        evidence: ""
        comments: ""
    
    # 6.1 风险和机遇的应对措施
    risk_opportunity_management:
      - check_item: "6.1-1 需求相关风险识别"
        requirement: "识别与需求相关的风险和机遇"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "6.1-2 风险应对措施制定"
        requirement: "制定应对需求风险的措施"
        status: ""
        evidence: ""
        comments: ""
    
    # 7.5 成文信息
    documented_information:
      - check_item: "7.5-1 需求文档控制"
        requirement: "需求基线文档得到适当控制"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "7.5-2 文档可获得性"
        requirement: "相关人员能够获得需要的需求信息"
        status: ""
        evidence: ""
        comments: ""
    
    # 8.1 运行策划和控制
    operational_planning:
      - check_item: "8.1-1 需求过程策划"
        requirement: "需求管理过程得到策划和控制"
        status: ""
        evidence: ""
        comments: ""
    
    # 9.1 监视、测量、分析和评价
    monitoring_measurement:
      - check_item: "9.1-1 需求质量监控"
        requirement: "建立需求质量的监控和测量机制"
        status: ""
        evidence: ""
        comments: ""
    
    # 10.1 不符合和纠正措施
    nonconformity_corrective_action:
      - check_item: "10.1-1 不符合处理"
        requirement: "识别和处理需求不符合项"
        status: ""
        evidence: ""
        comments: ""

  # JeecgBoot兼容性检查
  jeecgboot_compatibility_check:
    section_name: "JeecgBoot Framework Compatibility"
    compatibility_score: ""
    
    # 框架版本兼容性
    framework_version_compatibility:
      - check_item: "JG-1 框架版本要求符合"
        requirement: "需求与JeecgBoot 3.8.1+版本要求兼容"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "JG-2 技术栈约束遵循"
        requirement: "严格遵循Spring Boot 3.x + Vue 3 + MySQL技术栈"
        status: ""
        evidence: ""
        comments: ""
    
    # CodeGen系统兼容性
    codegen_compatibility:
      - check_item: "JG-3 CodeGen适用性评估"
        requirement: "评估需求对CodeGen系统的适用性"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "JG-4 自定义开发范围明确"
        requirement: "明确需要自定义开发的功能范围"
        status: ""
        evidence: ""
        comments: ""
    
    # 架构约束合规性
    architecture_constraints:
      - check_item: "JG-5 单体架构约束"
        requirement: "需求符合单体分层架构设计约束"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "JG-6 RESTful API规范"
        requirement: "接口需求遵循RESTful API设计规范"
        status: ""
        evidence: ""
        comments: ""
    
    # 数据存储约束
    data_storage_constraints:
      - check_item: "JG-7 MySQL数据库兼容性"
        requirement: "数据需求与MySQL 8.0+兼容"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "JG-8 Redis缓存策略"
        requirement: "缓存需求符合Redis 7.x使用策略"
        status: ""
        evidence: ""
        comments: ""

  # 内部质量标准检查
  internal_quality_standards_check:
    section_name: "Internal Quality Standards"
    quality_score: ""
    
    # 需求完整性检查
    requirements_completeness:
      - check_item: "IQ-1 需求ID唯一性"
        requirement: "所有需求都有唯一的标识符"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "IQ-2 需求描述完整性"
        requirement: "需求描述使用EARS语法且信息完整"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "IQ-3 验收标准可测试性"
        requirement: "100%的需求具有可测试的验收标准"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "IQ-4 业务规则完整性"
        requirement: "所有相关业务规则都已识别和文档化"
        status: ""
        evidence: ""
        comments: ""
    
    # 需求质量检查
    requirements_quality:
      - check_item: "IQ-5 需求无歧义性"
        requirement: "需求描述清晰无歧义，避免多重解释"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "IQ-6 需求一致性"
        requirement: "需求之间保持逻辑一致，无冲突"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "IQ-7 需求可实现性"
        requirement: "所有需求在技术和资源约束下可实现"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "IQ-8 需求可验证性"
        requirement: "需求可通过测试、检查或演示验证"
        status: ""
        evidence: ""
        comments: ""
    
    # 追溯性检查
    traceability_check:
      - check_item: "IQ-9 向前追溯完整性"
        requirement: "需求到设计、实现、测试的追溯覆盖率≥95%"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "IQ-10 向后追溯完整性"
        requirement: "需求到业务目标的追溯关系建立"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "IQ-11 追溯关系准确性"
        requirement: "追溯关系准确反映实际依赖关系"
        status: ""
        evidence: ""
        comments: ""
    
    # 基线管理质量
    baseline_management_quality:
      - check_item: "IQ-12 基线版本控制"
        requirement: "基线版本控制规范且历史记录完整"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "IQ-13 变更控制过程"
        requirement: "变更控制过程完善且执行规范"
        status: ""
        evidence: ""
        comments: ""
        
      - check_item: "IQ-14 影响分析完整性"
        requirement: "变更影响分析全面且准确"
        status: ""
        evidence: ""
        comments: ""

  # 检查结果汇总
  check_results_summary:
    overall_assessment:
      total_check_items: 0              # 总检查项数
      passed_items: 0                   # 通过项数
      failed_items: 0                   # 失败项数
      partial_items: 0                  # 部分通过项数
      not_applicable_items: 0           # 不适用项数
      
      # 分类评分
      ieee_830_score: ""                # IEEE 830评分
      cmmi_level3_score: ""             # CMMI Level 3评分
      iso_9001_score: ""                # ISO 9001评分
      jeecgboot_compatibility_score: "" # JeecgBoot兼容性评分
      internal_quality_score: ""        # 内部质量评分
      
      overall_compliance_percentage: "" # 总体合规百分比
      compliance_level: ""              # 合规级别: excellent/good/satisfactory/needs_improvement
    
    critical_issues:                    # 关键问题
      - issue_id: ""                    # 问题ID
        issue_description: ""           # 问题描述
        affected_standard: ""           # 影响的标准
        severity: ""                    # 严重程度: critical/major/minor
        recommended_action: ""          # 推荐行动
        target_resolution_date: ""      # 目标解决日期
        assigned_to: ""                 # 分配给
    
    improvement_recommendations:        # 改进建议
      - recommendation_id: ""           # 建议ID
        recommendation_description: ""  # 建议描述
        expected_benefit: ""            # 预期收益
        implementation_effort: ""       # 实施工作量
        priority: ""                    # 优先级: high/medium/low
        suggested_timeline: ""          # 建议时间线
    
    compliance_certificate:            # 合规证书
      certificate_issued: false        # 是否颁发证书
      certificate_date: ""             # 证书日期
      certificate_validity: ""         # 证书有效期
      certificate_conditions: []       # 证书条件
      next_audit_date: ""              # 下次审计日期

# 使用指南
usage_guide:
  purpose: "确保JeecgBoot项目需求基线符合国际标准和内部质量要求"
  when_to_use:
    - "需求基线初次建立后"
    - "需求基线重大更新后"
    - "项目里程碑审查时"
    - "质量审计要求时"
  
  execution_process:
    - step: "准备检查"
      description: "收集基线文档和相关材料"
      duration: "0.5天"
    
    - step: "执行检查"
      description: "按清单逐项检查"
      duration: "1-2天"
    
    - step: "结果分析"
      description: "分析检查结果，识别问题和改进机会"
      duration: "0.5天"
    
    - step: "报告生成"
      description: "生成检查报告和改进建议"
      duration: "0.5天"

# 质量标准
quality_standards:
  minimum_compliance_requirements:
    ieee_830_compliance: "≥90%"        # IEEE 830最低合规要求
    cmmi_level3_compliance: "≥95%"     # CMMI Level 3最低合规要求
    iso_9001_compliance: "≥90%"        # ISO 9001最低合规要求
    jeecgboot_compatibility: "≥98%"    # JeecgBoot兼容性最低要求
    internal_quality_standards: "≥95%" # 内部质量标准最低要求
    overall_compliance: "≥92%"         # 总体合规最低要求
  
  excellence_targets:
    overall_compliance: "≥98%"         # 卓越目标
    critical_issues: "0"               # 关键问题数
    major_issues: "≤2"                 # 主要问题数
    stakeholder_satisfaction: "≥95%"   # 利益相关方满意度