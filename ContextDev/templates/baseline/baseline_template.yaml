# 需求基线管理模板 (符合IEEE 830、CMMI Level 3、ISO 9001标准)
# ========================================================================
# 版本: v1.1.0 | 创建日期: 2025-07-27
# 标准依据: IEEE 830-1998, CMMI-DEV Level 3, ISO 9001:2015
# 用途: JeecgBoot项目需求基线全生命周期管理

requirement_baseline:
  # 基线基本信息 (IEEE 830 Section 3.1)
  baseline_info:
    baseline_id: ""                    # 唯一基线标识 格式: RBL-{项目代码}-{YYYYMMDD}-{序号}
    project_code: ""                   # 项目代码 格式: JG-{业务域}-{序号}
    baseline_name: ""                  # 基线名称
    version: "1.0.0"                   # 语义化版本 格式: major.minor.patch
    status: "draft"                    # 状态: draft/reviewing/approved/released/archived
    priority: "medium"                 # 优先级: critical/high/medium/low
    
    # 时间管理
    created_date: ""                   # 创建时间 ISO 8601格式
    last_modified: ""                  # 最后修改时间
    approved_date: ""                  # 批准时间
    release_date: ""                   # 发布时间
    planned_completion: ""             # 计划完成时间
    
    # 责任人信息
    baseline_owner: ""                 # 基线负责人
    business_analyst: ""               # 业务分析师
    technical_reviewer: ""             # 技术审查人
    approver: ""                       # 批准人

  # 业务范围定义 (IEEE 830 Section 1.3)
  business_scope:
    business_domain: ""                # 业务领域: finance/hr/scm/crm/core等
    functional_areas: []               # 功能领域列表
    business_objectives:               # 业务目标
      primary_objectives: []           # 主要目标
      secondary_objectives: []         # 次要目标
      success_criteria: []             # 成功标准
    
    stakeholders:                      # 利益相关方 (CMMI REQ 1.1)
      primary_stakeholders: []         # 主要相关方
      secondary_stakeholders: []       # 次要相关方
      external_stakeholders: []        # 外部相关方
    
    constraints:                       # 约束条件
      technical_constraints: []        # 技术约束
      business_constraints: []         # 业务约束
      resource_constraints: []         # 资源约束
      time_constraints: []             # 时间约束

  # 功能需求基线 (IEEE 830 Section 3.2)
  functional_requirements:
    requirement_categories:            # 需求分类
      core_functions: []               # 核心功能
      support_functions: []            # 支撑功能
      integration_functions: []        # 集成功能
      reporting_functions: []          # 报表功能
    
    detailed_requirements:             # 详细需求列表
      - requirement_id: ""             # 需求ID 格式: REQ-{类别}-{序号}
        requirement_name: ""           # 需求名称
        requirement_type: ""           # 类型: functional/non-functional/interface
        priority: ""                   # 优先级: must/should/could/wont
        complexity: ""                 # 复杂度: simple/medium/complex/enterprise
        
        # 需求描述 (EARS语法)
        description: ""                # 需求描述
        acceptance_criteria: []        # 验收标准
        business_rules: []             # 业务规则
        assumptions: []                # 假设条件
        
        # 追溯关系 (CMMI REQ 1.4)
        traceability:
          business_objectives: []      # 关联业务目标
          parent_requirements: []      # 父需求
          child_requirements: []       # 子需求
          related_requirements: []     # 相关需求
        
        # JeecgBoot技术映射
        jeecgboot_mapping:
          entity_design: ""            # 实体设计
          codegen_applicability: ""    # CodeGen适用性
          framework_components: []     # 框架组件
          technical_feasibility: ""    # 技术可行性

  # 非功能需求基线 (IEEE 830 Section 3.3)
  non_functional_requirements:
    performance_requirements:          # 性能需求
      response_time: ""                # 响应时间要求
      throughput: ""                   # 吞吐量要求
      concurrent_users: ""             # 并发用户数
      scalability: ""                  # 可扩展性要求
    
    security_requirements:             # 安全需求
      authentication: ""               # 认证要求
      authorization: ""                # 授权要求
      data_protection: ""              # 数据保护
      audit_trail: ""                  # 审计跟踪
    
    usability_requirements:            # 易用性需求
      user_interface: ""               # 用户界面要求
      accessibility: ""                # 可访问性
      user_experience: ""              # 用户体验
      training_requirements: ""        # 培训需求
    
    reliability_requirements:          # 可靠性需求
      availability: ""                 # 可用性要求
      fault_tolerance: ""              # 容错要求
      recovery_time: ""                # 恢复时间
      backup_strategy: ""              # 备份策略

  # 接口需求基线 (IEEE 830 Section 3.4)
  interface_requirements:
    external_interfaces:               # 外部接口
      - interface_id: ""               # 接口ID
        interface_name: ""             # 接口名称
        interface_type: ""             # 类型: api/file/database/message
        protocol: ""                   # 协议
        data_format: ""                # 数据格式
        frequency: ""                  # 调用频率
    
    internal_interfaces:               # 内部接口
      - interface_id: ""               # 内部接口ID
        source_component: ""           # 源组件
        target_component: ""           # 目标组件
        interface_specification: ""    # 接口规格

  # 数据需求基线
  data_requirements:
    entities:                          # 数据实体
      - entity_id: ""                  # 实体ID
        entity_name: ""                # 实体名称
        entity_type: ""                # 类型: master/transaction/reference
        attributes: []                 # 属性列表
        relationships: []              # 关系列表
        business_rules: []             # 业务规则
    
    data_quality:                      # 数据质量要求
      accuracy: ""                     # 准确性要求
      completeness: ""                 # 完整性要求
      consistency: ""                  # 一致性要求
      timeliness: ""                   # 及时性要求

  # 质量保证 (ISO 9001:2015)
  quality_assurance:
    review_criteria:                   # 评审标准
      completeness_check: []           # 完整性检查项
      consistency_check: []            # 一致性检查项
      feasibility_check: []            # 可行性检查项
      testability_check: []            # 可测试性检查项
    
    quality_metrics:                   # 质量指标
      requirement_stability: ""        # 需求稳定性
      requirement_completeness: ""     # 需求完整性
      requirement_traceability: ""     # 需求可追溯性
      stakeholder_satisfaction: ""     # 相关方满意度
    
    validation_plan:                   # 验证计划
      validation_methods: []           # 验证方法
      validation_criteria: []          # 验证标准
      validation_schedule: []          # 验证计划

  # 变更管理 (CMMI REQ 1.3)
  change_management:
    change_control_process: ""         # 变更控制流程
    impact_analysis_template: ""       # 影响分析模板
    approval_workflow: ""              # 审批工作流
    version_control_strategy: ""       # 版本控制策略
    
    change_history:                    # 变更历史
      - change_id: ""                  # 变更ID
        change_date: ""                # 变更日期
        change_type: ""                # 变更类型
        change_description: ""         # 变更描述
        change_impact: ""              # 变更影响
        approver: ""                   # 批准人
        implementation_status: ""      # 实施状态

  # 风险管理
  risk_management:
    identified_risks:                  # 已识别风险
      - risk_id: ""                    # 风险ID
        risk_description: ""           # 风险描述
        probability: ""                # 发生概率: high/medium/low
        impact: ""                     # 影响程度: critical/major/minor
        mitigation_strategy: ""        # 缓解策略
        contingency_plan: ""           # 应急计划
        risk_owner: ""                 # 风险负责人

  # 合规性检查
  compliance_check:
    jeecgboot_compliance:              # JeecgBoot合规性
      framework_version: ""            # 框架版本
      codegen_compatibility: ""        # CodeGen兼容性
      architecture_compliance: ""      # 架构合规性
      security_compliance: ""          # 安全合规性
    
    standard_compliance:               # 标准合规性
      ieee_830_compliance: ""          # IEEE 830合规性
      cmmi_level: ""                   # CMMI级别
      iso_9001_compliance: ""          # ISO 9001合规性

# 模板使用说明
template_usage:
  purpose: "JeecgBoot项目需求基线全生命周期管理"
  scope: "从需求获取到需求交付的完整基线管理"
  standards: ["IEEE 830-1998", "CMMI-DEV Level 3", "ISO 9001:2015"]
  
  usage_workflow:
    - step: "基线创建"
      description: "使用模板创建项目需求基线"
      responsible: "Requirements Analyst"
      deliverable: "requirement_baseline.yaml"
    
    - step: "基线审查"
      description: "多方审查基线完整性和准确性"
      responsible: "Stakeholders & Technical Team"
      deliverable: "baseline_review_report.yaml"
    
    - step: "基线批准"
      description: "正式批准需求基线"
      responsible: "Project Sponsor"
      deliverable: "baseline_approval.yaml"
    
    - step: "基线管理"
      description: "基线变更控制和版本管理"
      responsible: "Requirements Analyst"
      deliverable: "baseline_change_log.yaml"

# 质量检查清单
quality_checklist:
  completeness:
    - "所有必填字段已完整填写"
    - "需求ID符合命名规范"
    - "追溯关系已建立"
    - "验收标准已定义"
  
  consistency:
    - "需求描述与业务目标一致"
    - "技术映射与JeecgBoot能力匹配"
    - "接口定义与系统架构一致"
    - "数据需求与业务流程一致"
  
  feasibility:
    - "技术实现可行性已评估"
    - "资源需求在可接受范围内"
    - "时间计划切实可行"
    - "风险已识别并有缓解措施"
  
  traceability:
    - "需求与业务目标可追溯"
    - "需求间关系清晰定义"
    - "接口需求与系统组件关联"
    - "变更影响可准确评估"