# 需求追溯矩阵模板 (IEEE 830 + CMMI Level 3 + ISO 9001)
# ========================================================================
# 版本: v1.0.0 | 创建日期: 2025-07-27
# 标准依据: IEEE 830-1998, CMMI-DEV Level 3 REQ Practice, ISO 9001:2015
# 用途: JeecgBoot项目需求追溯关系管理和影响分析

requirements_traceability_matrix:
  # 追溯矩阵基本信息
  matrix_info:
    matrix_id: ""                      # 追溯矩阵ID 格式: RTM-{项目代码}-{版本}
    baseline_id: ""                    # 关联基线ID
    project_code: ""                   # 项目代码
    matrix_version: "1.0.0"            # 矩阵版本 语义化版本
    matrix_status: "active"            # 状态: draft/active/archived
    
    # 时间信息
    created_date: ""                   # 创建日期
    last_updated: ""                   # 最后更新日期
    next_review_date: ""               # 下次审查日期
    
    # 责任人信息
    matrix_owner: ""                   # 矩阵负责人
    requirements_analyst: ""           # 需求分析师
    technical_lead: ""                 # 技术负责人
    
    # 覆盖统计
    total_business_objectives: 0       # 业务目标总数
    total_requirements: 0              # 需求总数
    total_design_elements: 0           # 设计元素总数
    total_test_cases: 0                # 测试用例总数
    traceability_coverage: ""          # 追溯覆盖率 (目标≥95%)

  # 业务目标层 (Business Objectives Level)
  business_objectives:
    - objective_id: ""                 # 业务目标ID 格式: BO-{序号}
      objective_name: ""               # 业务目标名称
      objective_description: ""        # 业务目标描述
      business_priority: ""            # 业务优先级: critical/high/medium/low
      success_criteria: []             # 成功标准
      stakeholder_owner: ""            # 利益相关方负责人
      
      # 向下追溯 (Forward Traceability)
      traced_to_requirements: []       # 追溯到的需求列表
      traced_to_features: []           # 追溯到的功能特性
      coverage_percentage: ""          # 覆盖百分比
      
      # 变更影响
      change_impact_assessment: ""     # 变更影响评估
      affected_by_changes: []          # 受变更影响的项目

  # 需求层 (Requirements Level)
  requirements:
    - requirement_id: ""               # 需求ID 格式: REQ-{类别}-{序号}
      requirement_name: ""             # 需求名称
      requirement_type: ""             # 需求类型: functional/non-functional/interface
      requirement_category: ""         # 需求分类: core/support/integration/reporting
      requirement_priority: ""         # 需求优先级: must/should/could/wont
      requirement_complexity: ""       # 复杂度: simple/medium/complex/enterprise
      requirement_status: ""           # 状态: approved/under_review/implemented/tested
      
      # 需求详细信息
      requirement_description: ""      # 需求描述 (EARS语法)
      acceptance_criteria: []          # 验收标准
      business_rules: []               # 相关业务规则
      assumptions: []                  # 假设条件
      
      # 向上追溯 (Backward Traceability)
      traced_from_objectives: []       # 追溯源业务目标
      traced_from_stakeholders: []     # 追溯源利益相关方
      source_documents: []             # 源文档
      
      # 向下追溯 (Forward Traceability)
      traced_to_design: []             # 追溯到设计元素
      traced_to_code: []               # 追溯到代码模块
      traced_to_tests: []              # 追溯到测试用例
      
      # 水平追溯 (Horizontal Traceability)
      related_requirements: []         # 相关需求
      conflicting_requirements: []     # 冲突需求
      dependent_requirements: []       # 依赖需求
      
      # JeecgBoot特定映射
      jeecgboot_mapping:
        entity_mapping: ""             # 实体映射
        codegen_template: ""           # CodeGen模板
        framework_components: []       # 框架组件
        custom_development: ""         # 自定义开发需求
      
      # 变更跟踪
      change_history: []               # 变更历史
      impact_analysis: ""              # 影响分析
      verification_status: ""          # 验证状态

  # 设计层 (Design Level)
  design_elements:
    - design_id: ""                    # 设计ID 格式: DES-{类别}-{序号}
      design_name: ""                  # 设计名称
      design_type: ""                  # 设计类型: architecture/interface/data/algorithm
      design_category: ""              # 设计分类: system/component/module/function
      
      # 设计详细信息
      design_description: ""           # 设计描述
      design_rationale: ""             # 设计理由
      design_constraints: []           # 设计约束
      
      # 向上追溯
      traced_from_requirements: []     # 追溯源需求
      requirement_coverage: ""         # 需求覆盖情况
      
      # 向下追溯
      traced_to_code_modules: []       # 追溯到代码模块
      traced_to_interfaces: []         # 追溯到接口
      traced_to_data_structures: []    # 追溯到数据结构
      
      # JeecgBoot架构映射
      jeecgboot_architecture:
        layer_assignment: ""           # 层次分配 (Controller/Service/Mapper/Entity)
        component_type: ""             # 组件类型
        framework_integration: ""      # 框架集成方式
        codegen_generation: ""         # CodeGen生成方式
      
      # 实现状态
      implementation_status: ""        # 实现状态
      code_review_status: ""           # 代码审查状态
      unit_test_coverage: ""           # 单元测试覆盖率

  # 实现层 (Implementation Level)
  implementation_elements:
    - code_id: ""                      # 代码ID 格式: CODE-{模块}-{序号}
      code_name: ""                    # 代码名称
      code_type: ""                    # 代码类型: controller/service/mapper/entity/view
      file_path: ""                    # 文件路径
      module_name: ""                  # 模块名称
      
      # 代码详细信息
      code_description: ""             # 代码描述
      main_functions: []               # 主要功能
      dependencies: []                 # 依赖关系
      interfaces_exposed: []           # 暴露的接口
      
      # 向上追溯
      traced_from_design: []           # 追溯源设计
      traced_from_requirements: []     # 追溯源需求
      requirement_satisfaction: ""     # 需求满足情况
      
      # 向下追溯
      traced_to_unit_tests: []         # 追溯到单元测试
      traced_to_integration_tests: []  # 追溯到集成测试
      
      # JeecgBoot实现细节
      jeecgboot_implementation:
        generation_method: ""          # 生成方法: codegen/manual/hybrid
        framework_features_used: []    # 使用的框架特性
        custom_logic: []               # 自定义逻辑
        performance_considerations: [] # 性能考虑
      
      # 质量指标
      code_quality_metrics:
        complexity_score: ""           # 复杂度评分
        maintainability_index: ""      # 可维护性指数
        test_coverage: ""              # 测试覆盖率
        code_review_score: ""          # 代码审查评分

  # 测试层 (Testing Level)
  test_elements:
    - test_id: ""                      # 测试ID 格式: TEST-{类型}-{序号}
      test_name: ""                    # 测试名称
      test_type: ""                    # 测试类型: unit/integration/system/acceptance
      test_category: ""                # 测试分类: functional/performance/security/usability
      test_priority: ""                # 测试优先级: critical/high/medium/low
      
      # 测试详细信息
      test_description: ""             # 测试描述
      test_objective: ""               # 测试目标
      test_preconditions: []           # 前置条件
      test_steps: []                   # 测试步骤
      expected_results: []             # 期望结果
      
      # 向上追溯
      traced_from_requirements: []     # 追溯源需求
      traced_from_design: []           # 追溯源设计
      traced_from_code: []             # 追溯源代码
      requirement_verification: ""     # 需求验证情况
      
      # 测试执行信息
      test_execution:
        execution_status: ""           # 执行状态: not_run/passed/failed/blocked
        execution_date: ""             # 执行日期
        test_environment: ""           # 测试环境
        actual_results: []             # 实际结果
        defects_found: []              # 发现的缺陷
        test_evidence: []              # 测试证据
      
      # JeecgBoot测试特性
      jeecgboot_testing:
        automated_test_support: ""     # 自动化测试支持
        framework_test_utilities: []   # 框架测试工具
        data_setup_requirements: []    # 数据设置需求
        mock_requirements: []          # Mock需求

  # 追溯关系验证
  traceability_verification:
    verification_criteria:             # 验证标准
      forward_traceability: ""         # 向前追溯完整性
      backward_traceability: ""        # 向后追溯完整性
      horizontal_traceability: ""      # 水平追溯一致性
      orphan_elements: []              # 孤立元素识别
    
    coverage_analysis:                 # 覆盖分析
      business_objectives_coverage: "" # 业务目标覆盖率
      requirements_coverage: ""        # 需求覆盖率
      design_coverage: ""              # 设计覆盖率
      test_coverage: ""                # 测试覆盖率
      overall_coverage: ""             # 总体覆盖率
    
    gap_analysis:                      # 差距分析
      missing_requirements: []         # 缺失需求
      untraceable_elements: []         # 不可追溯元素
      coverage_gaps: []                # 覆盖差距
      improvement_recommendations: []  # 改进建议

  # 追溯关系维护
  maintenance_activities:
    regular_reviews:                   # 定期审查
      review_frequency: ""             # 审查频率
      review_participants: []          # 审查参与者
      review_criteria: []              # 审查标准
      last_review_date: ""             # 最后审查日期
      next_review_date: ""             # 下次审查日期
    
    update_triggers:                   # 更新触发器
      requirement_changes: []          # 需求变更
      design_modifications: []         # 设计修改
      code_updates: []                 # 代码更新
      test_changes: []                 # 测试变更
    
    maintenance_metrics:               # 维护指标
      matrix_accuracy: ""              # 矩阵准确性
      update_timeliness: ""            # 更新及时性
      stakeholder_satisfaction: ""     # 利益相关方满意度
      maintenance_effort: ""           # 维护工作量

  # 影响分析支持
  impact_analysis_support:
    change_impact_matrix:              # 变更影响矩阵
      - changed_element_id: ""         # 变更元素ID
        changed_element_type: ""       # 变更元素类型
        impact_scope: []               # 影响范围
        affected_elements: []          # 受影响元素
        impact_severity: ""            # 影响严重程度
        mitigation_actions: []         # 缓解行动
    
    dependency_analysis:               # 依赖分析
      critical_dependencies: []        # 关键依赖
      circular_dependencies: []        # 循环依赖
      dependency_risks: []             # 依赖风险
      dependency_management_plan: ""   # 依赖管理计划

  # 质量保证
  quality_assurance:
    completeness_metrics:              # 完整性指标
      total_trace_links: 0             # 总追溯链接数
      verified_trace_links: 0          # 已验证追溯链接数
      incomplete_traces: []            # 不完整追溯
      orphaned_elements: []            # 孤立元素
    
    accuracy_verification:             # 准确性验证
      trace_link_validation: []        # 追溯链接验证
      consistency_checks: []           # 一致性检查
      accuracy_rating: ""              # 准确性评级
      validation_date: ""              # 验证日期
    
    standards_compliance:              # 标准合规性
      ieee_830_compliance: ""          # IEEE 830合规性
      cmmi_traceability_requirements: "" # CMMI追溯要求
      iso_9001_quality_requirements: "" # ISO 9001质量要求

# 使用指南
usage_guide:
  purpose: "建立和维护JeecgBoot项目中需求的完整追溯关系"
  scope: "从业务目标到测试用例的端到端追溯管理"
  
  maintenance_workflow:
    - step: "基线建立时创建初始追溯矩阵"
      responsible: "Requirements Analyst"
      frequency: "项目启动时"
    
    - step: "需求变更时更新追溯关系"
      responsible: "Requirements Analyst"
      frequency: "每次需求变更"
    
    - step: "设计完成时建立设计追溯"
      responsible: "System Architect"
      frequency: "设计阶段完成时"
    
    - step: "代码实现时建立实现追溯"
      responsible: "Code Developer"
      frequency: "开发过程中"
    
    - step: "测试执行时验证追溯完整性"
      responsible: "Quality Tester"
      frequency: "测试阶段"

# 质量检查清单
quality_checklist:
  traceability_completeness:
    - "所有业务目标都有对应的需求追溯"
    - "所有需求都有对应的设计和实现追溯"
    - "所有实现都有对应的测试追溯"
    - "追溯覆盖率达到≥95%"
  
  traceability_accuracy:
    - "追溯关系准确反映实际依赖"
    - "没有错误的或过时的追溯链接"
    - "追溯关系双向一致"
    - "孤立元素已识别并处理"
  
  maintenance_effectiveness:
    - "追溯矩阵及时更新"
    - "变更影响准确分析"
    - "维护工作量在可接受范围内"
    - "利益相关方满意度≥90%"