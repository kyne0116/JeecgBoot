# 培训管理系统课程信息管理测试场景

test_scenario:
  name: "培训管理系统课程信息管理"
  description: "测试ContextDev 6-Agent协作链和A2A协议集成的完整工作流程"
  business_domain: "企业培训管理"

# Agent-1 输入
agent1_input:
  scenario_type: "明确式"
  system_description: "企业培训管理系统，主要管理培训课程信息，包括课程创建、编辑、删除、查询等功能"
  business_domain: "企业培训管理"
  technical_constraints:
    - "JeecgBoot 3.8.1+"
    - "MySQL 8.0"
    - "Vue 3.0"
    - "Spring Boot 2.7+"

# Agent-2 输入
agent2_input:
  business_requirements: |
    培训管理系统课程信息管理模块需求：
    
    1. 课程基本信息管理
       - 课程名称、描述、分类、难度等级
       - 课程时长、学分、价格信息
       - 课程状态（草稿、发布、下架）
       
    2. 课程内容管理
       - 课程大纲、章节结构
       - 学习目标、先修要求
       - 课程资料、附件管理
       
    3. 课程发布管理
       - 课程审核流程
       - 发布时间控制
       - 课程版本管理
       
    4. 课程查询统计
       - 多条件搜索筛选
       - 课程热度统计
       - 学员评价管理

# 预期实体设计
expected_entities:
  - name: "CourseInfo"
    description: "课程基本信息"
    fields:
      - name: "courseName"
        type: "string"
        required: true
        description: "课程名称"
      - name: "courseDescription"
        type: "text"
        required: false
        description: "课程描述"
      - name: "courseCategory"
        type: "string"
        required: true
        description: "课程分类"
      - name: "difficultyLevel"
        type: "integer"
        required: true
        description: "难度等级(1-5)"
      - name: "duration"
        type: "integer"
        required: true
        description: "课程时长(小时)"
      - name: "credits"
        type: "decimal"
        required: true
        description: "学分"
      - name: "price"
        type: "decimal"
        required: false
        description: "课程价格"
      - name: "status"
        type: "string"
        required: true
        description: "课程状态"
    relationships:
      - target: "CourseChapter"
        type: "one_to_many"
        description: "课程包含多个章节"
    business_rules:
      - description: "课程名称不能重复"
        type: "uniqueness"
      - description: "难度等级必须在1-5之间"
        type: "range_validation"
      - description: "发布状态的课程不能删除"
        type: "state_constraint"

  - name: "CourseChapter"
    description: "课程章节"
    fields:
      - name: "chapterName"
        type: "string"
        required: true
        description: "章节名称"
      - name: "chapterOrder"
        type: "integer"
        required: true
        description: "章节顺序"
      - name: "content"
        type: "text"
        required: false
        description: "章节内容"
      - name: "videoUrl"
        type: "string"
        required: false
        description: "视频链接"
    relationships:
      - target: "CourseInfo"
        type: "many_to_one"
        description: "章节属于某个课程"

# A2A协议测试预期
a2a_test_expectations:
  applicable_components:
    - entity: "CourseInfo"
      expected_confidence: ">= 0.8"
      expected_generation_type: "crud"
      expected_table_name: "us_training_course_courseinfo"
    - entity: "CourseChapter"
      expected_confidence: ">= 0.7"
      expected_generation_type: "crud"
      expected_table_name: "us_training_course_coursechapter"
  
  expected_variables:
    CourseInfo:
      MODULE_NAME: "training"
      SUBMODULE_NAME: "course"
      BUSINESS_ENTITY: "CourseInfo"
    CourseChapter:
      MODULE_NAME: "training"
      SUBMODULE_NAME: "course"
      BUSINESS_ENTITY: "CourseChapter"

# 代码生成预期结果
codegen_expectations:
  backend_files:
    CourseInfo:
      - "CourseInfoController.java"
      - "CourseInfoService.java"
      - "CourseInfoServiceImpl.java"
      - "CourseInfo.java"
      - "CourseInfoMapper.java"
    CourseChapter:
      - "CourseChapterController.java"
      - "CourseChapterService.java"
      - "CourseChapterServiceImpl.java"
      - "CourseChapter.java"
      - "CourseChapterMapper.java"
  
  frontend_files:
    CourseInfo:
      - "CourseInfoList.vue"
      - "CourseInfoForm.vue"
      - "CourseInfoModal.vue"
    CourseChapter:
      - "CourseChapterList.vue"
      - "CourseChapterForm.vue"
  
  database_files:
    - "course_info_ddl.sql"
    - "course_chapter_ddl.sql"

# 测试验证标准
test_criteria:
  a2a_protocol:
    success_rate: ">= 95%"
    response_time: "<= 30秒"
    error_handling: "严格异常处理机制正确触发"
  
  code_generation:
    quality_standards:
      - "符合JeecgBoot代码规范"
      - "包含完整的CRUD操作"
      - "数据库表结构正确"
      - "前端页面可正常访问"
    
    functional_requirements:
      - "生成的代码能在JeecgBoot环境中编译通过"
      - "API接口能正常响应"
      - "前端页面能正常显示和操作"
  
  integration_test:
    database_integration:
      - "表结构创建成功"
      - "数据插入、查询、更新、删除正常"
    
    api_integration:
      - "RESTful API接口正常工作"
      - "参数验证正确"
      - "异常处理完善"
    
    frontend_integration:
      - "页面正常渲染"
      - "表单提交正常"
      - "数据展示正确"

# 异常测试场景
exception_test_scenarios:
  - name: "A2A协议网络异常"
    description: "模拟CodeGen服务不可用"
    expected_behavior: "立即终止工作流，请求用户确认"
  
  - name: "代码生成失败"
    description: "模拟CodeGen生成过程异常"
    expected_behavior: "返回失败状态，提供错误信息"
  
  - name: "变量验证失败"
    description: "模拟三核心变量不符合规范"
    expected_behavior: "拒绝生成，返回验证错误"
