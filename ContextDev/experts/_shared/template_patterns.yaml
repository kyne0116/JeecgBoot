# ContextDev模板体系和协作机制配置
# 标准化的模板使用规范和专家协作接口定义
# Version: v4.0.0 | Last Update: 2025-07-27

template_system_patterns:
  # === 三维模板矩阵体系 ===
  template_matrix_dimensions:
    dimension_1_expert_roles:
      - "baseline_manager"    # 需求基线管理专家
      - "requirements_analyst" # 需求分析专家
      - "system_architect"    # 系统架构专家
      - "task_planner"       # 任务规划专家
      - "code_developer"     # 代码开发专家
      - "quality_tester"     # 质量测试专家
    
    dimension_2_business_domains:
      - "core_system"         # 核心系统
      - "finance_management"  # 财务管理
      - "supply_chain"       # 供应链管理
      - "customer_relationship" # 客户关系管理
      - "human_resources"    # 人力资源管理
      - "inventory_management" # 库存管理
      - "order_processing"   # 订单处理
      - "reporting_analytics" # 报表分析
      - "workflow_management" # 工作流管理
      - "integration_services" # 集成服务
    
    dimension_3_complexity_levels:
      - "simple"             # 简单CRUD
      - "standard"          # 标准业务逻辑
      - "complex"           # 复杂业务流程
      - "enterprise"        # 企业级解决方案

  # === 模板命名规范 ===
  template_naming_convention:
    format: "{expert}_{domain}_{complexity}_{type}.yaml"
    examples:
      - "requirements_analyst_finance_standard_input.yaml"
      - "system_architect_crm_complex_process.yaml"
      - "code_developer_core_simple_output.yaml"
    
    type_categories:
      - "input"    # 输入模板
      - "process"  # 处理模板
      - "output"   # 输出模板
      - "integration" # 集成模板

  # === 标准化模板路径体系 ===
  template_path_structure:
    base_path: "/templates"
    
    category_paths:
      input_templates: "/templates/input_templates/{expert}/"
      process_templates: "/templates/process_templates/{expert}/"
      output_templates: "/templates/output_templates/{expert}/"
      baseline_templates: "/templates/baseline_templates/"
      integration_templates: "/templates/integration_templates/"
      composite_templates: "/templates/composite_templates/"
    
    expert_specific_paths:
      baseline_manager:
        - "/templates/baseline_templates/requirement_baseline_template.yaml"
        - "/templates/baseline_templates/expert_task_assignment.yaml"
        - "/templates/baseline_templates/collaboration_tracking.yaml"
        - "/templates/baseline_templates/quality_checkpoint.yaml"
      
      requirements_analyst:
        - "/templates/input_templates/analyst/baseline_requirement_input.yaml"
        - "/templates/process_templates/analyst/baseline_driven_analysis.yaml"
        - "/templates/output_templates/analyst/requirement_specification.yaml"
        - "/templates/output_templates/analyst/business_rules_document.yaml"
      
      system_architect:
        - "/templates/input_templates/architect/requirement_spec_input.yaml"
        - "/templates/process_templates/architect/system_architecture_process.yaml"
        - "/templates/output_templates/architect/system_architecture.yaml"
        - "/templates/output_templates/architect/database_schema.yaml"
      
      task_planner:
        - "/templates/input_templates/planner/system_architecture_input.yaml"
        - "/templates/process_templates/planner/task_breakdown_process.yaml"
        - "/templates/output_templates/planner/development_plan.yaml"
        - "/templates/output_templates/planner/work_breakdown_structure.yaml"
      
      code_developer:
        - "/templates/input_templates/developer/development_plan_input.yaml"
        - "/templates/process_templates/developer/codegen_generation_process.yaml"
        - "/templates/output_templates/developer/backend_code_delivery.yaml"
        - "/templates/output_templates/developer/frontend_code_delivery.yaml"
      
      quality_tester:
        - "/templates/input_templates/tester/code_delivery_input.yaml"
        - "/templates/process_templates/tester/functional_testing_process.yaml"
        - "/templates/output_templates/tester/test_execution_report.yaml"
        - "/templates/output_templates/tester/quality_assessment_report.yaml"

# === 专家协作机制 ===
expert_collaboration_mechanisms:
  # === 标准化协作流水线 ===
  standard_collaboration_pipeline:
    flow_sequence:
      - "baseline_manager → requirements_analyst"
      - "requirements_analyst → system_architect"
      - "system_architect → task_planner"
      - "task_planner → code_developer"
      - "code_developer → quality_tester"
      - "quality_tester → baseline_manager (完成反馈)"
    
    parallel_activities:
      - "baseline_manager: 持续监控所有专家协作状态"
      - "requirements_analyst + system_architect: 需求澄清协作"
      - "task_planner + code_developer: 技术实现协作"

  # === 协作接口标准 ===
  collaboration_interface_standards:
    data_handoff_protocol:
      input_validation:
        - "上游专家输出格式验证"
        - "数据完整性检查"
        - "业务逻辑一致性验证"
        - "技术约束符合性检查"
      
      output_preparation:
        - "下游专家输入格式准备"
        - "协作上下文信息附加"
        - "质量自检报告附加"
        - "交接确认机制"
    
    communication_protocols:
      status_updates:
        - "实时进度状态同步"
        - "阻塞问题及时上报"
        - "质量问题反馈机制"
        - "协作冲突解决流程"
      
      quality_checkpoints:
        - "阶段输出物质量验证"
        - "协作接口兼容性检查"
        - "业务理解一致性确认"
        - "technical实现可行性确认"

  # === 协作效率优化 ===
  collaboration_efficiency_optimization:
    time_management:
      - "专家间等待时间 <= 2小时"
      - "协作接口成功率 >= 95%"
      - "返工率 <= 5%"
      - "并行工作比例 >= 60%"
    
    quality_management:
      - "协作输出一致性 >= 95%"
      - "接口兼容性 >= 98%"
      - "协作满意度 >= 90%"
      - "协作冲突解决时间 <= 4小时"

# === 模板使用指南 ===
template_usage_guidelines:
  # === 模板选择原则 ===
  template_selection_principles:
    complexity_based_selection:
      simple_tasks:
        - "使用基础模板，简化流程"
        - "重点关注核心功能实现"
        - "快速迭代，及时交付"
      
      standard_tasks:
        - "使用完整模板体系"
        - "遵循标准协作流程"
        - "确保质量和效率平衡"
      
      complex_tasks:
        - "使用增强模板和检查点"
        - "加强协作监控和质量控制"
        - "重点关注风险管理"
      
      enterprise_tasks:
        - "使用全套企业级模板"
        - "严格执行质量门禁"
        - "全面的文档和追溯管理"
  
  # === 模板定制指南 ===
  template_customization_guidelines:
    customization_principles:
      - "基于标准模板进行定制"
      - "保持核心结构和接口兼容"
      - "明确记录定制原因和影响"
      - "定期评估定制效果和必要性"
    
    customization_scope:
      - "字段扩展和业务规则定制"
      - "质量标准和验证规则调整"
      - "协作流程和时间节点优化"
      - "输出格式和内容结构微调"

# === 模板维护和演进 ===
template_maintenance_evolution:
  maintenance_cycle:
    - "月度使用效果评估"
    - "季度模板优化更新"
    - "年度模板体系架构评审"
    - "随JeecgBoot版本同步更新"
  
  evolution_drivers:
    - "实际使用反馈和问题"
    - "业务需求变化和扩展"
    - "技术栈升级和变更"
    - "质量标准提升要求"
  
  version_management:
    - "语义化版本管理 (Major.Minor.Patch)"
    - "向后兼容性保证"
    - "变更日志详细记录"
    - "升级迁移指南提供"